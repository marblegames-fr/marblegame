      <button class="tr-ball" data-action="spec" data-id="${treasure.id}">${mImg(treasure,300,120,"")}</button>

      <p class="meta">${isSeason(treasure)?"Exclusive au passe de saison":`${oneIn(chanceOf(treasure))} dans un sac gratuit`}</p>

    <section class="panel">
      <div class="panel-head"><h2>Jeux de la cour</h2><span class="sample-tag">5 jeux</span></div>
      <div class="game-card">
        <svg viewBox="0 0 240 150" preserveAspectRatio="xMidYMid slice" aria-hidden="true">

          <rect x="8" y="8" width="224" height="134" rx="4" fill="#3E9A4A"/>

          <rect x="140" y="52" width="18" height="90" fill="#A8713F"/>

          <path d="M205 40 V14" stroke="#fff" stroke-width="2"/><path d="M205 14 l13 5 -13 5z" fill="#E5484D"/>

        </svg>
        <div class="game-info">
          <b>Solo ou à plusieurs</b>
          <p>Solo : une récompense par jour. À plusieurs : mise tes ${CUR.many} !</p>
          <button class="btn btn-blue" data-action="nav" data-view="jeux">${ic("play",16)} Jouer</button>
        </div>

    <section class="panel feed">
      <div class="panel-head"><h2>Découvertes</h2><span class="sample-tag">Autres joueurs simulés</span></div>
      <ul id="feed-list">${feedItems()}</ul>

  </aside>
</div>`;
}

function oddsList(b){
  return `<ul class="odds">
    ${TK.map(k=>`<li style="${tstyle(k)}"><i></i><span>${TYPES[k].label}</span><span>${pct(b.odds[k])}</span></li>`).join("")}
    <li class="sh"><i></i><span>Shiny (sur chaque bille)</span><span>${pct(+(b.shiny*100).toFixed(2))}</span></li>
    ${b.guarantee?`<li class="guar">Garantie : 1 ${TYPES[b.guarantee].label} ou mieux</li>`:""}
  </ul>`;
}

        ${ready ? `<button class="btn btn-yellow" data-action="open-free">Ouvrir gratuitement</button>`

          ${miss>0?`Il manque ${fmt(miss)} ${CUR.many}`:`Ouvrir <span class="price">${COIN}${fmt(b.price)}</span>`}

    <button class="panel" data-action="nav" data-view="quetes">${ic("quest",26)}<div><b>Quêtes du jour</b><p>3 défis par jour, de 60 à 120 ${CUR.many} chacun, plus ${QUEST_BONUS} de bonus.</p></div></button>

function questRows(compact){
  ensureQuests();
  return `<div class="quest-list${compact?" compact":""}">${S.quests.items.map((q,i)=>{
    const Q = QUESTS[q.id], done = questDone(q);
    const btn = q.claimed ? `<span class="q-state">${ic("check",16,2.5)} Récupérée</span>`
      : done ? `<button class="btn btn-yellow q-claim" data-action="q-claim" data-i="${i}">+${Q.reward} ${COIN}</button>`
      : `<span class="q-reward">${COIN}${Q.reward}</span>`;
    return `<div class="quest${done?" done":""}${q.claimed?" claimed":""}">
      <span class="q-ic">${ic(Q.icon,compact?20:24)}</span>
      <div class="q-main"><b>${Q.title}</b>${compact?"":`<p>${Q.desc}</p>`}
        <div class="q-prog"><div class="bar"><i class="${done?"done":""}" style="width:${q.p/Q.goal*100}%"></i></div><small>${q.p} / ${Q.goal}</small></div></div>
      ${btn}
    </div>`}).join("")}</div>`;
}
function viewQuests(){
  ensureQuests();
  const Q = S.quests, all = Q.items.every(q=>q.claimed), n = Q.items.filter(q=>q.claimed).length;
  return `<div class="page-head">
    <div><h1>Quêtes du jour</h1><p>Trois défis par jour pour gagner des ${CUR.many}. Ils avancent tout seuls pendant que tu ouvres des sacs, joues au Tir ou échanges des billes à la Confiserie.</p></div>
    <span class="hand-note">Nouvelles quêtes dans <span data-quest-timer>${untilMidnight()}</span></span>
  </div>
  <div class="soon-page" style="max-width:820px">
    <section class="panel">${questRows(false)}</section>
    <section class="panel bonus-card${all&&!Q.bonus?" ready":""}">
      <span class="q-ic">${ic("trophy",26)}</span>
      <div class="q-main"><b>Bonus du jour</b><p>Récupère les 3 quêtes pour gagner ${QUEST_BONUS} ${CUR.many} de plus.</p>
        <div class="q-prog"><div class="bar"><i class="${all?"done":""}" style="width:${n/3*100}%"></i></div><small>${n} / 3</small></div></div>
      ${Q.bonus ? `<span class="q-state">${ic("check",16,2.5)} Récupéré</span>`
        : all ? `<button class="btn btn-yellow" data-action="q-bonus">+${QUEST_BONUS} ${COIN}</button>`
        : `<span class="q-reward">${COIN}${QUEST_BONUS}</span>`}
    </section>
  </div>`;
}

function viewCollection(){
  const slots = slotsOwned();
  const shinyCount = S.specs.filter(s=>s.shiny).length;
  const types = TK.filter(t=>ui.type==="all"||ui.type===t);
  const nSh = S.specs.filter(s=>s.shiny).length, nSe = S.specs.filter(isSeason).length, sp0 = ui.tab==="billes" ? (ui.special||"all") : "all";
  const special = ui.tab==="defis" ? "" : `<div class="seg" role="group" aria-label="Filtrer">
      <button class="chip" data-action="special" data-sp="all" aria-pressed="${sp0==="all"}">Toutes</button>
      <button class="chip" data-action="special" data-sp="shiny" aria-pressed="${sp0==="shiny"}">${SPARK} Shiny (${nSh})</button>
      <button class="chip" data-action="special" data-sp="season" aria-pressed="${sp0==="season"}">${ic("ticket",14)} Éditions saisonnières (${nSe})</button>
      <button class="chip" data-action="special" data-sp="secret" aria-pressed="${sp0==="secret"}">${ic("lock",14)} Secrètes (${S.specs.filter(s=>s.secret).length} / ${Object.keys(SECRETS).length})</button>
    </div>`;
  const chips = special + (ui.tab==="album"?`<label class="check"><input type="checkbox" id="f-hide" ${ui.hideMissing?"checked":""}> Masquer les manquantes</label>`:"");

  let body;
  if(ui.tab==="defis"){
    const list = [...CHALLENGES].sort((a,b)=>{
      const sa = S.chal.includes(a.id)?2:chalProg(a)>=a.goal?0:1, sb = S.chal.includes(b.id)?2:chalProg(b)>=b.goal?0:1;
      return sa-sb || chalProg(b)/b.goal-chalProg(a)/a.goal });
    body = `<div class="chal-list">${list.map(c=>{
      const p = chalProg(c), done = p>=c.goal, got = S.chal.includes(c.id);
      return `<div class="chal quest${done&&!got?" done":""}${got?" claimed":""}">
        <span class="q-ic">${ic(c.icon,24)}</span>
        <div class="q-main"><b>${c.title}</b><p>${c.desc}</p>
          <div class="q-prog"><div class="bar"><i class="${done?"done":""}" style="width:${p/c.goal*100}%"></i></div><small>${p} / ${c.goal}</small></div>
          <div class="rews">${rewChips(c.rew)}</div></div>
        ${got?`<span class="q-state">${ic("check",16,2.5)} Récupéré</span>`:done?`<button class="btn btn-yellow q-claim" data-action="chal-claim" data-id="${c.id}">${ic("gift",16)} Récupérer</button>`:""}
      </div>`}).join("")}</div>`;
  } else if(ui.tab==="album"){
    body = types.map(t=>{
      const have = FAMILIES.filter((_,f)=>slots.has(t+"|"+f)).length;
      const cards = FAMILIES.map((F,f)=>{
        const list = slots.get(t+"|"+f);
        if(!list){ if(ui.hideMissing) return ""; return `<button class="m-card missing" data-action="missing" data-type="${t}" data-fam="${f}" aria-label="${TYPES[t].label} ${F.name} : pas encore trouvée"><span class="ball">${mImg(ghost(t,f),160,Math.round(84*scaleOf(t)+6),"")}</span><b>${F.name}</b><small>À trouver</small></button>` }
        const best = [...list].sort(tierSort)[0];
        const isNew = list.some(s=>S.unseen.includes(s.id));
        const variants = new Set(list.map(s=>s.pal)).size;
        return `<button class="m-card${best.shiny?" is-shiny":""}" data-action="spec" data-id="${best.id}">
          ${best.shiny?`<span class="shiny-mark">${shinyPill(best)}</span>`:""}
          ${isNew?`<span class="new">Nouveau</span>`:list.length>1?`<span class="count">×${list.length}</span>`:""}
          <span class="ball">${mImg(best,160,Math.round(84*scaleOf(t)+6))}</span><b>${F.name}</b><small>${variants} coloris sur ${BASE_PALS}</small></button>`;
      }).join("");
      return `<section class="type-block">
        <div class="type-head">${typePill(t,true)}<h2>${TYPES[t].label}</h2><span class="mm">${TYPES[t].mm} mm</span>
          <span class="prog">${have} / ${FAMILIES.length}<span class="bar"><i class="${have===FAMILIES.length?"done":""}" style="width:${have/FAMILIES.length*100}%"></i></span></span>
          <p class="desc">${TYPES[t].desc}</p></div>
        ${cards.trim()?`<div class="card-grid">${cards}</div>`:`<p class="empty">Aucune ${TYPES[t].label.toLowerCase()} pour l'instant.</p>`}
      </section>`;
    }).join("");
  } else if(ui.special==="secret"){
    body = secretGrid();
  } else {
    const sp = ui.special||"all";
    const list = S.specs.filter(s=>(ui.type==="all"||s.type===ui.type) && (sp==="all" || (sp==="shiny"?s.shiny:isSeason(s)))).sort((a,b)=>b.at-a.at);
    const dups = recyclableDups(), dupVal = dups.reduce((a,s)=>a+recycleValue(s),0);
    body = `<section class="panel recycle-bar">
      <span class="q-ic">${ic("candy",24)}</span>
      <div><b>${dups.length ? `${dups.length} double${dups.length>1?"s":""} à échanger · +${fmt(dupVal)} ${CUR.many}` : "Aucun double pour l'instant"}</b>
        <p>Échange tes doubles contre des ${CUR.many} à la Confiserie.</p></div>
      <button class="btn btn-ghost" data-action="nav" data-view="confiserie">Aller à la Confiserie ${ic("arrow",16)}</button>
    </section>` + (list.length ? `<div class="card-grid">${list.map(s=>`<button class="m-card${s.shiny?" is-shiny":""}" data-action="spec" data-id="${s.id}">
      ${s.shiny?`<span class="shiny-mark">${shinyPill(s)}</span>`:""}${S.unseen.includes(s.id)?`<span class="new">Nouveau</span>`:""}
      <span class="ball">${mImg(s,160,Math.round(84*scaleOf(s.type)+6))}</span><b>${esc(specName(s))}</b>${typePill(s.type)}</button>`).join("")}</div>`
      : `<p class="empty">${sp==="shiny"?"Pas encore de shiny ici. Elles sont très rares : bonne chance !":sp==="season"?"Pas encore de bille de saison ici. Le passe de saison en donne à certains paliers.":"Aucune bille dans ce format."}</p>`);
  }

  return `<div class="page-head">
    <div><h1>Ma collection</h1><p>Chaque bille est unique : son motif et son numéro de série sont générés au moment où tu l'ouvres. L'album compte ${TOTAL_SLOTS} emplacements, un par format et par décor.</p></div>
  </div>
  <div class="col-summary">
    <section class="panel big-count">
      <small class="sample-tag">Emplacements remplis</small>
      <b>${slots.size} <small>/ ${TOTAL_SLOTS}</small></b>
      <div class="bar"><i style="width:${slots.size/TOTAL_SLOTS*100}%"></i></div>
      <small class="meta">${S.specs.length} billes au total · ${shinyCount} shiny</small>

/* =====================================================================
   ATELIER : 10 billes d'une taille -> 1 bille de la taille au-dessus
   ===================================================================== */
const CRAFT_N = 10, CRAFT_SHINY = .0005;   // même chance de shiny que le Sac Collector
const RAR_F  = TK.map(t=>TYPES[t].label);
const RAR_PL = TK.map(t=>TYPES[t].pl);
// billes qu'on peut fusionner : jamais les shiny, la bille active, la vitrine ni les billes de saison
const craftPool = t => S.specs.filter(s=>tierOf(s)===t && !s.shiny && !s.secret && s.id!==S.active && !S.vitrine.includes(s.id) && s.pal<BASE_PALS);
const slotCounts = () => { const c={}; S.specs.forEach(s=>{ const k=slotKey(s); c[k]=(c[k]||0)+1 }); return c };
// la taille au-dessus ; le décor et le coloris sont tirés au hasard avec leurs chances habituelles
function craftResult(T){
  return makeSpec(TK[T],{shiny:Math.random()<CRAFT_SHINY ? rollShiny() : 0});
}
// remplissage auto : d'abord les doubles, pour ne pas vider d'emplacement de l'album
function craftAuto(t){
  const cnt = slotCounts(), pool = [...craftPool(t)].sort((a,b)=>cnt[slotKey(b)]-cnt[slotKey(a)] || a.at-b.at), sel = [];
  for(const s of pool){ if(sel.length>=CRAFT_N) break; const k=slotKey(s); if(cnt[k]>1){ sel.push(s.id); cnt[k]-- } }
  for(const s of pool){ if(sel.length>=CRAFT_N) break; if(!sel.includes(s.id)) sel.push(s.id) }
  return sel;
}
function viewCraft(){
  const C = ui.craft || (ui.craft = {t:0, sel:[]});
  const pool = craftPool(C.t), cnt = slotCounts();
  C.sel = C.sel.filter(id=>pool.some(s=>s.id===id));
  const A = RARITY[C.t].c, B = RARITY[C.t+1].c;
  const recipes = TK.slice(0,-1).map((_,t)=>`<button class="recipe" data-action="craft-t" data-t="${t}" aria-pressed="${C.t===t}" style="--a:${RARITY[t].c};--b:${RARITY[t+1].c}">

  const slots = Array.from({length:CRAFT_N},(_,i)=>{ const s=specById(C.sel[i]);
    return s ? `<button class="fz-slot filled" data-action="craft-toggle" data-id="${s.id}" aria-label="Retirer ${esc(specName(s))}">${mImg(s,120,44,"")}</button>` : `<span class="fz-slot"></span>` }).join("");
  const last = C.sel.filter(id=>{ const s=specById(id); return !S.specs.some(x=>slotKey(x)===slotKey(s) && !C.sel.includes(x.id)) }).length;
  return `<div class="page-head">
    <div><h1>Atelier</h1><p>Fusionne ${CRAFT_N} billes d'une même taille pour obtenir une bille de la taille au-dessus : 10 Mini billes donnent une Bille, 10 Billes une Bille chinoise, 10 Billes chinoises un Calot, et ainsi de suite jusqu'au Mammouth. Son décor est tiré au hasard, et chaque fusion a ${pct(CRAFT_SHINY*100)} de chances de donner une shiny.</p></div>
    <span class="hand-note">Rien ne se perd, tout se transforme !</span>
  </div>
  <div class="recipes">${recipes}</div>

    <div class="fz-out"><span class="orb-mini">?</span><b>1 ${RAR_F[C.t+1]}</b><small>dont ${pct(CRAFT_SHINY*100)} de shiny</small></div>
    <div class="fz-actions">
      <span class="fz-count">${C.sel.length} / ${CRAFT_N} billes</span>
      <button class="btn btn-ghost" data-action="craft-auto" ${pool.length<CRAFT_N?"disabled":""}>Remplir avec mes doubles</button>
      <button class="btn btn-ghost" data-action="craft-clear" ${C.sel.length?"":"disabled"}>Vider</button>
      <button class="btn btn-yellow" data-action="craft-go" ${C.sel.length===CRAFT_N?"":"disabled"}>${ic("flask",18)} Fusionner</button>
    </div>
    ${last?`<p class="warn-note fz-warn">Attention : ${last} de ces billes ${last>1?"sont les dernières":"est la dernière"} de leur emplacement, l'album perdra ${last} case${last>1?"s":""}.</p>`:""}

    <div class="panel-head"><h2>Tes ${RAR_PL[C.t]} (${pool.length})</h2><span class="sample-tag">Touche une bille pour l'ajouter ou la retirer</span></div>
    ${pool.length ? `<div class="card-grid">${[...pool].sort((a,b)=>cnt[slotKey(b)]-cnt[slotKey(a)] || a.at-b.at).map(s=>`<button class="m-card" data-action="craft-toggle" data-id="${s.id}" aria-pressed="${C.sel.includes(s.id)}">
        ${cnt[slotKey(s)]>1?`<span class="dup-tag">Double</span>`:""}<span class="ball">${mImg(s,160,Math.round(70*scaleOf(s.type)+10))}</span><b>${esc(specName(s))}</b>${typePill(s.type)}</button>`).join("")}</div>`

}
function showCraft(inputs, out, pxp){
  const ov = document.getElementById("ov"), k = pullScore(out);
  ovState = {craft:true, results:[{s:out}], opened:new Set()};
  ov.style.setProperty("--bc", RARITY[tierOf(out)].c);
  ov.style.removeProperty("--flash");
  document.getElementById("ov-body").innerHTML = `<span class="ov-kicker">Atelier</span><div class="ov-title">Fusion en cours…</div>
    <div class="fuse-ring" style="--tc:${scoreCol(k)}">${inputs.map((s,i)=>`<img src="${marbleURL(s,120)}" alt="" style="--a:${i*36}deg;--d:${i*50}ms">`).join("")}<span class="fuse-core"></span></div>`;
  ov.hidden = false;
  document.body.style.overflow = "hidden";
  FX.fit(); FX.setDust(true);
  const reduce = FX.reduce();
  [0,500,1000].forEach((d,i)=>setTimeout(()=>Sound.shake(.8+i*.2), reduce?0:d));
  setTimeout(()=>{
    Sound.whoosh();
    const [x,y] = FX.at(document.querySelector(".fuse-core"));
    FX.burst(x,y, scoreCols(k), 60+k*16, 1.2+k*.08); FX.ring(x,y, scoreCol(k));
    if(out.shiny) FX.burst(x,y, SHINY_COLS, 90, 1.5);
    ov.style.setProperty("--flash", rgba(scoreCol(k), .6));
    FX.setDust(false);
    const ed = editionOf(out);
    document.getElementById("ov-body").innerHTML = `<div class="ov-title">${out.shiny?"Une shiny !":"Fusion réussie !"}</div>
      <p class="ov-sub">${esc(specName(out))} rejoint ta collection.</p>
      <div class="reveal-row"><button class="slot is-open ${k>=BIG?"big":""} ${out.shiny?"shiny":""}" data-action="zoom" data-id="${out.id}" aria-label="Agrandir ${esc(specName(out))}" style="--tc:${scoreCol(k)};${tstyle(out.type)}">
        ${BANNER[k]?`<span class="slot-banner">${BANNER[k]}</span>`:""}
        <div class="slot-ball"><span class="rays"></span>${mImg(out,300,Math.round(150*scaleOf(out.type)),"")}</div>
        <div class="slot-info"><b>${esc(specName(out))}</b><span style="display:flex;gap:4px;flex-wrap:wrap;justify-content:center">${typePill(out.type,true)}${shinyPill(out)}</span>${tierTag(out)}${k>=BIG?`<span class="ed-no">${edLabel(ed)}</span>`:""}<span class="zoom-hint">${ic("search",14)} Agrandir</span></div>
      </button></div>
      <div class="ov-actions"><span class="ov-xp" style="flex-basis:100%;justify-content:center">${ic("ticket",18)} +${pxp} XP de saison</span>
        ${craftPool(ui.craft.t).length>=CRAFT_N?`<button class="btn btn-yellow" data-action="craft-again">Préparer une autre fusion</button>`:""}
        <button class="btn btn-ghost" data-action="craft-see" data-id="${out.id}">Voir la fiche</button>
        <button class="btn btn-ghost" data-action="close-ov">Retour à l'atelier</button></div>`;
    Sound.reveal(FMT_TIER[out.type], !!out.shiny);
  }, reduce?50:1900);
}

let ovState = null;
function rollType(odds,min){
  const keys = TK.filter(k=>!min||TIDX[k]>=TIDX[min]);
  const tot = keys.reduce((a,k)=>a+odds[k],0);
  let x = Math.random()*tot;
  for(const k of keys){ x-=odds[k]; if(x<=0) return k }
  return keys[keys.length-1];
}
function pullBag(bag){
  const res = [];
  for(let i=0;i<bag.n;i++){
    let t = rollType(bag.odds);
    if(bag.guarantee && i===bag.n-1 && !res.some(s=>TIDX[s.type]>=TIDX[bag.guarantee])) t = rollType(bag.odds,bag.guarantee);
    const shiny = Math.random()<bag.shiny ? rollShiny() : 0;
    res.push(makeSpec(t,{shiny}));
  }
  if((S.pity||0)+1>=PITY && !res.some(s=>tierOf(s)>=BIG)){
    const last = res[res.length-1];
    res[res.length-1] = makeSpec(Math.random()*(bag.odds.boulet+bag.odds.mammouth)<bag.odds.mammouth ? "mammouth" : "boulet", {shiny:last.shiny});
    res.forced = true;
  }
  return res.sort((a,b)=>TIDX[a.type]-TIDX[b.type] || (a.shiny?1:0)-(b.shiny?1:0));
}
function openBag(bagId, gift){
  const bag = BAG_BY[bagId];
  if(gift){
    if(!(S.bagInv[bagId]>0)){ toast("Tu n'as plus de sac offert de ce type."); return }
    S.bagInv[bagId]--;
  } else if(bag.price===0){
    if(!freeReady()){ toast(`Ton prochain sac gratuit arrive dans ${freeLeft()}.`); return }
    useFree();
  } else {
    if(S.jetons < bag.price){ toast(`Il te manque ${fmt(bag.price-S.jetons)} ${CUR.many} pour ce sac.`); return }
    S.jetons -= bag.price;
  }
  const pulls = pullBag(bag);
  S.pity = pulls.some(s=>tierOf(s)>=BIG) ? 0 : (S.pity||0)+1;
  S.bags = (S.bags||0)+1;
  pulls.forEach(s=>{ if(tierOf(s)>=BIG || s.shiny) logFind(s) });
  const before = slotsOwned();
  const results = pulls.map(s=>{
    const k = slotKey(s);
    const isNew = !before.has(k);
    const newColor = !isNew && !before.get(k).some(x=>x.pal===s.pal);
    if(!before.has(k)) before.set(k,[]); before.get(k).push(s);
    S.specs.push(s); S.unseen.push(s.id);
    return {s, isNew, newColor};
  });
  const hr = new Date().getHours(), mn = new Date().getMinutes();
  const sid = hr===0 && mn<15 ? "grenier" : hr===16 && mn>=30 && mn<40 ? "gouter" : null;
  if(sid){ const sp = grantSecret(sid); if(sp) results.push({s:sp, isNew:true, newColor:false}) }
  save(); renderTop(); renderNav();
  questEvent("open_bag");
  if(bag.price===0) questEvent("open_free");
  const nBig = results.filter(r=>tierOf(r.s)>=1).length;
  if(nBig) questEvent("find_bille", nBig);
  if(results.some(r=>TIDX[r.s.type]>=TIDX.calot)) questEvent("find_calot");
  if(results.some(r=>r.isNew)) questEvent("new_slot");
  ovState = {bag, results, opened:new Set(), gift, forced:!!pulls.forced, pxp:passXP(BAG_XP[bag.id])};
  showBagStage();
}
// Taille la plus grosse d'un tirage : 0 (Mini) à 4 (Mammouth), et 6 pour une shiny
const pullScore = s => s.shiny || s.secret ? 6 : tierOf(s);
const scoreCol = k => k>=6 ? "#FFD27A" : RARITY[k].c;
const scoreCols = k => k>=6 ? SHINY_COLS : [RARITY[k].c, shade(RARITY[k].c,.45), "#FFF3D6"];
const BANNER = ["","","Chinoise !","Calot !","Boulet !","Mammouth !","Shiny !"];

// petites particules plein écran pendant l'ouverture
const FX = {
  parts:[], raf:0, dust:false, ctx:null,
  reduce(){ return matchMedia("(prefers-reduced-motion: reduce)").matches },
  fit(){ const c=document.getElementById("ov-fx"), d=Math.min(2,window.devicePixelRatio||1);
    c.width=Math.round(innerWidth*d); c.height=Math.round(innerHeight*d); this.ctx=c.getContext("2d"); this.ctx.setTransform(d,0,0,d,0,0) },
  burst(x,y,cols,n=40,pow=1){ if(this.reduce()) return;
    for(let i=0;i<n;i++){ const a=Math.random()*TAU, v=(1.5+Math.random()*6)*pow;
      this.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.2*pow,life:1,dec:.009+Math.random()*.015,sz:1.5+Math.random()*3*pow,c:cols[i%cols.length],spark:Math.random()<.6,g:.1}) }
    this.start() },
  ring(x,y,c){ if(this.reduce()) return; this.parts.push({ring:true,x,y,r:20,life:1,dec:.028,c}); this.start() },
  at(el){ const r=el.getBoundingClientRect(); return [r.left+r.width/2, r.top+r.height/2] },
  setDust(on){ this.dust=on && !this.reduce(); if(this.dust) this.start() },
  start(){ if(!this.raf){ if(!this.ctx) this.fit(); this.raf=requestAnimationFrame(()=>this.loop()) } },
  loop(){
    const c=this.ctx; c.clearRect(0,0,innerWidth,innerHeight);
    if(this.dust && Math.random()<.3) this.parts.push({x:Math.random()*innerWidth,y:innerHeight+6,vx:(Math.random()-.5)*.3,vy:-.35-Math.random()*.7,life:1,dec:.003+Math.random()*.003,sz:.8+Math.random()*2,c:"#FFE3B0",dust:true,g:0});
    c.globalCompositeOperation="lighter";
    this.parts = this.parts.filter(p=>{
      p.life -= p.dec; if(p.life<=0) return false;
      if(p.ring){ p.r += 9*p.life+2; c.globalAlpha=p.life*.8; c.strokeStyle=p.c; c.lineWidth=4*p.life+1; c.beginPath(); c.arc(p.x,p.y,p.r,0,TAU); c.stroke(); return true }
      p.vx*=.982; p.vy=p.vy*.982+p.g; p.x+=p.vx; p.y+=p.vy;
      c.globalAlpha = Math.min(1,p.life*1.5)*(p.dust?.45:1); c.fillStyle=p.c; c.strokeStyle=p.c;
      if(p.spark){ c.lineWidth=p.sz*.7; c.beginPath(); c.moveTo(p.x,p.y); c.lineTo(p.x-p.vx*3,p.y-p.vy*3); c.stroke() }
      else { c.beginPath(); c.arc(p.x,p.y,p.sz*(p.dust?1:.4+p.life*.6),0,TAU); c.fill() }
      return true;
    });
    c.globalAlpha=1; c.globalCompositeOperation="source-over";
    this.raf = (this.parts.length||this.dust) ? requestAnimationFrame(()=>this.loop()) : 0;
  },
  stop(){ this.parts=[]; this.dust=false; cancelAnimationFrame(this.raf); this.raf=0; if(this.ctx) this.ctx.clearRect(0,0,innerWidth,innerHeight) },
};
addEventListener("resize", ()=>{ if(FX.ctx) FX.fit() });

// le sac se prend en main : on le secoue en le faisant glisser, un simple appui l'ouvre
function bindBag(){
  const st = document.getElementById("bag-stage"), svg = st.querySelector("svg");
  let drag = null, lastShake = 0, lastVX = 0;
  st.addEventListener("animationend", ()=>st.classList.remove("jiggle"));
  st.addEventListener("pointerdown", e=>{
    if(st.dataset.busy) return;
    drag = {x:e.clientX, y:e.clientY, px:e.clientX, py:e.clientY, t:performance.now(), moved:0};
    st.setPointerCapture(e.pointerId); st.classList.add("dragging"); svg.style.transition = "none";
  });
  st.addEventListener("pointermove", e=>{
    if(!drag) return;
    const n = performance.now(), dt = Math.max(1,n-drag.t);
    const dx = e.clientX-drag.x, dy = e.clientY-drag.y;
    drag.moved = Math.max(drag.moved, Math.hypot(dx,dy));
    const cx = Math.max(-70,Math.min(70,dx*.6)), cy = Math.max(-50,Math.min(50,dy*.6));
    svg.style.transform = `translate(${cx}px,${cy}px) rotate(${cx*.25}deg)`;
    const vx = (e.clientX-drag.px)/dt, speed = Math.hypot(e.clientX-drag.px,e.clientY-drag.py)/dt;
    if(speed>.6 && n-lastShake>110 && (Math.sign(vx)!==Math.sign(lastVX) || speed>1.6)){ Sound.shake(Math.min(1.3,speed/1.8)); lastShake = n; if(ovState) ovState.shakes = (ovState.shakes||0)+1 }
    if(vx) lastVX = vx;
    drag.px = e.clientX; drag.py = e.clientY; drag.t = n;
  });
  const end = e=>{
    if(!drag) return;
    const moved = drag.moved; drag = null;
    svg.style.transition = "transform .35s cubic-bezier(.3,1.6,.5,1)"; svg.style.transform = "";
    setTimeout(()=>{ st.classList.remove("dragging"); svg.style.transition = "" }, 360);
    if(moved<8 && e.type==="pointerup") tear();
  };
  st.addEventListener("pointerup", end);
  st.addEventListener("pointercancel", end);
  st.addEventListener("click", e=>{ if(e.detail===0) tear() });   // clavier
}
function shakeBag(){
  const st = document.getElementById("bag-stage");
  if(!st || st.dataset.busy) return;
  st.classList.remove("jiggle"); void st.offsetWidth; st.classList.add("jiggle");
  Sound.shake(1); setTimeout(()=>Sound.shake(.9),200); setTimeout(()=>Sound.shake(.7),400);
  if(ovState) ovState.shakes = (ovState.shakes||0)+3;
}
function tear(){
  const st = document.getElementById("bag-stage");
  if(!st || st.dataset.busy) return;
  st.dataset.busy = 1;
  if((ovState.shakes||0)>=20){ const sp = grantSecret("preau"); if(sp) ovState.results.push({s:sp, isNew:true, newColor:false}) }
  const reduce = FX.reduce();
  const zone = document.getElementById("bag-zone");
  st.classList.remove("dragging","jiggle");
  st.querySelector("svg").style.transform = "";
  document.querySelector(".bag-tools")?.setAttribute("hidden","");
  document.querySelector(".ov-hint")?.setAttribute("hidden","");
  // le halo monte en couleur jusqu'à la meilleure rareté du sac : ça annonce la couleur
  const best = Math.max(...ovState.results.map(r=>pullScore(r.s)));
  const steps = [0, Math.min(best,2), best];
  zone.classList.add("charging");
  steps.forEach((k,i)=>setTimeout(()=>{
    zone.style.setProperty("--glow", rgba(scoreCol(k), .75));
    Sound.shake(1+i*.12);
    if(i===2 && best>=BIG) FX.burst(...FX.at(st), scoreCols(best), 16, .5);
  }, reduce?0:i*340));
  setTimeout(()=>{
    Sound.whoosh();
    zone.classList.remove("charging"); st.classList.add("burst");
    document.getElementById("ov").style.setProperty("--flash", rgba(scoreCol(best), best>=BIG?.75:.5));
    const [x,y] = FX.at(st);
    FX.burst(x,y, scoreCols(best), 60+best*18, 1.2+best*.08);
    FX.ring(x,y, scoreCol(best));
    if(best>=6) FX.burst(x,y, SHINY_COLS, 90, 1.6);
  }, reduce?0:1050);
  setTimeout(showReveal, reduce?50:1500);
}
function showReveal(){
  const {results} = ovState;
  FX.setDust(false);
  document.getElementById("ov-body").innerHTML = `
    <div class="ov-title">${results.length} billes trouvées !</div>
    <p class="ov-sub">${ovState.forced?"Garantie Boulet activée : un gros t'attend !":"Touche chaque bille pour la découvrir. La couleur de la lueur annonce sa taille…"}</p>
    <div class="reveal-row">
      ${results.map(({s,isNew,newColor},i)=>{
        const k = pullScore(s), big = k>=BIG;
        return `<button class="slot ${k>=FMT_TIER.calot?"hint":""} ${big?"big":""} ${s.shiny?"shiny":""}" style="--d:${i*130}ms;--tc:${scoreCol(k)};${tstyle(s.type)}" data-action="reveal" data-i="${i}" aria-label="Découvrir la bille ${i+1}">
        ${s.secret?`<span class="slot-banner">Secrète !</span>`:BANNER[k]?`<span class="slot-banner">${BANNER[k]}</span>`:""}
        <div class="slot-ball"><span class="rays"></span><span class="orb">?</span>${mImg(s,300,Math.round(150*scaleOf(s.type)),"")}</div>

  // chaque bille tombe du sac et rebondit (les gros formats sonnent plus grave)
  results.forEach(({s},i)=>Sound.drop(i*.13+.32, 1.25-scaleOf(s.type)*.5+Math.random()*.08));
}
function reveal(i){
  if(!ovState) return;
  // déjà découverte : on l'ouvre en grand, par-dessus l'ouverture
  if(ovState.opened.has(i)){ const s=ovState.results[i].s; if(specById(s.id)) openModal(s.id); return }
  ovState.opened.add(i);
  const el = document.querySelector(`.slot[data-i="${i}"]`);
  el.classList.add("is-open"); el.classList.remove("hint");

  if(k>=BIG){ const b=document.getElementById("ov-body"); b.classList.remove("quake"); void b.offsetWidth; b.classList.add("quake") }
  Sound.reveal(TIDX[rs.type], !!rs.shiny);

function finishReveal(){
  const {bag,results} = ovState;
  const best = results[results.length-1].s;
  const shiny = results.find(r=>r.s.shiny);
  const top = [...results].sort((a,b)=>pullScore(b.s)-pullScore(a.s))[0].s, tk = pullScore(top);
  document.querySelector(".ov-sub").textContent = shiny ? `Incroyable : une bille shiny ${SHINIES[shiny.s.shiny].name} !`

  document.querySelector(".ov-sub").textContent += " Touche une bille pour l'agrandir.";
  let again = "";
  if(ovState.gift){
    const n = S.bagInv[bag.id]||0;
    again = n ? `<button class="btn btn-yellow" data-action="buy-again">Ouvrir un autre sac offert (×${n})</button>` : `<button class="btn btn-yellow" data-action="to-bags">Voir les sacs</button>`;
  } else if(bag.price>0){

  } else {

  }
  document.getElementById("ov-actions").innerHTML = `<span class="ov-xp" style="flex-basis:100%;justify-content:center">${ic("ticket",18)} +${ovState.pxp} XP de saison</span>${again}<button class="btn btn-ghost" data-action="to-collection">Voir ma collection</button>`;

const W=900, H=520, BR=12, HOLE_R=15, MAXV=24;
const LEVELS = [
  {name:"Première ligne", par:2, start:[130,260], hole:[770,260], walls:[[430,190,40,140]], bumpers:[], sand:[]},

  {name:"Le zigzag", par:4, start:[110,90], hole:[800,440], walls:[[240,20,30,350],[450,150,30,350],[660,20,30,350]], bumpers:[], sand:[]},
  {name:"Le bunker", par:3, start:[110,260], hole:[760,260], walls:[[650,150,230,24],[650,346,230,24]], bumpers:[[400,140,24],[400,380,24]], sand:[[520,130,110,260]]},
  {name:"La spirale", par:4, start:[100,80], hole:[800,420], walls:[[20,140,660,26],[220,300,660,26]], bumpers:[[450,233,22]], sand:[]},

const BORDER = [[0,0,W,20],[0,H-20,W,20],[0,0,20,H],[W-20,0,20,H]];
const game = {lvl:0, raf:null};
const ballCanvas = document.createElement("canvas");
const ballGL = makeGL(ballCanvas);
let feltCanvas = null;

function starsFor(strokes,par){ return strokes<=par?3:strokes===par+1?2:1 }
function rewardFor(strokes,par){ const st=starsFor(strokes,par); return [0,20,40,60][st] + (strokes===1?40:0) }

function renderHoles(){
  const el = document.getElementById("g-holes"); if(!el) return;
  el.innerHTML = LEVELS.map((L,i)=>{
    const b = S.best[i]; const st = b ? starsFor(b,L.par) : 0;
    return `<button class="hole-btn" data-action="g-level" data-l="${i}" aria-current="${game.lvl===i}"><span class="n">${i+1}</span><span><b>${L.name}</b><small>Par ${L.par}${b?` · record ${b}`:""}${playedToday().tir[i]?" · récompense prise":""}</small></span><span class="mini-stars">${[1,2,3].map(k=>STAR(k<=st)).join("")}</span></button>`;
  }).join("");
}
function initGame(){
  cancelAnimationFrame(game.raf);
  const cv = document.getElementById("g-canvas");
  game.cv = cv; game.ctx = cv.getContext("2d");
  if(!feltCanvas){
    feltCanvas = document.createElement("canvas"); feltCanvas.width = feltCanvas.height = 96;
    const x = feltCanvas.getContext("2d"); x.fillStyle="#3E9A4A"; x.fillRect(0,0,96,96);
    const r = rng(12345);
    for(let i=0;i<700;i++){ x.fillStyle = r()<.5 ? "rgba(0,40,0,.10)" : "rgba(255,255,220,.06)"; x.fillRect(r()*96,r()*96,1.2,1.2) }
  }
  game.felt = game.ctx.createPattern(feltCanvas,"repeat");
  const act = activeSpec();
  game.spec = act;
  game.ballImg = null;
  if(!ballGL && act){ const im = new Image(); im.src = marbleURL(act,96); game.ballImg = im }
  cv.addEventListener("pointerdown", gDown);
  cv.addEventListener("pointermove", gMove);
  cv.addEventListener("pointerup", gUp);
  cv.addEventListener("pointercancel", ()=>{ game.aim=null });
  loadLevel(game.lvl);
  game.last = performance.now();
  game.raf = requestAnimationFrame(gLoop);
}
function loadLevel(i){
  game.lvl = i;
  const L = LEVELS[i];
  game.L = L;
  game.ball = {x:L.start[0], y:L.start[1], vx:0, vy:0};
  game.R = I3.slice();
  game.strokes = 0; game.moving = false; game.aim = null; game.sink = 0; game.done = false; game.bumpHit = {};
  game.walls = [...BORDER, ...L.walls];
  document.getElementById("g-result").hidden = true;
  updHud(); renderHoles();
}
function updHud(){
  const L = game.L;
  document.getElementById("g-name").innerHTML = `<small>Trou ${game.lvl+1}/${LEVELS.length}</small>${L.name}`;
  document.getElementById("g-par").textContent = L.par;
  document.getElementById("g-strokes").textContent = game.strokes;
  document.getElementById("g-best").textContent = S.best[game.lvl] || "–";
}
function gPos(e){ const r=game.cv.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H} }
function gDown(e){ if(game.moving||game.done) return; game.aim = gPos(e); game.cv.setPointerCapture(e.pointerId) }
function gMove(e){ if(game.aim) game.aim = gPos(e) }
function gUp(){
  if(!game.aim) return;
  const b = game.ball, dx = b.x-game.aim.x, dy = b.y-game.aim.y, len = Math.hypot(dx,dy);
  const power = Math.min(len/180,1);
  game.aim = null;
  if(power<.04 || len===0) return;
  [b.vx, b.vy] = wobble(game.spec, dx/len*power*MAXV, dy/len*power*MAXV);
  game.moving = true; game.strokes++; updHud();
  Sound.rollStart(); Sound.shot(power);
}
function inRect(x,y,[rx,ry,rw,rh]){ return x>rx && x<rx+rw && y>ry && y<ry+rh }
function physStep(){
  const b = game.ball, L = game.L;
  for(let sub=0;sub<4;sub++){
    b.x += b.vx/4; b.y += b.vy/4;
    for(const w of game.walls){
      const cx = Math.max(w[0],Math.min(b.x,w[0]+w[2])), cy = Math.max(w[1],Math.min(b.y,w[1]+w[3]));
      let dx = b.x-cx, dy = b.y-cy, d = Math.hypot(dx,dy);
      if(d<BR){
        if(d===0){ dx=0; dy=-1; d=1 }
        const nx=dx/d, ny=dy/d;
        b.x = cx+nx*BR; b.y = cy+ny*BR;
        const vn = b.vx*nx+b.vy*ny;
        if(vn<0){
          b.vx -= 1.72*vn*nx; b.vy -= 1.72*vn*ny;
          const tn = performance.now();
          if(vn<-1.2 && tn-(game.lastWall||0)>60){ Sound.wall(-vn/12); game.lastWall = tn }
        }
      }
    }
    L.bumpers.forEach(([bx,by,br],i)=>{
      const dx=b.x-bx, dy=b.y-by, d=Math.hypot(dx,dy);
      if(d<br+BR && d>0){
        const nx=dx/d, ny=dy/d;
        b.x = bx+nx*(br+BR); b.y = by+ny*(br+BR);
        const vn = b.vx*nx+b.vy*ny;
        if(vn<0){ b.vx -= 2.1*vn*nx; b.vy -= 2.1*vn*ny; game.bumpHit[i]=performance.now(); Sound.bumper() }
      }
    });
  }
  const sand = L.sand.some(r=>inRect(b.x,b.y,r));
  const f = sand ? .93 : .984;
  b.vx *= f; b.vy *= f;
  const hx = L.hole[0]-b.x, hy = L.hole[1]-b.y, hd = Math.hypot(hx,hy), sp = Math.hypot(b.vx,b.vy);
  if(hd<HOLE_R){
    if(sp<8.5){ game.moving=false; game.sink=1; b.vx=b.vy=0; Sound.hole(); return }
    b.vx += hx*.05; b.vy += hy*.05;
  } else if(hd<HOLE_R+10 && sp<3){ b.vx += hx*.012; b.vy += hy*.012 }
  // roulement de la bille (rotation 3D)
  if(sp>0.01){
    game.R = mul3(rotAxis(b.vy,b.vx,0,sp/BR), game.R);
    game.rc = (game.rc||0)+1; if(game.rc%60===0) game.R = ortho3(game.R);
  }
  if(sp<.07){ b.vx=b.vy=0; game.moving=false; if(game.strokes>=10) finishHole(false) }
}
function gLoop(t){
  if(ui.view!=="tir" || !document.body.contains(game.cv)){ Sound.rollStop(); return }
  const steps = Math.min(4, Math.max(1, Math.round((t-game.last)/16.67)));
  game.last = t;
  for(let i=0;i<steps;i++){
    if(game.moving) physStep();
    if(game.sink>0 && !game.done){ game.sink += .06; if(game.sink>=2){ finishHole(true) } }
  }
  const gb = game.ball;
  Sound.roll(game.moving ? Math.hypot(gb.vx,gb.vy) : 0, game.L.sand.some(r=>inRect(gb.x,gb.y,r)));
  gDraw();
  game.raf = requestAnimationFrame(gLoop);
}
function finishHole(success){
  game.done = true;
  const L = game.L, el = document.getElementById("g-result");
  let html;
  if(success){
    const st = starsFor(game.strokes,L.par), rew = rewardFor(game.strokes,L.par);
    const rec = !S.best[game.lvl] || game.strokes<S.best[game.lvl];
    if(rec) S.best[game.lvl] = game.strokes;
    const P = playedToday(), paid = !P.tir[game.lvl];
    if(paid){ P.tir[game.lvl] = 1; S.jetons += rew }
    S.holes++; save(); renderTop(); updHud(); renderHoles();
    const pxp = paid ? passXP(PASS_XP.star*st) : 0;
    questEvent("hole");
    if(game.strokes<=L.par) questEvent("par");
    if(game.strokes<=2) questEvent("twoshots");
    const msg = game.strokes===1 ? "Trou en un !" : game.strokes<L.par ? "Sous le par !" : game.strokes===L.par ? "Pile au par !" : "Dans le trou !";
    html = `<h2>${msg}</h2><div class="stars">${[1,2,3].map(k=>STAR(k<=st)).join("")}</div>
      <p>${game.strokes} coup${game.strokes>1?"s":""} pour un par de ${L.par}${rec?" · nouveau record":""}</p>
      ${paid ? `<span class="reward">${COIN}+${rew} ${CUR.many} · +${pxp} XP</span>` : `<p class="meta">Ce trou a déjà rapporté aujourd'hui : celui-ci était pour le plaisir.</p>`}`;
  } else {
    html = `<h2>Trop de coups</h2><p>10 coups, c'est le maximum. Retente ta chance !</p>`;
  }
  const next = game.lvl<LEVELS.length-1;
  html += `<div class="row"><button class="btn btn-ghost" data-action="g-restart">Rejouer ce trou</button>${next?`<button class="btn btn-yellow" data-action="g-level" data-l="${game.lvl+1}">Trou suivant ${ic("arrow",16)}</button>`:`<button class="btn btn-yellow" data-action="nav" data-view="sacs">Dépenser mes ${CUR.many}</button>`}</div>`;
  el.innerHTML = `<div class="g-card">${html}</div>`;
  el.hidden = false;
}
function rrect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath() }
function gDraw(){
  const cv = game.cv, c = game.ctx, L = game.L;
  const dpr = window.devicePixelRatio||1;
  const wpx = Math.round(cv.clientWidth*dpr);
  if(cv.width!==wpx){ cv.width = wpx; cv.height = Math.round(wpx*H/W) }
  const s = cv.width/W;
  c.setTransform(s,0,0,s,0,0);
  // cadre bois + feutrine
  c.fillStyle = "#8B5A2B"; c.fillRect(0,0,W,H);
  c.fillStyle = "#A06A36"; c.fillRect(4,4,W-8,6);
  c.fillStyle = game.felt; c.fillRect(20,20,W-40,H-40);
  c.strokeStyle = "rgba(0,0,0,.28)"; c.lineWidth = 6; c.strokeRect(23,23,W-46,H-46);
  // sable
  L.sand.forEach(([x,y,w,h])=>{ rrect(c,x,y,w,h,22); c.fillStyle="#E8D3A0"; c.fill(); c.strokeStyle="rgba(150,110,50,.35)"; c.lineWidth=2; c.stroke();
    c.fillStyle="rgba(150,110,50,.25)"; const r=rng(x*7+y); for(let i=0;i<w*h/140;i++){ c.fillRect(x+10+r()*(w-20), y+10+r()*(h-20), 2, 2) } });
  // murs
  L.walls.forEach(([x,y,w,h])=>{
    c.fillStyle="rgba(0,0,0,.25)"; c.fillRect(x+4,y+6,w,h);
    c.fillStyle="#A8713F"; c.fillRect(x,y,w,h);
    c.fillStyle="#C68C54"; c.fillRect(x,y,w,Math.min(5,h));
    c.strokeStyle="#6E4524"; c.lineWidth=1.5; c.strokeRect(x+.75,y+.75,w-1.5,h-1.5);
  });
  // champignons
  const now = performance.now();
  L.bumpers.forEach(([x,y,r],i)=>{
    const k = game.bumpHit[i] ? Math.max(0,1-(now-game.bumpHit[i])/250) : 0;
    const rr = r*(1+k*.12);
    c.fillStyle="rgba(0,0,0,.25)"; c.beginPath(); c.arc(x+3,y+5,rr,0,TAU); c.fill();
    const g = c.createRadialGradient(x-rr*.35,y-rr*.35,rr*.1,x,y,rr); g.addColorStop(0,"#FF8A7A"); g.addColorStop(1,"#C8282E");
    c.fillStyle=g; c.beginPath(); c.arc(x,y,rr,0,TAU); c.fill();
    c.strokeStyle="#fff"; c.lineWidth=3; c.beginPath(); c.arc(x,y,rr*.62,0,TAU); c.stroke();
    c.fillStyle="#fff"; c.beginPath(); c.arc(x,y,rr*.22,0,TAU); c.fill();
  });
  // départ
  c.fillStyle="rgba(255,255,255,.35)"; c.beginPath(); c.arc(L.start[0],L.start[1],6,0,TAU); c.fill();
  // trou + drapeau
  const [hx,hy] = L.hole;
  c.fillStyle="rgba(255,255,255,.18)"; c.beginPath(); c.arc(hx,hy,HOLE_R+3,0,TAU); c.fill();
  const hg = c.createRadialGradient(hx,hy-4,2,hx,hy,HOLE_R); hg.addColorStop(0,"#050A04"); hg.addColorStop(1,"#1C3319");
  c.fillStyle=hg; c.beginPath(); c.arc(hx,hy,HOLE_R,0,TAU); c.fill();
  c.strokeStyle="#EDEDED"; c.lineWidth=2.5; c.beginPath(); c.moveTo(hx,hy); c.lineTo(hx,hy-58); c.stroke();
  c.fillStyle="#E5484D"; c.beginPath(); c.moveTo(hx,hy-58); c.lineTo(hx+30,hy-49); c.lineTo(hx,hy-40); c.closePath(); c.fill();
  c.fillStyle="#fff"; c.font="bold 11px Nunito, sans-serif"; c.textAlign="center"; c.fillText(String(game.lvl+1),hx+11,hy-45);
  // visée
  const b = game.ball;
  if(game.aim && !game.moving){
    const dx=b.x-game.aim.x, dy=b.y-game.aim.y, len=Math.hypot(dx,dy)||1, p=Math.min(len/180,1);
    const ux=dx/len, uy=dy/len, reach=40+p*170;
    c.strokeStyle="rgba(255,255,255,.35)"; c.lineWidth=2; c.setLineDash([2,6]);
    c.beginPath(); c.moveTo(b.x,b.y); c.lineTo(game.aim.x,game.aim.y); c.stroke();
    c.setLineDash([]);
    const col = p<.5 ? "#FFE14D" : p<.85 ? "#FF9F1C" : "#FF4D4D";
    for(let i=1;i<=9;i++){ const t=i/9; c.fillStyle=col; c.globalAlpha=1-t*.6; c.beginPath(); c.arc(b.x+ux*(BR+t*reach),b.y+uy*(BR+t*reach),3.2-t*1.4,0,TAU); c.fill() }
    c.globalAlpha=1;
    c.strokeStyle=col; c.lineWidth=4; c.beginPath(); c.arc(b.x,b.y,BR+9,-Math.PI/2,-Math.PI/2+p*TAU); c.stroke();
  }
  // bille
  let scale = 1, alpha = 1;

function aStep(){
  const A = arena, live = A.balls.filter(b=>b.alive);

    for(const b of live){
      b.x += b.vx/4; b.y += b.vy/4;
      const lo = AB+b.r, hiX = AW-AB-b.r, hiY = AH-AB-b.r;
      let bump = 0;
      if(b.x<lo){ b.x=lo; if(b.vx<0){ bump=-b.vx; b.vx*=-.55 } } else if(b.x>hiX){ b.x=hiX; if(b.vx>0){ bump=b.vx; b.vx*=-.55 } }
      if(b.y<lo){ b.y=lo; if(b.vy<0){ bump=-b.vy; b.vy*=-.55 } } else if(b.y>hiY){ b.y=hiY; if(b.vy>0){ bump=b.vy; b.vy*=-.55 } }

        const dx=b.x-p.x, dy=b.y-p.y, d=Math.hypot(dx,dy);
        if(d<p.r+b.r && d>0){ const nx=dx/d, ny=dy/d; b.x=p.x+nx*(p.r+b.r); b.y=p.y+ny*(p.r+b.r);

    for(let i=0;i<live.length;i++) for(let j=i+1;j<live.length;j++){
      const a=live[i], c=live[j], dx=c.x-a.x, dy=c.y-a.y, d=Math.hypot(dx,dy), rr=a.r+c.r;
      if(d<rr && d>0){

        a.x-=nx*ov*ia/(ia+ic2); a.y-=ny*ov*ia/(ia+ic2); c.x+=nx*ov*ic2/(ia+ic2); c.y+=ny*ov*ic2/(ia+ic2);

function aLoop(t){

  const steps = Math.min(4, Math.max(1, Math.round((t-A.last)/16.67)));

  }
}

// --- la piste de sable : une ligne brisée avec une demi-largeur ---
const TRACK = [[90,440],[330,440],[420,380],[420,280],[330,220],[160,220],[110,150],[170,80],[450,80],[560,140],[600,260],[700,330],[800,300],[830,180],[790,90]];
const TRACK_HW = 34;
const trackSeg = (()=>{ const out=[]; let acc=0; for(let i=0;i<TRACK.length-1;i++){ const [x1,y1]=TRACK[i],[x2,y2]=TRACK[i+1], len=Math.hypot(x2-x1,y2-y1); out.push({x1,y1,x2,y2,len,acc}); acc+=len } out.L=acc; return out })();
// point de la piste le plus proche, en ne regardant qu'une portion [lo,hi] (pas de raccourci possible)
function trackNear(x,y,lo=-1e9,hi=1e9){
  let best = {d:1e9, s:0};
  for(const g of trackSeg){
    if(g.acc>hi || g.acc+g.len<lo) continue;
    const dx=g.x2-g.x1, dy=g.y2-g.y1;
    let t = ((x-g.x1)*dx+(y-g.y1)*dy)/(g.len*g.len);
    t = Math.max(Math.max(0,(lo-g.acc)/g.len), Math.min(Math.min(1,(hi-g.acc)/g.len), t));
    const px=g.x1+dx*t, py=g.y1+dy*t, d=Math.hypot(x-px,y-py);
    if(d<best.d) best = {d, s:g.acc+t*g.len};
  }
  return best;
}
function trackAt(s){
  s = Math.max(0,Math.min(trackSeg.L,s));
  for(const g of trackSeg) if(s<=g.acc+g.len){ const t=(s-g.acc)/g.len; return {x:g.x1+(g.x2-g.x1)*t, y:g.y1+(g.y2-g.y1)*t, nx:-(g.y2-g.y1)/g.len, ny:(g.x2-g.x1)/g.len} }
  const g = trackSeg[trackSeg.length-1]; return {x:g.x2, y:g.y2, nx:-(g.y2-g.y1)/g.len, ny:(g.x2-g.x1)/g.len};
}
function drawTrack(c){
  c.fillStyle="#EBD3A0"; c.fillRect(AB,AB,AW-2*AB,AH-2*AB);
  c.globalAlpha=.25; c.fillStyle=arena.dirt; c.fillRect(AB,AB,AW-2*AB,AH-2*AB); c.globalAlpha=1;
  const path = ()=>{ c.beginPath(); TRACK.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y)) };
  c.lineJoin="round"; c.lineCap="round";
  path(); c.strokeStyle="#C9A56A"; c.lineWidth=TRACK_HW*2+16; c.stroke();
  path(); c.strokeStyle="#F6E6C2"; c.lineWidth=TRACK_HW*2+7; c.stroke();
  path(); c.strokeStyle="#D6B67A"; c.lineWidth=TRACK_HW*2; c.stroke();
  path(); c.strokeStyle="rgba(255,255,255,.35)"; c.lineWidth=2; c.setLineDash([6,10]); c.stroke(); c.setLineDash([]);
  // départ (craie) et arrivée (damier)
  const st = trackAt(112); chalk(c); c.beginPath(); c.moveTo(st.x+st.nx*TRACK_HW,st.y+st.ny*TRACK_HW); c.lineTo(st.x-st.nx*TRACK_HW,st.y-st.ny*TRACK_HW); c.stroke();
  const f = trackAt(trackSeg.L-30), tx=-f.ny, ty=f.nx;
  for(let i=-4;i<4;i++) for(let j=0;j<2;j++){ c.fillStyle=(i+j)%2?"#24253D":"#fff";
    const cx=f.x+f.nx*(i+.5)*8.5+tx*(j-.5)*8.5, cy=f.y+f.ny*(i+.5)*8.5+ty*(j-.5)*8.5; c.fillRect(cx-4.25,cy-4.25,8.5,8.5) }
  const p = trackAt(trackSeg.L); c.strokeStyle="#5A3A20"; c.lineWidth=3; c.beginPath(); c.moveTo(p.x+30,p.y+10); c.lineTo(p.x+30,p.y-38); c.stroke();
  c.fillStyle="#E5484D"; c.beginPath(); c.moveTo(p.x+30,p.y-38); c.lineTo(p.x+54,p.y-30); c.lineTo(p.x+30,p.y-22); c.closePath(); c.fill();
}
SETUP.course = ()=>{

function courseRest(){
  const A = arena;
  for(const r of A.racers){
    if(r.done) continue;
    const b = r.ball, n = trackNear(b.x,b.y,r.s-80,r.s+420);
    if(n.s>=trackSeg.L-45 && n.d<=TRACK_HW+30){ r.done = true; A.rank.push(r); b.alive = false; if(!r.mine) toast(`${r.name} passe la ligne d'arrivée !`); continue }
    if(n.d>TRACK_HW){ b.x=r.safe.x; b.y=r.safe.y; b.vx=b.vy=0; if(b===A.shooter && r.mine) toast("Sortie de piste ! Ta bille revient à sa place.") }
    else { r.safe = {x:b.x, y:b.y}; r.s = Math.max(r.s, n.s) }
  }
  const me = A.racers[0];
  if(me.done || A.flicks>=30 || A.rank.length>=3){ endCourse(); return }
  let i = A.turnIdx;
  do { i = (i+1)%A.racers.length } while(A.racers[i].done);
  A.turnIdx = i; A.shooter = A.racers[i].ball; A.turn = i===0 ? "me" : "opp";
  updArenaHud();
  if(i!==0) setTimeout(aiCourse, 650);
}
// l'adversaire vise un point de la piste un peu plus loin, en vérifiant que la ligne droite reste dans le sable
function aiCourse(){
  const A = arena; if(A.mode!=="course" || A.done || A.moving || A.turnIdx===0) return;
  const r = A.racers[A.turnIdx], b = r.ball;
  let look = 110+r.skill*150, t;
  for(; look>40; look-=20){
    t = trackAt(r.s+look);
    let ok = true;
    for(let k=1;k<=10 && ok;k++){ const x=b.x+(t.x-b.x)*k/10, y=b.y+(t.y-b.y)*k/10; if(trackNear(x,y,r.s-80,r.s+look+60).d>TRACK_HW-8) ok=false }
    if(ok) break;
  }
  const d = Math.hypot(t.x-b.x,t.y-b.y), err = .16-r.skill*.1;
  const ang = Math.atan2(t.y-b.y,t.x-b.x)+(Math.random()*2-1)*err;
  const v = Math.min(AMAXV, d*(1-A.fric)/A.fric*(.9+Math.random()*.2));
  launch(b, Math.cos(ang)*v, Math.sin(ang)*v, v/AMAXV);
}
function endCourse(){
  const A = arena, me = A.racers[0], bet = A.bet||0;
  const pos = me.done ? A.rank.indexOf(me)+1 : 4;
  const gain = pos===1 ? bet*4 : pos===2 ? bet : 0, st = [3,2,1,0][pos-1];
  if(pos===1 && bet) S.stats.race++;
  payOut(gain, st, pos===1?"course":null, bet>0);
  const money = !bet ? " Partie pour de faux : rien de gagné, rien de perdu."
    : pos===1 ? ` Tu rafles les 4 mises : +${gain} ${CUR.many} !` : pos===2 ? " Tu récupères ta mise." : ` Ta mise de ${bet} ${CUR.many} est perdue.`;
  arenaResult(pos===1?"Maillot jaune !":pos===2?"Deuxième !":pos===3?"Sur le podium !":me.done?"Quatrième":"Pas fini…", st,
    (me.done ? `Tu passes la ligne en ${pos}${pos===1?"re":"e"} position, en ${A.flicks} pichenette${A.flicks>1?"s":""}.` : "Les autres sont arrivés avant toi.")+money, gain);
}
// l'adversaire vise ta bille, avec une petite erreur qui diminue avec le niveau
function aiShot(){
  const A = arena; if(A.mode!=="tic" || A.done || A.turn!=="opp" || A.moving) return;
  const a = A.foeBall, t = A.me, dist = Math.hypot(t.x-a.x,t.y-a.y);
  const err = [.2,.14,.1,.07,.05][A.lvl-1];
  const ang = Math.atan2(t.y-a.y,t.x-a.x) + (Math.random()*2-1)*err;
  const v = Math.min(AMAXV, (dist+50)*(1-A.fric)/A.fric*(.95+Math.random()*.3));
  launch(a, Math.cos(ang)*v, Math.sin(ang)*v, v/AMAXV);
}
function endTic(res){
  const A = arena, bet = A.bet||0;
  if(res==="win"){
    if(bet) S.stats.tic++;
    payOut(bet*2, 3, "tic", bet>0);
    arenaResult("Tic !", 3, `Tu as touché la bille de ${esc(A.foe.name)}. ${bet?`Tu rafles la mise : +${bet*2} ${CUR.many} !`:"Bien visé ! (partie pour de faux)"}`, bet*2);
  } else if(res==="lose"){
    arenaResult("Tic… pour lui !", 0, `${esc(A.foe.name)} a touché ta bille en premier. ${bet?`Ta mise de ${bet} ${CUR.many} est perdue, mais tu gardes ta bille.`:"Partie pour de faux : rien de perdu."}`, 0);
  } else {
    payOut(bet, 0, null, false);
    arenaResult("Match nul", null, `Personne n'a fait tic en 5 tirs.${bet?" Chacun récupère sa mise.":""}`, bet);
  }
}

  billepedia:["Billepedia","L'encyclopédie des formats, des décors et des coloris.",["Une fiche par décor, avec les coloris déjà trouvés par la communauté.","Les billes shiny les plus rares, avec leur date de découverte."]],

  casier:["Mon casier","Ton espace à toi : billes favorites, vitrine, badges.",["Expose tes plus belles billes dans une vitrine.","Personnalise ton titre (aujourd'hui : Petit Boulet)."]],

};
function viewSoon(){
  if(ui.view==="parametres") return `<div class="page-head"><div><h1>Paramètres</h1><p>Outils de la démo. Ta progression est enregistrée dans ce navigateur uniquement.</p></div></div>
    <div class="soon-page">
      <section class="panel"><div class="panel-head"><h3>Outils de test</h3></div>

        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
          <button class="btn btn-ghost" data-action="add-jetons">+ 1 000 ${CUR.many}</button>
          <button class="btn btn-ghost" data-action="refill-free">Remplir le stock de sacs gratuits</button>
          <button class="btn btn-ghost" data-action="give-shiny">Recevoir une bille shiny</button>
          <button class="btn btn-ghost" data-action="pass-xp">+ 3 paliers de passe</button>
          <button class="btn btn-ghost" data-action="bell-test">Écouter la sonnerie de récré</button>
          <button class="btn btn-ghost" data-action="daily-reset">Revoir le bonbec du jour</button>
          <button class="btn btn-ghost" data-action="pity-max">Garantie Boulet au prochain sac</button>
        </div>
      </section>
      <section class="panel"><div class="panel-head"><h3>Recommencer</h3></div>
        <p>Remet la collection, les ${CUR.many}, les records, le passe et les défis comme au premier lancement.</p>
        <div style="margin-top:14px"><button class="btn btn-ghost" data-action="reset" id="reset-btn">Réinitialiser la démo</button></div>
      </section>
    </div>`;
  const [title,lead,points] = SOON[ui.view] || ["Bientôt","",[]];
  let extra = "";
  if(ui.view==="cour"){
    const slots = slotsOwned();
    const dups = [...slots.values()].filter(l=>l.length>1).map(l=>[...l].sort(tierSort)[1]);
    extra = `<section class="panel"><div class="panel-head"><h3>Tes doubles (${dups.length})</h3></div>
      ${dups.length?`<p>Tu as au moins deux billes dans ces emplacements. Tu pourras les vendre ou les échanger ici.</p><div class="dup-grid">${dups.map(s=>`<button class="m-card" data-action="spec" data-id="${s.id}"><span class="ball">${mImg(s,160,Math.round(70*scaleOf(s.type)+8))}</span><b>${esc(specName(s))}</b>${typePill(s.type)}</button>`).join("")}</div>`:`<p>Pas encore de doubles. Ouvre quelques sacs !</p>`}</section>`;
  }
  return `<div class="page-head"><div><h1>${title}</h1><p>${lead}</p></div><span class="hand-note">En cours de fabrication…</span></div>
  <div class="soon-page">
    <section class="panel"><div class="panel-head"><h3>Ce qui est prévu</h3><span class="sample-tag">Bientôt</span></div>
      <ul class="soon-list">${points.map(p=>`<li>${p}</li>`).join("")}</ul>
    </section>
    ${extra}
  </div>`;
}

let toastT;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2800) }

let resetArmed = false;
document.addEventListener("click", e=>{
  if(e.target.id==="modal"){ closeModal(); return }
  const t = e.target.closest("[data-action]"); if(!t) return;
  switch(t.dataset.action){
    case "nav": closeModal(); go(t.dataset.view); break;
    case "tab": ui.tab=t.dataset.tab; closeModal(); if(ui.view!=="collection") go("collection"); else renderView(); break;
    case "ftype": ui.type=t.dataset.type; renderView(); break;
    case "special": ui.special=t.dataset.sp; if(ui.special!=="all") ui.tab="billes"; renderView(); break;
    case "album-type": ui.tab="album"; ui.type=t.dataset.type; go("collection"); break;
    case "spec": openModal(t.dataset.id); break;
    case "preview": openModal(null, pedia[+t.dataset.k]); break;
    case "theme": Theme.toggle(); renderThemeBtn(); break;
    case "give-shiny": {
      const s = makeSpec(TK[2+Math.floor(Math.random()*(TK.length-2))], {shiny:1+Math.floor(Math.random()*3)});
      S.specs.push(s); S.unseen.push(s.id); save(); renderTop(); renderView(); openModal(s.id);
      toast(`Nouvelle shiny ${SHINIES[s.shiny].name} : ${specName(s)} (démo).`);
      break;
    }
    case "missing": toast(`${TYPES[t.dataset.type].label} ${FAMILIES[+t.dataset.fam].name} : pas encore trouvée. Elle se cache peut-être dans ton prochain sac !`); break;
    case "set-active": S.active=t.dataset.id; save(); renderTop(); closeModal(); renderView(); toast(`${specName(activeSpec())} jouera au Tir.`); break;
    case "close-modal": closeModal(); break;
    case "active-step": {
      const list=[...S.specs].sort(tierSort); const i=list.findIndex(s=>s.id===S.active);
      S.active=list[(i+ +t.dataset.dir+list.length)%list.length].id; save(); renderTop(); renderView(); break;
    }
    case "open-free": openBag("gratuit"); break;
    case "open-next-free": FX.stop(); openBag("gratuit"); break;
    case "open-gift": openBag(t.dataset.bag, true); break;
    case "pass-claim": {
      const r = grantReward(t.dataset.track, +t.dataset.t); if(!r) break;
      save(); Sound.coin(); renderTop(); renderNav(); renderView();
      toast(`Récupéré : ${rewardLabel(r)}${r.k==="bag"?" (dans Ouvrir des sacs)":""}`);
      if(r.spec) setTimeout(()=>openModal(r.spec.id), 250);
      break;
    }
    case "pass-all": {
      const P = ensurePass(), got = [];
      for(let k=1;k<=passTier();k++) ["free","prem"].forEach(tr=>{ const r=grantReward(tr,k); if(r) got.push(r) });
      if(!got.length) break;
      save(); Sound.coin(); Sound.ding(); renderTop(); renderNav(); renderView();
      toast(`${got.length} récompense${got.length>1?"s":""} récupérée${got.length>1?"s":""} !`);
      break;
    }
    case "buy-pass": {
      const P = ensurePass(); if(P.premium) break;
      if(!arm("pass", t, "Confirmer (démo : aucun paiement)")) break;
      P.premium = true; save(); Sound.ding(); renderNav(); renderView();
      toast("Passe premium débloqué ! Les récompenses premium déjà atteintes t'attendent.");
      break;
    }
    case "set-title": S.title = t.dataset.title; save(); renderTop(); renderView(); break;
    case "zoom": if(specById(t.dataset.id)) openModal(t.dataset.id); break;
    case "a-restart": initArena(ui.view); break;
    case "bet": {
      const v = +t.dataset.v; if(S.jetons<v) break;
      S.jetons -= v; save(); renderTop(); initArena(ui.view, v);
      toast(v ? `Mise de ${v} ${CUR.many} : bonne chance !` : "Partie pour de faux : rien à gagner, rien à perdre.");
      break;
    }
    case "daily-open": openDaily(); break;
    case "daily-claim": {
      if(!dailyReady()) break;
      const streak = dailyStreak(), idx = (streak-1)%7, amount = DAILY[idx]*(isWednesday()?2:1);
      S.jetons += amount; if(idx===6) S.bagInv.premium = (S.bagInv.premium||0)+1;
      S.daily = {last:dayKey(), streak}; save();
      Sound.coin(); Sound.ding(); closeModal(); renderTop(); renderNav(); renderView();
      toast(`+${fmt(amount)} ${CUR.many}${idx===6?" et un Sac Premium":""} ! À demain pour le jour ${idx===6?1:idx+2}.`);
      break;
    }
    case "daily-reset": if(S.daily) S.daily.last = "démo"; save(); renderTop(); openDaily(); break;
    case "bell-test": Sound.bell(); break;
    case "vit-pick": openPicker(+t.dataset.i); break;
    case "craft-t": ui.craft = {t:+t.dataset.t, sel:[]}; renderView(); break;
    case "craft-toggle": {
      const C = ui.craft, id = t.dataset.id, i = C.sel.indexOf(id);
      if(i>=0) C.sel.splice(i,1);
      else if(C.sel.length<CRAFT_N) C.sel.push(id);
      else { toast(`Il y a déjà ${CRAFT_N} billes dans la fusion.`); break }
      renderView(); break;
    }
    case "craft-auto": ui.craft.sel = craftAuto(ui.craft.t); renderView(); break;
    case "craft-clear": ui.craft.sel = []; renderView(); break;
    case "craft-go": {
      const C = ui.craft, pool = craftPool(C.t);
      if(C.t>=TK.length-1 || C.sel.length!==CRAFT_N || !C.sel.every(id=>pool.some(s=>s.id===id))) break;
      if(!arm("craft", t, "Confirmer la fusion")) break;
      const inputs = C.sel.map(specById), gone = new Set(C.sel);
      S.specs = S.specs.filter(s=>!gone.has(s.id));
      S.unseen = S.unseen.filter(id=>!gone.has(id));
      const out = craftResult(C.t+1);
      S.specs.push(out); S.unseen.push(out.id);
      if(tierOf(out)>=BIG || out.shiny) logFind(out);
      S.crafts = (S.crafts||0)+1; C.sel = []; save();
      showCraft(inputs, out, passXP(PASS_XP.craft));
      break;
    }
    case "craft-again": closeOv(); ui.craft.sel = craftAuto(ui.craft.t); renderView(); break;
    case "craft-see": { const id = t.dataset.id; closeOv(); openModal(id); break }
    case "vit-set": S.vitrine[+t.dataset.i] = t.dataset.id; save(); closeModal(); renderView(); toast("Bille exposée dans ta vitrine."); break;
    case "vit-add": {
      const i = S.vitrine.findIndex(x=>!x || !specById(x));
      if(i<0){ toast("Ta vitrine est pleine : retires-en une depuis ton profil."); break }
      S.vitrine[i] = t.dataset.id; save(); openModal(t.dataset.id); toast("Bille exposée dans ta vitrine."); break;
    }
    case "vit-rm": {
      const i = S.vitrine.indexOf(t.dataset.id); if(i>=0) S.vitrine[i] = null; save();
      if(!document.getElementById("modal").hidden) openModal(t.dataset.id); else renderView();
      break;
    }
    case "chal-claim": {
      const c = CHAL_BY[t.dataset.id]; if(!c || S.chal.includes(c.id) || chalProg(c)<c.goal) break;
      S.chal.push(c.id); const r = c.rew;
      if(r.j) S.jetons += r.j;
      if(r.bag) S.bagInv[r.bag] = (S.bagInv[r.bag]||0)+1;
      if(r.title && !S.titles.includes(r.title)){ S.titles.push(r.title); S.title = r.title }
      save(); Sound.coin(); Sound.ding(); renderTop(); renderNav(); renderView();
      toast(`Défi « ${c.title} » réussi : +${fmt(r.j||0)} ${CUR.many}${r.bag?", "+BAG_BY[r.bag].name:""}${r.title?", titre « "+r.title+" »":""} !`);
      break;
    }
    case "pity-max": S.pity = PITY-1; save(); toast("Ton prochain sac contiendra un Boulet ou un Mammouth (démo)."); if(ui.view==="sacs") renderView(); break;
    case "buy": openBag(t.dataset.bag); break;
    case "tear": tear(); break;
    case "shake-bag": shakeBag(); break;
    case "recycle": {
      const s = specById(t.dataset.id); if(!s) break;
      if(!arm("r"+s.id, t, `Confirmer : +${fmt(recycleValue(s))} ${CUR.many}`)) break;
      const name = specName(s), got = recycleSpecs([s.id]);
      closeModal(); renderView(); toast(`${name} échangée à la Confiserie : +${fmt(got)} ${CUR.many}.`);
      break;
    }
    case "recycle-dups": {
      const dups = recyclableDups(); if(!dups.length) break;
      if(!arm("dups", t, `Confirmer : échanger ${dups.length} billes`)) break;
      const got = recycleSpecs(dups.map(s=>s.id));
      renderView(); toast(`${dups.length} doubles échangés : +${fmt(got)} ${CUR.many}.`);
      break;
    }
    case "q-claim": {
      ensureQuests(); const q = S.quests.items[+t.dataset.i];
      if(!q || q.claimed || !questDone(q)) break;
      q.claimed = true; S.jetons += QUESTS[q.id].reward; save();
      passXP(PASS_XP.quest);
      Sound.coin(); renderTop(); renderNav(); renderView();
      toast(`+${QUESTS[q.id].reward} ${CUR.many} et +${PASS_XP.quest} XP de saison !`);
      break;
    }
    case "q-bonus": {
      ensureQuests(); const Q = S.quests;
      if(Q.bonus || !Q.items.every(q=>q.claimed)) break;
      Q.bonus = true; S.jetons += QUEST_BONUS; S.stats.bonus++; save(); passXP(PASS_XP.bonus);
      Sound.coin(); Sound.ding(); renderTop(); renderNav(); renderView();
      toast(`Bonus du jour : +${QUEST_BONUS} ${CUR.many} !`);
      break;
    }
    case "sound": Sound.toggle(); renderSoundBtn(); toast(Sound.on?"Son activé.":"Son coupé."); break;
    case "reveal": reveal(+t.dataset.i); break;
    case "reveal-all": ovState.results.forEach((_,i)=>setTimeout(()=>reveal(i),i*380)); break;
    case "buy-again": openBag(ovState.bag.id, ovState.gift); break;
    case "to-bags": closeOv(); go("sacs"); break;
    case "to-collection": closeOv(); ui.tab="billes"; ui.type="all"; go("collection"); break;
    case "close-ov": closeOv(); break;
    case "bell": toast(freeReady() ? "Ton sac gratuit est prêt !" : `Prochain sac gratuit dans ${freeLeft()}.`); break;
    case "g-restart": loadLevel(game.lvl); break;
    case "g-level": loadLevel(+t.dataset.l); break;
    case "pass-xp": passXP(3*TIER_XP); renderNav(); toast("+3 paliers de passe (démo)."); break;
    case "add-jetons": S.jetons+=1000; save(); renderTop(); toast(`+1 000 ${CUR.many} ajoutés (démo).`); break;
    case "refill-free": S.freeT0=Date.now()-FREE_MAX*FREE_EVERY; save(); renderTop(); renderNav(); renderView(); toast(`${FREE_MAX} sacs gratuits en stock (démo).`); break;
    case "reset":
      if(!resetArmed){ resetArmed=true; t.textContent="Clique encore pour confirmer"; setTimeout(()=>{resetArmed=false; const b=document.getElementById("reset-btn"); if(b) b.textContent="Réinitialiser la démo"},3000); break }
      resetArmed=false; S=starterState(); save(); renderTop(); renderNav(); renderView(); toast("La démo est revenue à zéro."); break;
  }
});
document.addEventListener("submit", e=>{
  if(e.target.id!=="name-form") return;
  e.preventDefault();
  const v = e.target.pseudo.value.trim().replace(/\s+/g," ");
  if(!/^[\p{L}\p{N}_\- ]{3,20}$/u.test(v)){ toast("Ton pseudo doit faire 3 à 20 caractères : lettres, chiffres, espaces, - et _."); return }
  S.name = v; S.log.forEach(x=>{ if(x.me) x.who = v }); save(); renderTop(); renderView(); toast(`C'est noté, ${v} !`);
});
document.addEventListener("change", e=>{
  if(e.target.id==="f-hide"){ ui.hideMissing=e.target.checked; renderView() }
});
document.addEventListener("keydown", e=>{
  if(e.key!=="Escape") return;
  if(!document.getElementById("modal").hidden) closeModal();
  else if(!document.getElementById("ov").hidden) closeOv();
});

// compte à rebours du sac gratuit
let wasStock = freeStock();
setInterval(()=>{
  document.querySelectorAll("[data-free-timer]").forEach(el=>el.textContent=freeLeft());
  document.querySelectorAll("[data-quest-timer]").forEach(el=>el.textContent=untilMidnight());
  document.querySelectorAll("[data-pass-timer]").forEach(el=>el.textContent=passLeft());
  document.getElementById("daily-btn").hidden = !dailyReady();
  // de temps en temps, un autre joueur fait une trouvaille (simulé)
  if(Math.random()<1/25){ feed.unshift(fakeFind()); feed = feed.slice(0,8); const fl=document.getElementById("feed-list"); if(fl) fl.innerHTML = feedItems() }
  if(S.quests && S.quests.day!==dayKey()){ ensureQuests(); renderNav(); if(ui.view==="accueil"||ui.view==="quetes") renderView() }
  const st = freeStock();
  if(st!==wasStock){ const more = st>wasStock; wasStock=st; renderTop(); renderNav(); if(ui.view==="accueil"||ui.view==="sacs") renderView();
    if(more && st>=FREE_MAX){ Sound.bell(); toast(`Driiing ! C'est la récré : ${FREE_MAX} sacs gratuits t'attendent !`) }
    else if(more && document.getElementById("ov").hidden){ toast(st>1?`${st} sacs gratuits t'attendent !`:"Ton sac gratuit est prêt !"); Sound.ding() } }
},1000);

const KONAMI = ["arrowup","arrowup","arrowdown","arrowdown","arrowleft","arrowright","arrowleft","arrowright","b","a"];
let konami = 0;
document.addEventListener("keydown", e=>{
  if(e.target.matches && e.target.matches("input,textarea")) return;
  konami = e.key.toLowerCase()===KONAMI[konami] ? konami+1 : (e.key.toLowerCase()===KONAMI[0] ? 1 : 0);
  if(konami===KONAMI.length){ konami = 0; if(!revealSecret("arcade")){ marbleRain(); Sound.ding() } }
});
