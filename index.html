<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Billy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;600;700;800;900&family=Caveat:wght@600;700&display=swap">
<style>
:root{
  --bg:#FBF4E6;
  --panel:#FFFCF6;
  --panel-2:#FFF8EC;
  --line:#EFE3CD;
  --line-2:#E4D4B6;
  --ink:#24253D;
  --ink-2:#56546B;
  --muted:#8E8898;
  --yellow:#FFC93F;
  --yellow-2:#F2AE12;
  --yellow-soft:#FFE5A0;
  --blue:#2E6BE6;
  --blue-2:#1F4FB8;
  --blue-soft:#D6E4FC;
  --purple-soft:#E9DCFB;
  --green:#2FA35A;
  --green-soft:#D6F1D4;
  --navy:#1B2748;
  --hero-1:#2A1C16;
  --hero-2:#5A3A27;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
  --r-lg:18px;
  --r-md:14px;
  --shadow:0 1px 0 rgba(120,90,40,.06),0 6px 18px -10px rgba(120,90,40,.25);
  --on-ink:#fff;--glow:#fff;--topbar:rgba(251,244,230,.92);--track:#EDE6DA;
  --gold-line:#F4CF6A;--gold-bg:#FFF6DC;--yellow-hover:#FFD35F;
  --blue-line:#B7CEF6;--purple-line:#D3BEF3;--green-line:#B3E1AE;
  --avatar-1:#FFF8EC;--avatar-2:#EADBC0;--close-bg:rgba(255,255,255,.8);--warn:#B4462B;
  color-scheme:light;
}
/* mode sombre : suit le système, sauf choix explicite (bouton soleil/lune) */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16130F;--panel:#211D18;--panel-2:#2A251F;--line:#352E26;--line-2:#4A4136;
    --ink:#F5EEE2;--ink-2:#C8BDAD;--muted:#8F8578;
    --yellow-soft:#3F3212;--blue:#4F86F5;--blue-2:#9CBBFF;--blue-soft:#1C2A48;--purple-soft:#2E2344;
    --green:#4CC27A;--green-soft:#1B3524;
    --shadow:0 1px 0 rgba(0,0,0,.25),0 8px 22px -12px rgba(0,0,0,.7);
    --on-ink:#16130F;--glow:#3A342C;--topbar:rgba(22,19,15,.88);--track:#3A332A;
    --gold-line:#8C6A1C;--gold-bg:#2E2512;--yellow-hover:#FFD35F;
    --blue-line:#34487A;--purple-line:#4E3A70;--green-line:#2F5A3A;
    --avatar-1:#3A342C;--avatar-2:#221E19;--close-bg:rgba(40,36,30,.85);--warn:#F08A6E;
    color-scheme:dark;
  }
  :root:not([data-theme="light"]) :is(.pill,.type-box,.modal-visual,.active-visual){--rbg:color-mix(in srgb,var(--rc) 26%,var(--panel));--rtx:color-mix(in srgb,var(--rc) 55%,#fff)}
}
:root[data-theme="dark"]{
    --bg:#16130F;--panel:#211D18;--panel-2:#2A251F;--line:#352E26;--line-2:#4A4136;
    --ink:#F5EEE2;--ink-2:#C8BDAD;--muted:#8F8578;
    --yellow-soft:#3F3212;--blue:#4F86F5;--blue-2:#9CBBFF;--blue-soft:#1C2A48;--purple-soft:#2E2344;
    --green:#4CC27A;--green-soft:#1B3524;
    --shadow:0 1px 0 rgba(0,0,0,.25),0 8px 22px -12px rgba(0,0,0,.7);
    --on-ink:#16130F;--glow:#3A342C;--topbar:rgba(22,19,15,.88);--track:#3A332A;
    --gold-line:#8C6A1C;--gold-bg:#2E2512;--yellow-hover:#FFD35F;
    --blue-line:#34487A;--purple-line:#4E3A70;--green-line:#2F5A3A;
    --avatar-1:#3A342C;--avatar-2:#221E19;--close-bg:rgba(40,36,30,.85);--warn:#F08A6E;
    color-scheme:dark;
}
:root[data-theme="dark"] :is(.pill,.type-box,.modal-visual,.active-visual){--rbg:color-mix(in srgb,var(--rc) 26%,var(--panel));--rtx:color-mix(in srgb,var(--rc) 55%,#fff)}
/* fonds teintés par rareté : pastel en clair, assombris en sombre */
.pill,.type-box,.modal-visual,.active-visual{--rbg:var(--rb)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:10px}
img{max-width:100%;display:block}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:16px;height:68px;padding-inline:24px;background:var(--topbar);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:4px;font-family:var(--display);font-size:38px;line-height:1;color:var(--yellow);text-shadow:0 3px 0 var(--navy);letter-spacing:.5px}
.logo span{-webkit-text-stroke:6px var(--navy);paint-order:stroke fill}
.logo img{width:36px;height:36px;margin-left:2px;margin-top:4px}
.tagline{font-family:var(--hand);font-size:24px;font-weight:600;color:var(--ink);margin-left:18px;white-space:nowrap}
.top-spacer{flex:1}
.icon-btn{position:relative;width:40px;height:40px;display:grid;place-items:center;border-radius:12px}
.icon-btn:hover{background:var(--panel-2)}
.icon-btn .dot{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:#E5484D;border:2px solid var(--bg)}
.profile-mini{display:flex;align-items:center;gap:10px;padding-inline:14px;border-inline:1px solid var(--line)}
.avatar{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--avatar-1),var(--avatar-2));display:grid;place-items:center;overflow:hidden;box-shadow:0 0 0 2px var(--panel)}
.avatar img{width:92%;height:92%}
.profile-mini b{display:block;font-weight:800;font-size:14px;text-align:left}
button.profile-mini{height:56px;border-radius:0}
button.profile-mini:hover{background:var(--panel-2)}
.profile-mini small{display:block;text-align:left}
.profile-mini small{color:var(--muted);font-size:12px;font-weight:600}
.wallet{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px 0 7px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:800;font-variant-numeric:tabular-nums}
.wallet small{font-weight:700;color:var(--ink-2);font-size:12px}
.coin{width:24px;height:24px;flex:none}
button.wallet:hover{background:var(--panel-2)}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:calc(100% - 68px)}
.side{position:sticky;top:calc(68px + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - 68px);display:flex;flex-direction:column;gap:4px;padding:22px 10px;border-right:1px solid var(--line);overflow-y:auto}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;padding:12px 10px 12px 12px;border-radius:12px;font-weight:700;font-size:14.5px;color:var(--ink);text-align:left}
.nav-btn svg{flex:none;width:22px;height:22px}
.nav-btn span{white-space:nowrap}
.nav-btn:hover{background:var(--panel-2)}
.nav-btn[aria-current="page"]{background:var(--blue-soft);color:var(--blue-2)}
.nav-btn .soon{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.nav-btn .ready{margin-left:auto;width:9px;height:9px;border-radius:50%;background:#E5484D}
.nav-sep{height:1px;background:var(--line);margin:14px 8px}
.side-quote{margin-top:auto;padding:18px 10px 4px;font-family:var(--hand);font-size:19px;line-height:1.15;color:var(--ink-2);transform:rotate(-6deg)}
.side-quote svg{display:block;margin:6px 0 0 40px}

main{padding:22px 24px 40px;min-width:0}

/* ---------- panels ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);min-width:0}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px}
.panel-head h2,.panel-head h3{font-size:17px;font-weight:900;letter-spacing:-.01em}
.see-all{font-size:12.5px;font-weight:700;color:var(--ink-2);display:inline-flex;align-items:center;gap:4px;padding:4px 6px;border-radius:8px}
.see-all:hover{background:var(--panel-2);color:var(--ink)}
.sample-tag{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

.pill{display:inline-block;font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;color:var(--rtx,var(--rc));background:var(--rbg);white-space:nowrap;line-height:1.5}
.pill.solid{background:var(--rc);color:#fff}
.shiny-pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:900;padding:2px 9px 2px 7px;border-radius:999px;color:#fff;white-space:nowrap;line-height:1.5;background:linear-gradient(100deg,#FF6FB5,#FFB547 30%,#6FE3A8 55%,#5AB8FF 78%,#B07BFF)}
.shiny-pill svg{width:11px;height:11px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:44px;padding:0 22px;border-radius:999px;font-weight:800;font-size:15px;transition:transform .12s ease,box-shadow .12s ease,background .12s}
.btn:active{transform:translateY(1px)}
.btn-yellow{background:var(--yellow);color:#24253D;box-shadow:0 3px 0 var(--yellow-2)}
.btn-yellow:hover{background:var(--yellow-hover)}
.btn-blue{background:var(--blue);color:#fff;box-shadow:0 3px 0 var(--blue-2)}
.btn-blue:hover{background:#3A78F0}
.btn-ghost{border:1.5px solid var(--line-2);background:var(--panel);height:38px;padding:0 16px;font-size:13.5px}
.btn-ghost:hover{background:var(--panel-2)}
.btn[disabled]{opacity:.55;cursor:not-allowed;box-shadow:none}
.price{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.price .coin{width:20px;height:20px}
.timer{font-variant-numeric:tabular-nums}

/* ---------- home ---------- */
.home{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.home-main,.home-side{display:grid;gap:20px;min-width:0}
.row-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.row-2.wide-left{grid-template-columns:minmax(0,1.12fr) minmax(0,1fr)}

.hero{position:relative;overflow:hidden;border-radius:var(--r-lg);min-height:272px;padding:32px 34px;display:flex;flex-direction:column;justify-content:center;gap:16px;color:#fff;
  background:
    radial-gradient(ellipse 60% 70% at 72% 120%,#9a6a45 0%,transparent 70%),
    radial-gradient(ellipse 50% 60% at 95% 10%,rgba(255,190,120,.25),transparent 70%),
    linear-gradient(120deg,var(--hero-1) 0%,#3d2a1f 45%,var(--hero-2) 100%)}
.hero::after{content:"";position:absolute;inset:auto 0 0 30%;height:45%;background:repeating-radial-gradient(circle at 60% 120%,rgba(255,220,180,.05) 0 2px,transparent 2px 7px);pointer-events:none}
.hero .eyebrow{position:relative;z-index:2;align-self:flex-start;font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.14);padding:4px 12px;border-radius:999px;color:#FFE3B0}
.hero h1{position:relative;z-index:2;font-family:var(--display);font-weight:400;font-size:clamp(32px,4vw,50px);line-height:.98;letter-spacing:.01em;text-transform:uppercase;max-width:12ch;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.hero p{position:relative;z-index:2;max-width:34ch;font-size:16px;font-weight:600;color:#F6E9DA}
.hero .btn{position:relative;z-index:2;align-self:flex-start;height:50px;padding:0 28px;font-size:16px}
.hero-art{position:absolute;inset:0;pointer-events:none}
.hero-art img,.hero-art .hero-bag{position:absolute}
.hero-main{width:210px;height:210px;right:22%;top:50%;transform:translateY(-54%);filter:drop-shadow(0 22px 18px rgba(0,0,0,.55));animation:bob 5s ease-in-out infinite}
.hero-bag{right:4%;bottom:14px;width:150px;filter:drop-shadow(0 16px 14px rgba(0,0,0,.45));transform:rotate(8deg)}
.hero-bag svg{width:100%;height:auto;display:block}
.bokeh{filter:blur(7px);opacity:.8}
@keyframes bob{0%,100%{transform:translateY(-54%)}50%{transform:translateY(-58%)}}

.active-card{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:center}
.active-visual{position:relative;aspect-ratio:1;max-width:100%;border-radius:14px;display:grid;place-items:center;background:radial-gradient(circle at 50% 50%,var(--glow) 0%,var(--rbg) 95%)}
.active-visual img{width:82%;filter:drop-shadow(0 10px 10px rgba(40,20,80,.3))}
.active-visual .nav-arrow{position:absolute;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center}
.active-visual .nav-arrow.l{left:-10px}.active-visual .nav-arrow.r{right:-10px}
.active-name{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.active-name h3{font-size:22px;font-weight:900;letter-spacing:-.01em}
.meta{color:var(--ink-2);font-weight:600;font-size:13px;margin-top:4px}
.meta code{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.active-card .btn-ghost{margin-top:12px}

.marble-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.m-tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px 12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);text-align:center;transition:transform .15s,box-shadow .15s}
.m-tile:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.m-tile .ball{height:70px;display:grid;place-items:center}
.m-tile img{filter:drop-shadow(0 6px 5px rgba(40,30,20,.25))}
.m-tile b{font-size:12.5px;font-weight:800;line-height:1.2}

.type-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.t-tile{display:grid;grid-template-columns:52px minmax(0,1fr);align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);text-align:left}
.t-tile:hover{box-shadow:var(--shadow)}
.t-tile .ball{height:52px;display:grid;place-items:center}
.t-tile b{display:block;font-size:13px;font-weight:800;line-height:1.2}
.t-tile small{font-size:12px;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums}
.bar{width:100%;height:6px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--blue)}
.bar i.done{background:var(--green)}
.t-tile .bar{margin-top:5px}

.game-card{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);border-radius:var(--r-md);overflow:hidden;background:var(--navy);color:#fff;min-height:136px}
.game-card svg{width:100%;height:100%;display:block}
.game-info{padding:16px;display:flex;flex-direction:column;gap:6px}
.game-info b{font-size:16px;font-weight:800}
.game-info p{font-size:12px;color:#C9D3EE;line-height:1.4}
.game-info .btn{margin-top:auto;height:38px;font-size:14px}

.formats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));align-items:end;gap:8px;padding-top:6px}
.fmt{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.fmt .ball{height:100px;display:flex;align-items:flex-end;justify-content:center}
.fmt img{filter:drop-shadow(0 6px 4px rgba(40,30,20,.3))}
.fmt b{font-size:12.5px;font-weight:800;line-height:1.15}
.fmt small{font-size:11.5px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.ruler{height:10px;margin-top:4px;border-top:2px solid var(--line-2);background:repeating-linear-gradient(90deg,var(--line-2) 0 1px,transparent 1px 12px);background-size:12px 6px;background-repeat:repeat-x}

.profile-card{display:grid;gap:14px}
.pc-top{display:flex;align-items:center;gap:14px}
.pc-top .avatar{width:74px;height:74px;box-shadow:0 0 0 3px var(--panel),0 0 0 4px var(--line-2)}
.pc-top b{font-size:19px;font-weight:900;display:block}
.pc-top span{font-size:14px;color:var(--ink-2);font-weight:700}
.lvl{display:flex;justify-content:space-between;align-items:baseline}
.lvl b{font-size:18px;font-weight:900}
.lvl small{font-size:11.5px;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums}
.lvl-bar{height:10px}
.lvl-bar i{background:linear-gradient(90deg,var(--blue-2),var(--blue))}
.stats{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.stat{display:flex;align-items:center;gap:10px;padding:14px 4px 4px}
.stat:nth-child(odd){border-right:1px solid var(--line)}
.stat:nth-child(even){padding-left:16px}
.stat:nth-child(n+3){border-top:1px solid var(--line);margin-top:10px}
.stat .ic{width:34px;height:34px;flex:none;display:grid;place-items:center}
.stat .ic img{width:34px;height:34px}
.stat small{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.stat b{font-size:17px;font-weight:900;font-variant-numeric:tabular-nums}

.shortcuts{display:grid;gap:10px}
.shortcut{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:12px;font-weight:800;font-size:14px;text-align:left;transition:filter .12s,transform .12s}
.shortcut:hover{filter:brightness(.97);transform:translateX(2px)}
.shortcut svg{width:22px;height:22px;flex:none}
.shortcut .timer{margin-left:auto;font-size:12.5px;font-weight:800;color:var(--ink-2)}
.sc-yellow{background:var(--yellow-soft);box-shadow:inset 0 0 0 1.5px var(--gold-line)}
.sc-blue{background:var(--blue-soft);box-shadow:inset 0 0 0 1.5px var(--blue-line)}
.sc-purple{background:var(--purple-soft);box-shadow:inset 0 0 0 1.5px var(--purple-line)}
.sc-green{background:var(--green-soft);box-shadow:inset 0 0 0 1.5px var(--green-line)}

.event-card{position:relative;overflow:hidden;border-radius:var(--r-md);min-height:122px;padding:14px 16px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;text-align:left;width:100%;
  background:radial-gradient(ellipse 40% 60% at 78% 110%,#FFB43A 0%,transparent 60%),radial-gradient(ellipse 30% 40% at 75% 30%,#FF6A2A 0%,transparent 70%),linear-gradient(115deg,#5B1308,#B8360E 55%,#E8641A)}
.event-card .left{position:absolute;top:12px;left:14px;font-size:11.5px;font-weight:800;background:#FFE5A0;color:#6B3B00;padding:3px 10px;border-radius:999px}
.event-card b{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.01em;position:relative;z-index:1}
.event-card p{font-size:12px;max-width:26ch;color:#FFE6D2;position:relative;z-index:1}
.event-card img{position:absolute;right:12px;bottom:12px;width:80px;filter:drop-shadow(0 0 16px rgba(255,160,40,.7))}

.feed ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.feed li{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-2)}
.feed li b{color:var(--ink);font-weight:800}
.feed img{width:26px;height:26px;flex:none}

/* ---------- page headers ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:20px}
.page-head h1{font-family:var(--display);font-weight:400;font-size:40px;line-height:1;letter-spacing:.01em}
.page-head p{color:var(--ink-2);font-weight:600;margin-top:6px;max-width:62ch}
.hand-note{font-family:var(--hand);font-size:22px;color:var(--ink-2)}

/* ---------- bags ---------- */
.bags{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.bag-card{display:flex;flex-direction:column;gap:12px;padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.bag-card.free{border:2px solid var(--gold-line);background:linear-gradient(180deg,var(--gold-bg),var(--panel) 40%)}
.bag-visual{position:relative;height:180px;border-radius:14px;display:grid;place-items:center;background:radial-gradient(circle at 50% 60%,var(--glow) 0%,color-mix(in srgb,var(--bag-tint) 70%,var(--panel)) 80%)}
.bag-visual svg{height:160px;width:auto;transition:transform .25s ease}
.bag-card:hover .bag-visual svg{transform:rotate(-4deg) scale(1.04)}
.bag-visual .tag{position:absolute;top:10px;left:10px;font-size:11px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:var(--ink);color:var(--on-ink)}
.bag-card h3{font-size:19px;font-weight:900}
.bag-card > p{color:var(--ink-2);font-weight:600;font-size:13.5px;min-height:2.9em}
.odds{list-style:none;margin:0;padding:10px 12px;display:grid;gap:5px;background:var(--panel-2);border-radius:12px;border:1px solid var(--line)}
.odds li{display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.odds li i{width:10px;height:10px;border-radius:50%;background:var(--rc)}
.odds li span:last-child{font-variant-numeric:tabular-nums;color:var(--ink)}
.odds li.sh i{background:linear-gradient(135deg,#FF6FB5,#FFB547,#6FE3A8,#5AB8FF)}
.odds .guar{grid-template-columns:1fr;color:var(--green);font-weight:800;border-top:1px dashed var(--line-2);padding-top:6px;margin-top:2px}
.bag-card .btn{width:100%}
.earn{margin-top:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.earn .panel{display:flex;gap:12px;align-items:flex-start;text-align:left;transition:transform .15s}
.earn .panel:hover{transform:translateY(-2px)}

/* ---------- quêtes & recyclage ---------- */
.quest-list{display:grid;gap:10px}
.quest{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--panel-2)}
.quest-list.compact .quest{padding:10px 12px;gap:10px}
.quest.done:not(.claimed){border-color:var(--gold-line);background:var(--gold-bg)}
.quest.claimed{opacity:.6}
.q-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);color:var(--ink-2)}
.quest-list.compact .q-ic{width:34px;height:34px;border-radius:10px}
.q-main b{display:block;font-weight:800;font-size:14px;line-height:1.25}
.quest-list.compact .q-main b{font-size:13px}
.q-main p{font-size:12.5px;color:var(--ink-2);font-weight:600;margin-top:2px}
.q-prog{display:flex;align-items:center;gap:8px;margin-top:6px}
.q-prog small{font-size:11.5px;font-weight:800;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.q-reward{display:inline-flex;align-items:center;gap:4px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.q-reward .coin{width:18px;height:18px}
.q-state{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:12.5px;color:var(--green)}
.q-claim,.bonus-card .btn{height:36px;padding:0 14px;font-size:13.5px;gap:6px}
.q-claim .coin,.bonus-card .btn .coin{width:18px;height:18px}
.bonus-card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px}
.bonus-card.ready{border:2px solid var(--gold-line);background:linear-gradient(180deg,var(--gold-bg),var(--panel))}
.recycle-bar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;margin-bottom:16px}
.recycle-bar b{font-weight:900}
.recycle-bar p{font-size:12.5px;color:var(--ink-2);font-weight:600}
.warn-note{font-size:12.5px;font-weight:700;color:var(--warn)}
@media (max-width:560px){
  .quest,.bonus-card,.recycle-bar{grid-template-columns:auto minmax(0,1fr)}
  .quest > :last-child,.bonus-card > :last-child,.recycle-bar > .btn{grid-column:1/-1;justify-self:start}
}
.earn svg{flex:none;color:var(--ink-2)}
.earn b{display:block;font-weight:900}
.earn p{font-size:13px;color:var(--ink-2);font-weight:600}

/* ---------- collection ---------- */
.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--panel);border:1px solid var(--line);margin-bottom:18px}
.tab{height:36px;padding:0 16px;border-radius:999px;font-weight:800;font-size:13.5px;color:var(--ink-2)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--on-ink)}
.col-summary{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.2fr);gap:20px;margin-bottom:22px}
.big-count{display:flex;flex-direction:column;justify-content:center;gap:10px}
.big-count b{font-family:var(--display);font-weight:400;font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.big-count b small{font-size:22px;color:var(--muted)}
.big-count .bar{height:10px}
.type-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.type-box{display:flex;flex-direction:column;gap:3px;padding:12px;border-radius:12px;background:var(--rbg);border:1px solid color-mix(in srgb,var(--rc) 25%,transparent)}
.type-box span{font-size:11px;font-weight:900;color:var(--rtx,var(--rc));text-transform:uppercase;letter-spacing:.05em;line-height:1.2}
.type-box b{font-size:21px;font-weight:900;font-variant-numeric:tabular-nums}
.type-box b small{font-size:13px;color:var(--ink-2);font-weight:700}
.type-box em{font-style:normal;font-size:11.5px;font-weight:700;color:var(--ink-2)}

.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
.chip{height:36px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line-2);background:var(--panel);font-weight:800;font-size:13px;display:inline-flex;align-items:center;gap:8px}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--rc)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.filters .grow{flex:1}
.check{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:13px;color:var(--ink-2)}
.check input{width:18px;height:18px;accent-color:var(--blue)}

.type-block{margin-bottom:28px}
.type-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.type-head h2{font-size:21px;font-weight:900}
.type-head .mm{font-weight:800;color:var(--ink-2);font-size:13px}
.type-head .desc{flex-basis:100%;color:var(--ink-2);font-weight:600;font-size:13px;margin-top:-4px}
.type-head .prog{margin-left:auto;display:flex;align-items:center;gap:10px;font-weight:800;color:var(--ink-2);font-variant-numeric:tabular-nums}
.type-head .prog .bar{width:140px}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px}
.m-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:14px 10px 12px;border-radius:var(--r-md);background:var(--panel);border:1px solid var(--line);text-align:center;transition:transform .15s,box-shadow .15s}
.m-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.m-card .ball{height:92px;display:grid;place-items:center}
.m-card img{filter:drop-shadow(0 8px 6px rgba(40,30,20,.28))}
.m-card .count{position:absolute;top:7px;right:8px;font-size:11px;font-weight:900;background:var(--ink);color:var(--on-ink);border-radius:999px;padding:1px 7px}
.m-card .new{position:absolute;top:7px;right:8px;font-size:10px;font-weight:900;background:#E5484D;color:#fff;border-radius:999px;padding:2px 7px;text-transform:uppercase;letter-spacing:.04em}
.m-card .shiny-mark{position:absolute;top:8px;left:9px}
.m-card b{font-size:13.5px;font-weight:800;line-height:1.2}
.m-card small{font-size:11.5px;font-weight:700;color:var(--ink-2)}
.m-card.missing{background:repeating-linear-gradient(135deg,var(--panel) 0 10px,var(--panel-2) 10px 20px);border-style:dashed;border-color:var(--line-2)}
.m-card.missing img{filter:brightness(0) opacity(.12)}
.m-card.missing b{color:var(--muted)}
.m-card.is-shiny{box-shadow:inset 0 0 0 2px #FFB547}
.empty{padding:40px;text-align:center;color:var(--ink-2);font-weight:700}

/* ---------- rareté des décors ---------- */
.rar{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;color:var(--rar);white-space:nowrap}
.rar i{width:9px;height:9px;border-radius:50%;background:var(--rar);box-shadow:0 0 0 3px color-mix(in srgb,var(--rar) 22%,transparent)}
.ov .rar{color:color-mix(in srgb,var(--rar) 55%,#fff)}

/* ---------- billepedia ---------- */
.pedia-sec{margin-bottom:26px}
.pedia-sec > h2{font-size:21px;font-weight:900;margin-bottom:4px}
.pedia-sec > p{color:var(--ink-2);font-weight:600;margin-bottom:14px;max-width:70ch}
.shiny-show{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.sh-tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px 14px;border-radius:var(--r-md);background:var(--panel);border:1px solid var(--line);text-align:center;transition:transform .15s,box-shadow .15s}
.sh-tile:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.sh-tile img{width:min(120px,100%);height:auto;filter:drop-shadow(0 8px 6px rgba(40,30,20,.28))}
.sh-tile b{font-size:14px;font-weight:900}
.sh-tile small{font-size:11.5px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.sh-tile.is-shiny{box-shadow:inset 0 0 0 2px #FFB547}
.pedia-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.fam-card{display:flex;flex-direction:column;gap:8px}
.fam-card .row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.fam-card h3{font-size:18px;font-weight:900}
.fam-card > p{color:var(--ink-2);font-weight:600;font-size:13px;min-height:2.9em}
.fam-balls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:2px}
.fam-balls button{aspect-ratio:1;display:grid;place-items:center;border-radius:12px;background:var(--panel-2);transition:transform .15s}
.fam-balls button:hover{transform:translateY(-2px)}
.fam-balls img{width:84%;height:auto;filter:drop-shadow(0 5px 4px rgba(40,30,20,.25))}
.fam-card .foot{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:800;color:var(--ink-2);font-variant-numeric:tabular-nums}
.fam-card .got{color:var(--green)}
.fam-card .notgot{color:var(--muted)}
.fmt-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.fmt-grid .sh-tile{justify-content:flex-end}
.fmt-grid .sh-tile img{width:auto}
.pal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.pal{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:12.5px;font-weight:800}
.pal span{display:flex}
.pal i{width:16px;height:16px;border-radius:50%;margin-right:-5px;border:2px solid var(--panel)}
@media (max-width:1000px){ .fmt-grid{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:560px){ .shiny-show{grid-template-columns:repeat(2,minmax(0,1fr))} .fmt-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }

/* ---------- passe de saison ---------- */
.pass-hero{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:20px;align-items:center;padding:28px 30px;border-radius:var(--r-lg);color:#fff;margin-bottom:20px;
  background:radial-gradient(ellipse 50% 90% at 88% 50%,color-mix(in srgb,var(--s2) 50%,transparent),transparent 70%),linear-gradient(120deg,color-mix(in srgb,var(--s1) 65%,#000),var(--s1))}
.pass-hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.04) 0 14px,transparent 14px 28px);pointer-events:none}
.ph-main{position:relative;z-index:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.pass-hero .eyebrow{align-self:flex-start;font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.16);padding:4px 12px;border-radius:999px}
.pass-hero h2{font-family:var(--display);font-weight:400;font-size:clamp(34px,4.5vw,54px);line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.ph-tier{display:flex;align-items:baseline;gap:6px}
.ph-tier b{font-size:24px;font-weight:900}
.ph-tier span{font-weight:800;opacity:.8}
.pass-bar{height:12px;background:rgba(255,255,255,.22)}
.pass-bar i{background:linear-gradient(90deg,var(--s3),#fff)}
.pass-hero p{font-weight:700;opacity:.9}
.ph-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.btn-light{background:#fff;color:#24253D;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.btn-light:hover{background:#FFF3DA}
.prem-badge{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 16px;border-radius:999px;background:rgba(255,255,255,.16);font-weight:900}
.ph-final{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:#fff;padding:10px;border-radius:16px}
.ph-final:hover{background:rgba(255,255,255,.08)}
.ph-final img{width:170px;height:170px;filter:drop-shadow(0 16px 16px rgba(0,0,0,.45)) drop-shadow(0 0 30px color-mix(in srgb,var(--s2) 70%,transparent));animation:bobf 5s ease-in-out infinite}
@keyframes bobf{50%{transform:translateY(-6px)}}
.ph-final span{font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.ph-final b{font-size:16px;font-weight:900}
.pass-track{display:grid;grid-template-columns:84px minmax(0,1fr);padding:16px 0 12px 16px;margin-bottom:20px}
.track-labels,.tier{display:grid;grid-template-rows:118px 34px 118px;row-gap:8px}
.track-labels{align-items:center;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2)}
.track-labels .pl{display:inline-flex;align-items:center;gap:4px;color:#C07A0C}
.track-scroll{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px 4px;scroll-behavior:smooth;scrollbar-width:thin}
.tier{position:relative;flex:none;width:96px}
.tier::before{content:"";position:absolute;left:-8px;right:0;top:141px;height:4px;background:var(--track)}
.tier:first-child::before{left:50%}
.tier.reached::before{background:var(--green)}
.tier-n{position:relative;justify-self:center;align-self:center;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:13px;background:var(--panel);border:2px solid var(--line-2);color:var(--ink-2)}
.tier.reached .tier-n{background:var(--green);border-color:var(--green);color:#fff}
.tier.next .tier-n{border-color:var(--blue);color:var(--blue);box-shadow:0 0 0 4px color-mix(in srgb,var(--blue) 22%,transparent)}
.rw{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:14px;border:1.5px solid var(--line);background:var(--panel-2);padding:8px 4px;text-align:center;transition:transform .12s}
.rw b{font-size:12px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.rw-ic{height:54px;display:grid;place-items:center}
.rw-ic .coin{width:34px;height:34px}
.rw-bag svg{height:54px;width:auto}
.rw-title{color:#C07A0C}
.rw.prem{background:color-mix(in srgb,#FFC93F 12%,var(--panel));border-color:color-mix(in srgb,#FFC93F 45%,var(--line))}
.rw.future{opacity:.6}
.rw.locked .rw-ic{filter:grayscale(.6)}
.rw.got{opacity:.45}
button.rw:hover{transform:translateY(-2px)}
.rw-mark{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--on-ink)}
.rw-mark.ok{background:var(--green);color:#fff}
.rw-shiny{position:absolute;top:6px;left:6px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#FF6FB5,#FFB547,#6FE3A8,#5AB8FF)}
.rw-shiny svg{width:10px;height:10px}
.rw.can{border-color:#F2AE12;background:var(--gold-bg);animation:pulse 1.6s ease-in-out infinite}
.rw-cta{font-size:10.5px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;color:#24253D;background:var(--yellow);padding:2px 8px;border-radius:999px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px color-mix(in srgb,#FFC93F 40%,transparent)}50%{box-shadow:0 0 0 7px color-mix(in srgb,#FFC93F 15%,transparent)}}
.xp-list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.xp-list li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:10px;font-weight:700;color:var(--ink-2)}
.xp-list li b{color:var(--ink);font-weight:900;font-variant-numeric:tabular-nums}
.xp-list .coin{width:22px;height:22px}
.prem-card{border:1.5px solid color-mix(in srgb,#FFC93F 50%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,#FFC93F 10%,var(--panel)),var(--panel))}
.ed-pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:900;padding:2px 9px 2px 7px;border-radius:999px;color:var(--on-ink);background:var(--ink);white-space:nowrap;line-height:1.5}
.ov .ed-pill{color:#24253D;background:#fff}

/* ---------- accueil ---------- */
.hero-note{position:relative;z-index:2;display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:13px;color:#FFE3B0}
.pass-mini{color:#fff;border:0;background:radial-gradient(ellipse 60% 90% at 100% 0%,color-mix(in srgb,var(--s2) 45%,transparent),transparent 70%),linear-gradient(135deg,color-mix(in srgb,var(--s1) 70%,#000),var(--s1))}
.pass-mini .sample-tag{color:rgba(255,255,255,.75)}
.pass-mini .meta{color:rgba(255,255,255,.85)}
.pm-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.pm-season{display:block;font-family:var(--display);font-size:26px;line-height:1.05}
.pm-tier{font-size:16px;font-weight:900}
.pm-tier small{font-size:13px;opacity:.75}
.pm-top img{filter:drop-shadow(0 8px 8px rgba(0,0,0,.4))}
.pm-btn{margin-top:14px;width:100%}
.pass-mini .btn-ghost{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff}
.pass-mini .btn-ghost:hover{background:rgba(255,255,255,.22)}
.col-home{display:grid;grid-template-columns:190px minmax(0,1fr);gap:20px;align-items:center}
.col-count{display:flex;flex-direction:column;gap:6px}
.col-count b{font-family:var(--display);font-weight:400;font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.col-count b small{font-size:20px;color:var(--muted)}
.col-count span{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.col-count .bar{height:8px}
.sub-h{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:18px 0 10px}
.active-row{display:grid;grid-template-columns:26px minmax(0,1fr) 26px;align-items:center;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.active-row .nav-arrow{width:26px;height:26px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);display:grid;place-items:center}
.ar-main{display:flex;align-items:center;gap:10px;text-align:left;min-width:0;padding:4px 6px;border-radius:12px}
.ar-main:hover{background:var(--panel-2)}
.ar-main span{min-width:0}
.ar-main small{display:block;font-size:10.5px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ar-main b{display:block;font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.treasure{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;background:radial-gradient(circle at 50% 38%,var(--glow) 0%,color-mix(in srgb,var(--rc) 16%,var(--panel)) 72%)}
.treasure .panel-head{align-self:stretch;margin-bottom:4px}
.tr-ball img{filter:drop-shadow(0 12px 10px rgba(40,20,60,.35));transition:transform .2s}
.tr-ball:hover img{transform:scale(1.05) rotate(-4deg)}
.tr-name{font-size:17px;font-weight:900}
.treasure .pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.col-toolbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.col-toolbar .tabs{margin-bottom:0}
button.type-box{text-align:left;transition:transform .12s,box-shadow .12s}
button.type-box:hover{transform:translateY(-2px)}
.type-box[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--rc)}
.bag-visual .tag.gift{background:var(--green);color:#fff;display:inline-flex;align-items:center;gap:4px}
.bag-card.has-gift{border:2px solid var(--green)}
@media (max-width:820px){
  .pass-hero{grid-template-columns:minmax(0,1fr);padding:22px 20px}
  .ph-final{flex-direction:row;flex-wrap:wrap;justify-content:center}
  .ph-final img{width:110px;height:110px}
}

/* ---------- profil, vitrine, défis, garantie, journal ---------- */
.pc-top{position:relative}
.pc-edit{position:absolute;top:0;right:0}
.prof-card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:start;margin-bottom:20px}
.prof-av{width:120px;height:120px;box-shadow:0 0 0 4px var(--panel),0 0 0 5px var(--line-2)}
.prof-main{display:grid;gap:18px;min-width:0}
.name-form{display:grid;gap:6px;max-width:460px}
.name-form label,.lbl{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.name-row{display:flex;gap:10px;flex-wrap:wrap}
.name-row input{flex:1 1 200px;min-width:0;height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--panel-2);color:var(--ink);font:inherit;font-size:16px;font-weight:800}
.name-row input:focus{outline:3px solid var(--blue);outline-offset:1px}
.prof-titles{display:grid;gap:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.vitrine{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.vit-slot{position:relative;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px 8px;border-radius:var(--r-md);text-align:center}
button.vit-slot{border:2px dashed var(--line-2);color:var(--muted);font-weight:800;font-size:13px}
button.vit-slot:hover{background:var(--panel-2);color:var(--ink)}
.vit-slot.filled{background:radial-gradient(circle at 50% 35%,var(--glow) 0%,color-mix(in srgb,var(--rc) 14%,var(--panel)) 75%);border:1px solid color-mix(in srgb,var(--rc) 30%,var(--line))}
.vit-ball{flex:1;display:grid;place-items:center}
.vit-ball img{filter:drop-shadow(0 10px 8px rgba(40,20,60,.3));transition:transform .2s}
.vit-ball:hover img{transform:scale(1.06) rotate(-4deg)}
.vit-slot b{font-size:13.5px;font-weight:900;line-height:1.2}
.vit-slot .pills{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.vit-x{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:var(--close-bg);font-size:18px;line-height:1;display:grid;place-items:center}
.prof-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.prof-stats div{padding:12px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line)}
.prof-stats small{display:block;font-size:12px;font-weight:700;color:var(--ink-2)}
.prof-stats b{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.modal.picker{display:block;width:min(860px,100%)}
.picker-body{padding:26px}
.picker-body h2{font-family:var(--display);font-weight:400;font-size:30px;line-height:1}
.picker-body .card-grid{margin-top:16px}
.chal-list{display:grid;gap:10px;max-width:900px}
.rews{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.rew{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:3px 10px 3px 6px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--ink-2)}
.rew .coin{width:16px;height:16px}
.tab-dot{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:4px;border-radius:999px;background:#E5484D;color:#fff;font-size:11px}
.chal-cta{color:#C07A0C}
.pity{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;margin-bottom:18px}
.pity b{font-weight:900}
.pity p{font-size:12.5px;color:var(--ink-2);font-weight:600;margin-top:2px}
.pity .q-prog{max-width:420px}
.first-pill{display:inline-flex;align-items:center;font-size:11px;font-weight:900;padding:2px 9px;border-radius:999px;color:#24253D;background:linear-gradient(100deg,#FFD35F,#FFB547);white-space:nowrap;line-height:1.5}
.ed-no{font-size:12px;font-weight:900;color:#FFD98A;letter-spacing:.02em}
.feed li{align-items:flex-start}
.feed li > span{line-height:1.4}
.feed .rar{font-size:10px;margin-left:2px}
.feed time{display:block;font-size:11px;font-weight:700;color:var(--muted)}
@media (max-width:1000px){ .vitrine{grid-template-columns:repeat(3,minmax(0,1fr))} .prof-stats{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:560px){ .prof-card{grid-template-columns:minmax(0,1fr)} .vitrine,.prof-stats{grid-template-columns:repeat(2,minmax(0,1fr))} }

/* ---------- atelier ---------- */
.recipes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:18px}
.recipe{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--panel);text-align:left;font-weight:800;font-size:13px;transition:transform .12s,box-shadow .12s}
.recipe:hover{transform:translateY(-2px)}
.recipe svg{color:var(--muted);transform:rotate(90deg);margin-left:2px}
.rc-line{display:inline-flex;align-items:center;gap:7px}
.rc-line i{width:10px;height:10px;border-radius:50%}
.rc-line i.a{background:var(--a)}
.rc-line i.b{background:var(--b)}
.recipe small{color:var(--muted);font-weight:700;font-size:11.5px;margin-top:2px}
.recipe[aria-pressed="true"]{border-color:var(--b);box-shadow:0 0 0 2px var(--b)}
.fuse{display:grid;grid-template-columns:minmax(0,1fr) auto 170px;gap:18px;align-items:center;margin-bottom:22px}
.fz-grid{display:grid;grid-template-columns:repeat(5,minmax(0,88px));gap:10px;justify-content:center}
.fz-slot{aspect-ratio:1;border-radius:12px;border:2px dashed var(--line-2);display:grid;place-items:center;background:var(--panel-2)}
.fz-slot.filled{border-style:solid;border-color:color-mix(in srgb,var(--a) 60%,var(--line))}
.fz-slot img{width:72%;height:auto;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}
.fz-arrow{color:var(--muted)}
.fz-out{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.fz-out b{font-weight:900}
.fz-out small{color:var(--muted);font-weight:700}
.orb-mini{width:90px;height:90px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:36px;color:rgba(255,255,255,.85);
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),transparent 32%),radial-gradient(circle at 50% 55%,color-mix(in srgb,var(--b) 60%,#3A3650),#1B1828 78%);box-shadow:0 0 30px -4px var(--b)}
.fz-actions{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fz-count{font-weight:900;font-variant-numeric:tabular-nums;margin-right:auto}
.fz-warn{grid-column:1/-1}
.m-card[aria-pressed="true"]{box-shadow:0 0 0 3px var(--blue);transform:translateY(-2px)}
.m-card .dup-tag{position:absolute;top:7px;left:8px;font-size:10px;font-weight:900;background:var(--green-soft);color:var(--green);border-radius:999px;padding:1px 7px;text-transform:uppercase;letter-spacing:.04em}
.fuse-ring{position:relative;width:300px;height:300px;max-width:100%}
.fuse-ring img{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.5));
  transform:rotate(var(--a)) translateX(125px) rotate(calc(-1*var(--a))) scale(1);animation:fuse 1.7s cubic-bezier(.55,0,.85,.35) var(--d) forwards}
@keyframes fuse{to{transform:rotate(calc(var(--a) + 540deg)) translateX(0) rotate(calc(-1*var(--a))) scale(.2);opacity:0}}
.fuse-core{position:absolute;left:50%;top:50%;width:80px;height:80px;margin:-40px;border-radius:50%;background:radial-gradient(circle,#fff 0%,var(--tc) 45%,transparent 70%);animation:core 1.9s ease-in forwards}
@keyframes core{0%{transform:scale(.3);opacity:.4}80%{transform:scale(1.6);opacity:1}100%{transform:scale(2.4);opacity:1}}
@media (max-width:1000px){ .recipes{grid-template-columns:repeat(2,minmax(0,1fr))} .fuse{grid-template-columns:minmax(0,1fr)} .fz-arrow{justify-self:center;transform:rotate(90deg)} }

/* ---------- Lumineuse : la plus belle des shiny ---------- */
[data-lum]{animation:lumpulse 2.6s ease-in-out infinite both}
@keyframes lumpulse{
  0%,100%{filter:drop-shadow(0 0 3px var(--lc)) drop-shadow(0 0 12px var(--lc)) drop-shadow(0 0 26px color-mix(in srgb,var(--lc) 55%,transparent))}
  50%{filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 18px var(--lc)) drop-shadow(0 0 42px var(--lc))}}
.hero-art img.hero-main[data-lum]{animation:bob 5s ease-in-out infinite,lumpulse 2.6s ease-in-out infinite both}
.ph-final img[data-lum]{animation:bobf 5s ease-in-out infinite,lumpulse 2.6s ease-in-out infinite both}
.slot.shiny.is-open .slot-ball img[data-lum]{animation:lumpulse 2.6s ease-in-out infinite both}
.modal-visual{position:relative;overflow:hidden}
.modal-visual > *{position:relative}
.modal-visual.lum::before{content:"";position:absolute;left:50%;top:45%;width:560px;height:560px;margin:-280px;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--lc) 50%,transparent) 0 6deg,transparent 6deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 16%,transparent 60%);mask:radial-gradient(circle,#000 16%,transparent 60%);animation:spin 30s linear infinite}
/* agrandir pendant l'ouverture */
.slot.is-open{cursor:zoom-in}
.zoom-hint{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;color:rgba(255,255,255,.7);margin-top:2px}
.slot.is-open:hover .zoom-hint{color:#fff}

/* ---------- stock de sacs gratuits, filtres ---------- */
.stack{display:inline-flex;gap:5px;align-items:center}
.stack i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.18);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
.stack i.on{background:var(--yellow);box-shadow:0 0 8px rgba(255,201,63,.7)}
.hero-cta{position:relative;z-index:2;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.free-stock{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:800;color:var(--ink-2)}
.free-stock .stack i{background:var(--track);box-shadow:none}
.free-stock .stack i.on{background:#F2AE12}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg .chip svg{width:13px;height:13px}

/* ---------- jeux de la cour ---------- */
.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.game-tile{display:flex;flex-direction:column;gap:0;padding:0;overflow:hidden}
.gt-art{display:block;height:150px;background:#B8895A}
.gt-art svg{width:100%;height:100%;display:block;transition:transform .3s}
.game-tile:hover .gt-art svg{transform:scale(1.04)}
.gt-body{display:flex;flex-direction:column;gap:8px;padding:16px 18px 18px;flex:1}
.gt-body h2{font-family:var(--display);font-weight:400;font-size:26px;line-height:1}
.gt-body p{color:var(--ink-2);font-weight:600;font-size:13.5px}
.gt-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:6px}
.gt-foot small{font-weight:800;color:var(--muted);font-size:12px}
.back-link{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:800;color:var(--ink-2);margin-bottom:8px;padding:4px 8px 4px 4px;border-radius:8px}
.back-link:hover{background:var(--panel-2);color:var(--ink)}
.game-stage canvas.dirt{background:#B8895A;cursor:crosshair}

.games-sec{margin-bottom:28px}
.gs-head{margin-bottom:14px}
.gs-head h2{font-size:21px;font-weight:900}
.gs-head p{color:var(--ink-2);font-weight:600;max-width:78ch;margin-top:2px}
.gt-state{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--panel-2);color:var(--muted);border:1px solid var(--line);margin-top:6px}
.gt-state.ok{color:var(--green);background:var(--green-soft);border-color:var(--green-line)}
.gt-state .coin{width:16px;height:16px}
.bet-card .bets{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.bet-card .btn{height:40px;padding:0 16px;font-size:14px}
.bet-card .btn .coin{width:18px;height:18px}
.bet-card p{max-width:44ch}

/* ---------- secrets ---------- */
.secret-pill{background:linear-gradient(100deg,#2A1F4A,#6B3FD8)!important;color:#fff!important}
.secret-card{cursor:default}
.secret-card .ball{height:92px}
.secret-q{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:38px;color:var(--muted);background:radial-gradient(circle at 35% 30%,var(--panel),var(--line-2));box-shadow:inset 0 -6px 12px rgba(0,0,0,.15)}
.secret-card small{font-style:italic;line-height:1.35;padding:0 4px}
.m-card.is-secret{box-shadow:inset 0 0 0 2px #7B5CE0}
.rain{position:fixed;inset:0;pointer-events:none;z-index:85;overflow:hidden}
.rain img{position:absolute;top:-90px;animation:rainfall linear forwards;filter:drop-shadow(0 6px 6px rgba(0,0,0,.3))}
@keyframes rainfall{to{transform:translateY(calc(100vh + 140px)) rotate(720deg)}}
#logo-marble.l-spin{animation:lspin .5s ease-out}
@keyframes lspin{to{transform:rotate(360deg)}}
#logo-marble.l-roll{animation:lroll 1.8s ease-in-out}
@keyframes lroll{35%{transform:translateX(70vw) rotate(1080deg)}36%{opacity:0}64%{opacity:0;transform:translateX(-40vw)}65%{opacity:1}100%{transform:none}}

/* ---------- confiserie ---------- */
.tarif-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.tarif{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;padding:12px 6px;border-radius:12px;background:color-mix(in srgb,var(--rc,#8E8898) 15%,var(--panel));border:1px solid color-mix(in srgb,var(--rc,#8E8898) 30%,var(--line));text-align:center}
.tarif b{font-size:12.5px;font-weight:900;line-height:1.15}
.tarif .price{font-weight:900;font-size:15px}
.tarif.is-shiny{background:var(--panel-2)}
.conf-card{cursor:default}
.conf-btn{height:32px;padding:0 12px;font-size:13px;margin-top:4px}
.conf-btn .coin{width:16px;height:16px}
@media (max-width:1000px){ .tarif-grid{grid-template-columns:repeat(4,minmax(0,1fr))} }

/* ---------- bonbec du jour ---------- */
.modal.daily{display:block;width:min(640px,100%)}
.daily-body{padding:30px 26px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.daily-kicker{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#D9468F;background:color-mix(in srgb,#FF5FA8 14%,var(--panel));padding:4px 12px;border-radius:999px}
.daily-body h2{font-family:var(--display);font-weight:400;font-size:34px;line-height:1}
.daily-body > p{color:var(--ink-2);font-weight:600;max-width:46ch}
.daily-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;width:100%;margin:6px 0}
.day{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:12px;background:var(--panel-2);border:1.5px solid var(--line)}
.day small{font-size:10px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.day .coin{width:26px;height:26px}
.day b{font-weight:900;font-size:13px;font-variant-numeric:tabular-nums}
.day.today{border-color:#F2AE12;background:var(--gold-bg);box-shadow:0 0 0 3px color-mix(in srgb,#FFC93F 30%,transparent)}
.day.got{opacity:.55}
.day-ok{position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center}
.day-bonus{font-size:10px;font-weight:900;color:var(--green)}
#daily-btn{color:#D9468F}
#daily-btn svg{animation:giftwiggle 2.4s ease-in-out infinite}
@keyframes giftwiggle{0%,80%,100%{transform:none}85%{transform:rotate(-12deg)}90%{transform:rotate(10deg)}95%{transform:rotate(-6deg)}}
@media (max-width:560px){ .daily-row{grid-template-columns:repeat(4,minmax(0,1fr))} }

/* ---------- placeholder ---------- */
.soon-page{display:grid;gap:18px;max-width:760px}
.soon-page .panel p{color:var(--ink-2);font-weight:600;max-width:62ch}
.soon-list{display:grid;gap:10px;margin-top:12px;padding:0;list-style:none}
.soon-list li{display:flex;gap:10px;align-items:flex-start;font-weight:700;color:var(--ink-2)}
.soon-list li::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;background:var(--yellow);margin-top:6px;box-shadow:0 0 0 3px var(--yellow-soft)}
.dup-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:14px}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(27,24,40,.55);backdrop-filter:blur(4px);display:grid;place-items:center;padding:20px}
.modal{position:relative;width:min(700px,100%);max-height:calc(100% - 20px);overflow:auto;background:var(--panel);border-radius:22px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.modal-visual{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px 20px;background:radial-gradient(circle at 50% 45%,var(--glow) 0%,var(--rbg) 90%);min-height:300px}
.modal-visual canvas{width:min(250px,100%);aspect-ratio:1;filter:drop-shadow(0 18px 14px rgba(30,20,50,.35))}
.modal-visual .hint{font-size:11.5px;font-weight:800;color:var(--ink-2);letter-spacing:.04em;text-transform:uppercase}
.siblings{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.siblings button{width:40px;height:40px;border-radius:50%;padding:2px;border:2px solid transparent}
.siblings button[aria-pressed="true"]{border-color:var(--ink)}
.modal-body{padding:28px 26px;display:flex;flex-direction:column;gap:10px}
.modal-body .pills{display:flex;gap:6px;flex-wrap:wrap}
.modal-body h2{font-family:var(--display);font-weight:400;font-size:34px;line-height:1;letter-spacing:.01em}
.modal-body .desc{color:var(--ink-2);font-weight:600}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:6px 0 4px;font-size:13px}
.facts dt{color:var(--muted);font-weight:700}
.facts dd{margin:0;font-weight:800;font-variant-numeric:tabular-nums}
.facts code{font-family:ui-monospace,Consolas,monospace}
.modal-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.close-x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;background:var(--close-bg);display:grid;place-items:center;font-size:22px;line-height:1;z-index:2}
.close-x:hover{background:var(--panel)}

/* ---------- opening overlay ---------- */
.ov{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;color:#fff;overflow:auto;
  background:radial-gradient(ellipse 70% 60% at 50% 45%,color-mix(in srgb,var(--bc,#8a5a35) 38%,#241810) 0%,#1A120C 68%,#0C0806 100%)}
.ov-bg{position:fixed;inset:-60%;pointer-events:none;background:repeating-conic-gradient(from 0deg,rgba(255,228,180,.07) 0 9deg,transparent 9deg 18deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 40%);mask:radial-gradient(circle,#000 0,transparent 40%);animation:spin 80s linear infinite}
#ov-fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.ov-kicker{font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#FFE3B0;background:rgba(255,255,255,.1);padding:4px 12px;border-radius:999px}
.ov-count{font-size:13px;font-weight:800;color:#C9B8A6}
.bag-zone{position:relative;display:grid;place-items:center;--glow:rgba(255,220,160,.5)}
.bag-halo{position:absolute;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,var(--glow) 0%,transparent 62%);opacity:.35;transition:opacity .3s,transform .3s;pointer-events:none}
.bag-floor{width:190px;height:24px;margin-top:-16px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.55),transparent 70%)}
.bag-zone.charging .bag-halo{opacity:1;transform:scale(1.15)}
.bag-zone.charging .bag-stage svg{animation:charge .26s ease-in-out infinite;filter:drop-shadow(0 0 26px var(--glow)) drop-shadow(0 20px 20px rgba(0,0,0,.45))}
@keyframes charge{0%,100%{transform:rotate(-6deg) scale(1.04)}50%{transform:rotate(6deg) scale(1.09) translateY(-6px)}}

  const key = `${s.seed}|${s.type}|${s.family}|${s.pal}|${s.shiny}`;
  if(paramCache.has(key)) return paramCache.get(key);
  const r = rng((s.seed ^ 0x9E3779B9)>>>0);
  const P = PALETTES[s.pal];
  let tint = hex01(P[4]);
  const opaque = OPAQUE_FAMS.includes(s.family);
  if(s.family===2) tint = hex01(shade(P[1],-.1)).map(v=>Math.max(.08,v*.8));
  const p = {
    seed:[r(),r(),r(),r()],
    par:[(r()-.5)*5, [3,4,4,5,6][Math.floor(r()*5)], .05+r()*.07, 2+Math.floor(r()*4)],
    srot: rotAxis(r()-.5,r()-.5,r()-.5,r()*TAU),
    c1:hex01(P[1]), c2:hex01(P[2]), c3:hex01(P[3]), tint,
    mode:s.family, opaque:opaque?1:0, porc:0, sulf:0, fig:s.family%4, shiny:s.shiny||0, asp:s.type==="chinoise"?1.22:1,
  };
  paramCache.set(key,p); return p;
}

/* ---------- rendu WebGL : verre, réfraction, reflets ---------- */
const FS = `
precision highp float;
uniform vec2 uRes; uniform vec4 uSeed; uniform vec4 uPar;
uniform float uPorc, uShiny, uSulf, uFig, uR, uAsp;
uniform vec3 uC1, uC2, uC3, uTint;
uniform mat3 uRot, uSRot;

float h31(vec3 p){ p=fract(p*0.3183099+0.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float noise(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f);
  return mix(mix(mix(h31(i),h31(i+vec3(1,0,0)),f.x),mix(h31(i+vec3(0,1,0)),h31(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(h31(i+vec3(0,0,1)),h31(i+vec3(1,0,1)),f.x),mix(h31(i+vec3(0,1,1)),h31(i+vec3(1,1,1)),f.x),f.y),f.z); }
float fbm(vec3 p){ float a=0.5, s=0.0; for(int i=0;i<4;i++){ s+=a*noise(p); p=p*2.03+vec3(1.7,9.2,3.1); a*=0.5; } return s; }
vec3 pal3(float k){ k=mod(k,3.0); return k<1.0?uC1:(k<2.0?uC2:uC3); }

float sdStar(vec2 p){ const vec2 k1=vec2(0.809016994,-0.587785252); const vec2 k2=vec2(-0.809016994,-0.587785252);
  float r=0.85, rf=0.45; p.x=abs(p.x); p-=2.0*max(dot(k1,p),0.0)*k1; p-=2.0*max(dot(k2,p),0.0)*k2; p.x=abs(p.x); p.y-=r;
  vec2 ba=rf*vec2(-k1.y,k1.x)-vec2(0,1); float h=clamp(dot(p,ba)/dot(ba,ba),0.0,r); return length(p-ba*h)*sign(p.y*ba.x-p.x*ba.y); }
float sdHeart(vec2 p){ p.x=abs(p.x); p.y+=0.55;
  if(p.y+p.x>1.0) return sqrt(dot(p-vec2(0.25,0.75),p-vec2(0.25,0.75)))-0.35355;
  vec2 a=p-vec2(0.0,1.0); vec2 b=p-0.5*max(p.x+p.y,0.0); return sqrt(min(dot(a,a),dot(b,b)))*sign(p.x-p.y); }
float fig(vec2 p){ int f=int(uFig+0.5);
  if(f==0) return sdStar(p);
  if(f==1) return sdHeart(p*1.1)/1.1;
  if(f==2) return max(length(p)-0.75, -(length(p-vec2(0.34,0.2))-0.62));
  float d=min(min(length(p-vec2(0.0,0.4)),length(p-vec2(0.0,-0.4))),min(length(p-vec2(0.4,0.0)),length(p-vec2(-0.4,0.0))))-0.3;
  return min(d,length(p)-0.25); }

vec4 fam(vec3 q, out vec3 e){
  e=vec3(0.0);
  float r=length(q); vec3 so=uSeed.xyz*40.0;
  float tw=uPar.x, k=uPar.y, w=uPar.z, nb=uPar.w;
#if MODE==0
  { // oeil-de-chat
    float ang=atan(q.z,q.x)+q.y*tw;
    float d=abs(sin(ang*k*0.5))*length(q.xz);
    float dens=smoothstep(w,w*0.25,d)*smoothstep(0.93,0.78,r);
    return vec4(pal3(floor(ang/6.2831853*k+0.5)), dens*45.0);
  }
#elif MODE==1
  { // tourbillon
    vec3 wq=q+0.45*vec3(fbm(q*1.7+so),fbm(q*1.7+so+5.2),fbm(q*1.7+so+9.7))-0.22;
    float ang=atan(wq.z,wq.x)+wq.y*tw*1.3;
    float b=sin(ang*nb);
    float dens=smoothstep(1.0-w*3.2,1.0,abs(b))*smoothstep(0.93,0.62,r)*smoothstep(0.12,0.3,r);
    return vec4(pal3(floor(ang*nb/3.14159)), dens*32.0);
  }
#elif MODE==2
  { // galaxie
    float n=fbm(q*2.2+so), n2=fbm(q*4.0-so);
    vec3 c=mix(uC1,uC2,smoothstep(0.35,0.7,n)); c=mix(c,uC3,smoothstep(0.55,0.8,n2));
    e=c*(pow(smoothstep(0.25,0.8,n),1.6)*4.5+0.25)*smoothstep(0.97,0.4,r);
    vec3 g=q*16.0+so; vec3 fc=fract(g)-0.5;
    e+=vec3(step(0.955,h31(floor(g)))*smoothstep(0.2,0.0,length(fc)))*9.0;
    return vec4(uC1*0.25, 1.6);
  }
#elif MODE==3
  { // agate
    float f=fbm(q*1.3+so)*3.5+q.y*1.2; float t=fract(f*1.5);
    vec3 c=mix(uC1,uC2,smoothstep(0.2,0.5,t)); c=mix(c,uC3,smoothstep(0.72,0.85,t)*0.9);
    c=mix(c,vec3(1.0),smoothstep(0.93,0.99,t)*0.55);
    return vec4(c, 200.0);
  }
#elif MODE==4
  { // opaline
    float n=fbm(q*2.0+so);
    vec3 c=mix(uC3,uC1,smoothstep(0.3,0.7,n));
    c=mix(c,uC2,smoothstep(0.55,0.75,fbm(q*3.0+so+3.0)));
    e=c*0.35;
    return vec4(c, 3.5);
  }
#elif MODE==5
  { // pailletee
    vec3 g=q*22.0+so; vec3 fc=fract(g)-0.5;
    float fl=step(0.86,h31(floor(g)))*smoothstep(0.22,0.05,length(fc));
    float sw=smoothstep(0.55,0.7,fbm(q*2.0+so));
    e=uC3*fl*6.0*smoothstep(0.95,0.7,r);
    return vec4(mix(uC1,uC2,sw), 0.8+fl*40.0+sw*1.5);
  }
#elif MODE==6
  { // oignon
    float st=sin(atan(q.z,q.x)*nb*2.0+fbm(q*3.0+so)*5.0+q.y*tw);
    vec3 c=st>0.3?uC2:(st<-0.4?uC3:uC1);
    float shell=smoothstep(0.6,0.76,r)*smoothstep(0.95,0.88,r);
    return vec4(c, shell*60.0+0.3);
  }
#elif MODE==7
  { // berlingot
  float ang=atan(q.z,q.x)+q.y*tw;
  float s=fract(ang/6.2831853*nb);
  vec3 cream=vec3(0.98,0.96,0.93);
  vec3 c=s<0.33?uC1:(s<0.5?cream:(s<0.83?uC2:cream));
  return vec4(c, 200.0);
  }
#elif MODE==8
  { // terre cuite peinte
    float n=fbm(q*3.0+so);
    vec3 clay=mix(uC1,vec3(0.72,0.55,0.4),0.5)*(0.8+0.35*n)*(0.9+0.2*noise(q*45.0+so));
    float y=q.y+0.07*sin(atan(q.z,q.x)*3.0+so.x);
    float band=max(smoothstep(0.075,0.045,abs(abs(y)-0.36)),smoothstep(0.06,0.03,abs(y)));
    return vec4(mix(clay,uC3*0.9,band*0.9), 200.0);
  }
#elif MODE==9
  { // acier
    return vec4(mix(vec3(0.8),uC2,0.18), 200.0);
  }
#elif MODE==10
  { // nacrée : couches de nacre aux couleurs du coloris (les coloris sombres donnent des perles noires)
    float n=fbm(q*2.5+so);
    float lay=0.5+0.5*sin(fbm(q*1.8+so*0.7)*14.0);
    vec3 c=mix(uC1,uC2,0.35+0.4*lay);
    return vec4(mix(c,vec3(0.97,0.95,0.93),0.3+0.2*n), 200.0);
  }
#elif MODE==11
  { // cristal à bulles
    vec3 g=q*6.0+so; vec3 id=floor(g); vec3 fc=fract(g)-0.5;
    float hb=h31(id);
    vec3 off=vec3(h31(id+3.1),h31(id+7.7),h31(id+1.9))-0.5;
    float rb=0.07+0.16*h31(id+1.3);
    float d=length(fc-off*0.35);
    float sh=step(0.5,hb)*smoothstep(0.06,0.0,abs(d-rb))*smoothstep(0.92,0.75,r);
    e=vec3(1.0)*sh*1.5;
    return vec4(mix(uC2,vec3(1.0),0.6), 0.25+sh*22.0);
  }
#elif MODE==12
  { // arlequin
    vec3 g=q*3.0+so; vec3 i=floor(g), f=fract(g);
    float md=8.0, md2=8.0; vec3 mid=vec3(0.0);
    for(int x=-1;x<=1;x++) for(int y=-1;y<=1;y++) for(int z=-1;z<=1;z++){
      vec3 b=vec3(float(x),float(y),float(z));
      vec3 o=vec3(h31(i+b),h31(i+b+11.3),h31(i+b+27.1));
      vec3 rr=b+o-f; float dd=dot(rr,rr);
      if(dd<md){ md2=md; md=dd; mid=i+b; } else if(dd<md2) md2=dd;
    }
    float hk=h31(mid+5.0);
    vec3 c=hk<0.25?vec3(0.97,0.95,0.9):pal3(floor(hk*3.0));
    c*=mix(0.55,1.0,smoothstep(0.0,0.08,sqrt(md2)-sqrt(md)));
    return vec4(c, 200.0);
  }
#elif MODE==13
  { // ruban
    float a=q.y*tw*1.5+so.x; float ca=cos(a), sa=sin(a);
    vec2 p=vec2(ca*q.x-sa*q.z, sa*q.x+ca*q.z);
    float dens=smoothstep(w*1.1,w*0.4,abs(p.y))*smoothstep(0.62,0.5,abs(p.x))*smoothstep(0.93,0.8,r);
    return vec4(pal3(floor((p.x+0.62)*nb*1.3)), dens*55.0);
  }
#elif MODE==14
  { // arc-en-ciel
    vec3 wq=q+0.3*vec3(fbm(q*1.5+so),fbm(q*1.5+so+4.0),fbm(q*1.5+so+8.0));
    float ang=atan(wq.z,wq.x)+wq.y*tw;
    vec3 c=0.5+0.5*cos(6.2831*(vec3(0.0,0.33,0.67)+ang/6.2831853*2.0+wq.y*0.5));
    float dens=smoothstep(0.35,0.8,abs(sin(ang*nb*1.5)))*smoothstep(0.93,0.55,r);
    e=c*0.2;
    return vec4(c, dens*28.0);
  }
#elif MODE==15
  { // millefiori : des fleurs de verre sur un fond sombre
    vec3 g=q*2.7+so; vec3 id=floor(g); vec3 f=fract(g)-0.5;
    float d=length(f), a=atan(f.y,f.x);
    float pet=0.4+0.09*cos(a*(5.0+floor(h31(id)*3.0)));
    float flower=smoothstep(pet,pet-0.04,d), heart=smoothstep(0.13,0.1,d);
    vec3 c=mix(uC1*0.35, pal3(floor(h31(id+4.0)*3.0)), flower);
    c=mix(c, vec3(1.0,0.95,0.7), heart);
    return vec4(c, 200.0);
  }
#elif MODE==16
  { // givrée : verre laiteux, un peu teinté
    float n=fbm(q*3.0+so);
    return vec4(mix(uC2,vec3(0.96,0.97,1.0),0.3+0.25*n), 2.2+3.0*n);
  }
#elif MODE==17
  { // fumée : volutes dans le verre
    float n=fbm(q*2.4+so+1.5*vec3(fbm(q*1.4+so),fbm(q*1.4+so+3.0),fbm(q*1.4+so+6.0)));
    float dens=smoothstep(0.42,0.72,n)*smoothstep(0.93,0.55,r);
    return vec4(mix(uC1*0.5,vec3(0.9),smoothstep(0.5,0.9,n)), dens*16.0);
  }
#elif MODE==18
  { // lave : roche sombre et fissures incandescentes
    float n=fbm(q*3.0+so);
    float k2=abs(fbm(q*3.6+so*1.3)-0.5);
    float crack=smoothstep(0.045,0.0,k2);
    vec3 glow=mix(uC2,vec3(1.0,0.85,0.4),crack*0.6);
    e=glow*crack*2.2;
    return vec4(mix(vec3(0.07,0.06,0.06)+uC1*0.12*n, glow, crack), 200.0);
  }
#elif MODE==19
  { // marbre : pierre claire et veines
    float v=abs(sin((q.x+q.y*0.7)*5.0+fbm(q*2.6+so)*7.0));
    vec3 c=mix(vec3(0.95,0.94,0.91),uC3,0.12);
    c=mix(c, uC1*0.75, pow(1.0-v,10.0));
    c=mix(c, uC2, pow(1.0-abs(sin((q.z-q.y)*9.0+fbm(q*4.0-so)*5.0)),22.0)*0.6);
    return vec4(c, 200.0);
  }
#elif MODE==20
  { // tigrée : rayures de fauve
    float s=sin(q.y*nb*3.2+fbm(q*2.4+so)*5.5+q.x*1.6);
    return vec4(mix(uC2, uC1*0.22, smoothstep(0.35,0.55,s)), 200.0);
  }
#else
  { // à pois
    vec3 g=q*2.6+so; vec3 id=floor(g); vec3 f=fract(g)-0.5;
    float dot1=smoothstep(0.38,0.35,length(f))*step(0.2,h31(id));
    vec3 pc=h31(id+2.0)<0.55?vec3(0.97,0.96,0.93):uC3;
    return vec4(mix(uC1, pc, dot1), 200.0);
  }
#endif
}

vec4 pattern(vec3 q, vec3 qs, out vec3 e){
  vec4 c=fam(qs,e);
  if(uSulf>0.5){
    float d=fig(q.xy*1.8)/1.8;
    if(max(d,abs(q.z)-0.06)<0.0){ e=vec3(0.0); return vec4(0.93,0.93,0.96,400.0); }
    c.a*=0.05; e*=0.2;
  }
  if(uShiny>1.5 && uShiny<2.5){
    vec3 g=qs*17.0+uSeed.yzx*50.0; vec3 fc=fract(g)-0.5;
    float fl=step(0.66,h31(floor(g)))*smoothstep(0.3,0.06,length(fc))*smoothstep(0.97,0.8,length(q));
    e+=vec3(1.0,0.78,0.3)*fl*11.0; c.a+=fl*30.0; c.rgb=mix(c.rgb,vec3(1.0,0.8,0.35),fl);
  }
  if(uShiny>2.5){ e+=c.rgb*min(c.a,25.0)*0.09+uC2*0.25; }
  return c;
}

// pièce reflétée par le métal : ciel doux, sol, horizon adouci, fenêtre et lampe
vec3 chrome(vec3 r){
  vec3 sky=mix(vec3(0.62,0.66,0.72),vec3(0.98,0.99,1.0),smoothstep(0.05,0.9,r.y));
  vec3 flo=mix(vec3(0.46,0.42,0.38),vec3(0.24,0.22,0.21),smoothstep(-0.05,-0.9,r.y));
  vec3 c=mix(flo,sky,smoothstep(-0.22,0.22,r.y));
  c*=1.0-0.25*smoothstep(0.1,0.0,abs(r.y+0.12));
  c+=smoothstep(0.3,0.2,abs(r.x+0.42))*smoothstep(0.24,0.14,abs(r.y-0.5))*step(0.0,r.z)*1.1;
  c+=smoothstep(0.1,0.04,abs(r.x-0.6))*smoothstep(0.35,0.25,abs(r.y-0.15))*step(0.0,r.z)*0.5;
  return c;
}
vec3 env(vec3 r){
  vec3 sky=mix(vec3(0.96,0.93,0.87),vec3(1.0,0.99,0.96),clamp(r.y,0.0,1.0));
  vec3 flo=mix(vec3(0.6,0.48,0.36),vec3(0.86,0.78,0.66),clamp(r.y+1.0,0.0,1.0));
  vec3 c=mix(flo,sky,smoothstep(-0.08,0.08,r.y));
  vec2 w=vec2(r.x+0.42,r.y-0.5);
  c+=smoothstep(0.3,0.2,abs(w.x))*smoothstep(0.24,0.14,abs(w.y))*step(0.0,r.z)*1.4;
  return c;
}

void main(){
  vec2 uv=((gl_FragCoord.xy/uRes)*2.0-1.0)/uR;
  uv.x/=uAsp;   // bille chinoise : un peu ovale
  float rad=length(uv);
  float px=2.0/(uRes.x*uR);
  float edge=1.0-smoothstep(1.0-px*1.5,1.0+px*0.5,rad);
  if(rad>1.0) uv=uv/rad*0.999;
  vec3 n=vec3(uv,sqrt(max(0.0,1.0-dot(uv,uv))));
  vec3 d0=vec3(0.0,0.0,-1.0);
  vec3 L=normalize(vec3(-0.55,0.65,0.6));
  vec3 rv=reflect(d0,n);
  float F=0.04+0.96*pow(1.0-n.z,5.0);
  vec3 refl=env(rv);
  float sp=max(dot(rv,L),0.0);
  float spec=pow(sp,180.0)*2.5+pow(sp,16.0)*0.12;
  vec3 col;
  vec3 qo=uRot*n;   // point de la surface dans le repère de la bille : les effets shiny tournent avec elle
#if OPAQUE
  {
    vec3 q=uRot*n; vec3 e;
    vec3 qs=uSRot*q;
    vec4 pc=pattern(q, uPorc>0.5 ? qs*0.8 : qs, e);
    vec3 base=pc.rgb;
    if(uPorc>0.5){
      vec3 porc=vec3(0.97,0.95,0.91);
      base=mix(porc,pc.rgb,clamp(pc.a/15.0,0.0,1.0));
      base=mix(base,clamp(e,0.0,1.0),clamp(length(e)*0.6,0.0,1.0));
    }
    float dif=max(dot(n,L),0.0);
    col=base*(0.36+0.74*dif)+e*0.4;
    col=mix(col,refl,F*0.85+0.05);
    col+=spec*0.85;
#if MODE==8
    col=base*(0.42+0.7*dif)+refl*F*0.15+spec*0.08;   // terre : mate
#elif MODE==9
    // acier : miroir teinté par le coloris, avec de fines stries de polissage qui tournent avec la bille
    float brush=0.9+0.1*noise(vec3(qo.x*3.0,qo.y*80.0,qo.z*3.0)+uSeed.xyz*10.0);
    col=chrome(rv)*mix(vec3(0.95),uC2,0.35)*brush*(0.72+0.28*n.z)+spec*1.6;
#elif MODE==10
    vec3 nac=0.5+0.5*cos(6.2831*(vec3(0.0,0.33,0.67)+(1.0-n.z)*0.9+fbm(qs*2.0)*0.8));
    col=mix(col,col*0.75+nac*0.3,0.32)+nac*F*0.35;      // reflets de nacre
#endif
  }
#else
  {
    vec3 d=refract(d0,n,1.0/1.5);
    float tEx=-2.0*dot(n,d);
    float dt=tEx/30.0;
    vec3 acc=vec3(0.0); float T=1.0;
    for(int i=0;i<30;i++){
      vec3 p=n+d*(float(i)+0.5)*dt;
      vec3 q=uRot*p; vec3 e;
      vec4 pc=pattern(q, uSRot*q, e);
      float a=1.0-exp(-pc.a*dt);
      float lit=0.55+0.45*clamp(dot(normalize(p+vec3(0.0001)),L)*0.5+0.5,0.0,1.0);
      acc+=T*(a*pc.rgb*lit+e*dt);
      T*=1.0-a;
      if(T<0.01) break;
    }
    vec3 pe=n+d*tEx;
    vec3 d2=refract(d,-pe,1.5);
    if(dot(d2,d2)<0.01) d2=reflect(d,-pe);
    vec3 bg=env(d2)*pow(max(uTint,vec3(0.02)),vec3(tEx*1.2));
    bg+=uTint*smoothstep(0.55,0.0,length(uv-vec2(0.36,-0.42)))*0.35;
    col=acc+T*bg;
    col=mix(col,refl,F);
    col+=spec;
#if MODE==16
    col=mix(col,vec3(0.93,0.95,1.0)*(0.75+0.25*n.z),0.3);   // givrée : surface dépolie
#endif
  }
#endif
  if(uShiny>0.5 && uShiny<1.5){
    // irisée : film d'huile en volutes, dessiné sur la bille (et qui glisse un peu avec l'angle, comme un vrai reflet)
    float th=fbm(qo*1.7+uSeed.xyz*20.0)*2.4+qo.y*0.5+uSeed.w;
    vec3 iri=0.5+0.5*cos(6.2831*(vec3(0.0,0.33,0.67)+th+(1.0-n.z)*0.5));
    float film=0.12+0.4*smoothstep(0.35,0.8,fbm(qo*2.6-uSeed.zxy*12.0));
    col=mix(col,col*0.55+iri*0.6,film);
    col+=iri*(F*1.5+0.05);
  }
  if(uShiny>1.5 && uShiny<2.5){
    // dorée : feuilles d'or posées sur la bille, qui reflètent la pièce comme du métal

    col+=vec3(1.0,0.78,0.3)*F*0.9;
  }
  if(uShiny>2.5){
    // lumineuse : points phosphorescents pris dans la surface
    float st=pow(max(0.0,noise(qo*13.0+uSeed.xyz*40.0)-0.5)*2.0,4.0);
    col+=mix(uC2,vec3(1.0),0.55)*st*2.6;

  col=clamp(col,0.0,1.0);
  vec4 outc=vec4(col*edge,edge);
  gl_FragColor=outc;

class MarbleGL{
  constructor(cv){

    const gl=cv.getContext("webgl",{preserveDrawingBuffer:true,premultipliedAlpha:true,alpha:true,antialias:false});
    if(!gl) throw new Error("webgl indisponible");
    this.gl=gl;
    this.progs=new Map(); this.cur=null;
    const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  }
  // un petit programme par famille × (verre|opaque), compilé à la demande :
  // un seul gros shader met plusieurs minutes à compiler sous Windows (ANGLE/D3D) et fige le navigateur
  use(mode,opaque){
    const gl=this.gl, key=mode*2+opaque;
    let p=this.progs.get(key);
    if(!p){
      const sh=(t,src)=>{const o=gl.createShader(t);gl.shaderSource(o,src);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o};
      const pr=gl.createProgram();
      gl.attachShader(pr,sh(gl.VERTEX_SHADER,"attribute vec2 p;void main(){gl_Position=vec4(p,0.0,1.0);}"));
      gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,`#define MODE ${mode}
#define OPAQUE ${opaque}
`+FS));
      gl.linkProgram(pr);
      if(!gl.getProgramParameter(pr,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
      p={pr, loc:gl.getAttribLocation(pr,"p"), u:{}};
      ["uRes","uSeed","uPar","uPorc","uShiny","uSulf","uFig","uR","uAsp","uC1","uC2","uC3","uTint","uRot","uSRot"].forEach(n=>p.u[n]=gl.getUniformLocation(pr,n));
      this.progs.set(key,p);
    }
    if(this.cur!==p){ gl.useProgram(p.pr); gl.enableVertexAttribArray(p.loc); gl.vertexAttribPointer(p.loc,2,gl.FLOAT,false,0,0); this.cur=p }
    return p.u;
  }
  draw(s,size,rot=I3){
    const gl=this.gl,P=specParams(s),u=this.use(P.mode,P.opaque);
    if(this.cv.width!==size){this.cv.width=this.cv.height=size}
    gl.viewport(0,0,size,size); gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform2f(u.uRes,size,size); gl.uniform4fv(u.uSeed,P.seed); gl.uniform4fv(u.uPar,P.par);
    gl.uniform1f(u.uPorc,P.porc);
    gl.uniform1f(u.uShiny,P.shiny); gl.uniform1f(u.uSulf,P.sulf); gl.uniform1f(u.uFig,P.fig); gl.uniform1f(u.uR,.9/P.asp); gl.uniform1f(u.uAsp,P.asp);
    gl.uniform3fv(u.uC1,P.c1); gl.uniform3fv(u.uC2,P.c2); gl.uniform3fv(u.uC3,P.c3); gl.uniform3fv(u.uTint,P.tint);
    gl.uniformMatrix3fv(u.uRot,false,rot); gl.uniformMatrix3fv(u.uSRot,false,P.srot);

}

  while(items.length<3){ const id = pool.splice(Math.floor(r()*pool.length),1)[0]; items.push({id, p:0, claimed:false}) }

  const out = [];
  slotsOwned().forEach(list=>{ [...list].sort(tierSort).slice(1).forEach(s=>{ if(!s.shiny && !s.secret && s.id!==S.active && !S.vitrine.includes(s.id)) out.push(s) }) });
  return out;

function recycleSpecs(ids){
  const set = new Set(ids);
  const gone = S.specs.filter(s=>set.has(s.id) && s.id!==S.active);
  if(!gone.length) return 0;
  const total = gone.reduce((a,s)=>a+recycleValue(s),0);
  S.specs = S.specs.filter(s=>!gone.includes(s));
  S.unseen = S.unseen.filter(id=>!set.has(id));
  S.jetons += total;
  save(); renderTop();
  questEvent("recycle", gone.length);
  passXP(PASS_XP.recycle*gone.length);
  Sound.recycle();
  return total;
}

const WORLD_START = Date.UTC(2026,8,1), WORLD_BAGS_H = 1500;
function editionOf(s){
  if(s.pal>=BASE_PALS) return 0;
  const bags = Math.max(0,(s.at-WORLD_START)/3600000)*WORLD_BAGS_H;
  const r = rng((s.seed ^ 0x5EED)>>>0)();
  return 1 + Math.floor(chanceOf(s)*3*bags*(.6+.8*r));
}

const PASS_TIERS = 30, TIER_XP = 1000, PASS_PRICE = "4,99 €";
const BAG_XP = {gratuit:40, classique:150, premium:200, collector:300};
const PASS_XP = {quest:200, bonus:300, star:20, recycle:5, craft:50};
function seasonNow(d=new Date()){
  const m = d.getMonth(), y = d.getFullYear(), def = SEASONS[m];
  return {id:`${y}-${m+1}`, m, y, def, pal:BASE_PALS+m, end:new Date(y,m+1,1).getTime(), label:`${def.name} ${y}`,
    month:d.toLocaleDateString("fr-FR",{month:"long",year:"numeric"})};
}
function ensurePass(){
  const se = seasonNow();
  if(!S.pass || S.pass.id!==se.id){ S.pass = {id:se.id, xp:0, premium:false, free:[], prem:[]}; save() }
  return S.pass;
}
const passTier = () => Math.min(PASS_TIERS, Math.floor(ensurePass().xp/TIER_XP));
function passLeft(){ const ms=Math.max(0,seasonNow().end-Date.now()), d=Math.floor(ms/86400000), hh=Math.floor(ms/3600000)%24; return d ? `${d} j ${hh} h` : `${hh} h ${Math.floor(ms/60000)%60} min` }
const seasonStyle = se => { const P=PALETTES[se.pal]; return `--s1:${P[1]};--s2:${P[2]};--s3:${P[3]}` };
// récompenses d'un palier (1 à 30) sur la piste gratuite ("free") ou premium ("prem")
function passReward(track,t){
  const fam = seasonNow().def.fam;
  const M = (type,shiny=0) => ({k:"marble", type, fam, shiny});
  if(track==="free"){
    if(t===30) return M("calot");
    if(t===20) return M("bille");
    if(t===10) return M("mini");
    if(t%5===0) return {k:"bag", bag:"classique"};
    return {k:"jetons", n:(t%2?40:70)+t*4};
  }
  if(t===30) return M("mammouth",3);
  if(t===25) return {k:"bag", bag:"collector"};
  if(t===20) return M("boulet");
  if(t===15) return {k:"title", name:"As de la saison"};
  if(t===10) return M("calot",1);
  if(t===5)  return M("chinoise");
  if(t===1)  return {k:"title", name:"Collectionneur"};
  if(t%4===0) return {k:"bag", bag:"premium"};
  if(t%3===0) return {k:"bag", bag:"classique"};
  return {k:"jetons", n:120+t*8};
}
function rewardSpec(track,t,r){ const se=seasonNow(); return {seed:hash(se.id+track+t), type:r.type, family:r.fam, pal:se.pal, shiny:r.shiny, ed:se.label} }
function rewardLabel(r){
  if(!r) return "";
  if(r.k==="jetons") return `${fmt(r.n)} ${CUR.many}`;
  if(r.k==="bag") return BAG_BY[r.bag].name;
  if(r.k==="title") return `Titre « ${r.name} »`;
  return `${TYPES[r.type].label} ${FAMILIES[r.fam].name}${r.shiny?" "+SHINIES[r.shiny].name:""} de saison`;
}
function passClaimable(){
  const P = ensurePass(), tier = passTier(); let n = 0;
  for(let t=1;t<=tier;t++){ if(!P.free.includes(t)) n++; if(P.premium && !P.prem.includes(t)) n++ }
  return n;
}
function grantReward(track,t){
  const P = ensurePass(), r = passReward(track,t);
  if(!r || t>passTier() || (track==="prem" && !P.premium) || P[track].includes(t)) return null;
  P[track].push(t);
  if(r.k==="jetons") S.jetons += r.n;
  else if(r.k==="bag") S.bagInv[r.bag] = (S.bagInv[r.bag]||0)+1;
  else if(r.k==="title"){ if(!S.titles.includes(r.name)) S.titles.push(r.name); S.title = r.name }
  else { const sp = rewardSpec(track,t,r), s = makeSpec(sp.type,sp); s.ed = sp.ed; S.specs.push(s); S.unseen.push(s.id); r.spec = s }
  return r;
}
function passXP(n){
  const P = ensurePass(), before = passTier();
  P.xp = Math.min(PASS_TIERS*TIER_XP, P.xp+n); save();
  const after = passTier();
  if(after>before){ setTimeout(()=>{ toast(`Passe de saison : palier ${after} atteint !`); Sound.ding() }, 400); renderNav() }
  return n;
}

      ${act?`<div class="active-row">
