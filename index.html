<title>Billy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;600;700;800;900&family=Caveat:wght@600;700&display=swap">
<style>
:root{
  --bg:#FBF4E6;
  --panel:#FFFCF6;
  --panel-2:#FFF8EC;
  --line:#EFE3CD;
  --line-2:#E4D4B6;
  --ink:#24253D;
  --ink-2:#56546B;
  --muted:#8E8898;
  --yellow:#FFC93F;
  --yellow-2:#F2AE12;
  --yellow-soft:#FFE5A0;
  --blue:#2E6BE6;
  --blue-2:#1F4FB8;
  --blue-soft:#D6E4FC;
  --purple-soft:#E9DCFB;
  --green:#2FA35A;
  --green-soft:#D6F1D4;
  --navy:#1B2748;
  --hero-1:#2A1C16;
  --hero-2:#5A3A27;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
  --r-lg:18px;
  --r-md:14px;
  --shadow:0 1px 0 rgba(120,90,40,.06),0 6px 18px -10px rgba(120,90,40,.25);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:10px}
img{max-width:100%;display:block}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:16px;height:68px;padding-inline:24px;background:rgba(251,244,230,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:4px;font-family:var(--display);font-size:38px;line-height:1;color:var(--yellow);-webkit-text-stroke:0;paint-order:stroke fill;text-shadow:0 3px 0 var(--navy);letter-spacing:.5px}
.logo span{-webkit-text-stroke:6px var(--navy);paint-order:stroke fill}
.logo img{width:34px;height:34px;margin-left:2px;margin-top:4px;filter:drop-shadow(0 2px 0 var(--navy))}
.tagline{font-family:var(--hand);font-size:24px;font-weight:600;color:var(--ink);margin-left:18px;white-space:nowrap}
.top-spacer{flex:1}
.icon-btn{position:relative;width:40px;height:40px;display:grid;place-items:center;border-radius:12px}
.icon-btn:hover{background:var(--panel-2)}
.icon-btn .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:#E5484D;border:2px solid var(--bg)}
.profile-mini{display:flex;align-items:center;gap:10px;padding-inline:14px;border-inline:1px solid var(--line)}
.avatar{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#2d3a68,#101830);display:grid;place-items:center;overflow:hidden;box-shadow:0 0 0 2px var(--panel)}
.avatar img{width:88%;height:88%}
.profile-mini b{display:block;font-weight:800;font-size:14px}
.profile-mini small{color:var(--muted);font-size:12px;font-weight:600}
.wallet{display:flex;align-items:center;gap:8px;height:38px;padding:0 6px 0 6px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:800;font-variant-numeric:tabular-nums}
.wallet .plus{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:18px;line-height:1;color:var(--ink-2)}
.wallet .plus:hover{background:var(--panel-2)}
.coin{width:24px;height:24px;flex:none}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:calc(100% - 68px)}
.side{position:sticky;top:calc(68px + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - 68px);display:flex;flex-direction:column;gap:4px;padding:22px 12px;border-right:1px solid var(--line);overflow-y:auto}
.nav-btn{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;border-radius:12px;font-weight:700;font-size:14.5px;color:var(--ink);text-align:left}
.nav-btn svg{flex:none;width:22px;height:22px}
.nav-btn:hover{background:var(--panel-2)}
.nav-btn[aria-current="page"]{background:var(--blue-soft);color:var(--blue-2)}
.nav-btn .soon{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.nav-sep{height:1px;background:var(--line);margin:14px 8px}
.side-quote{margin-top:auto;padding:18px 10px 4px;font-family:var(--hand);font-size:19px;line-height:1.15;color:var(--ink-2);transform:rotate(-6deg)}
.side-quote svg{display:block;margin:6px 0 0 40px}

main{padding:22px 24px 40px;min-width:0}

/* ---------- panels ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 18px 18px;box-shadow:var(--shadow);min-width:0}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px}
.panel-head h2{font-size:19px;font-weight:900;letter-spacing:-.01em}
.panel-head h3{font-size:15px;font-weight:900}
.see-all{font-size:12.5px;font-weight:700;color:var(--ink-2);display:inline-flex;align-items:center;gap:4px;padding:4px 6px;border-radius:8px}
.see-all:hover{background:var(--panel-2);color:var(--ink)}

.pill{display:inline-block;font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;color:var(--rc);background:var(--rb);white-space:nowrap;line-height:1.5}
.pill.solid{background:var(--rc);color:#fff}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:44px;padding:0 22px;border-radius:999px;font-weight:800;font-size:15px;transition:transform .12s ease,box-shadow .12s ease,background .12s}
.btn:active{transform:translateY(1px)}
.btn-yellow{background:var(--yellow);color:var(--ink);box-shadow:0 3px 0 var(--yellow-2)}
.btn-yellow:hover{background:#FFD35F}
.btn-blue{background:var(--blue);color:#fff;box-shadow:0 3px 0 var(--blue-2)}
.btn-blue:hover{background:#3A78F0}
.btn-ghost{border:1.5px solid var(--line-2);background:var(--panel);height:38px;padding:0 16px;font-size:13.5px}
.btn-ghost:hover{background:var(--panel-2)}
.btn[disabled]{opacity:.55;cursor:not-allowed;box-shadow:none}

/* ---------- home ---------- */
.home{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.home-main,.home-side{display:grid;gap:20px;min-width:0}
.row-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.row-2.wide-left{grid-template-columns:minmax(0,1.12fr) minmax(0,1fr)}

.hero{position:relative;overflow:hidden;border-radius:var(--r-lg);min-height:272px;padding:32px 34px;display:flex;flex-direction:column;justify-content:center;gap:16px;color:#fff;
  background:
    radial-gradient(ellipse 60% 70% at 72% 120%,#9a6a45 0%,transparent 70%),
    radial-gradient(ellipse 50% 60% at 95% 10%,rgba(255,190,120,.25),transparent 70%),
    linear-gradient(120deg,var(--hero-1) 0%,#3d2a1f 45%,var(--hero-2) 100%)}
.hero::after{content:"";position:absolute;inset:auto 0 0 30%;height:45%;background:repeating-radial-gradient(circle at 60% 120%,rgba(255,220,180,.05) 0 2px,transparent 2px 7px);pointer-events:none}
.hero h1{position:relative;z-index:2;font-family:var(--display);font-weight:400;font-size:clamp(32px,4vw,50px);line-height:.98;letter-spacing:.01em;text-transform:uppercase;max-width:11ch;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.hero p{position:relative;z-index:2;max-width:32ch;font-size:16px;font-weight:600;color:#F6E9DA}
.hero .btn{position:relative;z-index:2;align-self:flex-start;height:50px;padding:0 28px;font-size:16px}
.hero-art{position:absolute;inset:0;pointer-events:none}
.hero-art img{position:absolute}
.hero-main{width:200px;height:200px;right:25%;top:50%;transform:translateY(-54%);filter:drop-shadow(0 22px 18px rgba(0,0,0,.55));animation:bob 5s ease-in-out infinite}
.bokeh{filter:blur(7px) saturate(1.1);opacity:.85}
.hero-spark{position:absolute;right:calc(25% + 170px);top:40px;width:70px}
.hero-spark2{position:absolute;right:calc(25% - 34px);bottom:36px;width:90px}
@keyframes bob{0%,100%{transform:translateY(-54%)}50%{transform:translateY(-58%)}}

.active-card{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:center}
.active-visual{position:relative;aspect-ratio:1;max-width:100%;border-radius:14px;background:radial-gradient(circle at 50% 55%,#fff 0%,#F3E7FB 45%,#E2D2F6 100%);display:grid;place-items:center}
.active-visual img{width:78%;filter:drop-shadow(0 10px 10px rgba(40,20,80,.3))}
.active-visual .nav-arrow{position:absolute;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center}
.active-visual .nav-arrow.l{left:-10px}.active-visual .nav-arrow.r{right:-10px}
.active-name{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.active-name h3{font-size:24px;font-weight:900;letter-spacing:-.01em}
.meta{color:var(--ink-2);font-weight:600;font-size:13px;margin-top:4px}
.active-desc{margin-top:10px;color:var(--ink-2);font-size:13px;max-width:34ch}
.active-card .btn-ghost{margin-top:12px}

.marble-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.m-tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px 12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);text-align:center;transition:transform .15s,box-shadow .15s}
.m-tile:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.m-tile img{width:64px;height:64px;filter:drop-shadow(0 6px 5px rgba(40,30,20,.25))}
.m-tile b{font-size:13px;font-weight:800}

.series-tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.s-tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px 12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);text-align:center}
.s-tile:hover{box-shadow:var(--shadow)}
.s-tile img{width:58px;height:58px;filter:drop-shadow(0 5px 4px rgba(40,30,20,.25))}
.s-tile b{font-size:13px;font-weight:800;margin-top:4px}
.s-tile small{font-size:12px;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums}
.bar{width:100%;height:6px;border-radius:99px;background:#EDE6DA;overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--blue)}
.bar i.done{background:var(--green)}
.s-tile .bar{width:80%;margin-top:4px}

.game-card{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);border-radius:var(--r-md);overflow:hidden;background:var(--navy);color:#fff;min-height:136px}
.game-card svg{width:100%;height:100%;display:block}
.game-info{padding:16px 16px;display:flex;flex-direction:column;gap:6px}
.game-info b{font-size:16px;font-weight:800}
.game-info p{font-size:12px;color:#C9D3EE;line-height:1.4}
.game-info .btn{margin-top:auto;height:38px;font-size:14px}

.strip-wrap{position:relative;display:flex;align-items:center;gap:6px}
.strip{display:flex;gap:10px;overflow-x:auto;scroll-behavior:smooth;scrollbar-width:none;flex:1}
.strip::-webkit-scrollbar{display:none}
.strip-item{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px 8px 8px;border:1px solid var(--line);border-radius:12px;background:var(--panel);min-width:130px}
.strip-item img{width:42px;height:42px}
.strip-item b{display:block;font-size:12px;font-weight:800;margin-bottom:2px}
.strip-arrow{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.strip-arrow:hover{background:var(--panel-2)}

.profile-card{display:grid;gap:14px}
.pc-top{display:flex;align-items:center;gap:14px}
.pc-top .avatar{width:74px;height:74px;box-shadow:0 0 0 3px var(--panel),0 0 0 4px var(--line-2)}
.pc-top b{font-size:19px;font-weight:900;display:block}
.pc-top span{font-size:14px;color:var(--ink-2);font-weight:700}
.lvl{display:flex;justify-content:space-between;align-items:baseline}
.lvl b{font-size:18px;font-weight:900}
.lvl small{font-size:11.5px;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums}
.lvl-bar{height:10px}
.lvl-bar i{background:linear-gradient(90deg,var(--blue-2),var(--blue))}
.stats{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.stat{display:flex;align-items:center;gap:10px;padding:14px 4px 4px}
.stat:nth-child(odd){border-right:1px solid var(--line)}
.stat:nth-child(even){padding-left:16px}
.stat:nth-child(n+3){border-top:1px solid var(--line);margin-top:10px}
.stat .ic{width:34px;height:34px;flex:none;display:grid;place-items:center}
.stat small{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.stat b{font-size:17px;font-weight:900;font-variant-numeric:tabular-nums}

.shortcuts{display:grid;gap:10px}
.shortcut{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:12px;font-weight:800;font-size:14px;text-align:left;transition:filter .12s,transform .12s}
.shortcut:hover{filter:brightness(.97);transform:translateX(2px)}
.shortcut svg{width:22px;height:22px;flex:none}
.sc-yellow{background:var(--yellow-soft);box-shadow:inset 0 0 0 1.5px #F4CF6A}
.sc-blue{background:var(--blue-soft);box-shadow:inset 0 0 0 1.5px #B7CEF6}
.sc-purple{background:var(--purple-soft);box-shadow:inset 0 0 0 1.5px #D3BEF3}
.sc-green{background:var(--green-soft);box-shadow:inset 0 0 0 1.5px #B3E1AE}

.event-card{position:relative;overflow:hidden;border-radius:var(--r-md);min-height:122px;padding:14px 16px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;text-align:left;width:100%;
  background:radial-gradient(ellipse 40% 60% at 78% 110%,#FFB43A 0%,transparent 60%),radial-gradient(ellipse 30% 40% at 75% 30%,#FF6A2A 0%,transparent 70%),linear-gradient(115deg,#5B1308,#B8360E 55%,#E8641A)}
.event-card .timer{position:absolute;top:12px;left:14px;font-size:11.5px;font-weight:800;background:var(--yellow-soft);color:#6B3B00;padding:3px 10px;border-radius:999px}
.event-card b{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.01em;position:relative;z-index:1}
.event-card p{font-size:12px;max-width:26ch;color:#FFE6D2;position:relative;z-index:1}
.event-card img{position:absolute;right:14px;bottom:14px;width:74px;filter:drop-shadow(0 0 16px rgba(255,160,40,.8))}

.feed{display:grid;gap:10px}
.feed li{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-2)}
.feed li b{color:var(--ink);font-weight:800}
.feed img{width:24px;height:24px;flex:none}
.feed ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.sample-tag{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* ---------- page headers ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:20px}
.page-head h1{font-family:var(--display);font-weight:400;font-size:40px;line-height:1;letter-spacing:.01em}
.page-head p{color:var(--ink-2);font-weight:600;margin-top:6px;max-width:60ch}
.hand-note{font-family:var(--hand);font-size:22px;color:var(--ink-2)}

/* ---------- bags ---------- */
.bags{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.bag-card{display:flex;flex-direction:column;gap:12px;padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.bag-visual{height:190px;border-radius:14px;display:grid;place-items:center;background:radial-gradient(circle at 50% 60%,#fff 0%,var(--bag-tint) 80%)}
.bag-visual svg{height:170px;width:auto;transition:transform .25s ease}
.bag-card:hover .bag-visual svg{transform:rotate(-4deg) scale(1.04)}
.bag-card h3{font-size:19px;font-weight:900}
.bag-card > p{color:var(--ink-2);font-weight:600;font-size:13.5px;min-height:2.9em}
.odds{list-style:none;margin:0;padding:10px 12px;display:grid;gap:5px;background:var(--panel-2);border-radius:12px;border:1px solid var(--line)}
.odds li{display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.odds li i{width:10px;height:10px;border-radius:50%;background:var(--rc)}
.odds li span:last-child{font-variant-numeric:tabular-nums;color:var(--ink)}
.odds .guar{grid-template-columns:1fr;color:var(--green);font-weight:800;border-top:1px dashed var(--line-2);padding-top:6px;margin-top:2px}
.bag-card .btn{width:100%}
.price{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.price .coin{width:20px;height:20px}

/* ---------- collection ---------- */
.col-summary{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr);gap:20px;margin-bottom:20px}
.big-count{display:flex;flex-direction:column;justify-content:center;gap:10px}
.big-count b{font-family:var(--display);font-weight:400;font-size:48px;line-height:1;font-variant-numeric:tabular-nums}
.big-count b small{font-size:24px;color:var(--muted)}
.big-count .bar{height:10px}
.rar-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.rar-box{display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:12px;background:var(--rb);border:1px solid color-mix(in srgb,var(--rc) 25%,transparent)}
.rar-box span{font-size:11.5px;font-weight:800;color:var(--rc);text-transform:uppercase;letter-spacing:.05em}
.rar-box b{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.rar-box b small{font-size:13px;color:var(--ink-2);font-weight:700}

.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.chip{height:36px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line-2);background:var(--panel);font-weight:800;font-size:13px;display:inline-flex;align-items:center;gap:8px}
.chip img{width:20px;height:20px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.filters .grow{flex:1}
.select{height:36px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line-2);background:var(--panel);font:inherit;font-weight:700;color:var(--ink)}
.check{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:13px;color:var(--ink-2)}
.check input{width:18px;height:18px;accent-color:var(--blue)}

.series-block{margin-bottom:26px}
.series-head{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.series-head img{width:40px;height:40px}
.series-head h2{font-size:21px;font-weight:900}
.series-head small{font-weight:800;color:var(--ink-2);font-variant-numeric:tabular-nums}
.series-head .bar{max-width:180px;margin-left:auto}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:12px}
.m-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 10px 12px;border-radius:var(--r-md);background:var(--panel);border:1px solid var(--line);text-align:center;transition:transform .15s,box-shadow .15s}
.m-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.m-card img{width:84px;height:84px;filter:drop-shadow(0 8px 6px rgba(40,30,20,.28))}
.m-card .num{position:absolute;top:8px;left:10px;font-size:11px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.m-card .count{position:absolute;top:7px;right:8px;font-size:11px;font-weight:900;background:var(--ink);color:#fff;border-radius:999px;padding:1px 7px}
.m-card .new{position:absolute;top:7px;right:8px;font-size:10px;font-weight:900;background:#E5484D;color:#fff;border-radius:999px;padding:2px 7px;text-transform:uppercase;letter-spacing:.04em}
.m-card b{font-size:14px;font-weight:800}
.m-card.missing{background:repeating-linear-gradient(135deg,var(--panel) 0 10px,var(--panel-2) 10px 20px);border-style:dashed;border-color:var(--line-2)}
.m-card.missing img{filter:brightness(0) opacity(.12)}
.m-card.missing b{color:var(--muted);letter-spacing:.1em}
.m-card.r-legendaire:not(.missing),.m-card.r-secret:not(.missing){box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--rc) 45%,transparent)}

function ribbons(ctx,S_,R,r,C,glow){

  for(let i=0;i<n;i++){

    const a=r()*TAU, b=a+Math.PI+(r()-.5)*1.8;
    const p=new Path2D();

    p.bezierCurveTo(R+(r()-.5)*R*1.6,R+(r()-.5)*R*1.6,R+(r()-.5)*R*1.6,R+(r()-.5)*R*1.6,R+Math.cos(b)*R*1.15,R+Math.sin(b)*R*1.15);
    const w=S_*(.05+r()*.11);

      ctx.filter=`blur(${S_*.014}px)`;
      ctx.strokeStyle=rgba(col,.6); ctx.lineWidth=w*1.5; ctx.stroke(p);
      ctx.filter="none";
      ctx.strokeStyle=rgba(shade(col,.45),.55); ctx.lineWidth=w*.35; ctx.stroke(p);
      ctx.globalCompositeOperation="source-over";
      continue;
    }
    ctx.strokeStyle=rgba(shade(col,-.55),.35); ctx.lineWidth=w*1.3; ctx.stroke(p);
    ctx.strokeStyle=col; ctx.lineWidth=w; ctx.stroke(p);
    ctx.save(); ctx.translate(-w*.18,-w*.18);
    ctx.strokeStyle=rgba(shade(col,.55),.55); ctx.lineWidth=w*.3; ctx.stroke(p);
    ctx.restore();

  const o = owned(m.id), isNew = S.unseen.includes(m.id);

  if(!o) return `<button class="m-card missing r-${m.rarity}" style="${rstyle(m.rarity)}" data-action="missing" aria-label="Bille ${RARITIES[m.rarity].label} non trouvée">${num}${mImg(m,160,"","")}<b>???</b>${pill(m.rarity)}</button>`;

/* ================= ouverture ================= */
let ovState = null;
function rollRarity(odds, min){
  const keys = RK.filter(k=>!min||RIDX[k]>=RIDX[min]);
  const tot = keys.reduce((a,k)=>a+odds[k],0);
  let x = Math.random()*tot;
  for(const k of keys){ x-=odds[k]; if(x<=0) return k }
  return keys[keys.length-1];
}
function pullBag(bag){
  const pool = MARBLES.filter(m=>!bag.series||m.series===bag.series);
  const res = [];
  for(let i=0;i<bag.n;i++){
    let rk = rollRarity(bag.odds);
    if(bag.guarantee && i===bag.n-1 && !res.some(m=>RIDX[m.rarity]>=RIDX[bag.guarantee])) rk = rollRarity(bag.odds,bag.guarantee);
    const c = pool.filter(m=>m.rarity===rk);
    res.push(c[Math.floor(Math.random()*c.length)]);
  }
  return res.sort((a,b)=>RIDX[a.rarity]-RIDX[b.rarity]);
}
function buy(bagId){
  const bag = BAG_BY[bagId];
  const key = bag.cur==="gems"?"gems":"calots";
  if(S[key] < bag.price){ toast(`Il te manque ${fmt(bag.price-S[key])} ${bag.cur==="gems"?"gemmes":"calots"} pour ce sac.`); return }
  S[key] -= bag.price;
  const pulls = pullBag(bag);
  let leveled = false;
  const results = pulls.map(m=>{
    const isNew = !S.owned[m.id];
    const o = S.owned[m.id] || (S.owned[m.id] = {count:0, serials:[], first:Date.now()});
    o.count++; o.serials.push(serialFor(m));
    if(isNew) S.unseen.push(m.id);
    S.history.unshift(m.id);
    S.xp += RARITIES[m.rarity].xp;
    while(S.xp >= XP_NEED){ S.xp -= XP_NEED; S.level++; leveled = true }
    return {m, isNew};
  });
  S.history = S.history.slice(0,30);
  save(); renderTop();
  ovState = {bag, results, opened:new Set(), leveled};
  showBagStage();
}
function showBagStage(){
  const {bag} = ovState;
  const ov = document.getElementById("ov");
  ov.style.removeProperty("--flash");
  document.getElementById("ov-body").innerHTML = `
    <div class="ov-title">${bag.name}</div>
    <button class="bag-stage" id="bag-stage" data-action="tear" aria-label="Ouvrir le sac">${bagSVG(bag.color)}</button>
    <p class="ov-hint">Touche le sac pour l'ouvrir</p>`;
  ov.hidden = false;
  document.body.style.overflow = "hidden";
  document.getElementById("bag-stage").focus();
}
function tear(){
  const st = document.getElementById("bag-stage");
  if(!st || st.dataset.busy) return;
  st.dataset.busy = 1;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  st.classList.add("shake");
  setTimeout(()=>{
    st.classList.remove("shake"); st.classList.add("burst");
    const best = ovState.results[ovState.results.length-1].m.rarity;
    document.getElementById("ov").style.setProperty("--flash", rgba(RARITIES[best].rc,.55));
  }, reduce?0:850);
  setTimeout(showReveal, reduce?50:1250);
}
function showReveal(){
  const {results,bag} = ovState;
  document.getElementById("ov-body").innerHTML = `
    <div class="ov-title">${results.length} billes trouvées !</div>
    <p class="ov-sub">Touche chaque bille pour la découvrir.</p>
    <div class="reveal-row">
      ${results.map(({m,isNew},i)=>`<button class="slot ${RIDX[m.rarity]>=2?"hint":""} ${RIDX[m.rarity]>=3?"big":""}" style="--d:${i*130}ms;${rstyle(m.rarity)}" data-action="reveal" data-i="${i}" aria-label="Découvrir la bille ${i+1}">
        <div class="slot-ball"><span class="rays"></span><span class="orb">?</span>${mImg(m,280,"","")}</div>
        <div class="slot-info"><b>${esc(m.name)}</b>${pill(m.rarity,true)}${isNew?`<span class="new">Nouvelle !</span>`:`<span class="new" style="color:#C9B8A6">Double</span>`}</div>
      </button>`).join("")}
    </div>
    <div class="ov-actions" id="ov-actions">
      <button class="btn btn-ghost" data-action="reveal-all">Tout révéler</button>
    </div>`;
}
function reveal(i){
  if(ovState.opened.has(i)) return;
  ovState.opened.add(i);
  const el = document.querySelector(`.slot[data-i="${i}"]`);
  el.classList.add("is-open"); el.classList.remove("hint");
  el.setAttribute("aria-label", ovState.results[i].m.name);
  if(ovState.opened.size === ovState.results.length) finishReveal();
}
function finishReveal(){
  const {bag,leveled} = ovState;
  const bal = bag.cur==="gems"?S.gems:S.calots;
  const best = ovState.results[ovState.results.length-1];
  document.querySelector(".ov-sub").textContent = RIDX[best.m.rarity]>=3 ? `Quelle chance : une ${RARITIES[best.m.rarity].label} !` : "Elles sont rangées dans ta collection.";
  document.getElementById("ov-actions").innerHTML = `
    <button class="btn btn-yellow" data-action="buy-again" ${bal<bag.price?"disabled":""}>${bal<bag.price?"Plus assez pour un autre sac":`Rouvrir un sac <span class="price">${curIcon(bag.cur)}${fmt(bag.price)}</span>`}</button>
    <button class="btn btn-ghost" data-action="to-collection">Voir ma collection</button>`;
  if(leveled){ toast(`Niveau ${S.level} atteint !`); ovState.leveled=false }
}
function closeOv(){
  document.getElementById("ov").hidden = true;
  document.body.style.overflow = "";
  ovState = null;
  renderView();
}

/* ================= interactions ================= */
let toastT;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2600) }

let resetArmed = false;
document.addEventListener("click", e=>{
  if(e.target.id==="modal"){ closeModal(); return }
  const t = e.target.closest("[data-action]"); if(!t) return;
  const a = t.dataset.action;
  switch(a){
    case "nav": closeModal(); go(t.dataset.view); break;
    case "series": ui.series = t.dataset.series; if(ui.view!=="collection") go("collection"); else renderView(); break;
    case "marble": {
      const id=t.dataset.id;
      if(owned(id)) openModal(id); else toast(`${BY_ID[id].name} (${RARITIES[BY_ID[id].rarity].label}) ne fait pas encore partie de ta collection.`);
      break;
    }
    case "missing": toast("Pas encore trouvée. Elle se cache peut-être dans ton prochain sac !"); break;
    case "set-active": S.active=t.dataset.id; save(); renderTop(); closeModal(); renderView(); toast(`${BY_ID[S.active].name} est ta nouvelle bille active.`); break;
    case "close-modal": closeModal(); break;
    case "active-step": {
      const list=ownedSorted(); const i=list.findIndex(m=>m.id===S.active);
      S.active=list[(i+ +t.dataset.dir+list.length)%list.length].id; save(); renderTop(); renderView(); break;
    }
    case "strip": document.getElementById("strip").scrollBy({left:+t.dataset.dir*320}); break;
    case "buy": buy(t.dataset.bag); break;
    case "tear": tear(); break;
    case "reveal": reveal(+t.dataset.i); break;
    case "reveal-all": ovState.results.forEach((_,i)=>setTimeout(()=>reveal(i),i*160)); break;
    case "buy-again": buy(ovState.bag.id); break;
    case "to-collection": closeOv(); ui.series="all"; go("collection"); break;
    case "close-ov": closeOv(); break;
    case "add-calots": S.calots+=500; save(); renderTop(); if(ui.view!=="collection") renderView(); toast("+500 calots ajoutés (démo)."); break;
    case "add-gems": S.gems+=50; save(); renderTop(); if(ui.view!=="collection") renderView(); toast("+50 gemmes ajoutées (démo)."); break;
    case "soon": toast(t.dataset.msg); break;
    case "reset":
      if(!resetArmed){ resetArmed=true; t.textContent="Clique encore pour confirmer"; setTimeout(()=>{resetArmed=false; const b=document.getElementById("reset-btn"); if(b) b.textContent="Réinitialiser la démo"},3000); break }
      resetArmed=false; S=starterState(); save(); renderTop(); renderView(); toast("La démo est revenue à zéro."); break;
  }
});
document.addEventListener("change", e=>{
  if(e.target.id==="f-rarity"){ ui.rarity=e.target.value; renderView() }
  if(e.target.id==="f-sort"){ ui.sort=e.target.value; renderView() }
  if(e.target.id==="f-hide"){ ui.hideMissing=e.target.checked; renderView() }
});
document.addEventListener("keydown", e=>{
  if(e.key!=="Escape") return;
  if(!document.getElementById("ov").hidden) closeOv();
  else if(!document.getElementById("modal").hidden) closeModal();
});

/* ================= démarrage ================= */
document.getElementById("logo-marble").src = marbleURL(BY_ID["cos-nebuleuse"],80);
document.getElementById("coin-slot-1").outerHTML = COIN;
document.getElementById("gem-slot-1").outerHTML = GEM;
renderTop(); renderNav(); renderView();
</script>
