<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tikalo · 3 couleurs par coloris</title>
<style>
  :root{ --bg:#16141f; --card:#211e2e; --line:#332f45; --txt:#f1eef8; --mut:#a49fb8; --acc:#ffb547; }
  *{ box-sizing:border-box }
  body{ margin:0; background:var(--bg); color:var(--txt); font:15px/1.45 system-ui,"Segoe UI",sans-serif }
  header{ padding:22px 20px 8px; max-width:1300px; margin:auto }
  h1{ margin:0 0 4px; font-size:24px }
  header p{ margin:0; color:var(--mut); max-width:820px }
  .bar{ position:sticky; top:0; z-index:5; background:rgba(22,20,31,.94); backdrop-filter:blur(6px); border-bottom:1px solid var(--line) }
  .bar-in{ max-width:1300px; margin:auto; padding:10px 20px; display:flex; flex-wrap:wrap; gap:6px; align-items:center }
  .tab{ border:1px solid var(--line); background:var(--card); color:var(--txt); border-radius:999px; padding:6px 12px; font:inherit; cursor:pointer }
  .tab small{ color:var(--mut); margin-left:4px }
  .tab[aria-pressed=true]{ background:var(--acc); color:#241a05; border-color:var(--acc) }
  .tab[aria-pressed=true] small{ color:#5a4310 }
  .sep{ flex:1 }
  .seg{ display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden }
  .seg button{ border:0; background:var(--card); color:var(--txt); padding:6px 12px; font:inherit; cursor:pointer }
  .seg button[aria-pressed=true]{ background:#4b4466 }
  main{ max-width:1300px; margin:auto; padding:14px 20px 40px }
  .info{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 16px; margin-bottom:14px }
  .info b{ color:var(--acc) }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(var(--w,210px),1fr)); gap:10px }
  .c{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:8px 8px 10px; text-align:center }
  .c .imgs{ display:flex; justify-content:center; gap:4px }
  .c figure{ margin:0; flex:1 }
  .c figcaption{ font-size:11px; color:var(--mut); text-transform:uppercase; letter-spacing:.05em }
  .c img{ width:100%; max-width:110px; aspect-ratio:1; display:block; margin:auto }
  .c .nm{ font-weight:600; margin-top:4px; display:flex; align-items:center; justify-content:center; gap:6px }
  .sw{ display:inline-flex; gap:2px } .sw i{ width:11px; height:11px; border-radius:3px; border:1px solid rgba(255,255,255,.25) }
  body.only .c figure.hide{ display:none }
</style>
</head>
<body>
<header>
  <h1>Utiliser les 3 couleurs de chaque coloris</h1>
  <p>Les motifs qui n'utilisaient qu'une ou deux couleurs du coloris, rendus avec le vrai moteur du jeu. Pour chaque motif, toutes les billes ont la même graine : seule la couleur change, ce qui montre bien les coloris qui se ressemblent.</p>
</header>
<div class="bar"><div class="bar-in" id="tabs"></div></div>
<main>
  <div class="info" id="info"></div>
  <div class="grid" id="grid"></div>
</main>
<script src="maquette-3couleurs-rendu.js"></script>
<script>
const MOTIFS = [
  {f:9,  n:"Acier",     k:1, op:1, d:"<b>Avant</b> : un miroir à peine teinté de la 2ᵉ couleur. <b>Après</b> : un acier « recuit », comme du titane anodisé : le miroir reste, mais il est traversé de reflets irisés qui passent par les 3 couleurs."},
  {f:15, n:"Givrée",    k:1, op:0, d:"<b>Avant</b> : seulement la 2ᵉ couleur, voilée de blanc. <b>Après</b> : le givre passe d'une couleur du coloris à l'autre selon les zones."},
  {f:16, n:"Fumée",     k:1, op:0, d:"<b>Avant</b> : seulement la 1ʳᵉ couleur, assombrie. <b>Après</b> : des volutes de trois couleurs qui s'entremêlent."},
  {f:28, n:"Bois",      k:1, op:1, d:"<b>Avant</b> : un bois brun à peine teinté. <b>Après</b> : un bois lamellé, teinté cerne après cerne des 3 couleurs."},
  {f:8,  n:"Terre",     k:2, op:1, d:"<b>Après</b> : le filet peint du milieu prend la 2ᵉ couleur, ceux du haut et du bas gardent la 3ᵉ."},
  {f:7,  n:"Berlingot", k:2, op:1, d:"<b>Après</b> : un filet de la 3ᵉ couleur entre les rayures crème."},
  {f:10, n:"Nacrée",    k:2, op:1, d:"<b>Après</b> : des nappes de la 3ᵉ couleur dans la nacre."},
  {f:11, n:"Cristal",   k:2, op:0, d:"<b>Après</b> : les bulles d'air prennent la 3ᵉ couleur."},
  {f:17, n:"Lave",      k:2, op:1, d:"<b>Après</b> : le cœur des fissures, le plus brûlant, prend la 3ᵉ couleur (au lieu d'un jaune toujours le même)."},
  {f:19, n:"Tigrée",    k:2, op:1, d:"<b>Après</b> : le ventre clair du fauve prend la 3ᵉ couleur."},
  {f:21, n:"Damier",    k:2, op:1, d:"<b>Après</b> : une case sur deux de la 1ʳᵉ couleur, les autres alternent la 2ᵉ et la 3ᵉ d'une rangée à l'autre."},
  {f:29, n:"Écailles",  k:2, op:1, d:"<b>Après</b> : environ une écaille sur quatre prend la 3ᵉ couleur."},
  {f:50, n:"Orage",     k:2, op:0, d:"<b>Après</b> : les branches des éclairs et le haut des nuages prennent la 3ᵉ couleur."},
];
const TINT_DARK = [50];

class GLR{
  constructor(fs){ this.fs=fs; this.cv=document.createElement("canvas");
    const gl=this.gl=this.cv.getContext("webgl",{preserveDrawingBuffer:true,premultipliedAlpha:true,alpha:true,antialias:false});
    this.progs=new Map();
    const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW); }
  use(mode,opaque){
    const gl=this.gl, key=mode*2+opaque; let p=this.progs.get(key);
    if(!p){
      const sh=(t,src)=>{const o=gl.createShader(t);gl.shaderSource(o,src);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o};
      const pr=gl.createProgram();
      gl.attachShader(pr,sh(gl.VERTEX_SHADER,"attribute vec2 p;void main(){gl_Position=vec4(p,0.0,1.0);}"));
      gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,`#define MODE ${mode}\n#define OPAQUE ${opaque}\n`+this.fs));
      gl.linkProgram(pr);
      p={pr, loc:gl.getAttribLocation(pr,"p"), u:{}};
      ["uRes","uSeed","uPar","uPorc","uShiny","uSulf","uFig","uR","uAsp","uC1","uC2","uC3","uTint","uRot","uSRot","uTime"].forEach(n=>p.u[n]=gl.getUniformLocation(pr,n));
      this.progs.set(key,p);
    }
    gl.useProgram(p.pr); gl.enableVertexAttribArray(p.loc); gl.vertexAttribPointer(p.loc,2,gl.FLOAT,false,0,0);
    return p.u;
  }
  url(m,pal,seed,size){
    const gl=this.gl, P=PALETTES48[pal], r=rng((seed^0x9E3779B9)>>>0), u=this.use(m.f,m.op);
    this.cv.width=this.cv.height=size; gl.viewport(0,0,size,size); gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
    const sd=[r(),r(),r(),r()], par=[(r()-.5)*5,[3,4,4,5,6][Math.floor(r()*5)],.05+r()*.07,2+Math.floor(r()*4)];
    const srot=rotAxis(r()-.5,r()-.5,r()-.5,r()*TAU);
    const tint=TINT_DARK.includes(m.f) ? hex01(P[1]).map(v=>Math.max(.08,v*.72)) : hex01(P[4]);
    gl.uniform2f(u.uRes,size,size); gl.uniform4fv(u.uSeed,sd); gl.uniform4fv(u.uPar,par);
    gl.uniform1f(u.uPorc,0); gl.uniform1f(u.uShiny,0); gl.uniform1f(u.uSulf,0); gl.uniform1f(u.uFig,m.f%4); gl.uniform1f(u.uR,.9); gl.uniform1f(u.uTime,0); gl.uniform1f(u.uAsp,1);
    gl.uniform3fv(u.uC1,hex01(P[1])); gl.uniform3fv(u.uC2,hex01(P[2])); gl.uniform3fv(u.uC3,hex01(P[3])); gl.uniform3fv(u.uTint,tint);
    gl.uniformMatrix3fv(u.uRot,false,I3); gl.uniformMatrix3fv(u.uSRot,false,srot);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    return this.cv.toDataURL("image/png");
  }
}
const R_OLD=new GLR(FS_OLD), R_NEW=new GLR(FS_NEW);
let cur=0, view="both", job=0;
const SEED=0x5EED1234;
const SIZE=Math.round(110*Math.min(2,devicePixelRatio||1));

function tabs(){
  const t=document.getElementById("tabs");
  t.innerHTML = MOTIFS.map((m,i)=>`<button class="tab" data-i="${i}" aria-pressed="${i===cur}">${m.n}<small>${m.k} coul.</small></button>`).join("")
   + `<span class="sep"></span><div class="seg">${[["both","Côte à côte"],["old","Avant"],["new","Après"]].map(([v,l])=>`<button data-v="${v}" aria-pressed="${v===view}">${l}</button>`).join("")}</div>`;
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.i){ cur=+b.dataset.i; tabs(); render() }
  if(b.dataset.v){ view=b.dataset.v; tabs(); applyView() }
});
function applyView(){
  document.body.classList.toggle("only", view!=="both");
  document.getElementById("grid").style.setProperty("--w", view==="both"?"210px":"120px");
  document.querySelectorAll(".c figure").forEach(f=>f.classList.toggle("hide", view!=="both" && f.dataset.k!==view));
}
function render(){
  const m=MOTIFS[cur], my=++job;
  document.getElementById("info").innerHTML=`<b>${m.n}</b> · utilisait ${m.k} couleur${m.k>1?"s":""} sur 3. ${m.d}`;
  const g=document.getElementById("grid");
  g.innerHTML=PALETTES48.map((P,i)=>`<div class="c"><div class="imgs">
      <figure data-k="old"><img id="o${i}" alt=""><figcaption>Avant</figcaption></figure>
      <figure data-k="new"><img id="n${i}" alt=""><figcaption>Après</figcaption></figure></div>
      <div class="nm">${P[0]} <span class="sw"><i style="background:${P[1]}"></i><i style="background:${P[2]}"></i><i style="background:${P[3]}"></i></span></div></div>`).join("");
  applyView();
  let i=0;
  const step=()=>{ if(my!==job) return; const t0=performance.now();
    while(i<PALETTES48.length && performance.now()-t0<30){
      try{ document.getElementById("o"+i).src=R_OLD.url(m,i,SEED,SIZE); document.getElementById("n"+i).src=R_NEW.url(m,i,SEED,SIZE) }
      catch(err){ document.getElementById("info").textContent="Erreur de rendu : "+err.message; return }
      i++ }
    if(i<PALETTES48.length) requestAnimationFrame(step) };
  requestAnimationFrame(step);
}
{ const h=decodeURIComponent(location.hash.slice(1)), i=MOTIFS.findIndex(m=>m.n===h); if(i>=0) cur=i }
tabs(); render();
</script>
</body>
</html>
