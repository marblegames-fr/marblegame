<title>Billy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;600;700;800;900&family=Caveat:wght@600;700&display=swap">
<style>
:root{
  --bg:#FBF4E6;
  --panel:#FFFCF6;
  --panel-2:#FFF8EC;
  --line:#EFE3CD;
  --line-2:#E4D4B6;
  --ink:#24253D;
  --ink-2:#56546B;
  --muted:#8E8898;
  --yellow:#FFC93F;
  --yellow-2:#F2AE12;
  --yellow-soft:#FFE5A0;
  --blue:#2E6BE6;
  --blue-2:#1F4FB8;
  --blue-soft:#D6E4FC;
  --purple-soft:#E9DCFB;
  --green:#2FA35A;
  --green-soft:#D6F1D4;
  --navy:#1B2748;
  --hero-1:#2A1C16;
  --hero-2:#5A3A27;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
  --r-lg:18px;
  --r-md:14px;
  --shadow:0 1px 0 rgba(120,90,40,.06),0 6px 18px -10px rgba(120,90,40,.25);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:10px}
img{max-width:100%;display:block}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:16px;height:68px;padding-inline:24px;background:rgba(251,244,230,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:4px;font-family:var(--display);font-size:38px;line-height:1;color:var(--yellow);text-shadow:0 3px 0 var(--navy);letter-spacing:.5px}
.logo span{-webkit-text-stroke:6px var(--navy);paint-order:stroke fill}
.logo img{width:36px;height:36px;margin-left:2px;margin-top:4px}
.tagline{font-family:var(--hand);font-size:24px;font-weight:600;color:var(--ink);margin-left:18px;white-space:nowrap}
.top-spacer{flex:1}
.icon-btn{position:relative;width:40px;height:40px;display:grid;place-items:center;border-radius:12px}
.icon-btn:hover{background:var(--panel-2)}
.icon-btn .dot{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:#E5484D;border:2px solid var(--bg)}
.profile-mini{display:flex;align-items:center;gap:10px;padding-inline:14px;border-inline:1px solid var(--line)}
.avatar{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#FFF8EC,#EADBC0);display:grid;place-items:center;overflow:hidden;box-shadow:0 0 0 2px var(--panel)}
.avatar img{width:92%;height:92%}
.profile-mini b{display:block;font-weight:800;font-size:14px}
.profile-mini small{color:var(--muted);font-size:12px;font-weight:600}
.wallet{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px 0 7px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:800;font-variant-numeric:tabular-nums}
.wallet small{font-weight:700;color:var(--ink-2);font-size:12px}
.coin{width:24px;height:24px;flex:none}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:calc(100% - 68px)}
.side{position:sticky;top:calc(68px + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - 68px);display:flex;flex-direction:column;gap:4px;padding:22px 10px;border-right:1px solid var(--line);overflow-y:auto}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;padding:12px 10px 12px 12px;border-radius:12px;font-weight:700;font-size:14.5px;color:var(--ink);text-align:left}
.nav-btn svg{flex:none;width:22px;height:22px}
.nav-btn span{white-space:nowrap}
.nav-btn:hover{background:var(--panel-2)}
.nav-btn[aria-current="page"]{background:var(--blue-soft);color:var(--blue-2)}
.nav-btn .soon{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.nav-btn .ready{margin-left:auto;width:9px;height:9px;border-radius:50%;background:#E5484D}
.nav-sep{height:1px;background:var(--line);margin:14px 8px}
.side-quote{margin-top:auto;padding:18px 10px 4px;font-family:var(--hand);font-size:19px;line-height:1.15;color:var(--ink-2);transform:rotate(-6deg)}
.side-quote svg{display:block;margin:6px 0 0 40px}

main{padding:22px 24px 40px;min-width:0}

/* ---------- panels ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);min-width:0}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px}
.panel-head h2{font-size:19px;font-weight:900;letter-spacing:-.01em}
.panel-head h3{font-size:15px;font-weight:900}
.see-all{font-size:12.5px;font-weight:700;color:var(--ink-2);display:inline-flex;align-items:center;gap:4px;padding:4px 6px;border-radius:8px}
.see-all:hover{background:var(--panel-2);color:var(--ink)}
.sample-tag{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

.pill{display:inline-block;font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;color:var(--rc);background:var(--rb);white-space:nowrap;line-height:1.5}
.pill.solid{background:var(--rc);color:#fff}
.shiny-pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:900;padding:2px 9px 2px 7px;border-radius:999px;color:#fff;white-space:nowrap;line-height:1.5;background:linear-gradient(100deg,#FF6FB5,#FFB547 30%,#6FE3A8 55%,#5AB8FF 78%,#B07BFF)}
.shiny-pill svg{width:11px;height:11px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:44px;padding:0 22px;border-radius:999px;font-weight:800;font-size:15px;transition:transform .12s ease,box-shadow .12s ease,background .12s}
.btn:active{transform:translateY(1px)}
.btn-yellow{background:var(--yellow);color:var(--ink);box-shadow:0 3px 0 var(--yellow-2)}
.btn-yellow:hover{background:#FFD35F}
.btn-blue{background:var(--blue);color:#fff;box-shadow:0 3px 0 var(--blue-2)}
.btn-blue:hover{background:#3A78F0}
.btn-ghost{border:1.5px solid var(--line-2);background:var(--panel);height:38px;padding:0 16px;font-size:13.5px}
.btn-ghost:hover{background:var(--panel-2)}
.btn[disabled]{opacity:.55;cursor:not-allowed;box-shadow:none}
.price{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.price .coin{width:20px;height:20px}
.timer{font-variant-numeric:tabular-nums}

/* ---------- home ---------- */
.home{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.home-main,.home-side{display:grid;gap:20px;min-width:0}
.row-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.row-2.wide-left{grid-template-columns:minmax(0,1.12fr) minmax(0,1fr)}

.hero{position:relative;overflow:hidden;border-radius:var(--r-lg);min-height:272px;padding:32px 34px;display:flex;flex-direction:column;justify-content:center;gap:16px;color:#fff;
  background:
    radial-gradient(ellipse 60% 70% at 72% 120%,#9a6a45 0%,transparent 70%),
    radial-gradient(ellipse 50% 60% at 95% 10%,rgba(255,190,120,.25),transparent 70%),
    linear-gradient(120deg,var(--hero-1) 0%,#3d2a1f 45%,var(--hero-2) 100%)}
.hero::after{content:"";position:absolute;inset:auto 0 0 30%;height:45%;background:repeating-radial-gradient(circle at 60% 120%,rgba(255,220,180,.05) 0 2px,transparent 2px 7px);pointer-events:none}
.hero .eyebrow{position:relative;z-index:2;align-self:flex-start;font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.14);padding:4px 12px;border-radius:999px;color:#FFE3B0}
.hero h1{position:relative;z-index:2;font-family:var(--display);font-weight:400;font-size:clamp(32px,4vw,50px);line-height:.98;letter-spacing:.01em;text-transform:uppercase;max-width:12ch;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.hero p{position:relative;z-index:2;max-width:34ch;font-size:16px;font-weight:600;color:#F6E9DA}
.hero .btn{position:relative;z-index:2;align-self:flex-start;height:50px;padding:0 28px;font-size:16px}
.hero-art{position:absolute;inset:0;pointer-events:none}
.hero-art img,.hero-art .hero-bag{position:absolute}
.hero-main{width:210px;height:210px;right:22%;top:50%;transform:translateY(-54%);filter:drop-shadow(0 22px 18px rgba(0,0,0,.55));animation:bob 5s ease-in-out infinite}
.hero-bag{right:4%;bottom:14px;width:150px;filter:drop-shadow(0 16px 14px rgba(0,0,0,.45));transform:rotate(8deg)}
.hero-bag svg{width:100%;height:auto;display:block}
.bokeh{filter:blur(7px);opacity:.8}
@keyframes bob{0%,100%{transform:translateY(-54%)}50%{transform:translateY(-58%)}}

.active-card{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:center}
.active-visual{position:relative;aspect-ratio:1;max-width:100%;border-radius:14px;display:grid;place-items:center}
.active-visual img{width:82%;filter:drop-shadow(0 10px 10px rgba(40,20,80,.3))}
.active-visual .nav-arrow{position:absolute;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center}
.active-visual .nav-arrow.l{left:-10px}.active-visual .nav-arrow.r{right:-10px}
.active-name{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.active-name h3{font-size:22px;font-weight:900;letter-spacing:-.01em}
.meta{color:var(--ink-2);font-weight:600;font-size:13px;margin-top:4px}
.meta code{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.active-card .btn-ghost{margin-top:12px}

.marble-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.m-tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px 12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);text-align:center;transition:transform .15s,box-shadow .15s}
.m-tile:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.m-tile .ball{height:70px;display:grid;place-items:center}
.m-tile img{filter:drop-shadow(0 6px 5px rgba(40,30,20,.25))}
.m-tile b{font-size:12.5px;font-weight:800;line-height:1.2}

.type-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.t-tile{display:grid;grid-template-columns:52px minmax(0,1fr);align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);text-align:left}
.t-tile:hover{box-shadow:var(--shadow)}
.t-tile .ball{height:52px;display:grid;place-items:center}
.t-tile b{display:block;font-size:13px;font-weight:800;line-height:1.2}
.t-tile small{font-size:12px;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums}
.bar{width:100%;height:6px;border-radius:99px;background:#EDE6DA;overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--blue)}
.bar i.done{background:var(--green)}
.t-tile .bar{margin-top:5px}

.game-card{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);border-radius:var(--r-md);overflow:hidden;background:var(--navy);color:#fff;min-height:136px}
.game-card svg{width:100%;height:100%;display:block}
.game-info{padding:16px;display:flex;flex-direction:column;gap:6px}
.game-info b{font-size:16px;font-weight:800}
.game-info p{font-size:12px;color:#C9D3EE;line-height:1.4}
.game-info .btn{margin-top:auto;height:38px;font-size:14px}

.formats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));align-items:end;gap:8px;padding-top:6px}
.fmt{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.fmt .ball{height:100px;display:flex;align-items:flex-end;justify-content:center}
.fmt img{filter:drop-shadow(0 6px 4px rgba(40,30,20,.3))}
.fmt b{font-size:12.5px;font-weight:800;line-height:1.15}
.fmt small{font-size:11.5px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.ruler{height:10px;margin-top:4px;border-top:2px solid var(--line-2);background:repeating-linear-gradient(90deg,var(--line-2) 0 1px,transparent 1px 12px);background-size:12px 6px;background-repeat:repeat-x}

.profile-card{display:grid;gap:14px}
.pc-top{display:flex;align-items:center;gap:14px}
.pc-top .avatar{width:74px;height:74px;box-shadow:0 0 0 3px var(--panel),0 0 0 4px var(--line-2)}
.pc-top b{font-size:19px;font-weight:900;display:block}
.pc-top span{font-size:14px;color:var(--ink-2);font-weight:700}
.lvl{display:flex;justify-content:space-between;align-items:baseline}
.lvl b{font-size:18px;font-weight:900}
.lvl small{font-size:11.5px;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums}
.lvl-bar{height:10px}
.lvl-bar i{background:linear-gradient(90deg,var(--blue-2),var(--blue))}
.stats{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.stat{display:flex;align-items:center;gap:10px;padding:14px 4px 4px}
.stat:nth-child(odd){border-right:1px solid var(--line)}
.stat:nth-child(even){padding-left:16px}
.stat:nth-child(n+3){border-top:1px solid var(--line);margin-top:10px}
.stat .ic{width:34px;height:34px;flex:none;display:grid;place-items:center}
.stat .ic img{width:34px;height:34px}
.stat small{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.stat b{font-size:17px;font-weight:900;font-variant-numeric:tabular-nums}

.shortcuts{display:grid;gap:10px}
.shortcut{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:12px;font-weight:800;font-size:14px;text-align:left;transition:filter .12s,transform .12s}
.shortcut:hover{filter:brightness(.97);transform:translateX(2px)}
.shortcut svg{width:22px;height:22px;flex:none}
.shortcut .timer{margin-left:auto;font-size:12.5px;font-weight:800;color:var(--ink-2)}
.sc-yellow{background:var(--yellow-soft);box-shadow:inset 0 0 0 1.5px #F4CF6A}
.sc-blue{background:var(--blue-soft);box-shadow:inset 0 0 0 1.5px #B7CEF6}
.sc-purple{background:var(--purple-soft);box-shadow:inset 0 0 0 1.5px #D3BEF3}
.sc-green{background:var(--green-soft);box-shadow:inset 0 0 0 1.5px #B3E1AE}

.event-card{position:relative;overflow:hidden;border-radius:var(--r-md);min-height:122px;padding:14px 16px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;text-align:left;width:100%;
  background:radial-gradient(ellipse 40% 60% at 78% 110%,#FFB43A 0%,transparent 60%),radial-gradient(ellipse 30% 40% at 75% 30%,#FF6A2A 0%,transparent 70%),linear-gradient(115deg,#5B1308,#B8360E 55%,#E8641A)}
.event-card .left{position:absolute;top:12px;left:14px;font-size:11.5px;font-weight:800;background:var(--yellow-soft);color:#6B3B00;padding:3px 10px;border-radius:999px}
.event-card b{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.01em;position:relative;z-index:1}
.event-card p{font-size:12px;max-width:26ch;color:#FFE6D2;position:relative;z-index:1}
.event-card img{position:absolute;right:12px;bottom:12px;width:80px;filter:drop-shadow(0 0 16px rgba(255,160,40,.7))}

.feed ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.feed li{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-2)}
.feed li b{color:var(--ink);font-weight:800}
.feed img{width:26px;height:26px;flex:none}

/* ---------- page headers ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:20px}
.page-head h1{font-family:var(--display);font-weight:400;font-size:40px;line-height:1;letter-spacing:.01em}
.page-head p{color:var(--ink-2);font-weight:600;margin-top:6px;max-width:62ch}
.hand-note{font-family:var(--hand);font-size:22px;color:var(--ink-2)}

/* ---------- bags ---------- */
.bags{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.bag-card{display:flex;flex-direction:column;gap:12px;padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.bag-card.free{border:2px solid #F4CF6A;background:linear-gradient(180deg,#FFF6DC,var(--panel) 40%)}
.bag-visual{position:relative;height:180px;border-radius:14px;display:grid;place-items:center;background:radial-gradient(circle at 50% 60%,#fff 0%,var(--bag-tint) 80%)}
.bag-visual svg{height:160px;width:auto;transition:transform .25s ease}
.bag-card:hover .bag-visual svg{transform:rotate(-4deg) scale(1.04)}
.bag-visual .tag{position:absolute;top:10px;left:10px;font-size:11px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:var(--ink);color:#fff}
.bag-card h3{font-size:19px;font-weight:900}
.bag-card > p{color:var(--ink-2);font-weight:600;font-size:13.5px;min-height:2.9em}
.odds{list-style:none;margin:0;padding:10px 12px;display:grid;gap:5px;background:var(--panel-2);border-radius:12px;border:1px solid var(--line)}
.odds li{display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.odds li i{width:10px;height:10px;border-radius:50%;background:var(--rc)}
.odds li span:last-child{font-variant-numeric:tabular-nums;color:var(--ink)}
.odds li.sh i{background:linear-gradient(135deg,#FF6FB5,#FFB547,#6FE3A8,#5AB8FF)}
.odds .guar{grid-template-columns:1fr;color:var(--green);font-weight:800;border-top:1px dashed var(--line-2);padding-top:6px;margin-top:2px}
.bag-card .btn{width:100%}
.earn{margin-top:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.earn .panel{display:flex;gap:12px;align-items:flex-start;text-align:left;transition:transform .15s}
.earn .panel:hover{transform:translateY(-2px)}

/* ---------- quêtes & recyclage ---------- */
.quest-list{display:grid;gap:10px}
.quest{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--panel-2)}
.quest-list.compact .quest{padding:10px 12px;gap:10px}
.quest.done:not(.claimed){border-color:#F4CF6A;background:#FFF6DC}
.quest.claimed{opacity:.6}
.q-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);color:var(--ink-2)}
.quest-list.compact .q-ic{width:34px;height:34px;border-radius:10px}
.q-main b{display:block;font-weight:800;font-size:14px;line-height:1.25}
.quest-list.compact .q-main b{font-size:13px}
.q-main p{font-size:12.5px;color:var(--ink-2);font-weight:600;margin-top:2px}
.q-prog{display:flex;align-items:center;gap:8px;margin-top:6px}
.q-prog small{font-size:11.5px;font-weight:800;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.q-reward{display:inline-flex;align-items:center;gap:4px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.q-reward .coin{width:18px;height:18px}
.q-state{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:12.5px;color:var(--green)}
.q-claim,.bonus-card .btn{height:36px;padding:0 14px;font-size:13.5px;gap:6px}
.q-claim .coin,.bonus-card .btn .coin{width:18px;height:18px}
.bonus-card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px}
.bonus-card.ready{border:2px solid #F4CF6A;background:linear-gradient(180deg,#FFF6DC,var(--panel))}
.recycle-bar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;margin-bottom:16px}
.recycle-bar b{font-weight:900}
.recycle-bar p{font-size:12.5px;color:var(--ink-2);font-weight:600}
.warn-note{font-size:12.5px;font-weight:700;color:#B4462B}
@media (max-width:560px){
  .quest,.bonus-card,.recycle-bar{grid-template-columns:auto minmax(0,1fr)}

<script>
/* =====================================================================
   DONNÉES DU JEU
   ===================================================================== */
const CUR = {one:"jeton", many:"jetons"};           // nom provisoire de la monnaie
const FREE_EVERY = 60*60*1000;                        // un sac gratuit toutes les heures

// Formats = raretés, du plus courant au plus rare
const TYPES = {
  mini:     {label:"Mini bille",     mm:10, rc:"#7C7A8A", rb:"#ECEAE6", xp:10,   desc:"La plus petite de la cour. Légère et rapide."},
  bille:    {label:"Bille",          mm:16, rc:"#2F8F45", rb:"#DAF2D6", xp:25,   desc:"Le format classique, celui de toutes les parties."},
  chinoise: {label:"Bille chinoise", mm:16, rc:"#2E6BE6", rb:"#DCE7FC", xp:60,   desc:"Porcelaine opaque, décor peint."},
  calot:    {label:"Calot",          mm:25, rc:"#8A4AD6", rb:"#ECDDFB", xp:150,  desc:"Le gros format qui impressionne les copains."},
  boulet:   {label:"Boulet",         mm:35, rc:"#D97E06", rb:"#FDEAC4", xp:400,  desc:"Si gros qu'il tient à peine dans la poche."},
  sulfure:  {label:"Sulfure",        mm:40, rc:"#D1335F", rb:"#FBDCE5", xp:1000, desc:"Verre clair avec une figurine argentée prise à l'intérieur."},
};
const TK = Object.keys(TYPES);

function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const randU32 = () => (Math.random()*4294967296)>>>0;
function hexRgb(h){h=h.replace("#","");return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
const hex01 = h => hexRgb(h).map(v=>v/255);
function shade(h,a){const c=hexRgb(h).map(v=>Math.round(a>0?v+(255-v)*a:v*(1+a)));return "#"+c.map(v=>v.toString(16).padStart(2,"0")).join("")}
function rgba(h,a){const [r,g,b]=hexRgb(h);return `rgba(${r},${g},${b},${a})`}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const fmt = n => Math.round(n).toLocaleString("fr-FR").replace(/ | /g," ");

function rotAxis(ax,ay,az,a){const l=Math.hypot(ax,ay,az)||1;ax/=l;ay/=l;az/=l;const c=Math.cos(a),s=Math.sin(a),t=1-c;
  return [t*ax*ax+c,t*ax*ay-s*az,t*ax*az+s*ay, t*ax*ay+s*az,t*ay*ay+c,t*ay*az-s*ax, t*ax*az-s*ay,t*ay*az+s*ax,t*az*az+c]}
function mul3(A,B){const C=new Array(9);for(let i=0;i<3;i++)for(let j=0;j<3;j++)C[i*3+j]=A[i*3]*B[j]+A[i*3+1]*B[3+j]+A[i*3+2]*B[6+j];return C}
function ortho3(M){const a=[M[0],M[1],M[2]],b=[M[3],M[4],M[5]];const n=v=>{const l=Math.hypot(...v);return v.map(x=>x/l)};
  const A=n(a);const d=A[0]*b[0]+A[1]*b[1]+A[2]*b[2];const B=n([b[0]-d*A[0],b[1]-d*A[1],b[2]-d*A[2]]);
  const C=[A[1]*B[2]-A[2]*B[1],A[2]*B[0]-A[0]*B[2],A[0]*B[1]-A[1]*B[0]];return [...A,...B,...C]}

const Sound = (()=>{
  let ctx=null, master=null, noiseBuf=null, muffle=null, on=true;
  try{ on = localStorage.getItem("billy-sound")!=="off" }catch(e){}
  function init(){
    if(!on) return null;
    if(!ctx){
      const AC = window.AudioContext||window.webkitAudioContext; if(!AC) return null;
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = .8;
      const comp = ctx.createDynamicsCompressor();
      master.connect(comp); comp.connect(ctx.destination);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate*2, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
      muffle = ctx.createBiquadFilter(); muffle.type="lowpass"; muffle.frequency.value=2600; muffle.connect(master);
    }
    if(ctx.state==="suspended") ctx.resume();
    return ctx;
  }
  const now = () => ctx.currentTime;
  function env(g,t,a,att,dec){ g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(Math.max(a,.0002),t+att); g.gain.exponentialRampToValueAtTime(.0001,t+att+dec) }
  function osc(t,type,f,a,att,dec,dest,f2){
    const o=ctx.createOscillator(), g=ctx.createGain(); o.type=type; o.frequency.setValueAtTime(f,t);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+att+dec);
    env(g,t,a,att,dec); o.connect(g); g.connect(dest||master); o.start(t); o.stop(t+att+dec+.05);
  }
  function noise(t,dur,filters,dest){
    const s=ctx.createBufferSource(); s.buffer=noiseBuf; const g=ctx.createGain(); let node=s;
    filters.forEach(fp=>{ const f=ctx.createBiquadFilter(); f.type=fp.type; f.frequency.setValueAtTime(fp.f,t);
      if(fp.f2) f.frequency.exponentialRampToValueAtTime(fp.f2,t+dur); if(fp.Q) f.Q.value=fp.Q; node.connect(f); node=f });
    node.connect(g); g.connect(dest||master);
    s.start(t, Math.random()*Math.max(0,1.9-dur), dur+.05);
    return g;
  }
  // verre contre verre : partiels aigus inharmoniques + petit clic
  function clack(t,a=1,p=1,dest){
    [[2150,.07,.32],[3420,.05,.2],[5310,.035,.1]].forEach(([f,d,m])=>osc(t,"sine",f*p*(1+(Math.random()-.5)*.05),a*m,.001,d*(.8+Math.random()*.4),dest));
    env(noise(t,.02,[{type:"bandpass",f:4200*p,Q:1.2}],dest),t,a*.35,.001,.015);
  }
  function thud(t,a=1,f=180){ osc(t,"sine",f*1.6,a*.5,.002,.09,null,f); env(noise(t,.05,[{type:"lowpass",f:700}]),t,a*.5,.002,.04) }
  // froissement du tissu : bruit filtré avec des crépitements aléatoires
  function rustle(t,dur,a){
    const g=noise(t,dur,[{type:"highpass",f:1200},{type:"bandpass",f:3200,Q:.7}]);
    g.gain.setValueAtTime(0,t);
    for(let x=0;x<dur;x+=.011) g.gain.setValueAtTime(a*Math.pow(Math.random(),2.5),t+x);
    g.gain.setValueAtTime(0,t+dur);
  }
  function chime(t,f,a,dur=1.4){ osc(t,"sine",f,a,.004,dur); osc(t,"sine",f*2.005,a*.25,.004,dur*.6); osc(t,"triangle",f*3.01,a*.06,.004,dur*.3) }
  const SCALE=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.5,1568,1760];
  const api = {
    get on(){ return on },
    toggle(){ on=!on; try{localStorage.setItem("billy-sound",on?"on":"off")}catch(e){}
      if(on){ init(); api.pop() } else { api.rollStop(); if(ctx) ctx.suspend() } return on },
    shake(k=1){ if(!init()) return; const t=now();
      rustle(t,.16+.08*k,.22*k);
      const n=2+Math.round(Math.random()*3*k);
      for(let i=0;i<n;i++) clack(t+Math.random()*.13,(.35+Math.random()*.4)*k,.9+Math.random()*.6,muffle); },
    whoosh(){ if(!init()) return; const t=now();
      env(noise(t,.4,[{type:"bandpass",f:300,f2:3500,Q:1.2}]),t,.5,.12,.28);
      osc(t+.3,"sine",220,.35,.002,.12,null,70); },
    // une bille qui tombe du sac : rebonds de plus en plus rapprochés, puis elle roule
    drop(delay=0,p=1){ if(!init()) return; let t=now()+delay, dt=.2, a=.9;
      for(let k=0;k<6;k++){ thud(t,a*.6,160); clack(t,a,p); t+=dt; dt*=.6; a*=.52 }
      const g=noise(t,.7,[{type:"lowpass",f:500}]); g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(.12,t+.05); g.gain.linearRampToValueAtTime(.0001,t+.7); },
    reveal(tier,shiny){ if(!init()) return; const t=now();
      const n=[1,1,2,3,5,6][tier];
      for(let i=0;i<n;i++) chime(t+i*.09, SCALE[Math.min(tier+i*(tier>=4?1:2),SCALE.length-1)], .18);
      if(tier>=4||shiny) for(let i=0;i<14;i++) chime(t+.35+i*.045,1500+Math.random()*2500,.05,.5);
      if(shiny) for(let i=0;i<8;i++) chime(t+.1+i*.07,SCALE[(i*2)%SCALE.length]*2,.08,.9); },
    ding(){ if(!ctx||!on||ctx.state!=="running") return; const t=now(); chime(t,880,.12); chime(t+.12,1318.5,.1) },
    pop(){ if(!init()) return; clack(now(),.5,1.1) },
    shot(pw){ if(!init()) return; const t=now(); clack(t,.4+pw*.6,.85); thud(t,.3+pw*.4,220) },
    wall(a){ if(!init()) return; const t=now(); a=Math.min(1,a); thud(t,a,140); clack(t,a*.35,.7) },
    bumper(){ if(!init()) return; const t=now(); osc(t,"triangle",260,.35,.003,.22,null,620); osc(t,"sine",130,.3,.003,.15,null,90) },
    // bille recyclée : verre qui se brise, puis pièces
    recycle(){ if(!init()) return; const t=now();
      for(let i=0;i<7;i++) clack(t+i*.028,.6-i*.07,1.35-i*.09);
      env(noise(t,.16,[{type:"highpass",f:2500}]),t,.3,.005,.13);
      api._coin(t+.28); },
    coin(){ if(!init()) return; api._coin(now()) },
    _coin(t){ osc(t,"triangle",1318.5,.15,.003,.12); osc(t+.08,"triangle",1760,.15,.003,.35) },
    hole(){ if(!init()) return; const t=now(); osc(t,"sine",620,.4,.003,.16,null,160); thud(t+.14,.5,90);
      [.14,.22,.27,.3].forEach((d,i)=>clack(t+d,.5-i*.1,.6)); },
    // roulement continu pendant Le Tir
    _roll:null,
    rollStart(){ if(!init()||api._roll) return;
      const s=ctx.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
      const f=ctx.createBiquadFilter(); f.type="lowpass"; f.frequency.value=600;
      const g=ctx.createGain(); g.gain.value=0; s.connect(f); f.connect(g); g.connect(master); s.start();
      api._roll={s,f,g}; },
    roll(v,sand){ const r=api._roll; if(!r) return; const t=now();
      r.g.gain.setTargetAtTime(on?Math.min(v/24,1)*(sand?.06:.14):0,t,.05);
      r.f.frequency.setTargetAtTime(sand?1800:350+v*25,t,.05); },
    rollStop(){ const r=api._roll; if(!r) return; try{ r.s.stop() }catch(e){} r.s.disconnect(); api._roll=null },
  };
  return api;
})();

let idc = 0;
function makeSpec(type, o={}){
  const seed = o.seed ?? randU32();
  const r = rng(seed);
  return {id: seed.toString(36)+(Date.now()+(idc++)).toString(36).slice(-5), seed, type,
    family: o.family ?? Math.floor(r()*FAMILIES.length),
    pal: o.pal ?? Math.floor(r()*PALETTES.length),
    shiny: o.shiny ?? 0, at: o.at ?? Date.now()};
}
const specName = s => `${FAMILIES[s.family].name} ${PALETTES[s.pal][0]}`;
const serial = s => { const h=(s.seed>>>0).toString(16).toUpperCase().padStart(8,"0"); return h.slice(0,4)+"-"+h.slice(4) };
const slotKey = s => s.type+"|"+s.family;

const paramCache = new Map();
function specParams(s){
  const key = `${s.seed}|${s.type}|${s.family}|${s.pal}|${s.shiny}`;
  if(paramCache.has(key)) return paramCache.get(key);
  const r = rng((s.seed ^ 0x9E3779B9)>>>0);
  const P = PALETTES[s.pal];
  let tint = hex01(P[4]);
  const opaque = s.type==="chinoise" || s.family===3 || s.family===7;
  if(s.type==="sulfure") tint = tint.map(v=>v*.35+.65);
  if(s.family===2) tint = hex01(shade(P[1],-.1)).map(v=>Math.max(.08,v*.8));
  const p = {
    seed:[r(),r(),r(),r()],
    par:[(r()-.5)*5, [3,4,4,5,6][Math.floor(r()*5)], .05+r()*.07, 2+Math.floor(r()*4)],
    srot: rotAxis(r()-.5,r()-.5,r()-.5,r()*TAU),
    c1:hex01(P[1]), c2:hex01(P[2]), c3:hex01(P[3]), tint,
    mode:s.family, opaque:opaque?1:0, porc:s.type==="chinoise"?1:0, sulf:s.type==="sulfure"?1:0, fig:s.family%4, shiny:s.shiny||0,
  };
  paramCache.set(key,p); return p;
}

const FS = `
precision highp float;
uniform vec2 uRes; uniform vec4 uSeed; uniform vec4 uPar;

float h31(vec3 p){ p=fract(p*0.3183099+0.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float noise(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f);
  return mix(mix(mix(h31(i),h31(i+vec3(1,0,0)),f.x),mix(h31(i+vec3(0,1,0)),h31(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(h31(i+vec3(0,0,1)),h31(i+vec3(1,0,1)),f.x),mix(h31(i+vec3(0,1,1)),h31(i+vec3(1,1,1)),f.x),f.y),f.z); }
float fbm(vec3 p){ float a=0.5, s=0.0; for(int i=0;i<4;i++){ s+=a*noise(p); p=p*2.03+vec3(1.7,9.2,3.1); a*=0.5; } return s; }
vec3 pal3(float k){ k=mod(k,3.0); return k<1.0?uC1:(k<2.0?uC2:uC3); }

float sdStar(vec2 p){ const vec2 k1=vec2(0.809016994,-0.587785252); const vec2 k2=vec2(-0.809016994,-0.587785252);
  float r=0.85, rf=0.45; p.x=abs(p.x); p-=2.0*max(dot(k1,p),0.0)*k1; p-=2.0*max(dot(k2,p),0.0)*k2; p.x=abs(p.x); p.y-=r;
  vec2 ba=rf*vec2(-k1.y,k1.x)-vec2(0,1); float h=clamp(dot(p,ba)/dot(ba,ba),0.0,r); return length(p-ba*h)*sign(p.y*ba.x-p.x*ba.y); }
float sdHeart(vec2 p){ p.x=abs(p.x); p.y+=0.55;
  if(p.y+p.x>1.0) return sqrt(dot(p-vec2(0.25,0.75),p-vec2(0.25,0.75)))-0.35355;
  vec2 a=p-vec2(0.0,1.0); vec2 b=p-0.5*max(p.x+p.y,0.0); return sqrt(min(dot(a,a),dot(b,b)))*sign(p.x-p.y); }
float fig(vec2 p){ int f=int(uFig+0.5);
  if(f==0) return sdStar(p);
  if(f==1) return sdHeart(p*1.1)/1.1;
  if(f==2) return max(length(p)-0.75, -(length(p-vec2(0.34,0.2))-0.62));
  float d=min(min(length(p-vec2(0.0,0.4)),length(p-vec2(0.0,-0.4))),min(length(p-vec2(0.4,0.0)),length(p-vec2(-0.4,0.0))))-0.3;
  return min(d,length(p)-0.25); }

vec4 fam(vec3 q, out vec3 e){
  e=vec3(0.0);
  float r=length(q); vec3 so=uSeed.xyz*40.0;
  float tw=uPar.x, k=uPar.y, w=uPar.z, nb=uPar.w;
  int m=int(uMode+0.5);
  if(m==0){ // oeil-de-chat
    float ang=atan(q.z,q.x)+q.y*tw;
    float d=abs(sin(ang*k*0.5))*length(q.xz);
    float dens=smoothstep(w,w*0.25,d)*smoothstep(0.93,0.78,r);
    return vec4(pal3(floor(ang/6.2831853*k+0.5)), dens*45.0);
  }
  if(m==1){ // tourbillon
    vec3 wq=q+0.45*vec3(fbm(q*1.7+so),fbm(q*1.7+so+5.2),fbm(q*1.7+so+9.7))-0.22;
    float ang=atan(wq.z,wq.x)+wq.y*tw*1.3;
    float b=sin(ang*nb);
    float dens=smoothstep(1.0-w*3.2,1.0,abs(b))*smoothstep(0.93,0.62,r)*smoothstep(0.12,0.3,r);
    return vec4(pal3(floor(ang*nb/3.14159)), dens*32.0);
  }
  if(m==2){ // galaxie
    float n=fbm(q*2.2+so), n2=fbm(q*4.0-so);
    vec3 c=mix(uC1,uC2,smoothstep(0.35,0.7,n)); c=mix(c,uC3,smoothstep(0.55,0.8,n2));
    e=c*(pow(smoothstep(0.25,0.8,n),1.6)*4.5+0.25)*smoothstep(0.97,0.4,r);
    vec3 g=q*16.0+so; vec3 fc=fract(g)-0.5;
    e+=vec3(step(0.955,h31(floor(g)))*smoothstep(0.2,0.0,length(fc)))*9.0;
    return vec4(uC1*0.25, 1.6);
  }
  if(m==3){ // agate
    float f=fbm(q*1.3+so)*3.5+q.y*1.2; float t=fract(f*1.5);
    vec3 c=mix(uC1,uC2,smoothstep(0.2,0.5,t)); c=mix(c,uC3,smoothstep(0.72,0.85,t)*0.9);
    c=mix(c,vec3(1.0),smoothstep(0.93,0.99,t)*0.55);
    return vec4(c, 200.0);
  }
  if(m==4){ // opaline
    float n=fbm(q*2.0+so);
    vec3 c=mix(uC3,uC1,smoothstep(0.3,0.7,n));
    c=mix(c,uC2,smoothstep(0.55,0.75,fbm(q*3.0+so+3.0)));
    e=c*0.35;
    return vec4(c, 3.5);
  }
  if(m==5){ // pailletee
    vec3 g=q*22.0+so; vec3 fc=fract(g)-0.5;
    float fl=step(0.86,h31(floor(g)))*smoothstep(0.22,0.05,length(fc));
    float sw=smoothstep(0.55,0.7,fbm(q*2.0+so));
    e=uC3*fl*6.0*smoothstep(0.95,0.7,r);
    return vec4(mix(uC1,uC2,sw), 0.8+fl*40.0+sw*1.5);
  }
  if(m==6){ // oignon
    float st=sin(atan(q.z,q.x)*nb*2.0+fbm(q*3.0+so)*5.0+q.y*tw);
    vec3 c=st>0.3?uC2:(st<-0.4?uC3:uC1);
    float shell=smoothstep(0.6,0.76,r)*smoothstep(0.95,0.88,r);
    return vec4(c, shell*60.0+0.3);
  }
  // berlingot
  float ang=atan(q.z,q.x)+q.y*tw;
  float s=fract(ang/6.2831853*nb);
  vec3 cream=vec3(0.98,0.96,0.93);
  vec3 c=s<0.33?uC1:(s<0.5?cream:(s<0.83?uC2:cream));
  return vec4(c, 200.0);
}

vec4 pattern(vec3 q, vec3 qs, out vec3 e){
  vec4 c;
  if(uSulf>0.5){
    float d=fig(q.xy*1.8)/1.8;
    if(max(d,abs(q.z)-0.06)<0.0){ e=vec3(0.0); return vec4(0.93,0.93,0.96,400.0); }
    c=fam(qs,e); c.a*=0.05; e*=0.2;
  } else c=fam(qs,e);
  if(uShiny>1.5 && uShiny<2.5){
    vec3 g=qs*26.0+uSeed.yzx*50.0; vec3 fc=fract(g)-0.5;
    float fl=step(0.8,h31(floor(g)))*smoothstep(0.25,0.05,length(fc))*smoothstep(0.97,0.8,length(q));
    e+=vec3(1.0,0.78,0.3)*fl*8.0; c.a+=fl*30.0; c.rgb=mix(c.rgb,vec3(1.0,0.8,0.35),fl);
  }
  if(uShiny>2.5){ e+=c.rgb*min(c.a,25.0)*0.09+uC2*0.25; }
  return c;
}

vec3 env(vec3 r){
  vec3 sky=mix(vec3(0.96,0.93,0.87),vec3(1.0,0.99,0.96),clamp(r.y,0.0,1.0));
  vec3 flo=mix(vec3(0.6,0.48,0.36),vec3(0.86,0.78,0.66),clamp(r.y+1.0,0.0,1.0));
  vec3 c=mix(flo,sky,smoothstep(-0.08,0.08,r.y));
  vec2 w=vec2(r.x+0.42,r.y-0.5);
  c+=smoothstep(0.3,0.2,abs(w.x))*smoothstep(0.24,0.14,abs(w.y))*step(0.0,r.z)*1.4;
  return c;
}

void main(){
  vec2 uv=((gl_FragCoord.xy/uRes)*2.0-1.0)/uR;
  float rad=length(uv);
  float px=2.0/(uRes.x*uR);
  float edge=1.0-smoothstep(1.0-px*1.5,1.0+px*0.5,rad);
  if(rad>1.0) uv=uv/rad*0.999;
  vec3 n=vec3(uv,sqrt(max(0.0,1.0-dot(uv,uv))));
  vec3 d0=vec3(0.0,0.0,-1.0);
  vec3 L=normalize(vec3(-0.55,0.65,0.6));
  vec3 rv=reflect(d0,n);
  float F=0.04+0.96*pow(1.0-n.z,5.0);
  vec3 refl=env(rv);
  float sp=max(dot(rv,L),0.0);
  float spec=pow(sp,180.0)*2.5+pow(sp,16.0)*0.12;
  vec3 col;
  if(uOpaque>0.5){
    vec3 q=uRot*n; vec3 e;
    vec3 qs=uSRot*q;
    vec4 pc=pattern(q, uPorc>0.5 ? qs*0.8 : qs, e);
    vec3 base=pc.rgb;
    if(uPorc>0.5){
      vec3 porc=vec3(0.97,0.95,0.91);
      base=mix(porc,pc.rgb,clamp(pc.a/15.0,0.0,1.0));
      base=mix(base,clamp(e,0.0,1.0),clamp(length(e)*0.6,0.0,1.0));
    }
    float dif=max(dot(n,L),0.0);
    col=base*(0.36+0.74*dif)+e*0.4;
    col=mix(col,refl,F*0.85+0.05);
    col+=spec*0.85;
  } else {
    vec3 d=refract(d0,n,1.0/1.5);
    float tEx=-2.0*dot(n,d);
    float dt=tEx/30.0;
    vec3 acc=vec3(0.0); float T=1.0;
    for(int i=0;i<30;i++){
      vec3 p=n+d*(float(i)+0.5)*dt;
      vec3 q=uRot*p; vec3 e;
      vec4 pc=pattern(q, uSRot*q, e);
      float a=1.0-exp(-pc.a*dt);
      float lit=0.55+0.45*clamp(dot(normalize(p+vec3(0.0001)),L)*0.5+0.5,0.0,1.0);
      acc+=T*(a*pc.rgb*lit+e*dt);
      T*=1.0-a;
      if(T<0.01) break;
    }
    vec3 pe=n+d*tEx;
    vec3 d2=refract(d,-pe,1.5);
    if(dot(d2,d2)<0.01) d2=reflect(d,-pe);
    vec3 bg=env(d2)*pow(max(uTint,vec3(0.02)),vec3(tEx*1.2));
    bg+=uTint*smoothstep(0.55,0.0,length(uv-vec2(0.36,-0.42)))*0.35;
    col=acc+T*bg;
    col=mix(col,refl,F);
    col+=spec;
  }
  if(uShiny>0.5 && uShiny<1.5){
    vec3 iri=0.5+0.5*cos(6.2831*(vec3(0.0,0.33,0.67)+(1.0-n.z)*1.3+uSeed.w+uv.x*0.4));
    col=mix(col,col*0.55+iri*0.65,0.3+0.5*(1.0-n.z));
    col+=iri*F*1.4;
  }
  col*=mix(0.8,1.0,smoothstep(0.0,0.35,n.z));
  col=clamp(col,0.0,1.0);
  vec4 outc=vec4(col*edge,edge);
  if(uShiny>2.5 && rad>0.98){
    float g=exp(-(rad-1.0)*9.0)*0.75*(1.0-edge);
    outc+=vec4(uC2*g,g);
  }
  gl_FragColor=outc;
}`;

class MarbleGL{
  constructor(cv){
    this.cv=cv;
    const gl=cv.getContext("webgl",{preserveDrawingBuffer:true,premultipliedAlpha:true,alpha:true,antialias:false});
    if(!gl) throw new Error("webgl indisponible");
    this.gl=gl;
    const sh=(t,src)=>{const o=gl.createShader(t);gl.shaderSource(o,src);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o};
    const pr=gl.createProgram();
    gl.attachShader(pr,sh(gl.VERTEX_SHADER,"attribute vec2 p;void main(){gl_Position=vec4(p,0.0,1.0);}"));
    gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));
    gl.linkProgram(pr);
    if(!gl.getProgramParameter(pr,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
    gl.useProgram(pr);
    const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
    const loc=gl.getAttribLocation(pr,"p"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
    this.u={};
    ["uRes","uSeed","uPar","uMode","uOpaque","uPorc","uShiny","uSulf","uFig","uR","uC1","uC2","uC3","uTint","uRot","uSRot"].forEach(n=>this.u[n]=gl.getUniformLocation(pr,n));
  }
  draw(s,size,rot=I3){
    const gl=this.gl,u=this.u,P=specParams(s);
    if(this.cv.width!==size){this.cv.width=this.cv.height=size}
    gl.viewport(0,0,size,size); gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform2f(u.uRes,size,size); gl.uniform4fv(u.uSeed,P.seed); gl.uniform4fv(u.uPar,P.par);
    gl.uniform1f(u.uMode,P.mode); gl.uniform1f(u.uOpaque,P.opaque); gl.uniform1f(u.uPorc,P.porc);
    gl.uniform1f(u.uShiny,P.shiny); gl.uniform1f(u.uSulf,P.sulf); gl.uniform1f(u.uFig,P.fig); gl.uniform1f(u.uR,.9);
    gl.uniform3fv(u.uC1,P.c1); gl.uniform3fv(u.uC2,P.c2); gl.uniform3fv(u.uC3,P.c3); gl.uniform3fv(u.uTint,P.tint);
    gl.uniformMatrix3fv(u.uRot,false,rot); gl.uniformMatrix3fv(u.uSRot,false,P.srot);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }
}
function makeGL(cv){ try{ return new MarbleGL(cv) }catch(e){ console.warn("Rendu WebGL indisponible :",e.message); return null } }
const mainGL = makeGL(document.createElement("canvas"));

// Rendu de secours sans WebGL
function draw2D(s,size){
  const c=document.createElement("canvas"); c.width=c.height=size; const x=c.getContext("2d");
  const P=PALETTES[s.pal], R=size/2*.9, m=size/2;
  const g=x.createRadialGradient(m*.8,m*.7,R*.1,m,m,R); g.addColorStop(0,P[3]); g.addColorStop(.5,P[2]); g.addColorStop(1,P[1]);
  x.fillStyle=g; x.beginPath(); x.arc(m,m,R,0,TAU); x.fill();
  x.fillStyle="rgba(255,255,255,.75)"; x.beginPath(); x.ellipse(m*.75,m*.62,R*.22,R*.13,-.6,0,TAU); x.fill();
  return c;
}
const urlCache = new Map();
function marbleURL(s,size=160){
  const k=`${s.seed}|${s.type}|${s.family}|${s.pal}|${s.shiny}@${size}`;
  if(urlCache.has(k)) return urlCache.get(k);
  let u;
  if(mainGL){ mainGL.draw(s,size); u=mainGL.cv.toDataURL("image/png") } else u=draw2D(s,size).toDataURL("image/png");
  urlCache.set(k,u); return u;
}
function mImg(s,size=160,px,alt){

  return `<img src="${marbleURL(s,size)}" alt="${alt===undefined?esc(specName(s)):alt}" width="${Math.round(w)}" height="${Math.round(w)}" style="width:${Math.round(w)}px;height:${Math.round(w)}px">`;
}

/* ---------- quêtes du jour ---------- */
function dayKey(d=new Date()){ return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}` }
function ensureQuests(){
  const k = dayKey();
  if(S.quests && S.quests.day===k) return;
  const r = rng(hash("quetes"+k)), pool = Object.keys(QUESTS), items = [];
  while(items.length<3){ const id = pool.splice(Math.floor(r()*pool.length),1)[0]; items.push({id, p:0, claimed:false}) }
  S.quests = {day:k, items, bonus:false};
  save();
}
function untilMidnight(){
  const n = new Date(), m = new Date(n.getFullYear(), n.getMonth(), n.getDate()+1);
  const mins = Math.ceil((m-n)/60000), h = Math.floor(mins/60);
  return h ? `${h} h ${String(mins%60).padStart(2,"0")}` : `${mins} min`;
}
const questDone = q => q.p>=QUESTS[q.id].goal;
function questsClaimable(){
  ensureQuests();
  const Q = S.quests;
  return Q.items.filter(q=>questDone(q)&&!q.claimed).length + (!Q.bonus && Q.items.every(q=>q.claimed) ? 1 : 0);
}
function questEvent(type, n=1){
  ensureQuests();
  S.quests.items.forEach(q=>{
    if(q.id!==type || questDone(q)) return;
    q.p = Math.min(QUESTS[type].goal, q.p+n);
    if(questDone(q)) setTimeout(()=>{ toast(`Quête terminée : ${QUESTS[type].title}. Récupère ta récompense !`); Sound.ding() }, 1500);
  });
  save(); renderNav();
}

/* ---------- recyclage ---------- */
// Doubles recyclables : on garde la meilleure bille de chaque emplacement, les shiny et la bille active
function recyclableDups(){
  const out = [];
  slotsOwned().forEach(list=>{ [...list].sort(tierSort).slice(1).forEach(s=>{ if(!s.shiny && s.id!==S.active) out.push(s) }) });
  return out;
}
function recycleSpecs(ids){
  const set = new Set(ids);
  const gone = S.specs.filter(s=>set.has(s.id) && s.id!==S.active);
  if(!gone.length) return 0;
  const total = gone.reduce((a,s)=>a+recycleValue(s),0);
  S.specs = S.specs.filter(s=>!gone.includes(s));
  S.unseen = S.unseen.filter(id=>!set.has(id));
  S.jetons += total;
  save(); renderTop();
  questEvent("recycle", gone.length);
  Sound.recycle();
  return total;
}
let armed = null;   // confirmation en deux clics
function arm(key, btn, label){
  if(armed && armed.key===key){ clearTimeout(armed.t); armed=null; return true }
  if(armed){ clearTimeout(armed.t); armed.restore() }
  const old = btn.innerHTML;
  btn.innerHTML = label;
  armed = {key, restore:()=>{ if(document.body.contains(btn)) btn.innerHTML=old }, t:setTimeout(()=>{ armed&&armed.restore(); armed=null },3500)};
  return false;
}

function questRows(compact){

    const Q = QUESTS[q.id], done = questDone(q);
    const btn = q.claimed ? `<span class="q-state">${ic("check",16,2.5)} Récupérée</span>`
      : done ? `<button class="btn btn-yellow q-claim" data-action="q-claim" data-i="${i}">+${Q.reward} ${COIN}</button>`
      : `<span class="q-reward">${COIN}${Q.reward}</span>`;

      <span class="q-ic">${ic(Q.icon,compact?20:24)}</span>

}

function viewCollection(){
  const slots = slotsOwned();
  const shinyCount = S.specs.filter(s=>s.shiny).length;
  const types = TK.filter(t=>ui.type==="all"||ui.type===t);
  const chips = `<div class="filters">
    <button class="chip" data-action="ftype" data-type="all" aria-pressed="${ui.type==="all"}">Tous les formats</button>
    ${TK.map(t=>`<button class="chip" style="${tstyle(t)}" data-action="ftype" data-type="${t}" aria-pressed="${ui.type===t}"><i></i>${TYPES[t].label}</button>`).join("")}
    <span class="grow"></span>
    ${ui.tab==="album"?`<label class="check"><input type="checkbox" id="f-hide" ${ui.hideMissing?"checked":""}> Masquer les manquantes</label>`:""}
  </div>`;

  let body;
  if(ui.tab==="album"){
    body = types.map(t=>{
      const have = FAMILIES.filter((_,f)=>slots.has(t+"|"+f)).length;
      const cards = FAMILIES.map((F,f)=>{
        const list = slots.get(t+"|"+f);
        if(!list){ if(ui.hideMissing) return ""; return `<button class="m-card missing" data-action="missing" data-type="${t}" data-fam="${f}" aria-label="${TYPES[t].label} ${F.name} : pas encore trouvée"><span class="ball">${mImg(ghost(t,f),160,Math.round(84*scaleOf(t)+6),"")}</span><b>${F.name}</b><small>À trouver</small></button>` }
        const best = [...list].sort(tierSort)[0];
        const isNew = list.some(s=>S.unseen.includes(s.id));
        const variants = new Set(list.map(s=>s.pal)).size;
        return `<button class="m-card${best.shiny?" is-shiny":""}" data-action="spec" data-id="${best.id}">
          ${best.shiny?`<span class="shiny-mark">${shinyPill(best)}</span>`:""}
          ${isNew?`<span class="new">Nouveau</span>`:list.length>1?`<span class="count">×${list.length}</span>`:""}
          <span class="ball">${mImg(best,160,Math.round(84*scaleOf(t)+6))}</span><b>${F.name}</b><small>${variants} coloris sur ${PALETTES.length}</small></button>`;
      }).join("");
      return `<section class="type-block">
        <div class="type-head">${typePill(t,true)}<h2>${TYPES[t].label}</h2><span class="mm">${TYPES[t].mm} mm</span>
          <span class="prog">${have} / ${FAMILIES.length}<span class="bar"><i class="${have===FAMILIES.length?"done":""}" style="width:${have/FAMILIES.length*100}%"></i></span></span>
          <p class="desc">${TYPES[t].desc}</p></div>
        ${cards.trim()?`<div class="card-grid">${cards}</div>`:`<p class="empty">Aucune ${TYPES[t].label.toLowerCase()} pour l'instant.</p>`}
      </section>`;

let ovState = null;
function rollType(odds,min){
  const keys = TK.filter(k=>!min||TIDX[k]>=TIDX[min]);
  const tot = keys.reduce((a,k)=>a+odds[k],0);
  let x = Math.random()*tot;
  for(const k of keys){ x-=odds[k]; if(x<=0) return k }
  return keys[keys.length-1];
}
function pullBag(bag){
  const res = [];
  for(let i=0;i<bag.n;i++){
    let t = rollType(bag.odds);
    if(bag.guarantee && i===bag.n-1 && !res.some(s=>TIDX[s.type]>=TIDX[bag.guarantee])) t = rollType(bag.odds,bag.guarantee);
    const shiny = Math.random()<bag.shiny ? 1+Math.floor(Math.random()*3) : 0;
    res.push(makeSpec(t,{shiny}));
  }
  return res.sort((a,b)=>TIDX[a.type]-TIDX[b.type] || (a.shiny?1:0)-(b.shiny?1:0));
}
function openBag(bagId){
  const bag = BAG_BY[bagId];
  if(bag.price===0){
    if(!freeReady()){ toast(`Ton prochain sac gratuit arrive dans ${freeLeft()}.`); return }
    S.freeAt = Date.now()+FREE_EVERY;
  } else {
    if(S.jetons < bag.price){ toast(`Il te manque ${fmt(bag.price-S.jetons)} ${CUR.many} pour ce sac.`); return }
    S.jetons -= bag.price;
  }
  const pulls = pullBag(bag);
  const before = slotsOwned();
  let leveled = false;
  const results = pulls.map(s=>{
    const k = slotKey(s);
    const isNew = !before.has(k);
    const newColor = !isNew && !before.get(k).some(x=>x.pal===s.pal);
    if(!before.has(k)) before.set(k,[]); before.get(k).push(s);
    S.specs.push(s); S.unseen.push(s.id);
    S.xp += TYPES[s.type].xp * (s.shiny?3:1);
    while(S.xp >= XP_NEED){ S.xp -= XP_NEED; S.level++; leveled = true }
    return {s, isNew, newColor};
  });
  save(); renderTop(); renderNav();
  questEvent("open_bag");
  if(bag.price===0) questEvent("open_free");
  const nChin = results.filter(r=>TIDX[r.s.type]>=TIDX.chinoise).length;
  if(nChin) questEvent("find_chinoise", nChin);
  if(results.some(r=>TIDX[r.s.type]>=TIDX.calot)) questEvent("find_calot");
  if(results.some(r=>r.isNew)) questEvent("new_slot");
  ovState = {bag, results, opened:new Set(), leveled};
  showBagStage();
}
function showBagStage(){
  const {bag} = ovState;
  const ov = document.getElementById("ov");
  ov.style.removeProperty("--flash");
  document.getElementById("ov-body").innerHTML = `
    <div class="ov-title">${bag.name}</div>
    <button class="bag-stage" id="bag-stage" aria-label="Ouvrir le sac">${bagSVG(bag.color)}</button>
    <p class="ov-hint">Secoue le sac pour l'entendre, touche-le pour l'ouvrir</p>
    <div class="bag-tools">
      <button class="btn btn-ghost" data-action="shake-bag">Secouer</button>
      <button class="btn btn-yellow" data-action="tear">Ouvrir le sac</button>
    </div>`;
  ov.hidden = false;
  document.body.style.overflow = "hidden";
  bindBag();
  document.getElementById("bag-stage").focus();
}
// le sac se prend en main : on le secoue en le faisant glisser, un simple appui l'ouvre
function bindBag(){
  const st = document.getElementById("bag-stage"), svg = st.querySelector("svg");
  let drag = null, lastShake = 0, lastVX = 0;
  st.addEventListener("animationend", ()=>st.classList.remove("jiggle"));
  st.addEventListener("pointerdown", e=>{
    if(st.dataset.busy) return;
    drag = {x:e.clientX, y:e.clientY, px:e.clientX, py:e.clientY, t:performance.now(), moved:0};
    st.setPointerCapture(e.pointerId); st.classList.add("dragging"); svg.style.transition = "none";
  });
  st.addEventListener("pointermove", e=>{
    if(!drag) return;
    const n = performance.now(), dt = Math.max(1,n-drag.t);
    const dx = e.clientX-drag.x, dy = e.clientY-drag.y;
    drag.moved = Math.max(drag.moved, Math.hypot(dx,dy));
    const cx = Math.max(-70,Math.min(70,dx*.6)), cy = Math.max(-50,Math.min(50,dy*.6));
    svg.style.transform = `translate(${cx}px,${cy}px) rotate(${cx*.25}deg)`;
    const vx = (e.clientX-drag.px)/dt, speed = Math.hypot(e.clientX-drag.px,e.clientY-drag.py)/dt;
    if(speed>.6 && n-lastShake>110 && (Math.sign(vx)!==Math.sign(lastVX) || speed>1.6)){ Sound.shake(Math.min(1.3,speed/1.8)); lastShake = n }
    if(vx) lastVX = vx;
    drag.px = e.clientX; drag.py = e.clientY; drag.t = n;
  });
  const end = e=>{
    if(!drag) return;
    const moved = drag.moved; drag = null;
    svg.style.transition = "transform .35s cubic-bezier(.3,1.6,.5,1)"; svg.style.transform = "";
    setTimeout(()=>{ st.classList.remove("dragging"); svg.style.transition = "" }, 360);
    if(moved<8 && e.type==="pointerup") tear();
  };
  st.addEventListener("pointerup", end);
  st.addEventListener("pointercancel", end);
  st.addEventListener("click", e=>{ if(e.detail===0) tear() });   // clavier
}
function shakeBag(){
  const st = document.getElementById("bag-stage");
  if(!st || st.dataset.busy) return;
  st.classList.remove("jiggle"); void st.offsetWidth; st.classList.add("jiggle");
  Sound.shake(1); setTimeout(()=>Sound.shake(.9),200); setTimeout(()=>Sound.shake(.7),400);
}
function tear(){
  const st = document.getElementById("bag-stage");
  if(!st || st.dataset.busy) return;
  st.dataset.busy = 1;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  st.classList.remove("dragging","jiggle");
  st.querySelector("svg").style.transform = "";
  document.querySelector(".bag-tools")?.setAttribute("hidden","");
  st.classList.add("shake");
  Sound.shake(1); setTimeout(()=>Sound.shake(1.1),280); setTimeout(()=>Sound.shake(1.2),560);
  setTimeout(()=>{
    Sound.whoosh();
    st.classList.remove("shake"); st.classList.add("burst");
    const best = ovState.results[ovState.results.length-1].s;
    document.getElementById("ov").style.setProperty("--flash", best.shiny ? "rgba(255,200,120,.6)" : rgba(TYPES[best.type].rc,.55));
  }, reduce?0:850);
  setTimeout(showReveal, reduce?50:1250);
}
function showReveal(){
  const {results} = ovState;
  document.getElementById("ov-body").innerHTML = `
    <div class="ov-title">${results.length} billes trouvées !</div>
    <p class="ov-sub">Touche chaque bille pour la découvrir.</p>
    <div class="reveal-row">
      ${results.map(({s,isNew,newColor},i)=>{
        const big = TIDX[s.type]>=3 || s.shiny;
        return `<button class="slot ${TIDX[s.type]>=2||s.shiny?"hint":""} ${big?"big":""} ${s.shiny?"shiny":""}" style="--d:${i*130}ms;${tstyle(s.type)}" data-action="reveal" data-i="${i}" aria-label="Découvrir la bille ${i+1}">
        <div class="slot-ball"><span class="rays"></span><span class="orb">?</span>${mImg(s,300,Math.round(150*scaleOf(s.type)),"")}</div>
        <div class="slot-info"><b>${esc(specName(s))}</b><span style="display:flex;gap:4px;flex-wrap:wrap;justify-content:center">${typePill(s.type,true)}${shinyPill(s)}</span>${isNew?`<span class="new">Nouvel emplacement !</span>`:newColor?`<span class="new">Nouveau coloris</span>`:`<span class="dup">Déjà dans l'album</span>`}</div>
      </button>`}).join("")}
    </div>
    <div class="ov-actions" id="ov-actions">
      <button class="btn btn-ghost" data-action="reveal-all">Tout révéler</button>
    </div>`;
  // chaque bille tombe du sac et rebondit (les gros formats sonnent plus grave)
  results.forEach(({s},i)=>Sound.drop(i*.13+.32, 1.25-scaleOf(s.type)*.5+Math.random()*.08));

function reveal(i){
  if(!ovState || ovState.opened.has(i)) return;
  ovState.opened.add(i);
  const el = document.querySelector(`.slot[data-i="${i}"]`);
  el.classList.add("is-open"); el.classList.remove("hint");

function finishReveal(){
  const {bag,leveled,results} = ovState;
  const best = results[results.length-1].s;
  const shiny = results.find(r=>r.s.shiny);
  document.querySelector(".ov-sub").textContent = shiny ? `Incroyable : une bille shiny ${SHINIES[shiny.s.shiny].name} !`
    : TIDX[best.type]>=3 ? `Quelle chance : ${best.type==="calot"?"un":"un"} ${TYPES[best.type].label} !` : "Elles sont rangées dans ta collection.";

}
function gPos(e){ const r=game.cv.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H} }
function gDown(e){ if(game.moving||game.done) return; game.aim = gPos(e); game.cv.setPointerCapture(e.pointerId) }
function gMove(e){ if(game.aim) game.aim = gPos(e) }
function gUp(){
  if(!game.aim) return;
  const b = game.ball, dx = b.x-game.aim.x, dy = b.y-game.aim.y, len = Math.hypot(dx,dy);
  const power = Math.min(len/180,1);
  game.aim = null;
  if(power<.04 || len===0) return;
  b.vx = dx/len*power*MAXV; b.vy = dy/len*power*MAXV;
  game.moving = true; game.strokes++; updHud();
  Sound.rollStart(); Sound.shot(power);
}
function inRect(x,y,[rx,ry,rw,rh]){ return x>rx && x<rx+rw && y>ry && y<ry+rh }
function physStep(){
  const b = game.ball, L = game.L;
  for(let sub=0;sub<4;sub++){
    b.x += b.vx/4; b.y += b.vy/4;
    for(const w of game.walls){
      const cx = Math.max(w[0],Math.min(b.x,w[0]+w[2])), cy = Math.max(w[1],Math.min(b.y,w[1]+w[3]));
      let dx = b.x-cx, dy = b.y-cy, d = Math.hypot(dx,dy);
      if(d<BR){
        if(d===0){ dx=0; dy=-1; d=1 }
        const nx=dx/d, ny=dy/d;
        b.x = cx+nx*BR; b.y = cy+ny*BR;
        const vn = b.vx*nx+b.vy*ny;
        if(vn<0){
          b.vx -= 1.72*vn*nx; b.vy -= 1.72*vn*ny;
          const tn = performance.now();
          if(vn<-1.2 && tn-(game.lastWall||0)>60){ Sound.wall(-vn/12); game.lastWall = tn }
        }
      }
    }
    L.bumpers.forEach(([bx,by,br],i)=>{
      const dx=b.x-bx, dy=b.y-by, d=Math.hypot(dx,dy);
      if(d<br+BR && d>0){
        const nx=dx/d, ny=dy/d;
        b.x = bx+nx*(br+BR); b.y = by+ny*(br+BR);
        const vn = b.vx*nx+b.vy*ny;
        if(vn<0){ b.vx -= 2.1*vn*nx; b.vy -= 2.1*vn*ny; game.bumpHit[i]=performance.now(); Sound.bumper() }
      }
    });
  }
  const sand = L.sand.some(r=>inRect(b.x,b.y,r));
  const f = sand ? .93 : .984;
  b.vx *= f; b.vy *= f;
  const hx = L.hole[0]-b.x, hy = L.hole[1]-b.y, hd = Math.hypot(hx,hy), sp = Math.hypot(b.vx,b.vy);
  if(hd<HOLE_R){
    if(sp<8.5){ game.moving=false; game.sink=1; b.vx=b.vy=0; Sound.hole(); return }
    b.vx += hx*.05; b.vy += hy*.05;
  } else if(hd<HOLE_R+10 && sp<3){ b.vx += hx*.012; b.vy += hy*.012 }
  // roulement de la bille (rotation 3D)
  if(sp>0.01){
    game.R = mul3(rotAxis(b.vy,b.vx,0,sp/BR), game.R);
    game.rc = (game.rc||0)+1; if(game.rc%60===0) game.R = ortho3(game.R);
  }
  if(sp<.07){ b.vx=b.vy=0; game.moving=false; if(game.strokes>=10) finishHole(false) }
}
function gLoop(t){
  if(ui.view!=="jeux" || !document.body.contains(game.cv)){ Sound.rollStop(); return }
  const steps = Math.min(4, Math.max(1, Math.round((t-game.last)/16.67)));
  game.last = t;
  for(let i=0;i<steps;i++){
    if(game.moving) physStep();
    if(game.sink>0 && !game.done){ game.sink += .06; if(game.sink>=2){ finishHole(true) } }
  }
  const gb = game.ball;
  Sound.roll(game.moving ? Math.hypot(gb.vx,gb.vy) : 0, game.L.sand.some(r=>inRect(gb.x,gb.y,r)));
  gDraw();
  game.raf = requestAnimationFrame(gLoop);
}
function finishHole(success){
  game.done = true;
  const L = game.L, el = document.getElementById("g-result");
  let html;
  if(success){
    const st = starsFor(game.strokes,L.par), rew = rewardFor(game.strokes,L.par);
    const rec = !S.best[game.lvl] || game.strokes<S.best[game.lvl];
    if(rec) S.best[game.lvl] = game.strokes;
    S.jetons += rew; S.holes++; save(); renderTop(); updHud(); renderHoles();
    questEvent("hole");
    if(game.strokes<=L.par) questEvent("par");
    if(game.strokes<=2) questEvent("twoshots");
    const msg = game.strokes===1 ? "Trou en un !" : game.strokes<L.par ? "Sous le par !" : game.strokes===L.par ? "Pile au par !" : "Dans le trou !";
    html = `<h2>${msg}</h2><div class="stars">${[1,2,3].map(k=>STAR(k<=st)).join("")}</div>
      <p>${game.strokes} coup${game.strokes>1?"s":""} pour un par de ${L.par}${rec?" · nouveau record":""}</p>
      <span class="reward">${COIN}+${rew} ${CUR.many}</span>`;
  } else {
    html = `<h2>Trop de coups</h2><p>10 coups, c'est le maximum. Retente ta chance !</p>`;
  }
  const next = game.lvl<LEVELS.length-1;
  html += `<div class="row"><button class="btn btn-ghost" data-action="g-restart">Rejouer ce trou</button>${next?`<button class="btn btn-yellow" data-action="g-level" data-l="${game.lvl+1}">Trou suivant ${ic("arrow",16)}</button>`:`<button class="btn btn-yellow" data-action="nav" data-view="sacs">Dépenser mes ${CUR.many}</button>`}</div>`;
  el.innerHTML = `<div class="g-card">${html}</div>`;
  el.hidden = false;
}
function rrect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath() }
function gDraw(){
  const cv = game.cv, c = game.ctx, L = game.L;
  const dpr = window.devicePixelRatio||1;
  const wpx = Math.round(cv.clientWidth*dpr);
  if(cv.width!==wpx){ cv.width = wpx; cv.height = Math.round(wpx*H/W) }
  const s = cv.width/W;
  c.setTransform(s,0,0,s,0,0);
  // cadre bois + feutrine
  c.fillStyle = "#8B5A2B"; c.fillRect(0,0,W,H);
  c.fillStyle = "#A06A36"; c.fillRect(4,4,W-8,6);
  c.fillStyle = game.felt; c.fillRect(20,20,W-40,H-40);
  c.strokeStyle = "rgba(0,0,0,.28)"; c.lineWidth = 6; c.strokeRect(23,23,W-46,H-46);
  // sable
  L.sand.forEach(([x,y,w,h])=>{ rrect(c,x,y,w,h,22); c.fillStyle="#E8D3A0"; c.fill(); c.strokeStyle="rgba(150,110,50,.35)"; c.lineWidth=2; c.stroke();
    c.fillStyle="rgba(150,110,50,.25)"; const r=rng(x*7+y); for(let i=0;i<w*h/140;i++){ c.fillRect(x+10+r()*(w-20), y+10+r()*(h-20), 2, 2) } });
  // murs
  L.walls.forEach(([x,y,w,h])=>{
    c.fillStyle="rgba(0,0,0,.25)"; c.fillRect(x+4,y+6,w,h);
    c.fillStyle="#A8713F"; c.fillRect(x,y,w,h);
    c.fillStyle="#C68C54"; c.fillRect(x,y,w,Math.min(5,h));
    c.strokeStyle="#6E4524"; c.lineWidth=1.5; c.strokeRect(x+.75,y+.75,w-1.5,h-1.5);
  });
  // champignons
  const now = performance.now();
  L.bumpers.forEach(([x,y,r],i)=>{
    const k = game.bumpHit[i] ? Math.max(0,1-(now-game.bumpHit[i])/250) : 0;
    const rr = r*(1+k*.12);
    c.fillStyle="rgba(0,0,0,.25)"; c.beginPath(); c.arc(x+3,y+5,rr,0,TAU); c.fill();
    const g = c.createRadialGradient(x-rr*.35,y-rr*.35,rr*.1,x,y,rr); g.addColorStop(0,"#FF8A7A"); g.addColorStop(1,"#C8282E");
    c.fillStyle=g; c.beginPath(); c.arc(x,y,rr,0,TAU); c.fill();
    c.strokeStyle="#fff"; c.lineWidth=3; c.beginPath(); c.arc(x,y,rr*.62,0,TAU); c.stroke();
    c.fillStyle="#fff"; c.beginPath(); c.arc(x,y,rr*.22,0,TAU); c.fill();
  });
  // départ
  c.fillStyle="rgba(255,255,255,.35)"; c.beginPath(); c.arc(L.start[0],L.start[1],6,0,TAU); c.fill();
  // trou + drapeau
  const [hx,hy] = L.hole;
  c.fillStyle="rgba(255,255,255,.18)"; c.beginPath(); c.arc(hx,hy,HOLE_R+3,0,TAU); c.fill();
  const hg = c.createRadialGradient(hx,hy-4,2,hx,hy,HOLE_R); hg.addColorStop(0,"#050A04"); hg.addColorStop(1,"#1C3319");
  c.fillStyle=hg; c.beginPath(); c.arc(hx,hy,HOLE_R,0,TAU); c.fill();
  c.strokeStyle="#EDEDED"; c.lineWidth=2.5; c.beginPath(); c.moveTo(hx,hy); c.lineTo(hx,hy-58); c.stroke();
  c.fillStyle="#E5484D"; c.beginPath(); c.moveTo(hx,hy-58); c.lineTo(hx+30,hy-49); c.lineTo(hx,hy-40); c.closePath(); c.fill();
  c.fillStyle="#fff"; c.font="bold 11px Nunito, sans-serif"; c.textAlign="center"; c.fillText(String(game.lvl+1),hx+11,hy-45);
  // visée
  const b = game.ball;
  if(game.aim && !game.moving){
    const dx=b.x-game.aim.x, dy=b.y-game.aim.y, len=Math.hypot(dx,dy)||1, p=Math.min(len/180,1);
    const ux=dx/len, uy=dy/len, reach=40+p*170;
    c.strokeStyle="rgba(255,255,255,.35)"; c.lineWidth=2; c.setLineDash([2,6]);
    c.beginPath(); c.moveTo(b.x,b.y); c.lineTo(game.aim.x,game.aim.y); c.stroke();
    c.setLineDash([]);
    const col = p<.5 ? "#FFE14D" : p<.85 ? "#FF9F1C" : "#FF4D4D";
    for(let i=1;i<=9;i++){ const t=i/9; c.fillStyle=col; c.globalAlpha=1-t*.6; c.beginPath(); c.arc(b.x+ux*(BR+t*reach),b.y+uy*(BR+t*reach),3.2-t*1.4,0,TAU); c.fill() }
    c.globalAlpha=1;
    c.strokeStyle=col; c.lineWidth=4; c.beginPath(); c.arc(b.x,b.y,BR+9,-Math.PI/2,-Math.PI/2+p*TAU); c.stroke();
  }
  // bille
  let scale = 1, alpha = 1;
  if(game.sink>0){ const t=Math.min(game.sink-1,1); scale = Math.max(0,1-Math.max(0,t)*1.1); alpha = scale }
  if(scale>0){
    const D = 2*BR/.9*scale;
    c.globalAlpha = alpha;
    c.fillStyle="rgba(0,0,0,.3)"; c.beginPath(); c.ellipse(b.x+3,b.y+5,BR*scale,BR*.8*scale,0,0,TAU); c.fill();
    if(ballGL && game.spec){
      const px = Math.max(24, Math.ceil(D*s));
      ballGL.draw(game.spec, px, game.R);
      c.drawImage(ballCanvas, b.x-D/2, b.y-D/2, D, D);
    } else if(game.ballImg && game.ballImg.complete){
      c.drawImage(game.ballImg, b.x-D/2, b.y-D/2, D, D);
    } else { c.fillStyle="#2E8CFF"; c.beginPath(); c.arc(b.x,b.y,BR*scale,0,TAU); c.fill() }
    c.globalAlpha = 1;
  }
}

let toastT;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2800) }

let resetArmed = false;
document.addEventListener("click", e=>{
  if(e.target.id==="modal"){ closeModal(); return }
  const t = e.target.closest("[data-action]"); if(!t) return;
  switch(t.dataset.action){
    case "nav": closeModal(); go(t.dataset.view); break;
    case "tab": ui.tab=t.dataset.tab; if(ui.view!=="collection") go("collection"); else renderView(); break;
    case "ftype": ui.type=t.dataset.type; renderView(); break;
    case "album-type": ui.tab="album"; ui.type=t.dataset.type; go("collection"); break;
    case "spec": openModal(t.dataset.id); break;
    case "missing": toast(`${TYPES[t.dataset.type].label} ${FAMILIES[+t.dataset.fam].name} : pas encore trouvée. Elle se cache peut-être dans ton prochain sac !`); break;
    case "set-active": S.active=t.dataset.id; save(); renderTop(); closeModal(); renderView(); toast(`${specName(activeSpec())} jouera au Tir.`); break;
    case "close-modal": closeModal(); break;
    case "active-step": {
      const list=[...S.specs].sort(tierSort); const i=list.findIndex(s=>s.id===S.active);
      S.active=list[(i+ +t.dataset.dir+list.length)%list.length].id; save(); renderTop(); renderView(); break;
    }
    case "open-free": openBag("gratuit"); break;
    case "buy": openBag(t.dataset.bag); break;
    case "tear": tear(); break;
    case "shake-bag": shakeBag(); break;
    case "recycle": {
      const s = specById(t.dataset.id); if(!s) break;
      if(!arm("r"+s.id, t, `Confirmer : +${fmt(recycleValue(s))} ${CUR.many}`)) break;
      const name = specName(s), got = recycleSpecs([s.id]);
      closeModal(); renderView(); toast(`${name} recyclée : +${fmt(got)} ${CUR.many}.`);
      break;
    }
    case "recycle-dups": {
      const dups = recyclableDups(); if(!dups.length) break;
      if(!arm("dups", t, `Confirmer : recycler ${dups.length} billes`)) break;
      const got = recycleSpecs(dups.map(s=>s.id));
      renderView(); toast(`${dups.length} doubles recyclés : +${fmt(got)} ${CUR.many}.`);
      break;
    }
    case "q-claim": {
      ensureQuests(); const q = S.quests.items[+t.dataset.i];
      if(!q || q.claimed || !questDone(q)) break;
      q.claimed = true; S.jetons += QUESTS[q.id].reward; save();
      Sound.coin(); renderTop(); renderNav(); renderView();
      toast(`+${QUESTS[q.id].reward} ${CUR.many} !`);
      break;
    }
    case "q-bonus": {
      ensureQuests(); const Q = S.quests;
      if(Q.bonus || !Q.items.every(q=>q.claimed)) break;
      Q.bonus = true; S.jetons += QUEST_BONUS; save();
      Sound.coin(); Sound.ding(); renderTop(); renderNav(); renderView();
      toast(`Bonus du jour : +${QUEST_BONUS} ${CUR.many} !`);
      break;
    }
    case "sound": Sound.toggle(); renderSoundBtn(); toast(Sound.on?"Son activé.":"Son coupé."); break;
    case "reveal": reveal(+t.dataset.i); break;
    case "reveal-all": ovState.results.forEach((_,i)=>setTimeout(()=>reveal(i),i*160)); break;
    case "buy-again": openBag(ovState.bag.id); break;
    case "to-bags": closeOv(); go("sacs"); break;
    case "to-collection": closeOv(); ui.tab="billes"; ui.type="all"; go("collection"); break;
    case "close-ov": closeOv(); break;
    case "bell": toast(freeReady() ? "Ton sac gratuit est prêt !" : `Prochain sac gratuit dans ${freeLeft()}.`); break;
    case "g-restart": loadLevel(game.lvl); break;
    case "g-level": loadLevel(+t.dataset.l); break;
    case "add-jetons": S.jetons+=1000; save(); renderTop(); toast(`+1 000 ${CUR.many} ajoutés (démo).`); break;
    case "refill-free": S.freeAt=Date.now(); save(); renderTop(); renderNav(); toast("Le sac gratuit est prêt."); break;
    case "reset":
      if(!resetArmed){ resetArmed=true; t.textContent="Clique encore pour confirmer"; setTimeout(()=>{resetArmed=false; const b=document.getElementById("reset-btn"); if(b) b.textContent="Réinitialiser la démo"},3000); break }
      resetArmed=false; S=starterState(); save(); renderTop(); renderNav(); renderView(); toast("La démo est revenue à zéro."); break;
  }
});
