<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Courses inédites</title>
<!-- Maquette (4 novembre 2026) : deux formes de Grande Course qui n'existent pas encore dans le jeu.
     La physique est celle du jeu (recopiée par fabriquer-courses-inedites.mjs) ; seul le dessin est simplifié (billes de couleur). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#120E1E;--panel:rgba(18,14,30,.82);--ink:#fff;--muted:#B9B3CC;--line:rgba(255,255,255,.14);--yellow:#FFD34D;--pink:#FF5FA2}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:600 14px/1.35 Nunito,system-ui,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block}
.top{position:fixed;left:12px;right:12px;top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;z-index:5}
.chip,.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:8px 14px;font:800 13px Nunito,sans-serif;cursor:pointer;backdrop-filter:blur(6px)}
.chip[aria-pressed="true"]{background:var(--yellow);color:#241A05;border-color:var(--yellow)}
.chip small{font-weight:700;opacity:.7;margin-left:4px}
.btn{background:var(--pink);border-color:var(--pink)}
.btn.y{background:var(--yellow);border-color:var(--yellow);color:#241A05}
.sp{flex:1}
.title{position:fixed;left:16px;bottom:16px;max-width:min(520px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 16px;z-index:5;backdrop-filter:blur(6px)}
.title h1{font:400 26px "Lilita One",sans-serif;letter-spacing:.02em}
.title p{color:var(--muted);margin-top:4px}
.title .new{display:inline-block;background:var(--pink);color:#fff;font:900 11px Nunito;padding:2px 8px;border-radius:999px;vertical-align:middle;margin-left:6px;letter-spacing:.04em}
.board{position:fixed;right:12px;top:64px;width:200px;max-height:calc(100vh - 150px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;z-index:5;backdrop-filter:blur(6px)}
.board button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;color:var(--ink);font:800 13px Nunito;padding:4px 6px;border-radius:8px;cursor:pointer;text-align:left}
.board button:hover,.board button.f{background:rgba(255,255,255,.1)}
.board i{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:inset -2px -2px 3px rgba(0,0,0,.35)}
.board em{font-style:normal;color:var(--muted);width:22px;flex:none;text-align:right}
.board b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board small{color:var(--yellow)}
.chrono{position:fixed;left:50%;top:64px;translate:-50% 0;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 16px;font:400 22px "Lilita One";z-index:5}
.big{position:fixed;left:50%;top:42%;translate:-50% -50%;font:400 min(18vw,140px) "Lilita One";color:var(--yellow);text-shadow:0 6px 0 rgba(0,0,0,.35);z-index:6;pointer-events:none}
.labels{position:fixed;inset:0;pointer-events:none;z-index:4}
.labels span{position:absolute;font:900 11px Nunito;padding:1px 6px;border-radius:999px;background:rgba(0,0,0,.55);white-space:nowrap;translate:-50% -140%}
.wait{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,8,18,.6);z-index:9;font:400 26px "Lilita One"}
.wait[hidden],.end[hidden],.btn[hidden]{display:none}
.end{position:fixed;left:50%;top:50%;translate:-50% -50%;width:min(420px,calc(100vw - 32px));background:#1C1630;border:1px solid var(--line);border-radius:20px;padding:20px;z-index:8;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.end h2{font:400 30px "Lilita One";text-align:center}
.end ol{margin:12px 0 16px;padding-left:28px;max-height:46vh;overflow:auto}
.end li{padding:3px 0;font-weight:800}
.end li span{color:var(--muted);font-weight:700}
.end .row{display:flex;gap:8px;justify-content:center}
.stats{color:var(--muted);font-size:12px;text-align:center;margin-top:10px}
@media (max-width:700px){ .board{width:150px;top:auto;bottom:150px;max-height:40vh} .title{right:16px} .title h1{font-size:21px} .chrono{top:auto;bottom:150px;left:16px;translate:none} }
</style>
</head>
<body>
<div id="stage"></div>
<div class="labels" id="labels"></div>
<div class="top">
  <span id="circuits"></span>
  <span class="sp"></span>
  <select class="chip" id="nb" aria-label="Nombre de billes"><option value="8">8 billes</option><option value="12">12 billes</option><option value="24" selected>24 billes</option></select>
  <button class="chip" id="vit" aria-pressed="false">Vitesse ×1</button>
  <button class="chip" id="cam" aria-pressed="false">Caméra libre</button>
  <button class="btn y" id="classe" hidden>Afficher le classement</button>
  <button class="btn" id="go">Nouvelle course</button>
</div>
<div class="chrono" id="chrono">0:00</div>
<div class="board" id="board"></div>
<div class="title" id="title"></div>
<div class="big" id="big"></div>
<div class="wait" id="wait">Calcul de la course…</div>
<div class="end" id="end" hidden></div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/","cannon-es":"https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"}}</script>
<script src="courses-inedites-moteur.js"></script>
<script type="module">
import * as THREE from "three";
import * as CANNON from "cannon-es";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
const {G3C, G3, g3Simulate, g3Where} = window.COURSE;
const $ = id => document.getElementById(id);

// les circuits de la maquette, et un circuit du jeu pour comparer
const LISTE = [["tour", true], ["couloirs", true], ["foret", false]];
const NOMS = ["Lulu","Noé","Inès","Malo","Zoé","Tom","Léa","Sacha","Jade","Hugo","Mila","Nino","Ness","Dylayn","Kathlyn","PlummB","Bim","Andrea","FrkMax","Ptitjas","Stephiox","Merlitow","Geralex5","Tcherno"];
const COLS = Array.from({length:24}, (_, i)=>new THREE.Color().setHSL(((i*0.381966) % 1), .78, .56));
const Q = new URLSearchParams(location.search);
let CID = G3C[Q.get("c")] ? Q.get("c") : "tour", NB = +($("nb").value), SPEED = 1, FREE = false;

$("circuits").innerHTML = LISTE.map(([c, neuf])=>`<button class="chip" data-c="${c}" aria-pressed="${c===CID}">${G3C[c].name}${neuf ? "" : "<small>(du jeu)</small>"}</button>`).join(" ");
$("circuits").onclick = e => { const b = e.target.closest("[data-c]"); if(!b) return; CID = b.dataset.c; document.querySelectorAll("#circuits .chip").forEach(x=>x.setAttribute("aria-pressed", x===b)); start() };
$("nb").onchange = () => { NB = +$("nb").value; start() };
$("go").onclick = () => start();
$("vit").onclick = () => { const now = performance.now(), t = raceT(now); SPEED = SPEED===1 ? 2 : 1; R.t0 = now - t*1000/SPEED; $("vit").textContent = `Vitesse ×${SPEED}`; $("vit").setAttribute("aria-pressed", SPEED>1) };
$("cam").onclick = () => { FREE = !FREE; ctl.enabled = FREE; $("cam").setAttribute("aria-pressed", FREE); $("cam").textContent = FREE ? "Suivre la course" : "Caméra libre"; if(FREE && R.followP) ctl.target.copy(R.followP) };
$("classe").onclick = () => showEnd();
$("board").onclick = e => { const b = e.target.closest("[data-i]"); if(!b) return; R.follow = R.follow===+b.dataset.i ? null : +b.dataset.i; if(FREE) $("cam").click() };

// ---------- la scène ----------
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping;
$("stage").appendChild(renderer.domElement);
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(50, 1, .1, 800);
const ctl = new OrbitControls(camera, renderer.domElement); ctl.enabled = false; ctl.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x404060, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {left:-30, right:30, top:30, bottom:-30, near:1, far:200}); scene.add(sun, sun.target);
const resize = () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix() };
addEventListener("resize", resize); resize();

let R = {}, world3 = null;
const shade = (hex, p) => { const c = new THREE.Color(hex), h = {}; c.getHSL(h); c.setHSL(h.h, h.s, Math.max(0, Math.min(1, h.l + p))); return c };
function colorOf(kind, th){
  switch(kind){
    case "ramp": return {c:th.ramp};
    case "wall": case "wall2": return {c:shade(th.ramp, -.18)};
    case "glass": return {c:"#CFE8FF", glass:true};
    case "tray": return {c:th.tray};
    case "peg": case "rail": return {c:th.peg || "#F4EEDC"};
    case "bump": return {c:th.bump || "#FF6FB5", em:.25};
    case "spin": return {c:th.spin || "#FFD34D", em:.15};
    default: return {c:th.rock || "#8A8496"};
  }
}
const mats = new Map();
function mat(kind, th){ const k = kind; if(mats.has(k)) return mats.get(k); const o = colorOf(kind, th);
  const m = o.glass ? new THREE.MeshPhysicalMaterial({color:o.c, transparent:true, opacity:.18, roughness:.05, metalness:0, depthWrite:false})
    : new THREE.MeshStandardMaterial({color:o.c, roughness:.55, metalness:.05, emissive:o.em ? o.c : 0x000000, emissiveIntensity:o.em || 0});
  mats.set(k, m); return m }
const GEO = {box:new THREE.BoxGeometry(1,1,1), cyl:new THREE.CylinderGeometry(1,1,1,24), sph:new THREE.SphereGeometry(1,24,16)};
const scaleOf = d => d.shape==="box" ? d.size : d.shape==="cyl" ? [d.size[0], d.size[1], d.size[0]] : [d.size[0], d.size[0], d.size[0]];
function pieceMesh(d, th){ const m = new THREE.Mesh(GEO[d.shape] || GEO.box, mat(d.kind, th)); m.scale.set(...scaleOf(d)); m.castShadow = d.kind!=="glass"; m.receiveShadow = true; return m }

function build(W, th){
  if(world3){ scene.remove(world3); world3.traverse(o=>{ if(o.geometry && !Object.values(GEO).includes(o.geometry)) o.geometry.dispose() }) }
  mats.clear(); world3 = new THREE.Group(); scene.add(world3);
  scene.background = new THREE.Color(th.bg); scene.fog = new THREE.Fog(th.bg, 60, 260);
  // le décor fixe : une instance par morceau, regroupés par forme et par matière (des milliers de morceaux de piste)
  const groups = new Map();
  W.statics.forEach(d=>{ if(d.shape==="group") return; const k = d.shape + "|" + d.kind; if(!groups.has(k)) groups.set(k, []); groups.get(k).push(d) });
  const M4 = new THREE.Matrix4(), P = new THREE.Vector3(), Qt = new THREE.Quaternion(), S = new THREE.Vector3();
  groups.forEach(list=>{ const d0 = list[0], im = new THREE.InstancedMesh(GEO[d0.shape] || GEO.box, mat(d0.kind, th), list.length);
    list.forEach((d, i)=>{ M4.compose(P.set(...d.pos), Qt.set(...d.quat), S.set(...scaleOf(d))); im.setMatrixAt(i, M4) });
    im.castShadow = d0.kind!=="glass"; im.receiveShadow = true; world3.add(im) });
  // les pièces qui tournent
  const kin = W.kin.map(d=>{ const g = new THREE.Group(); g.position.set(...d.pos); g.quaternion.set(...d.quat);
    if(d.shape==="group") d.parts.forEach(p=>{ const m = pieceMesh({...p, kind:p.kind || "spin"}, th); m.position.set(...p.pos); m.quaternion.set(...p.quat); g.add(m) });
    else g.add(pieceMesh(d, th));
    world3.add(g); return g });
  // les billes
  const bGeo = new THREE.SphereGeometry(G3.R, 28, 20);
  const balls = Array.from({length:W.balls.length}, (_, i)=>{ const m = new THREE.Mesh(bGeo, new THREE.MeshPhysicalMaterial({color:COLS[i], roughness:.12, clearcoat:1, clearcoatRoughness:.08}));
    m.castShadow = true; world3.add(m); return m });
  return {kin, balls};
}

// ---------- une course ----------
const raceT = now => (now - R.t0)/1000*SPEED;
function start(){
  $("wait").hidden = false; $("end").hidden = true; $("classe").hidden = true;
  const C = G3C[CID];
  $("title").innerHTML = `<h1>${C.name}${LISTE.find(x=>x[0]===CID)[1] ? `<span class="new">INÉDIT</span>` : ""}</h1><p>${C.desc}</p>`;
  setTimeout(()=>{
    const seed = (Math.random()*2**31)>>>0 || 1, t0 = performance.now();
    const sim = g3Simulate(CANNON, seed, NB, CID), calc = (performance.now() - t0)/1000;
    const v = build(sim.W, C.theme);
    const order = sim.fin.map((x, i)=>i).sort((a, b)=>sim.fin[a]-sim.fin[b]);
    $("labels").innerHTML = sim.W.balls.map((_, i)=>`<span id="lb${i}" style="color:#${COLS[i].getHexString()}">${NOMS[i]}</span>`).join("");
    R = {sim, v, order, seed, calc, t0:performance.now(), follow:null, camP:null, camL:null, ended:false, said:""};
    const p0 = sim.W.balls[0].position; camera.position.set(p0.x - 12, p0.y + 8, p0.z + 12);
    $("wait").hidden = true;
  }, 30);
}

function rankAt(f, tt){
  const {sim} = R, F = sim.frames[f];
  return sim.W.balls.map((_, i)=>({i, done:sim.fin[i] <= tt, s:g3Where(sim.W, F[i*7], F[i*7+1], F[i*7+2]).s}))
    .sort((a, b)=> (a.done && b.done) ? sim.fin[a.i]-sim.fin[b.i] : a.done ? -1 : b.done ? 1 : b.s-a.s);
}
function showEnd(){
  if(R.ended) return; R.ended = true; $("classe").hidden = true;
  const {sim, order} = R, ok = sim.fin.filter(x=>x<900);
  $("end").innerHTML = `<h2>🏁 ${G3C[CID].name}</h2><ol>${order.map((i, k)=>`<li style="color:#${COLS[i].getHexString()}">${NOMS[i]} <span>${sim.fin[i]<900 ? (sim.fin[i]-3).toFixed(1)+" s" : "pas arrivée"}</span></li>`).join("")}</ol>
    <div class="row"><button class="btn" onclick="document.getElementById('go').click()">Nouvelle course</button><button class="chip" onclick="document.getElementById('end').hidden=true">Fermer</button></div>
    <p class="stats">Gagnante ${(Math.min(...ok)-3).toFixed(1)} s · dernière ${(Math.max(...ok)-3).toFixed(1)} s · calcul ${R.calc.toFixed(1)} s · graine ${R.seed}</p>`;
  $("end").hidden = false;
}

const V3 = new THREE.Vector3(), camGoal = new THREE.Vector3(), lookGoal = new THREE.Vector3();
let lastNow = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(.1, (now - lastNow)/1000); lastNow = now;
  if(!R.sim){ renderer.render(scene, camera); return }
  const {sim, v} = R, t = raceT(now), ff = Math.max(0, Math.min(sim.frames.length - 1, t/G3.DT)), f = Math.floor(ff), F = sim.frames[f], F2 = sim.frames[f+1] || F, a = ff - f;
  for(let i=0;i<v.balls.length;i++){ v.balls[i].position.set(F[i*7]+(F2[i*7]-F[i*7])*a, F[i*7+1]+(F2[i*7+1]-F[i*7+1])*a, F[i*7+2]+(F2[i*7+2]-F[i*7+2])*a); v.balls[i].quaternion.set(F[i*7+3],F[i*7+4],F[i*7+5],F[i*7+6]) }
  if(sim.kf.length){ const K = sim.kf[Math.min(f, sim.kf.length-1)]; v.kin.forEach((g, j)=>g.quaternion.set(K[j*4],K[j*4+1],K[j*4+2],K[j*4+3])) }
  // le compte à rebours, le chrono
  const cd = t<1 ? "3" : t<2 ? "2" : t<3 ? "1" : t<3.8 ? "Partez !" : ""; if(cd!==R.said){ R.said = cd; $("big").textContent = cd }
  const rt = Math.max(0, t - 3); $("chrono").textContent = `${Math.floor(rt/60)}:${String(Math.floor(rt%60)).padStart(2, "0")}`;
  // le classement en direct (toutes les 6 images)
  if(!R.rank || f % 6===0) R.rank = rankAt(f, f*G3.DT);
  const rank = R.rank;
  $("board").innerHTML = rank.map((q, k)=>`<button data-i="${q.i}" class="${R.follow===q.i ? "f" : ""}"><em>${k+1}</em><i style="background:#${COLS[q.i].getHexString()}"></i><b>${NOMS[q.i]}</b>${q.done ? `<small>✓</small>` : ""}</button>`).join("");
  // le podium connu : on peut passer la fin ; tout le monde arrivé : les résultats
  const tt = f*G3.DT, n = sim.W.balls.length, lastFin = Math.max(...sim.fin.filter(x=>x<900));
  if(!R.ended && tt >= sim.fin[R.order[Math.min(2, n-1)]]) $("classe").hidden = false;
  if(!R.ended && tt > lastFin + 1.5) showEnd();
  // la caméra : sur la bille suivie, sinon sur la première pas encore arrivée
  const fq = R.follow!=null ? R.follow : (rank.find(q=>!q.done) || rank[0]).i, P = v.balls[fq].position;
  R.followP = P;
  if(!FREE){
    const T = g3Where(sim.W, P.x, P.y, P.z).T, W = sim.W;
    camGoal.set(...(W.cam ? W.cam([P.x, P.y, P.z], T) : [P.x - T[0]*10, P.y + 8.5, P.z - T[2]*10]));
    lookGoal.set(...(W.look ? W.look([P.x, P.y, P.z]) : [P.x, P.y, P.z]));
    if(!R.camP){ R.camP = camGoal.clone(); R.camL = lookGoal.clone() }
    R.camP.lerp(camGoal, Math.min(1, dt*2.2)); R.camL.lerp(lookGoal, Math.min(1, dt*3));
    camera.position.copy(R.camP); camera.lookAt(R.camL);
  } else ctl.update();
  sun.position.set(P.x + 20, P.y + 40, P.z + 15); sun.target.position.copy(P);
  // les noms au-dessus des billes proches
  for(let i=0;i<n;i++){ const el = $("lb"+i); if(!el) continue; V3.copy(v.balls[i].position); V3.y += .7; const d = camera.position.distanceTo(V3); V3.project(camera);
    const vis = V3.z < 1 && Math.abs(V3.x) < 1.05 && Math.abs(V3.y) < 1.05 && d < 34;
    el.style.opacity = vis ? 1 : 0; if(vis){ el.style.left = ((V3.x*.5 + .5)*innerWidth) + "px"; el.style.top = ((-V3.y*.5 + .5)*innerHeight) + "px" } }
  renderer.render(scene, camera);
}
requestAnimationFrame(loop);
start();
</script>
</body>
</html>
