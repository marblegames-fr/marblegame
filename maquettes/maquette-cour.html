<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tikalo · Maquette : la cour refaite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&family=Caveat:wght@700&display=swap">
<style>
/* Maquette du 27 octobre 2026 : 1) « Ma bille de jeu » plus visible (Mini-jeux et Grande Course), 2) la cour refaite, onglet par onglet.
   L'idée de la cour : un vrai lieu. Le sol est en bitume, on y écrit à la craie ; les objets posés dessus sont en papier
   (petits mots pliés pour le troc, étiquettes kraft pour le marché, carnet pour l'historique), comme le cahier de la Boîte à billes. */
:root{--bg:#F2E9D7;--panel:#FAF5EB;--panel-2:#F3EADA;--line:#E6D9C1;--ink:#24253D;--ink-2:#56546B;--muted:#8E8898;
  --yellow:#FFC93F;--yellow-2:#F2AE12;--red:#EF5B60;--green:#2FA35A;--blue:#2E6BE6;--orange:#E8743B;--pink:#E85D9A;--violet:#8A63D2;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;--body:"Nunito","Segoe UI",system-ui,sans-serif;--hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
  --shadow:0 14px 30px -18px rgba(40,30,20,.45);
  /* la cour : toujours les mêmes couleurs (c'est un lieu), en mode clair comme en sombre */
  --tar:#3B3634;--tar-2:#332E2C;--chalk:#F6F2E8;--chalk-2:rgba(246,242,232,.62);--paper:#FCF7EC;--paper-2:#F4ECDA;--kraft:#D9BC8E;--kraft-2:#CBA873;--pen:#2B2233}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){--bg:#12151F;--panel:#1B1F2C;--panel-2:#232838;--line:#2C3244;--ink:#F3F0EA;--ink-2:#BFC2CF;--muted:#858A9C;--shadow:0 14px 30px -18px rgba(0,0,0,.8)} }
:root[data-theme="dark"]{--bg:#12151F;--panel:#1B1F2C;--panel-2:#232838;--line:#2C3244;--ink:#F3F0EA;--ink-2:#BFC2CF;--muted:#858A9C;--shadow:0 14px 30px -18px rgba(0,0,0,.8)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:700 15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
img{display:block}
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 60px}
.frame.phone{max-width:400px;margin:0 auto;border:10px solid #1B1B22;border-radius:34px;padding:10px 10px 18px;background:var(--bg);box-shadow:0 20px 40px -20px rgba(0,0,0,.6)}

/* ---------- le haut de la maquette ---------- */
.mq-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:16px}
.mq-top h1{font:400 26px/1.1 var(--display)}
.mq-top p{color:var(--muted);font-size:13.5px;flex-basis:100%}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--panel);border:1px solid var(--line);gap:2px}
.seg button{padding:7px 14px;border-radius:999px;font-weight:900;font-size:13.5px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.note{margin:14px 0 18px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--yellow) 22%,var(--panel));border:1px dashed var(--yellow-2);font-size:14px;color:var(--ink-2)}
.note b{color:var(--ink)}
h2.mq{font:400 21px/1.1 var(--display);margin:26px 0 10px}
h2.mq small{display:block;font:800 13px/1.3 var(--body);color:var(--muted)}

/* ---------- les pièces communes ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:999px;font-weight:900;font-size:14.5px;line-height:1.1;white-space:nowrap}
.btn-y{background:var(--yellow);color:#2B2233;box-shadow:0 4px 0 var(--yellow-2)}
.btn-g{background:var(--panel-2);border:1px solid var(--line)}
.btn-sm{padding:7px 12px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:900;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}
.coin{width:16px;height:16px;vertical-align:-3px}

/* =====================================================================
   1) MA BILLE DE JEU
   ===================================================================== */
/* le sélecteur « comme dans un jeu vidéo » : la bille au centre, une flèche de chaque côté, le nom en dessous,
   et la rangée de ses billes préférées pour changer en un geste */
.pick-hero{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;padding:18px 20px;border-radius:24px;
  background:radial-gradient(ellipse at 18% 60%,color-mix(in srgb,var(--yellow) 30%,transparent),transparent 55%),var(--panel);border:2px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.ph-sel{display:grid;grid-template-columns:44px auto 44px;align-items:center;gap:4px}
.ph-arrow{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--panel-2);border:2px solid var(--line);font:400 22px/1 var(--display);transition:transform .15s}
.ph-arrow:hover{transform:scale(1.1);border-color:var(--ink-2)}
.ph-ball{position:relative;width:132px;height:132px;display:grid;place-items:center}
.ph-ball::before{content:"";position:absolute;inset:auto 10px 4px;height:22px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.28),transparent)}
.ph-ball::after{content:"";position:absolute;inset:6px;border-radius:50%;border:3px dashed color-mix(in srgb,var(--ink) 18%,transparent);animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ph-ball img{position:relative;z-index:1;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
@keyframes bob{50%{transform:translateY(-6px)}}
.ph-ball.swap img{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4) rotate(-90deg);opacity:.2}}
.ph-txt small{display:block;font-size:11.5px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.ph-txt h3{font:400 26px/1.1 var(--display);margin:2px 0 6px}
.ph-txt .tip{color:var(--ink-2);font-size:13.5px;max-width:46ch}
.ph-quick{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.ph-q{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--panel-2);border:2px solid var(--line);transition:transform .15s}
.ph-q:hover{transform:translateY(-3px)}
.ph-q[aria-pressed="true"]{border-color:var(--yellow-2);background:color-mix(in srgb,var(--yellow) 30%,var(--panel))}
.ph-sticker{position:absolute;top:12px;right:14px;transform:rotate(6deg);padding:5px 11px;border-radius:10px;background:var(--pink);color:#fff;font:400 15px/1 var(--display);box-shadow:0 3px 0 #B83C75;animation:wig 2.4s ease-in-out infinite}
@keyframes wig{0%,80%,100%{transform:rotate(6deg)}88%{transform:rotate(-3deg) scale(1.08)}94%{transform:rotate(9deg)}}
/* (27 octobre, 2e version) la page Mini-jeux telle qu'elle est aujourd'hui, pour voir où se place le sélecteur : seul le bloc « Ta bille de jeu » est nouveau */
.page{display:grid;gap:18px}
.ph1{font:400 34px/1 var(--display)}
.ph1 + small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.new-mark{position:relative;outline:3px dashed var(--pink);outline-offset:6px;border-radius:24px}
.new-mark::after{content:"NOUVEAU";position:absolute;z-index:3;top:10px;left:50%;translate:-50% 0;padding:2px 9px;border-radius:999px;background:var(--pink);color:#fff;font-size:11px;font-weight:900;letter-spacing:.08em}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.strip{padding:16px 18px}
.strip .top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
.kick{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.strip .goal{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;margin:10px 0 12px}
.strip .goal svg{width:46px;height:auto}
.strip .goal b{display:block;font:400 21px/1.1 var(--display);margin-bottom:7px}
.bar{display:block;height:8px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--green);border-radius:99px}
.days3{display:flex;flex-wrap:wrap;gap:8px}
.days3 span{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);font-weight:900;font-size:13.5px}
.days3 span.done{background:color-mix(in srgb,var(--green) 16%,var(--panel));color:var(--green);border-color:color-mix(in srgb,var(--green) 40%,transparent)}
.rdv-h{font:400 20px/1 var(--display);display:flex;align-items:center;gap:8px}
.rdv-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.rdv{display:grid;grid-template-columns:150px minmax(0,1fr);overflow:hidden}
.rdv-art{display:grid;place-items:center;background:var(--a)}
.rdv-art svg{width:100%;max-height:160px}
.rdv-b{padding:14px 16px}
.rdv-b h3{font:400 22px/1.1 var(--display);margin:2px 0 4px}
.rdv-b p{font-size:13px;color:var(--ink-2)}
.rdv-b .t{margin:6px 0 10px;font-weight:900;font-size:13.5px}
.grid-h{font:400 20px/1 var(--display)}
.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.gtile{overflow:hidden;display:flex;flex-direction:column}
.gt-art{position:relative;height:170px;display:grid;place-items:center;background:var(--a)}
.gt-art svg{height:100%;width:auto;max-width:100%}
.gt-jdj{position:absolute;top:10px;left:10px;padding:4px 10px;border-radius:999px;background:var(--yellow);color:#2B2233;font-size:12px;font-weight:900}
.gt-state{position:absolute;bottom:10px;left:10px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--green);font-size:12px;font-weight:900}
.gt-me{position:absolute;bottom:8px;right:10px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.92);box-shadow:0 3px 8px rgba(0,0,0,.25)}
.gt-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px}
.gt-foot small{font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.gt-foot h2{font:400 21px/1.05 var(--display)}
.pips{display:flex;gap:3px;margin-top:4px}.pips i{width:9px;height:9px;border-radius:50%;background:var(--line)}.pips i.on{background:var(--green)}
.btn-b{background:var(--blue);color:#fff;box-shadow:0 4px 0 #1F4FB8}
.fonds{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 14px;border-radius:20px;background:linear-gradient(135deg,#FFF3CC,#FFE08A);color:#5A3A08}
.fonds .l{font-weight:900;font-size:13px}
.fonds span.g{display:inline-flex;align-items:center;gap:6px;padding:5px 12px 5px 5px;border-radius:999px;background:rgba(255,255,255,.7);font-weight:900;font-size:13px}
.fonds span.g i{width:30px;height:30px;border-radius:50%;background:var(--a)}
@media (max-width:640px){ .rdv-grid{grid-template-columns:minmax(0,1fr)} }
.phone .rdv-grid{grid-template-columns:minmax(0,1fr)} .phone .rdv{grid-template-columns:110px minmax(0,1fr)} .phone .games-grid{grid-template-columns:minmax(0,1fr)}
/* le sélecteur, en plus compact que la 1re version : il ne doit pas pousser les jeux trop bas */
.pick-hero{padding:14px 18px}
.pick-hero .ph-ball{width:112px;height:112px}
/* la page de la Grande Course */
.back{font-weight:900;font-size:13px;color:var(--muted)}
.gc-prizes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:4px}
.gc-prizes div{padding:10px 8px;border-radius:14px;text-align:center;font-weight:800;font-size:13px;color:#2B2233}
.gc-prizes b{display:block;font:400 20px/1 var(--display)}
.gc-prizes .p1{background:linear-gradient(180deg,#FFE27A,#F2AE12)}.gc-prizes .p2{background:linear-gradient(180deg,#E9EDF5,#B9C3D6)}.gc-prizes .p3{background:linear-gradient(180deg,#F6C9A0,#D98A4E)}
.gc-clock{display:inline-grid;gap:2px;padding:8px 18px;border-radius:16px;background:rgba(0,0,0,.25);text-align:center}
.gc-clock small{font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.gc-clock b{font:400 30px/1 var(--display);color:#FFE14D}
.gc-top{position:relative;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}

/* la Grande Course : ta coureuse sur la ligne de départ, avec son dossard */
.gc-start{position:relative;border-radius:24px;overflow:hidden;color:#fff;padding:18px 20px 20px;
  background:linear-gradient(180deg,#3F8EF0 0%,#8CC6FF 58%,#6FAE55 58%,#5E9A47 100%);box-shadow:var(--shadow)}
.gc-start .lane{position:absolute;left:0;right:0;bottom:84px;height:14px;background:repeating-linear-gradient(90deg,#fff 0 14px,#24253D 14px 28px);opacity:.9}
.gcs-row{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:end}
.gcs-row .ph-arrow{background:rgba(255,255,255,.9);border-color:#fff;color:#24253D}
.gcs-row .ph-ball::after{border-color:rgba(255,255,255,.55)}
.bib{position:absolute;z-index:2;right:6px;top:10px;padding:3px 7px;border-radius:7px;background:#fff;color:#E0182D;font:400 15px/1 var(--display);border:2px solid #24253D;transform:rotate(8deg)}
.gcs-txt{padding-bottom:40px;text-shadow:0 2px 6px rgba(0,0,0,.3)}
.gcs-txt small{font-size:11.5px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;opacity:.9}
.gcs-txt h3{font:400 26px/1.1 var(--display)}
.gcs-txt p{font-size:13.5px;opacity:.95;max-width:44ch}
.gcs-quick{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.gcs-quick .ph-q{background:rgba(255,255,255,.85);border-color:rgba(255,255,255,.9)}
.gcs-go{position:relative;display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:34px}
.gcs-go span{padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.28);font-weight:900;font-size:13px}
.gcs-go .btn-y{font-size:16px;padding:13px 22px}

/* =====================================================================
   2) LA COUR
   ===================================================================== */
.cour{position:relative;border-radius:26px;padding:0 0 22px;color:var(--chalk);overflow:hidden;
  background:radial-gradient(1.2px 1.2px at 20% 30%,rgba(255,255,255,.07) 50%,transparent 51%) 0 0/11px 13px,
    radial-gradient(1px 1px at 70% 60%,rgba(0,0,0,.25) 50%,transparent 51%) 0 0/9px 7px,
    radial-gradient(ellipse at 85% -10%,rgba(255,180,90,.22),transparent 55%),var(--tar);box-shadow:0 18px 40px -22px rgba(0,0,0,.7)}
.chalk{font-family:var(--hand);color:var(--chalk)}
/* le haut : le titre à la craie, ton pseudo à donner, et le plan de la cour (les 5 onglets) */
.c-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 18px;padding:22px 22px 6px}
.c-head h1{font:700 52px/.9 var(--hand);letter-spacing:.01em;text-shadow:0 0 1px rgba(255,255,255,.4)}
.c-head h1 span{display:block;font:900 12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--yellow);margin-bottom:6px}
.c-me{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px;border-radius:16px;border:2px dashed rgba(246,242,232,.35)}
.c-me img{flex:none}
.c-me small{display:block;font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--chalk-2)}
.c-me b{font:700 24px/1 var(--hand)}
.c-me button{margin-left:6px;padding:6px 10px;border-radius:999px;background:rgba(246,242,232,.12);font-size:12.5px;font-weight:900}
.c-nav{display:flex;gap:8px;padding:10px 18px 4px;overflow-x:auto;scrollbar-width:none}
.c-nav::-webkit-scrollbar{display:none}
.cn{position:relative;flex:1 0 auto;display:grid;justify-items:center;gap:2px;min-width:92px;padding:10px 10px 8px;border-radius:18px;color:var(--chalk-2);border:2px solid transparent;transition:transform .15s}
.cn svg{width:42px;height:34px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.cn b{font:700 22px/1 var(--hand)}
.cn:hover{transform:translateY(-2px);color:var(--chalk)}
.cn[aria-selected="true"]{color:var(--chalk);border-color:rgba(246,242,232,.55);border-style:dashed;background:rgba(246,242,232,.06)}
.cn .n{position:absolute;top:4px;left:calc(50% + 12px);min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font:900 11.5px/20px var(--body)}
.c-body{padding:10px 18px 0}
.c-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:18px 4px 10px}
.c-h h3{font:700 30px/1 var(--hand)}
.c-h small{font-size:12.5px;color:var(--chalk-2);font-weight:800}
.c-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){ .c-grid{grid-template-columns:minmax(0,1fr)} }
.phone .c-grid{grid-template-columns:minmax(0,1fr)}

/* papier posé sur le bitume */
.paper{position:relative;color:var(--pen);background:var(--paper);border-radius:6px;box-shadow:0 2px 0 rgba(0,0,0,.18),0 14px 22px -14px rgba(0,0,0,.7)}
.tape{position:absolute;top:-10px;left:50%;width:74px;height:22px;translate:-50% 0;rotate:-3deg;background:rgba(255,236,170,.75);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.seyes{background:repeating-linear-gradient(180deg,transparent 0 23px,rgba(60,110,180,.2) 23px 24px),linear-gradient(90deg,transparent 30px,rgba(220,85,85,.45) 30px 32px,transparent 32px),var(--paper)}

/* ---------- Copains ---------- */
/* les trouvailles rares : une bande qui défile, comme des cartes posées en éventail */
.finds{display:flex;gap:12px;overflow-x:auto;padding:8px 4px 14px;scrollbar-width:thin}
.fc{flex:none;width:132px;padding:8px;border-radius:14px;background:linear-gradient(160deg,color-mix(in srgb,var(--dc) 70%,#fff),var(--dc));color:#fff;box-shadow:0 10px 16px -10px rgba(0,0,0,.7);rotate:var(--r)}
.fc .in{border-radius:10px;background:rgba(255,255,255,.92);color:var(--pen);padding:6px 6px 8px;text-align:center}
.fc .st{display:flex;justify-content:space-between;font-size:10px;font-weight:900;color:var(--dc)}
.fc img{margin:4px auto}
.fc b{display:block;font-size:12.5px;line-height:1.15}
.fc small{font-size:11px;color:var(--muted)}
/* le banc : chaque copain est une carte avec sa bille, posée sur un rond de craie */
.bench{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.phone .bench{grid-template-columns:repeat(2,minmax(0,1fr))}
.mate{position:relative;display:grid;justify-items:center;gap:2px;padding:12px 8px 10px;border-radius:18px;border:2px dashed rgba(246,242,232,.28);text-align:center;transition:transform .15s,border-color .15s}
.mate:hover{transform:translateY(-3px);border-color:rgba(246,242,232,.6)}
.mate .ring{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;border:2.5px solid rgba(246,242,232,.35)}
.mate b{font:700 25px/1 var(--hand);margin-top:4px}
.mate small{font-size:11.5px;color:var(--chalk-2);font-weight:800}
.mate .new{position:absolute;top:8px;left:8px;padding:2px 7px;border-radius:999px;background:var(--yellow);color:#2B2233;font-size:10.5px;font-weight:900}
.mate .acts{display:flex;gap:6px;margin-top:8px}
.mate .acts button{padding:6px 11px;border-radius:999px;font-size:12.5px;font-weight:900;background:rgba(246,242,232,.12)}
.mate .acts .tr{background:var(--yellow);color:#2B2233}
.mate.add{place-content:center;color:var(--chalk-2)}
.mate.add .ring{font:400 40px/1 var(--display)}
/* les demandes reçues : un petit mot plié */
.notes{display:grid;gap:14px}
.note-p{padding:16px 14px 12px 42px}
.note-p .from{font:700 24px/1 var(--hand)}
.note-p p{font-size:13.5px;color:var(--ink-2)}
.note-p .acts{display:flex;gap:8px;margin-top:10px}
.add-p{padding:16px 14px 14px 42px}
.add-p label{font:700 24px/1 var(--hand)}
.add-p form{display:flex;gap:8px;margin-top:8px}
.add-p input{flex:1;min-width:0;border:0;border-bottom:2px solid var(--pen);background:transparent;padding:6px 2px;font:700 22px/1 var(--hand);outline:0}

/* ---------- Troc ---------- */
.who-row{display:flex;gap:10px;overflow-x:auto;padding:4px 4px 10px;scrollbar-width:none}
.who-row::-webkit-scrollbar{display:none}
.who{flex:none;display:grid;justify-items:center;gap:2px;width:74px;color:var(--chalk-2);font:700 18px/1 var(--hand)}
.who span{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;border:2.5px dashed rgba(246,242,232,.35);transition:transform .15s}
.who:hover span{transform:scale(1.08);border-color:var(--yellow)}
.who:hover{color:var(--chalk)}
.ttabs{display:flex;gap:6px;margin:14px 4px 0}
.ttab{padding:8px 14px 10px;border-radius:12px 12px 0 0;background:rgba(246,242,232,.1);color:var(--chalk-2);font-weight:900;font-size:13.5px}
.ttab[aria-pressed="true"]{background:var(--paper);color:var(--pen)}
.ttab .n{margin-left:4px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-size:11px}
.offers{display:grid;gap:18px;padding:16px;border-radius:0 14px 14px 14px;background:var(--paper-2)}
.offer{padding:18px 16px 14px 44px}
.offer .oh{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px}
.offer .oh b{font:700 26px/1 var(--hand)}
.offer .oh time{margin-left:auto;font-size:12px;color:var(--muted)}
.offer .oh .end{font-size:12px;font-weight:900;color:var(--orange)}
.pockets{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;margin:12px 0 8px}
.pocket{padding:10px;border-radius:16px;border:2px solid var(--pc);background:color-mix(in srgb,var(--pc) 9%,var(--paper))}
.pocket small{display:block;font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--pc)}
.pocket .bl{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:4px;min-height:48px}
.pocket .tag{display:block;font-size:11.5px;font-weight:900;color:var(--pc);margin-top:4px}
.swap{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--yellow);font:400 20px/1 var(--display);box-shadow:0 3px 0 var(--yellow-2)}
@media (max-width:560px){ .pockets{grid-template-columns:minmax(0,1fr)} .swap{justify-self:center;rotate:90deg} }
.phone .pockets{grid-template-columns:minmax(0,1fr)} .phone .swap{justify-self:center;rotate:90deg}
.offer .mot{font:700 21px/1.2 var(--hand);color:#3558A8}
.offer .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* ---------- Marché ---------- */
.stall{position:relative;border-radius:18px 18px 10px 10px;overflow:hidden;background:var(--paper-2);color:var(--pen)}
.awning{height:46px;background:repeating-linear-gradient(90deg,#E85D9A 0 34px,#FCF7EC 34px 68px);position:relative}
.awning::after{content:"";position:absolute;left:0;right:0;bottom:-14px;height:14px;background:radial-gradient(circle at 17px 0,#E85D9A 16px,transparent 17px) 0 0/68px 14px,radial-gradient(circle at 51px 0,#FCF7EC 16px,transparent 17px) 0 0/68px 14px}
.stall-in{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;padding:24px 18px 16px}
.stall-in h3{font:700 36px/1 var(--hand)}
.stall-in p{font-size:13.5px;color:var(--ink-2);flex:1 1 220px}
.mk-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 4px 4px}
.srch{flex:1 1 220px;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:rgba(246,242,232,.1);border:2px solid rgba(246,242,232,.25)}
.srch input{flex:1;min-width:0;border:0;background:none;outline:0;color:var(--chalk)}
.srch input::placeholder{color:var(--chalk-2)}
.fchip{padding:8px 13px;border-radius:999px;background:rgba(246,242,232,.1);color:var(--chalk);font-weight:900;font-size:13px;border:1px solid rgba(246,242,232,.2)}
.fchip[aria-pressed="true"]{background:var(--chalk);color:var(--pen)}
.tags{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 16px;padding:22px 4px 0}
.phone .tags{grid-template-columns:repeat(2,minmax(0,1fr))}
.ptag{position:relative;padding:22px 10px 12px;border-radius:10px 10px 12px 12px;text-align:center;color:var(--pen);rotate:var(--r);
  background:linear-gradient(180deg,var(--kraft),var(--kraft-2));box-shadow:0 12px 16px -12px rgba(0,0,0,.8);clip-path:polygon(22% 0,78% 0,100% 12%,100% 100%,0 100%,0 12%)}
.ptag::before{content:"";position:absolute;top:8px;left:50%;width:10px;height:10px;translate:-50% 0;border-radius:50%;background:var(--tar);box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.ptag .bw{width:84px;height:84px;margin:0 auto;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.35)}
.ptag b{display:block;font-size:13px;line-height:1.15;margin-top:6px}
.ptag .price{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font:400 22px/1 var(--display)}
.ptag .avg{display:block;font-size:11px;color:#6E5A3E}
.ptag .sel{display:block;font:700 18px/1 var(--hand);color:#6E5A3E;margin-top:4px}
.ptag .miss{position:absolute;top:42px;right:6px;padding:2px 7px;border-radius:999px;background:var(--yellow);font-size:10px;font-weight:900}
/* (27 octobre, 2e version) deux couleurs d'étiquette : kraft = prix fixe (on achète tout de suite), rouge = aux enchères (on fait une offre) */
.ptag .kind{display:block;font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#6E5A3E;margin:-6px 0 6px}
.ptag.auc{color:#fff;background:linear-gradient(180deg,#E8604C,#B8352B)}
.ptag.auc .kind{color:#FFE1A8}
.ptag.auc .bw{background:rgba(255,255,255,.22)}
.ptag.auc .avg,.ptag.auc .sel{color:rgba(255,255,255,.85)}
.ptag.auc .price{color:#FFE14D}
.ptag .time{display:inline-block;margin-top:6px;padding:3px 9px;border-radius:999px;background:#2B2233;color:#fff;font-size:11.5px;font-weight:900}
.c-none{color:var(--chalk-2);margin:0 8px 10px;font-weight:800;font-size:13.5px}
.mk-leg{display:flex;flex-wrap:wrap;gap:6px 16px;margin:14px 4px 0;font-size:12.5px;font-weight:800;color:var(--chalk-2)}
.mk-leg i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px;background:var(--c)}

/* ---------- Classement ---------- */
.cl-sw{display:flex;gap:8px;flex-wrap:wrap;margin:6px 4px 0}
.chalk-pod{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:10px;max-width:520px;margin:20px auto 0;text-align:center}
.cp-st{display:grid;justify-items:center;gap:4px}
.cp-st b{font:700 26px/1 var(--hand)}
.cp-st small{font-size:12px;font-weight:900;color:var(--chalk-2)}
.cp-st .step{width:100%;display:grid;place-items:center;border:3px solid var(--chalk);border-bottom:0;border-radius:8px 8px 0 0;font:700 46px/1 var(--hand);color:var(--chalk)}
.cp-st.p1 .step{height:110px;border-color:#FFD34D;color:#FFD34D}.cp-st.p2 .step{height:80px}.cp-st.p3 .step{height:58px;border-color:#F0A36B;color:#F0A36B}
.cp-st .crown{font-size:26px;line-height:1}
.me-card{display:flex;align-items:center;gap:12px 18px;margin:22px 0 0;padding:16px 18px 16px 46px}
.me-card .medal{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff 0,#BFD3F7 30%,#2E6BE6 100%);color:#fff;font:400 26px/1 var(--display);box-shadow:0 4px 0 #1F4FB8}
.me-card .sc small{font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.me-card .sc b{display:block;font:400 30px/1 var(--display)}
.me-card .sc p{font:700 21px/1.1 var(--hand);color:#3558A8}
.board{margin-top:18px;border-radius:14px;padding:6px 14px;background:#2F4A3A;border:10px solid #8A6A45;box-shadow:inset 0 0 30px rgba(0,0,0,.35),0 12px 20px -12px rgba(0,0,0,.8)}
.br{display:grid;grid-template-columns:34px 44px minmax(0,1fr) auto;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed rgba(246,242,232,.2)}
.br:last-child{border:0}
.br .rk{font:700 26px/1 var(--hand);color:var(--chalk-2);text-align:center}
.br .nm{font:700 24px/1 var(--hand)}
.br .nm small{display:block;font:800 11.5px/1.2 var(--body);color:var(--chalk-2)}
.br .pt{font:700 26px/1 var(--hand);color:#FFD34D}
.br.me{background:rgba(255,211,77,.12);border-radius:10px;padding-left:6px;padding-right:6px}

/* ---------- Historique ---------- */
.carnet{padding:20px 16px 18px 46px}
.carnet .day{font:700 26px/1 var(--hand);color:#B4462B;margin:20px 0 8px;padding-bottom:4px;border-bottom:2px solid rgba(180,70,43,.35)}
.carnet .day:first-child{margin-top:0}
/* (27 octobre, 2e version) chaque élément est un petit encadré à part, avec sa couleur (troc, vente, achat, enchère) et son heure */
.ev{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;margin:8px 0;border-radius:12px;
  background:color-mix(in srgb,var(--ec) 9%,#fff);border:1.5px solid color-mix(in srgb,var(--ec) 35%,transparent);border-left:5px solid var(--ec)}
.ev .ico{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:16px;background:color-mix(in srgb,var(--ec) 18%,#fff)}
.ev p{font-size:14px}
.ev p small{display:block;font-size:11.5px;font-weight:800;color:var(--muted)}
.ev .bl{display:inline-flex;gap:2px;vertical-align:middle}
.ev .amt{font:400 17px/1 var(--display)}
.ev .amt.plus{color:var(--green)}.ev .amt.minus{color:var(--red)}
.hfilt{display:flex;gap:8px;margin:6px 4px 14px}

/* sur téléphone : la bille au-dessus, le texte dessous, tout centré */
.phone .pick-hero,.phone .gcs-row{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}
.phone .ph-quick,.phone .gcs-quick{justify-content:center}
.phone .ph-sticker{top:10px;right:10px}
.phone .gcs-txt{padding:30px 0 0}
.phone .gc-start .lane{bottom:auto;top:178px}
.phone .gcs-go{justify-content:center;margin-top:14px}
@media (max-width:560px){ .pick-hero,.gcs-row{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center} .ph-quick,.gcs-quick{justify-content:center} .gcs-txt{padding:30px 0 0} .gc-start .lane{bottom:auto;top:178px} .gcs-go{justify-content:center;margin-top:14px} }
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="mq-top">
    <h1>Maquette · la cour refaite</h1>
    <div class="seg" role="group" aria-label="Partie"><button data-part="bille" aria-pressed="true">1. Page Mini-jeux</button><button data-part="course" aria-pressed="false">2. Page Grande Course</button><button data-part="cour" aria-pressed="false">3. La cour</button></div>
    <div class="seg" role="group" aria-label="Écran"><button data-w="pc" aria-pressed="true">Ordi</button><button data-w="phone" aria-pressed="false">Téléphone</button></div>
    <p>Maquette du 27 octobre 2026, rien n'est sur le site. Les billes sont tirées au hasard ; tout est cliquable pour voir le comportement.</p>
  </div>
  <div class="frame" id="frame"></div>
</div>

<script src="tikalo-demo-rendu.js"></script>
<script>
// ---------- les données de la maquette ----------
const R = (()=>{ let s = 20261027; return () => (s = (s*1664525 + 1013904223) >>> 0) / 4294967296 })();
const famsOf = r => DECOR_IDS.filter(i=>FAMILIES[i].rar===r && !FAMILIES[i].myth);
const pick = a => a[Math.floor(R()*a.length)];
const mk = (t, r, sh=0) => makeSpec(t, {seed:Math.floor(R()*4e9), family:pick(famsOf(r)), shiny:sh});
const img = (s, px, size=128) => `<img src="${marbleURL(s, size)}" alt="${esc(specName(s))}" width="${px}" height="${px}" style="width:${px}px;height:${px}px">`;
const px = (s, base) => Math.round(base*(.62 + .38*scaleOf(s.type)));
const name = s => specName(s);
const fold = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();   // sans accents ni majuscules, comme dans le jeu

const MINE = [mk("calot",4), mk("boulet",3), mk("bille",2,2), mk("mammouth",2), mk("chinoise",3), mk("mini",4,1), mk("calot",1), mk("bille",0)];
const MATES = [["Léa",mk("boulet",3),1],["Malo",mk("calot",2)],["Inès",mk("mammouth",1)],["Noé",mk("bille",4)],["Jade",mk("chinoise",2,1)],["Sacha",mk("calot",0)],["Hugo",mk("mini",3)]];
const FINDS = [["Léa",mk("mammouth",3),"il y a 2 h"],["Noé",mk("calot",4),"il y a 5 h"],["Jade",mk("bille",2,3),"hier"],["Malo",mk("boulet",4),"hier"],["Inès",mk("mammouth",4),"il y a 2 j"]];
const MARKET = [[mk("calot",3),120,98,"Malo"],[mk("boulet",2),80,85,"Léa",1],[mk("mammouth",3),260,null,"Hugo",0,"2 h 14"],[mk("bille",4),340,310,"Jade",1],
  [mk("chinoise",1,1),95,90,"Sacha"],[mk("mini",3),30,26,"Noé"],[mk("calot",4),420,null,"Inès",1,"38 min"],[mk("boulet",0),25,22,"Malo"]];
const TOP = [["Jade",mk("mammouth",4),4820],["Léa",mk("boulet",3),4410],["Noé",mk("calot",4),3990],["Malo",mk("calot",2),3120],["Toi",MINE[0],2875],["Inès",mk("mammouth",1),2610],["Hugo",mk("mini",3),1990]];

const st = {part:"bille", w:"pc", gi:0, ci:0, tab:"copains", tt:"recues"};
new URLSearchParams(location.search).forEach((v,k)=>{ if(k in st) st[k] = v });   // ?part=cour&tab=marche&w=phone : pour ouvrir directement un onglet
document.querySelectorAll("[data-part]").forEach(x=>x.setAttribute("aria-pressed", x.dataset.part===st.part)); document.querySelectorAll("[data-w]").forEach(x=>x.setAttribute("aria-pressed", x.dataset.w===st.w));
const frame = document.getElementById("frame");

// ---------- 1) Ma bille de jeu ----------
function vBille(part){
  const s = MINE[st.gi], c = MINE[st.ci];
  const quick = (i, cur, act) => `<button class="ph-q" data-act="${act}" data-i="${i}" aria-pressed="${i===cur}" title="${esc(name(MINE[i]))}">${img(MINE[i], 34, 96)}</button>`;
  // la page Mini-jeux d'aujourd'hui (3 jeux du jour, Grande Course et Loterie, jeux à jouer, faits à fond) : rien ne bouge, sauf le bloc rose
  const bag = BAGS.find(b=>b.id==="classique");
  const me = `<span class="gt-me" title="Tu joues avec ${esc(name(s))}">${img(s, 34, 96)}</span>`;
  const tile = (t, art, a, jdj, state, pips, btn) => `<article class="panel gtile"><div class="gt-art" style="--a:${a}">${art}${jdj?`<span class="gt-jdj">★ Jeu du jour</span>`:""}<span class="gt-state">${state}</span>${me}</div>
    <div class="gt-foot"><div><small>Jeu de chance</small><h2>${t}</h2>${pips?`<span class="pips">${pips}</span>`:""}</div><button class="btn ${btn==="Jouer"?"btn-b":"btn-g"} btn-sm">▶ ${btn}</button></div></article>`;
  const pip = (n, on) => Array.from({length:n},(_,i)=>`<i class="${i<on?"on":""}"></i>`).join("");
  const flag = `<svg viewBox="0 0 120 120"><rect x="28" y="18" width="5" height="88" rx="2" fill="#24253D"/><g>${[0,1,2,3].map(r=>[0,1,2,3,4].map(c=>`<rect x="${33+c*12}" y="${20+r*12}" width="12" height="12" fill="${(r+c)%2?"#24253D":"#fff"}"/>`).join("")).join("")}</g></svg>`;
  const jeux = `
  <div class="note"><b>Où est le changement ?</b> Voici la page <b>Mini-jeux</b> telle qu'elle est aujourd'hui sur le site : les 3 jeux du jour, la Grande Course et la Loterie,
  les jeux à jouer, puis la ligne dorée des jeux faits à fond. Rien de tout ça ne bouge. <b>Seul le bloc entouré en rose est nouveau</b> : il remplace le petit bouton « Ma bille de jeu » qui était en haut à droite.
  On voit sa bille en grand, comme dans un écran de « choix du personnage » de jeu vidéo. On change avec les flèches ‹ ›, ou d'un toucher sur une de ses 6 billes préférées.
  « Toutes mes billes » ouvre la fenêtre de choix actuelle. Un petit rond rappelle aussi la bille sur chaque jeu.</div>

  <div class="page">
  <div><div class="ph1">Mini-jeux</div></div>
  <section class="pick-hero new-mark">
    ${st.seen ? "" : `<span class="ph-sticker">Change-la !</span>`}
    <div class="ph-sel">
      <button class="ph-arrow" data-act="gprev" aria-label="Bille précédente">‹</button>
      <div class="ph-ball" id="gball">${img(s, px(s,112), 200)}</div>
      <button class="ph-arrow" data-act="gnext" aria-label="Bille suivante">›</button>
    </div>
    <div class="ph-txt">
      <small>Ta bille pour tous les mini-jeux</small>
      <h3>${esc(name(s))}</h3>
      <span class="pill" style="--c:${TYPES[s.type].rc}">${TYPES[s.type].label}</span>${FAMILIES[s.family].rar>=1?` <span class="pill" style="--c:${DECOR_RAR[FAMILIES[s.family].rar].c}">${DECOR_RAR[FAMILIES[s.family].rar].name}</span>`:""}
      <p class="tip" style="margin-top:8px">Elle ne change que le look : les chances sont les mêmes pour toutes. Alors joue avec ta plus belle !</p>
      <div class="ph-quick">${MINE.slice(0,6).map((_,i)=>quick(i, st.gi, "gset")).join("")}<button class="btn btn-g btn-sm">Toutes mes billes ›</button></div>
    </div>
  </section>
  <section class="panel strip">
    <div class="top"><span class="kick">★ Les 3 jeux du jour</span><span class="kick">⏱ Nouveaux dans <b>&nbsp;9 h 12</b></span></div>
    <div class="goal">${bagSVG(bag)}<span><b>Encore 2 jeux pour un ${bag.name}</b><i class="bar"><i style="width:33%"></i></i></span></div>
    <div class="days3"><span class="done">✓ La Roue</span><span>🎯 La Marelle</span><span>🥤 Les Gobelets</span></div>
  </section>
  <h2 class="rdv-h">⏱ Les grands rendez-vous</h2>
  <div class="rdv-grid">
    <article class="panel rdv"><div class="rdv-art" style="--a:linear-gradient(180deg,#8CC6FF,#6FAE55)">${flag}</div><div class="rdv-b"><small class="kick">Tous les jours à 12 h et à 20 h</small><h3>La Grande Course</h3>
      <p>Inscris ta bille : elle court contre celles des autres joueurs. Le podium gagne des bonbecs et un sachet, et tout le monde repart avec 10 bonbecs.</p><p class="t">⏱ Départ dans 2 h 41</p><button class="btn btn-y btn-sm">🏁 M'inscrire · gratuit</button></div></article>
    <article class="panel rdv"><div class="rdv-art" style="--a:linear-gradient(135deg,#1F7A4D,#14506E)">${artLoterie()}</div><div class="rdv-b"><small class="kick">Un ticket gratuit par jour</small><h3>La Loterie</h3>
      <p>Tirage le dimanche à 21 h. 3 bons numéros : un Mammouth + un Sachet Collector + 500 bonbecs !</p><p class="t">⏱ Tirage dans 5 j 3 h</p><button class="btn btn-y btn-sm">🎟 Prendre mon ticket · gratuit</button></div></article>
  </div>
  <h2 class="grid-h">Les jeux</h2>
  <div class="games-grid">
    ${tile("La Marelle", artMarelle(), "linear-gradient(180deg,#FFE9A8,#FFC93F)", 1, "🎁 Partie offerte à jouer", `🎁 ${pip(1,0)} ${pip(4,0)}`, "Jouer")}
    ${tile("Le Plinko", artPachinko(), "linear-gradient(180deg,#CFE8FF,#5AB8FF)", 0, "🎁 Partie du jour à jouer", "", "Jouer")}
    ${tile("Le Ticket à gratter", artGrattage(), "linear-gradient(180deg,#FFD6E7,#FF8FB8)", 0, "🍬 Encore 3 parties à acheter", `🎁 ${pip(1,1)} ${pip(4,1)}`, "Rejouer")}
    ${tile("Le Distributeur", artDistributeur(), "linear-gradient(180deg,#D7F5DF,#7CE59A)", 0, "🍬 Encore 2 parties à acheter", `🎁 ${pip(1,1)} ${pip(4,2)}`, "Rejouer")}
  </div>
  <div class="fonds"><span class="l">★ Faits à fond</span>${[["La Roue","#FFC93F"],["Les Gobelets","#FF8FB8"],["La Toupie","#7CE59A"],["La Pince","#5AB8FF"]].map(([t,c])=>`<span class="g"><i style="--a:${c}"></i>${t} ✓</span>`).join("")}</div>
  </div>`;
  const course = `
  <div class="note"><b>La page de la Grande Course</b> (celle qui s'ouvre en touchant la Grande Course dans les rendez-vous) : le même sélecteur, posé sur la ligne de départ avec un dossard. Il remplace la petite bille « Changer » au-dessus du bouton d'inscription.
  Le reste de la page (le compte à rebours, les lots du podium, les inscrits, les rediffusions) ne change pas.</div>
  <div class="page">
  <div><span class="back">‹ Tous les jeux</span><div class="ph1">La Grande Course</div><small>À 12 h et à 20 h. Toutes les billes ont la même chance.</small></div>
  <section class="gc-start new-mark"><div class="lane"></div>
    <div class="gc-top"><span class="kick" style="color:#fff">🏁 Course du mardi 27 octobre à 20 h</span><span class="gc-clock"><small>Départ dans</small><b>2:41:07</b></span></div>
    <div class="gcs-row">
      <div class="ph-sel">
        <button class="ph-arrow" data-act="cprev" aria-label="Bille précédente">‹</button>
        <div class="ph-ball" id="cball">${img(c, px(c,112), 200)}<span class="bib">n°7</span></div>
        <button class="ph-arrow" data-act="cnext" aria-label="Bille suivante">›</button>
      </div>
      <div class="gcs-txt"><small>Ta coureuse · course de ce soir</small><h3>${esc(name(c))}</h3>
        <p>Toutes les billes ont la même chance : choisis celle que tu veux voir gagner en 3D.</p>
        <div class="gcs-quick">${MINE.slice(0,6).map((_,i)=>quick(i, st.ci, "cset")).join("")}</div></div>
    </div>
    <div class="gcs-go"><button class="btn btn-y">🏁 M'inscrire pour ce soir</button><span>🍬 10 bonbecs pour chaque coureur, même hors podium</span></div>
  </section>
  <section class="panel strip"><div class="gc-prizes"><div class="p1"><b>1er</b>🍬 50 + Sachet Collector</div><div class="p2"><b>2e</b>🍬 30 + Sachet Premium</div><div class="p3"><b>3e</b>🍬 20 + Sachet Classique</div></div>
    <p style="font-size:13px;color:var(--muted);margin-top:8px">Les autres inscrits gagnent 10 bonbecs. 6 inscrits. Inscriptions jusqu'à 19 h 59.</p></section>
  </div>`;
  return part ? course : jeux;
}

// ---------- 2) La cour ----------
const NAV = [
  ["copains","Copains",`<circle cx="12" cy="13" r="6"/><circle cx="30" cy="13" r="6"/><path d="M3 31c1-7 6-10 9-10s8 3 9 10M21 31c1-7 6-10 9-10s8 3 9 10"/>`,1],
  ["troc","Troc",`<path d="M6 10h26l-6-6M36 24H10l6 6"/>`,2],
  ["marche","Marché",`<path d="M4 12h34l-3-8H7zM6 12v18h30V12M15 30v-9h12v9"/><path d="M4 12c0 3 4 3 4 0 0 3 5 3 5 0 0 3 4 3 4 0 0 3 5 3 5 0 0 3 4 3 4 0 0 3 5 3 5 0 0 3 4 3 4 0"/>`],
  ["classement","Classement",`<path d="M15 30V12h12v18M3 30v-9h12M27 30v-13h12v13M1 30h40"/><path d="M21 4l1.5 3 3 .4-2.2 2 .6 3-2.9-1.5-2.9 1.5.6-3-2.2-2 3-.4z"/>`],
  ["journal","Historique",`<path d="M9 3h22v28H9zM14 10h12M14 16h12M14 22h8"/>`],
];
function vCour(){
  const me = MINE[0];
  return `<div class="note"><b>Le principe :</b> la cour devient un lieu. Le sol est en bitume et on y écrit à la craie : les titres, le plan de la cour (les 5 onglets) et le podium.
  Ce qu'on y pose est en papier : un petit mot plié pour chaque troc et chaque demande de copain, des étiquettes kraft au marché, un carnet pour l'historique.
  C'est le même esprit que le cahier de la Boîte à billes, et ça reste lisible en mode sombre comme en mode clair, parce que la cour garde toujours ses couleurs.</div>
  <section class="cour">
    <div class="c-head"><h1 class="chalk"><span>Tout le monde dehors !</span>La cour de récré</h1>
      <div class="c-me">${img(me, 44, 96)}<div><small>Ton pseudo, à donner aux copains</small><b>Billou</b></div><button>Copier</button></div></div>
    <nav class="c-nav" role="tablist">${NAV.map(([k,l,svg,n])=>`<button class="cn" role="tab" data-tab="${k}" aria-selected="${st.tab===k}"><svg viewBox="0 0 42 34">${svg}</svg><b>${l}</b>${n?`<span class="n">${n}</span>`:""}</button>`).join("")}</nav>
    <div class="c-body">${({copains:tCopains, troc:tTroc, marche:tMarche, classement:tClass, journal:tJournal})[st.tab]()}</div>
  </section>`;
}
function tCopains(){
  return `<div class="c-h"><h3>✨ Trouvailles rares</h3><small>Chez tes copains, ces 2 derniers jours</small></div>
  <div class="finds">${FINDS.map(([w,s,t],i)=>{ const r = FAMILIES[s.family].rar; return `<div class="fc" style="--dc:${s.shiny?"#C78BFF":DECOR_RAR[r].c};--r:${[-2,1.5,-1,2,-1.5][i]}deg"><div class="in"><div class="st"><span>${TYPES[s.type].label}</span><span>${"★".repeat(1+TIDX[s.type])}</span></div>${img(s, px(s,70))}<b>${esc(name(s))}</b><small>${w} · ${t}</small></div></div>` }).join("")}</div>
  <div class="c-grid">
    <div><div class="c-h"><h3>Le banc des copains</h3><small>${MATES.length} copains</small></div>
      <label class="srch" style="margin:0 4px 14px">🔍<input class="mate-q" data-for=".bench .mate[data-q]" placeholder="Chercher un copain…" autocomplete="off"></label>
      <p class="c-none" hidden>Aucun copain ne s'appelle comme ça.</p>
      <div class="bench">${MATES.map(([p,s,n])=>`<div class="mate" data-q="${fold(p)}">${n?`<span class="new">Trouvaille !</span>`:""}<span class="ring">${img(s, px(s,64))}</span><b>${p}</b><small>joue avec ${esc(FAMILIES[s.family].name)}</small><div class="acts"><button class="tr">⇄ Troc</button><button>Sa fiche</button></div></div>`).join("")}
        <div class="mate add"><span class="ring">+</span><b>Un copain</b><small>avec son pseudo</small></div></div></div>
    <div class="notes"><div class="c-h" style="margin-bottom:0"><h3>Petits mots</h3><small>2 demandes</small></div>
      ${["Zoé","Tom"].map((p,i)=>`<div class="paper seyes note-p" style="rotate:${i?1.2:-1}deg"><span class="tape"></span><div class="from">${p}</div><p>veut être ton copain · il y a ${i?"3 h":"20 min"}</p><div class="acts"><button class="btn btn-y btn-sm">✓ Accepter</button><button class="btn btn-g btn-sm">Non merci</button></div></div>`).join("")}
      <div class="paper seyes add-p" style="rotate:-.6deg"><label for="np">Ajouter un copain</label><form onsubmit="return false"><input id="np" placeholder="son pseudo…" autocomplete="off"><button class="btn btn-y btn-sm">Ajouter</button></form></div>
    </div>
  </div>`;
}
function tTroc(){
  const pocket = (cls, lbl, col, list, b, tag) => `<div class="pocket" style="--pc:${col}"><small>${lbl}</small><div class="bl">${list.map(s=>img(s, px(s,44), 96)).join("")}${b?`<span style="font:400 17px/1 var(--display)">+ ${COIN} ${b}</span>`:""}</div><span class="tag">${tag}</span></div>`;
  const offers = st.tt==="recues" ? [
      ["Léa", [MATES[0][1]], 0, [MINE[6], MINE[7]], 0, "« Je te l'échange contre tes deux doubles, ça te va ? »", "il y a 12 min", "Expire dans 47 h", "✨ Motif qui te manque", "Tu ne donnes que des doubles"],
      ["Noé", [MATES[3][1]], 0, [MINE[1]], 40, "", "il y a 3 h", "Expire dans 44 h", "✨ Motif qui te manque", "Ton seul exemplaire"]]
    : st.tt==="envoyees" ? [["Jade", [MATES[4][1]], 0, [MINE[5]], 0, "« Ta shiny contre ma mini épique ? »", "hier", "Expire dans 21 h", "✨ Shiny que tu n'as pas", "Tu ne donnes que des doubles"]] : [];
  return `<div class="c-h"><h3>Proposer un troc à…</h3><small>Touche un copain</small></div>
  <label class="srch" style="margin:0 4px 10px">🔍<input class="mate-q" data-for=".who-row .who" placeholder="Écris le pseudo de ton copain…" autocomplete="off"></label>
  <p class="c-none" hidden>Aucun copain ne s'appelle comme ça.</p>
  <div class="who-row">${MATES.map(([p,s])=>`<button class="who" data-q="${fold(p)}"><span>${img(s, px(s,48), 96)}</span>${p}</button>`).join("")}</div>
  <div class="ttabs">${[["recues","Reçus",2],["envoyees","Envoyés",1],["finis","Terminés"]].map(([k,l,n])=>`<button class="ttab" data-tt="${k}" aria-pressed="${st.tt===k}">${l}${n?`<span class="n">${n}</span>`:""}</button>`).join("")}</div>
  <div class="offers">${offers.length ? offers.map(([p,get,gb,give,vb,mot,t,end,tg,tv],i)=>`<div class="paper seyes offer" style="rotate:${i%2?.6:-.5}deg"><span class="tape"></span>
      <div class="oh"><b>${st.tt==="recues"?`${p} te propose :`:`Ton troc avec ${p}`}</b><span class="end">⏳ ${end}</span><time>${t}</time></div>
      <div class="pockets">${pocket("get","Tu reçois","#2FA35A",get,gb,tg)}<span class="swap">⇄</span>${pocket("give","Tu donnes","#E8743B",give,vb,tv)}</div>
      ${mot?`<p class="mot">${mot}</p>`:""}
      <div class="acts">${st.tt==="recues"?`<button class="btn btn-y btn-sm">✓ Accepter</button><button class="btn btn-g btn-sm">⇄ Contre-proposer</button><button class="btn btn-g btn-sm">Refuser</button>`:`<button class="btn btn-g btn-sm">Annuler ce troc</button>`}</div></div>`).join("")
    : `<div class="paper seyes offer"><p class="mot">Pas encore de troc terminé. Les trocs acceptés ou refusés s'afficheront ici.</p></div>`}</div>`;
}
function tMarche(){
  return `<div class="stall"><div class="awning"></div><div class="stall-in"><h3>Le marché de la cour</h3><p>Tu as <b>23 doubles</b> : vends-les aux autres joueurs, à prix fixe ou aux enchères.</p><button class="btn btn-y">+ Vendre une bille</button></div></div>
  <div class="mk-tools"><label class="srch">🔍<input placeholder="Galaxie, Rubis, shiny, un vendeur…"></label>
    <button class="fchip" aria-pressed="true">Tout</button><button class="fchip">🔨 Enchères</button><button class="fchip">✨ Me manque</button><button class="fchip">Filtres ▾</button></div>
  <div class="mk-tools"><button class="fchip" aria-pressed="true">À vendre</button><button class="fchip">Mes annonces · 3</button><button class="fchip">Mes enchères · 1</button></div>
  <div class="mk-leg"><span><i style="--c:var(--kraft)"></i>Étiquette kraft : prix fixe, tu achètes tout de suite</span><span><i style="--c:#C8402F"></i>Étiquette rouge : aux enchères, tu fais une offre</span></div>
  <div class="tags">${MARKET.map(([s,p,avg,who,miss,time],i)=>`<div class="ptag${time?" auc":""}" style="--r:${[-2,1.5,-1,2.2,1,-1.8,2,-1][i]}deg">${miss?`<span class="miss">✨ Te manque</span>`:""}
      <span class="kind">${time?"🔨 Aux enchères":"Prix fixe"}</span><span class="bw">${img(s, px(s,70))}</span><b>${esc(name(s))}</b>
      <span class="price">${COIN}${p}</span>${time?`<span class="avg">meilleure offre · 3 offres</span><span class="time">🔨 ${time}</span>`:`<span class="avg">${avg?`prix moyen ${avg}`:""}</span>`}
      <span class="sel">par ${who}</span></div>`).join("")}</div>`;
}
function tClass(){
  const [a,b,c] = TOP;
  const step = (x, k) => `<div class="cp-st p${k}">${k===1?`<span class="crown">👑</span>`:""}${img(x[1], px(x[1], k===1?78:60))}<b>${x[0]}</b><small>${x[2].toLocaleString("fr-FR")} pts</small><span class="step">${k}</span></div>`;
  return `<div class="cl-sw"><button class="fchip" aria-pressed="true">🏆 Général</button><button class="fchip">⏱ Cette semaine</button><button class="fchip">⭐ Palmarès</button><span style="flex:1"></span><button class="fchip" aria-pressed="true">Tout le monde</button><button class="fchip">Mes copains</button></div>
  <div class="chalk-pod">${step(b,2)}${step(a,1)}${step(c,3)}</div>
  <div class="c-grid" style="margin-top:4px">
    <div class="board">${TOP.slice(3).map((x,i)=>`<div class="br${x[0]==="Toi"?" me":""}"><span class="rk">${i+4}</span>${img(x[1], 38, 96)}<span class="nm">${x[0]}<small>${30+i*7} motifs</small></span><span class="pt">${x[2].toLocaleString("fr-FR")}</span></div>`).join("")}</div>
    <div class="paper seyes me-card"><span class="tape"></span><span class="medal">5e</span><div class="sc"><small>Ton score · sur 48</small><b>2 875 pts</b><p>Plus que 246 pts pour passer devant Malo !</p></div></div>
  </div>`;
}
function tJournal(){
  // [icône, couleur, texte, billes, montant, heure et type]
  const TR = "#2FA35A", VE = "#E85D9A", AC = "#2E6BE6", EN = "#E8743B", NO = "#8E8898";
  const E = [["Aujourd'hui",[["⇄",TR,`Troc avec <b>Léa</b> : tu as reçu`,[MATES[0][1]],"","14 h 32 · Troc accepté"],["🍬",VE,`<b>Malo</b> a acheté ta bille`,[MINE[7]],"+80","11 h 05 · Vente"],["⇄",TR,`Troc avec <b>Sacha</b> : tu as reçu`,[MATES[5][1]],"","10 h 47 · Troc accepté"],["🔨",EN,`Tu as enchéri sur une bille de <b>Hugo</b>`,[MARKET[2][0]],"","9 h 12 · Enchère · tu es en tête"]]],
    ["Hier",[["🛒",AC,`Tu as acheté une bille à <b>Jade</b>`,[MARKET[3][0]],"−340","20 h 18 · Achat"],["✗",NO,`<b>Noé</b> a refusé ton troc`,[],"","17 h 40 · Troc refusé"]]],
    ["Lundi 26 octobre",[["⇄",TR,`Troc avec <b>Inès</b> : tu as reçu`,[MATES[2][1], MINE[3]],"","16 h 02 · Troc accepté"]]]];
  return `<div class="hfilt"><button class="fchip" aria-pressed="true">Tout</button><button class="fchip">Troc</button><button class="fchip">Marché</button></div>
  <div class="paper seyes carnet"><span class="tape"></span>${E.map(([d,l])=>`<div class="day">${d}</div>${l.map(([ico,c,t,b,amt,h])=>`<div class="ev" style="--ec:${c}"><span class="ico">${ico}</span><p>${t} <span class="bl">${b.map(s=>img(s, 26, 96)).join("")}</span><small>${h}</small></p><span class="amt ${amt.startsWith("+")?"plus":amt?"minus":""}">${amt?`${amt} ${COIN}`:""}</span></div>`).join("")}`).join("")}</div>`;
}

// ---------- le dessin et les clics ----------
function render(){
  frame.className = "frame" + (st.w==="phone" ? " phone" : "");
  frame.innerHTML = st.part==="cour" ? vCour() : vBille(st.part==="course");
}
document.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.part){ st.part = b.dataset.part; document.querySelectorAll("[data-part]").forEach(x=>x.setAttribute("aria-pressed", x===b)); render(); return }
  if(b.dataset.w){ st.w = b.dataset.w; document.querySelectorAll("[data-w]").forEach(x=>x.setAttribute("aria-pressed", x===b)); render(); return }
  if(b.dataset.tab){ st.tab = b.dataset.tab; render(); return }
  if(b.dataset.tt){ st.tt = b.dataset.tt; render(); return }
  const a = b.dataset.act; if(!a) return;
  const n = 6, g = a[0]==="g";
  const k = g ? "gi" : "ci";
  if(g) st.seen = true;
  if(a.endsWith("prev")) st[k] = (st[k]+n-1)%n; else if(a.endsWith("next")) st[k] = (st[k]+1)%n; else st[k] = +b.dataset.i;
  render();
  const el = document.getElementById(g ? "gball" : "cball"); el?.classList.add("swap");
});
// la recherche d'un copain (banc et troc) : cache ceux qui ne correspondent pas, sans tout redessiner
document.addEventListener("input", e=>{
  if(!e.target.classList.contains("mate-q")) return;
  const q = fold(e.target.value).trim(); let n = 0;
  document.querySelectorAll(e.target.dataset.for).forEach(x=>{ const ok = !q || x.dataset.q.includes(q); x.hidden = !ok; n += ok });
  document.querySelector(".c-none")?.toggleAttribute("hidden", n>0);
});
render();
</script>
