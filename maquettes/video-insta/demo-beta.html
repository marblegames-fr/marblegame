<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tikalo · vidéo Bêta jusqu'au 1er décembre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gluten:wght@900&family=Lilita+One&family=Nunito:wght@700;800;900&family=Caveat:wght@700&display=swap">
<style>
/* La 9e vidéo Instagram de Tikalo (23 octobre 2026) : le lancement est reporté au 1er décembre 2026, la bêta dure un mois de plus.
   Les nouveaux joueurs peuvent encore réclamer leurs 6 billes Bêta (une par taille, avec le β d'or) jusqu'au 30 novembre au soir,
   et nous aider à améliorer le jeu (bouton « Signaler un bug », leurs idées).
   Même moteur que demo-shiny.html (scènes, repères, musique générée à 120 BPM, enregistrement de l'onglet) ; les billes qui tombent
   font le vrai rebond de bille en verre du jeu (tikalo-demo-sons.js).
   Pour vérifier une image précise : demo-beta.html?s=2&at=3 (scène 2, figée à 3 s), &film pour cacher la barre.
   L'image de couverture : demo-beta.html?cover&film, en 1080 × 1920 (couverture-beta.png). */
:root{
  --night:#1B1446; --night-2:#3A2A8C; --night-3:#0A0724; --ink:#1A1B33;
  --yellow:#FFC93F; --yellow-2:#F2AE12; --pink:#FF4FA3; --cyan:#2EE6E6; --green:#2FCF6A; --violet:#8B6CFF; --red:#E5484D;
  --display:"Lilita One","Arial Rounded MT Bold",sans-serif; --logo:"Gluten","Lilita One",sans-serif; --body:"Nunito","Segoe UI",system-ui,sans-serif; --hand:"Caveat",cursive;
  --ui-bg:#0A0B16; --ui-panel:#15172A; --ui-line:#2C3050; --ui-ink:#E9EBFF;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ui-bg);color:var(--ui-ink);font-family:var(--body);display:flex;flex-direction:column;overflow:hidden}
button,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}

/* ---------- la scène : un ciel de nuit plein d'étoiles ---------- */
.wrap{flex:1;min-height:0;display:grid;place-items:center;padding:16px}
#stage{--rc:#8B6CFF;position:relative;overflow:hidden;width:var(--sw);height:var(--sh);font-size:calc(var(--u)*4);color:#fff;border-radius:18px;
  background:radial-gradient(60% 40% at 50% 46%,var(--night-2),var(--night) 60%,var(--night-3));box-shadow:0 30px 80px -30px #000}
body.film .wrap{padding:0} body.film #stage{border-radius:0;box-shadow:none}
.bg{position:absolute;inset:0;pointer-events:none}
.bg .stars{position:absolute;inset:0;opacity:.55;
  background-image:radial-gradient(circle,#fff calc(var(--u)*.22),transparent calc(var(--u)*.3)),radial-gradient(circle,#FFE9A0 calc(var(--u)*.18),transparent calc(var(--u)*.26)),radial-gradient(circle,#BFD8FF calc(var(--u)*.16),transparent calc(var(--u)*.24));
  background-size:calc(var(--u)*13) calc(var(--u)*17),calc(var(--u)*19) calc(var(--u)*23),calc(var(--u)*7) calc(var(--u)*11);background-position:0 0,calc(var(--u)*6) calc(var(--u)*9),calc(var(--u)*3) calc(var(--u)*2);
  animation:twinkle 2.4s ease-in-out infinite alternate}
@keyframes twinkle{to{opacity:.3}}
.bg .burst{position:absolute;left:50%;top:46%;width:calc(var(--u)*240);height:calc(var(--u)*240);margin:calc(var(--u)*-120);border-radius:50%;
  background:repeating-conic-gradient(from 0deg,var(--rc) 0 9deg,transparent 9deg 22deg);opacity:.32;-webkit-mask:radial-gradient(circle,#000 8%,transparent 55%);mask:radial-gradient(circle,#000 8%,transparent 55%);
  animation:spin 14s linear infinite;transition:opacity .4s}
.bg .glow{position:absolute;left:50%;top:46%;width:calc(var(--u)*110);height:calc(var(--u)*110);margin:calc(var(--u)*-55);border-radius:50%;background:radial-gradient(circle,var(--rc),transparent 62%);opacity:.45;transition:background .4s}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:8}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9}
#flash.go{animation:fl .6s ease-out}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
.cam{position:absolute;inset:0;z-index:2}
.cam.shake{animation:shake .38s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translate(-1%,0)}20%,80%{transform:translate(1.4%,.6%)}30%,50%,70%{transform:translate(-1.8%,-.6%) rotate(-.6deg)}40%,60%{transform:translate(1.8%,.4%) rotate(.6deg)}}

/* le bas de l'image est laissé libre : sur Instagram, la légende et les boutons passent par-dessus */
.sc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*3.6);padding:calc(var(--u)*12) calc(var(--u)*6) calc(var(--u)*18);text-align:center;opacity:0;visibility:hidden}
.sc.on{opacity:1;visibility:visible}
.sc.out{visibility:visible;animation:sc-out .3s ease-in forwards}
@keyframes sc-out{to{opacity:0;transform:scale(1.15);filter:blur(calc(var(--u)*.8))}}

.mini-logo{position:absolute;top:calc(var(--u)*4.6);left:50%;transform:translateX(-50%);z-index:6;transition:opacity .3s}
#stage.big-logo .mini-logo,#stage.no-logo .mini-logo{opacity:0}
.logo{display:flex;align-items:flex-end;font-family:var(--logo);font-weight:900;line-height:1;letter-spacing:.02em}
.logo .lt{display:inline-block;position:relative;color:var(--yellow);-webkit-text-stroke:.16em var(--ink);paint-order:stroke fill;
  text-shadow:0 .04em 0 #F59E0B,0 .08em 0 #E07B00,0 .13em 0 var(--ink),0 .2em .3em rgba(0,0,0,.5)}
.logo .lt:nth-child(1){transform:translateY(-.02em) rotate(-6deg)} .logo .lt:nth-child(2){transform:translateY(-.10em) rotate(4deg)}
.logo .lt:nth-child(3){transform:translateY(.02em) rotate(-3deg)} .logo .lt:nth-child(4){transform:translateY(-.08em) rotate(5deg)}
.logo .lt:nth-child(5){transform:rotate(-4deg)} .logo .lt:nth-child(6){transform:translateY(-.04em) rotate(3deg)}
.logo .i img{position:absolute;left:50%;top:-.2em;width:.27em;height:.27em;margin-left:-.12em;border-radius:50%;box-shadow:0 0 0 .05em var(--ink);filter:drop-shadow(0 .06em 0 var(--ink))}
.mini-logo .logo{font-size:calc(var(--u)*6.5)}

/* ---------- la typo qui claque ---------- */
.slam{font-family:var(--display);line-height:.92;letter-spacing:.01em;color:#fff;-webkit-text-stroke:calc(var(--u)*.55) var(--ink);paint-order:stroke fill;text-shadow:0 calc(var(--u)*1) 0 var(--ink),0 calc(var(--u)*2) calc(var(--u)*3) rgba(0,0,0,.45)}
.slam.xl{font-size:calc(var(--u)*16)} .slam.l{font-size:calc(var(--u)*12)} .slam.m{font-size:calc(var(--u)*8.5)} .slam.s{font-size:calc(var(--u)*6.4)}
.slam .y{color:var(--yellow)}
.word{display:inline-block;opacity:0}
.on .word{animation:slam .42s cubic-bezier(.2,1.6,.35,1) forwards;animation-delay:var(--d)}
@keyframes slam{from{opacity:0;transform:scale(2.6) rotate(var(--r,-8deg));filter:blur(calc(var(--u)*.6))}to{opacity:1;transform:rotate(var(--rr,0deg))}}
.hand{font-family:var(--hand);line-height:1.05;color:#FFE9A0;transform:rotate(-3deg)}
.hand.l{font-size:calc(var(--u)*10)} .hand.m{font-size:calc(var(--u)*7.6)} .hand.s{font-size:calc(var(--u)*6)}
.hand b{color:#FFB3D6}
.in{opacity:0}
.on .in{animation:pop .5s cubic-bezier(.2,1.5,.4,1) forwards;animation-delay:var(--d,0s)}
.on .in.up{animation-name:up;animation-timing-function:cubic-bezier(.2,.9,.3,1)}
@keyframes pop{from{opacity:0;transform:scale(.4) rotate(var(--r0,0deg))}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(calc(var(--u)*8))}to{opacity:1;transform:none}}
.mb{display:block;width:100%;height:auto;aspect-ratio:1;filter:drop-shadow(0 calc(var(--u)*1.2) calc(var(--u)*1.4) rgba(0,0,0,.55))}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{to{transform:translateY(calc(var(--u)*-1.5)) rotate(5deg)}}
@keyframes shim{to{background-position:200% 0}}
.tag{display:inline-block;font-weight:900;font-size:calc(var(--u)*3.2);text-transform:uppercase;letter-spacing:.05em;padding:calc(var(--u)*.7) calc(var(--u)*2.4);border-radius:999px;color:var(--ink);border:calc(var(--u)*.35) solid var(--ink);
  background:linear-gradient(90deg,#FFF3C4,#FFC93F,#E8A317,#FFE38A)}

/* 1. l'accroche : le mégaphone */
.mega{font-size:calc(var(--u)*24);line-height:1;filter:drop-shadow(0 calc(var(--u)*1) 0 var(--ink))}
.on .mega{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both,wig .5s ease-in-out .6s infinite alternate}
@keyframes wig{from{transform:rotate(-8deg)}to{transform:rotate(8deg) scale(1.06)}}

/* 2. le calendrier : le 1er novembre barré, le 1er décembre tamponné */
.cals{display:flex;align-items:center;gap:calc(var(--u)*4)}
.cal{position:relative;width:calc(var(--u)*34);border-radius:calc(var(--u)*3);background:#FFFDF6;color:var(--ink);border:calc(var(--u)*.6) solid var(--ink);box-shadow:0 calc(var(--u)*1.4) 0 var(--ink)}
.cal .mo{display:block;padding:calc(var(--u)*1.4) 0;font-family:var(--display);font-size:calc(var(--u)*5.4);letter-spacing:.04em;color:#fff;background:var(--red);border-bottom:calc(var(--u)*.6) solid var(--ink);border-radius:calc(var(--u)*2.4) calc(var(--u)*2.4) 0 0}
.cal .dd{display:block;padding:calc(var(--u)*1) 0 calc(var(--u)*1.8);font-family:var(--display);font-size:calc(var(--u)*17);line-height:1}
.cal .dd sup{font-size:.36em;vertical-align:top;position:relative;top:.35em}
.cal.old{transform:rotate(-6deg)}
.cal.old::after{content:"";position:absolute;left:-10%;right:-10%;top:52%;height:calc(var(--u)*2.2);background:var(--red);border-radius:999px;transform:rotate(-24deg) scaleX(0);transform-origin:0 50%;box-shadow:0 0 0 calc(var(--u)*.5) var(--ink)}
.on .cal.old::after{animation:strike .35s ease-out forwards;animation-delay:var(--sd)}
@keyframes strike{to{transform:rotate(-24deg) scaleX(1)}}
.on .cal.old{animation:dim .4s ease forwards;animation-delay:var(--sd)}
@keyframes dim{to{opacity:.55;filter:grayscale(.6)}}
.cal.new{transform:rotate(5deg)}
.cal.new .mo{background:#2F6BEA}
.arrow{font-family:var(--display);font-size:calc(var(--u)*10);color:var(--yellow);-webkit-text-stroke:calc(var(--u)*.4) var(--ink);paint-order:stroke fill}
.stamp{position:absolute;right:calc(var(--u)*-4);bottom:calc(var(--u)*-4);white-space:nowrap;font-family:var(--display);font-size:calc(var(--u)*3.6);line-height:1;color:#fff;background:var(--green);
  padding:calc(var(--u)*1.2) calc(var(--u)*2);border-radius:calc(var(--u)*1.6);border:calc(var(--u)*.45) solid var(--ink);box-shadow:0 calc(var(--u)*.7) 0 var(--ink);transform:rotate(-10deg)}

/* 3. les billes Bêta : une de chaque taille, de la Mini au Mammouth */
.betas{display:grid;grid-template-columns:repeat(3,calc(var(--u)*27));gap:calc(var(--u)*2.4) calc(var(--u)*1.6);align-items:end;justify-items:center}
.betas .it{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*.6);opacity:0}
.on .betas .it{animation:drop .55s cubic-bezier(.3,1.6,.5,1) forwards;animation-delay:var(--d)}
@keyframes drop{from{opacity:0;transform:translateY(calc(var(--u)*-26)) scale(.7)}to{opacity:1;transform:none}}
.betas .ball{width:var(--w);position:relative}
.on .betas .ball{animation:float 1.5s ease-in-out infinite alternate;animation-delay:calc(var(--d) + .6s)}
.betas .ball::before{content:"";position:absolute;inset:-14%;border-radius:50%;background:radial-gradient(circle,rgba(255,201,63,.55),transparent 62%)}
.betas .ball .mb{position:relative}
.betas b{font-family:var(--display);font-size:calc(var(--u)*4.2);line-height:1;color:#fff;-webkit-text-stroke:calc(var(--u)*.25) var(--ink);paint-order:stroke fill}
.betas small{font-weight:900;font-size:calc(var(--u)*2.7);color:#C9C2FF;text-transform:uppercase;letter-spacing:.06em}
.beta-t .bt{display:inline-block;font-family:var(--display);color:var(--yellow);background:var(--ink);border-radius:calc(var(--u)*2);padding:0 calc(var(--u)*1.8);margin-left:calc(var(--u)*1);-webkit-text-stroke:0;transform:rotate(4deg)}

/* 4. comment faire : 3 étapes */
.steps{display:flex;flex-direction:column;gap:calc(var(--u)*2.4);width:calc(var(--u)*84)}
.step{display:flex;align-items:center;gap:calc(var(--u)*3);padding:calc(var(--u)*2.2) calc(var(--u)*3);border-radius:calc(var(--u)*3.4);background:rgba(255,255,255,.1);border:calc(var(--u)*.4) solid rgba(255,255,255,.22);text-align:left;opacity:0}
.on .step{animation:slide .5s cubic-bezier(.2,1.4,.4,1) forwards;animation-delay:var(--d)}
@keyframes slide{from{opacity:0;transform:translateX(calc(var(--u)*-20)) rotate(-3deg)}to{opacity:1;transform:none}}
.step .n{flex:none;width:calc(var(--u)*11);height:calc(var(--u)*11);border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:calc(var(--u)*6);color:var(--ink);background:var(--yellow);border:calc(var(--u)*.45) solid var(--ink);box-shadow:0 calc(var(--u)*.7) 0 var(--ink)}
.step p{font-weight:900;font-size:calc(var(--u)*4.4);line-height:1.15}
.step p small{display:block;font-weight:800;font-size:.72em;color:#C9C2FF;margin-top:calc(var(--u)*.4)}
.step .em{flex:none;margin-left:auto;font-size:calc(var(--u)*8)}
.step .em.mbs{width:calc(var(--u)*12)}

/* 5. l'appel final */
.url{font-family:var(--display);font-size:calc(var(--u)*8.5);padding:calc(var(--u)*2) calc(var(--u)*6);border-radius:999px;background:var(--yellow);color:var(--ink);
  box-shadow:0 calc(var(--u)*1.2) 0 var(--yellow-2),0 0 calc(var(--u)*8) rgba(255,201,63,.5)}
.on .url.in{animation:pop .5s cubic-bezier(.2,1.5,.4,1) forwards,beat .5s ease-in-out infinite;animation-delay:var(--d),calc(var(--d) + .5s)}
@keyframes beat{0%{transform:scale(1)}15%{transform:scale(1.07)}100%{transform:scale(1)}}
.giant{font-size:calc(var(--u)*16)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(var(--u)*1.6)}
.chips span{font-weight:900;font-size:calc(var(--u)*3.3);padding:calc(var(--u)*.8) calc(var(--u)*2.6);border-radius:999px;background:rgba(255,255,255,.1);border:calc(var(--u)*.35) solid rgba(255,255,255,.25)}
.launch{font-family:var(--hand);font-size:calc(var(--u)*7.4);color:#FFB3D6;transform:rotate(-3deg)}
.row6{display:flex;align-items:flex-end;gap:calc(var(--u)*.6)}
.row6 span{display:block;width:var(--w)}
.on .row6 span{animation:float 1.4s ease-in-out infinite alternate;animation-delay:var(--fd)}

/* ---------- l'image de couverture : tout l'important au milieu (la grille du profil coupe le haut et le bas en 3:4) ---------- */
.cov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*2.6);text-align:center;padding:0 calc(var(--u)*5)}
.cov .kick{font-family:var(--display);font-size:calc(var(--u)*7.4);line-height:1;color:#fff;-webkit-text-stroke:calc(var(--u)*.5) var(--ink);paint-order:stroke fill;text-shadow:0 calc(var(--u)*.9) 0 var(--ink);transform:rotate(-3deg)}
.cov .ttl{font-family:var(--display);font-size:calc(var(--u)*17);line-height:.88;color:var(--yellow);-webkit-text-stroke:calc(var(--u)*.7) var(--ink);paint-order:stroke fill;
  text-shadow:0 calc(var(--u)*1.3) 0 var(--ink),0 0 calc(var(--u)*7) rgba(255,201,63,.45)}
.cov .ttl sup{font-size:.4em;vertical-align:top;position:relative;top:.3em}
.cov .old{font-family:var(--display);font-size:calc(var(--u)*6);color:#C9C2FF;text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:calc(var(--u)*1.1)}
.cov .row6{margin:calc(var(--u)*2) 0}
.cov .tag{font-size:calc(var(--u)*3.9)}
.cov .cov-logo{position:absolute;top:calc(var(--u)*9);left:50%;transform:translateX(-50%)}
.cov .cov-logo .logo{font-size:calc(var(--u)*9)}
.cov .hand{font-size:calc(var(--u)*7)}

/* ---------- la barre de pilotage ---------- */
.bar{flex:none;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:10px 16px 14px;border-top:1px solid var(--ui-line);background:var(--ui-panel)}
.bar button,.bar select{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--ui-line);background:#1E2140;color:var(--ui-ink);font-weight:800;font-size:13.5px}
.bar button:hover{background:#272B52}
.bar button.rec{background:#E5484D;border-color:#E5484D;color:#fff}
.bar button.on{background:var(--yellow);color:#24253D;border-color:var(--yellow)}
.bar .sep{width:1px;height:24px;background:var(--ui-line)}
.bar .dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.bar .dots button{padding:0 9px;font-size:12px;height:30px}
.hint{font-size:12px;color:#8E93C4;font-weight:700}
body.film .bar{display:none}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--ui-bg);font-weight:800;z-index:20}
@media (max-width:640px){ .bar .hint,.bar .sep{display:none} }
</style>
</head>
<body>
<div class="loading" id="loading">Préparation des billes…</div>
<div class="wrap"><div id="stage" aria-label="Vidéo Tikalo : la bêta continue jusqu'au 1er décembre"></div></div>
<div class="bar" id="bar">
  <button id="b-play">⏸ Pause</button>
  <button id="b-restart">⏮ Recommencer</button>
  <button id="b-sound">🔇 Son coupé</button>
  <span class="dots" id="dots"></span>
  <span class="sep"></span>
  <select id="b-format" aria-label="Format">
    <option value="9:16">9:16 · Reels, TikTok, Shorts</option>
    <option value="4:5">4:5 · fil Instagram / Facebook</option>
    <option value="1:1">1:1 · carré</option>
  </select>
  <button id="b-film">Mode tournage (H)</button>
  <button id="b-rec" class="rec">● Enregistrer la vidéo</button>
  <span class="hint">Espace : pause · ← → : scène · H : cacher la barre · M : son</span>
</div>

<script src="../tikalo-demo-rendu.js"></script>
<script src="tikalo-demo-sons.js"></script>
<script>
/* =====================================================================
   LA VIDÉO : 5 scènes, environ 28 secondes, calées sur 120 BPM
   ===================================================================== */
const STAGE = document.getElementById("stage");
const BEAT = .5;
const cache = new Map();
const url = (s, px) => { const k = `${s.seed}|${s.type}|${s.family}|${s.pal}|${s.shiny}|${px}`; if(!cache.has(k)) cache.set(k, marbleURL(s, px)); return cache.get(k) };
const img = (s, px, attrs="") => `<img class="mb" src="${url(s, px)}" alt="" ${attrs}>`;
const words = (txt, d0, step=BEAT/2, cls="") => txt.split(" ").map((w,i)=>`<span class="word ${cls}" style="--d:${(d0+i*step).toFixed(2)}s;--r:${(i%2?8:-8)}deg">${w}</span>`).join(" ");
const logoHTML = (cls="") => `<div class="logo ${cls}"><span class="lt">T</span><span class="lt i">ı<img src="${url(LOGO_SPEC,160)}" alt=""></span><span class="lt">k</span><span class="lt">a</span><span class="lt">l</span><span class="lt">o</span></div>`;
// les 6 billes Bêta, exactement comme dans le jeu (index.html : famille BETA.fam, un coloris précieux par taille, le β d'or)
const BETAS = TK.map(t=>{ const s = makeSpec(t, {family:BETA.fam, pal:BETA.palOf(t), shiny:0}); s.secret = "beta"; return s });
const PAL_NAME = s => PALETTES[s.pal][0];
const SIZE_NAME = {mini:"Mini", bille:"Bille", chinoise:"Chinoise", calot:"Calot", boulet:"Boulet", mammouth:"Mammouth"};
const row6 = (k=1) => `<div class="row6">${BETAS.map((s,i)=>`<span style="--w:calc(var(--u)*${((7+7*scaleOf(s.type))*k).toFixed(1)});--fd:${(i*.15).toFixed(2)}s">${img(s, 260)}</span>`).join("")}</div>`;

/* ---------- les scènes : html() dessine, cues = [temps (s), action] pour le son, les confettis et les secousses ---------- */
const SCENES = [
  {name:"Annonce", dur:3.6, logo:"small", rc:"#E5484D", html:()=>`
      <div class="mega">📢</div>
      <h1 class="slam l">${words("PETIT", .3, .2)}<br><span class="y">${words("CHANGEMENT !", .55, .2)}</span></h1>
      <p class="hand m in" style="--d:1.5s">Le lancement de Tikalo<br>est <b>reporté</b>…</p>`,
    cues:[[0,"hit"],[.3,"hit"],[.55,"hit2"],[.75,"boom"],[.75,"shake"],[1.5,"chime"]]},
  {name:"1er décembre", dur:5.4, logo:"small", rc:"#2F6BEA", html:()=>`
      <div class="cals">

/* ---------- les effets : confettis (canvas), secousses, flash ---------- */
const FX = (() => {
  let cv, cx, parts = [], W = 0, H = 0;
  const PAL = {gold:["#FFC93F","#FFE38A","#F2AE12","#fff"], rainbow:["#FF6FB5","#FFB547","#FFE14D","#6FE3A8","#5AB8FF","#B07BFF"], beta:["#D7263D","#1FA463","#2F6BEA","#8C3FD9","#FFC94A","#F7FCFF"]};
  function fit(){ cv = document.getElementById("fx"); if(!cv) return; const r = cv.getBoundingClientRect(); W = r.width; H = r.height; cv.width = W*devicePixelRatio; cv.height = H*devicePixelRatio; cx = cv.getContext("2d"); cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0) }
  function burst(pal, n){
    if(!cx) return; const x = W/2, y = H*.42, cols = PAL[pal] || PAL.gold, sp = W/100;
    for(let i=0;i<n;i++){ const a = Math.random()*Math.PI*2, v = (1.2+Math.random()*3.2)*sp*.55;
      parts.push({x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v - sp*.5, g:sp*.045, life:1, d:.008+Math.random()*.012, s:sp*(.5+Math.random()*.9), c:cols[i%cols.length], r:Math.random()*6, vr:(Math.random()-.5)*.4, k:Math.random()<.45 }) }
  }
  function frame(){
    if(cx){ cx.clearRect(0,0,W,H);
      if(!paused) parts = parts.filter(p=>p.life>0);
      for(const p of parts){ if(!paused){ p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= .985; p.r += p.vr; p.life -= p.d }
        cx.save(); cx.globalAlpha = Math.max(0, Math.min(1, p.life*2)); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c;
        if(p.k){ cx.beginPath(); for(let j=0;j<8;j++){ const rr = j%2 ? p.s*.35 : p.s; cx.lineTo(Math.cos(j*Math.PI/4)*rr, Math.sin(j*Math.PI/4)*rr) } cx.fill() }
        else cx.fillRect(-p.s/2, -p.s/4, p.s, p.s/2);
        cx.restore() } }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  return {fit, burst};
})();
const kick = (el, c) => { if(!el) return; el.classList.remove(c); void el.offsetWidth; el.classList.add(c) };

/* ---------- le son : une musique générée (Web Audio), les vrais rebonds de bille et la boîte à musique du jeu ---------- */
const SND = (() => {
  let ctx = null, master, musG, music = null, on = false, dest = null, MB = null, hits = null;
  const N = n => 440*Math.pow(2,(n-69)/12);
  function init(){ if(ctx) return; ctx = new AudioContext(); master = ctx.createGain(); master.gain.value = .8; musG = ctx.createGain(); musG.connect(master);
    const comp = ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination); dest = ctx.createMediaStreamDestination(); comp.connect(dest);
    MB = makeMB(ctx, master);
    const bin = atob(HIT_WAV), u = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i);
    ctx.decodeAudioData(u.buffer).then(b=>hits=b).catch(()=>{}) }
  const noiseBuf = () => { const b = ctx.createBuffer(1, ctx.sampleRate*3, ctx.sampleRate), d = b.getChannelData(0); for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1; return b };
  let NB = null;
  function env(node, t, a, peak, dec){ node.gain.setValueAtTime(0, t); node.gain.linearRampToValueAtTime(peak, t+a); node.gain.exponentialRampToValueAtTime(.0001, t+a+dec) }
  function osc(type, f, t, peak, dec, f2, out=master, a=.004){ const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if(f2) o.frequency.exponentialRampToValueAtTime(f2, t+dec);
    env(g, t, a, peak, dec); o.connect(g); g.connect(out); o.start(t); o.stop(t+a+dec+.05) }
  function noise(t, peak, dec, ftype="highpass", f=6000, f2, out=master, a=.003){ NB ||= noiseBuf(); const s = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain(); s.buffer = NB;
    fl.type = ftype; fl.frequency.setValueAtTime(f, t); if(f2) fl.frequency.exponentialRampToValueAtTime(f2, t+a+dec); env(g, t, a, peak, dec); s.connect(fl); fl.connect(g); g.connect(out); s.start(t); s.stop(t+a+dec+.05) }
  // la boucle : 120 BPM, en do majeur (do, sol, la mineur, fa : bonne nouvelle !), un arpège qui sautille, une basse qui pousse
  const PROG = [[48,60,64,67],[43,59,62,67],[45,60,64,69],[41,57,60,65]];
  function bar(t, k){
    const ch = PROG[k%4], M = musG;
    for(let b=0;b<4;b++){ const tb = t+b*BEAT;
      osc("sine", 140, tb, .7, .22, 42, M);
      noise(tb+BEAT/2, .09, .05, "highpass", 7500, 0, M);
      if(b%2) noise(tb, .26, .14, "bandpass", 1800, 0, M);
      osc("sawtooth", N(ch[0]-12), tb, .07, .2, 0, M); osc("sawtooth", N(ch[0]-12), tb+BEAT/2, .06, .15, 0, M);
      for(let j=0;j<2;j++) osc("square", N(ch[1+((b*2+j)%3)] + 12), tb+j*BEAT/2, .022, .14, 0, M);   // l'arpège, une note tous les demi-temps
    }
    [ch[3]+12, ch[2]+12, ch[3]+12].forEach((n,i)=>osc("triangle", N(n), t+BEAT+i*BEAT, .06, .35, 0, M));
  }
  function startMusic(){ init(); if(music) return; let k = 0, next = ctx.currentTime + .05;
    music = setInterval(()=>{ while(next < ctx.currentTime + .6){ bar(next, k++); next += BEAT*4 } }, 120) }
  function stopMusic(){ clearInterval(music); music = null }
  const ok = () => on && ctx && ctx.state==="running";
  // un vrai rebond de bille en verre (rebond_bille.wav) ; i = la taille (de la Mini, aiguë, au Mammouth, grave)
  function glass(i){ if(!hits) return; const t = ctx.currentTime, n = HIT_SLICES.length, k = HIT_STRONG + Math.floor(Math.random()*(n-HIT_STRONG));
    const [off, dur] = HIT_SLICES[k], src = ctx.createBufferSource(), g = ctx.createGain(); src.buffer = hits; src.playbackRate.value = 1.35 - i*.1;
    g.gain.value = .5 + i*.08; src.connect(g); g.connect(master); src.start(t, off, dur) }
  const SFX = {
    hit(){ const t = ctx.currentTime; osc("sine", 300, t, .5, .14, 80); noise(t, .22, .06, "lowpass", 3000) },
    hit2(){ const t = ctx.currentTime; osc("sine", 420, t, .5, .16, 110); noise(t, .28, .08, "lowpass", 4000) },
    boom(){ const t = ctx.currentTime; osc("sine", 90, t, 1, .8, 28); noise(t, .5, .5, "lowpass", 1200, 100) },
    chime(){ const t = ctx.currentTime; [76,83,88].forEach((n,i)=>osc("sine", N(n), t+i*.06, .18, 1.1)) },
    arp(){ const t = ctx.currentTime; [72,76,79,84,88,91,96].forEach((n,i)=>osc("triangle", N(n), t+i*.055, .14, .7)); noise(t, .2, 1.2, "highpass", 7000) },
    pop(){ const t = ctx.currentTime; osc("sine", 520, t, .35, .12, 980); noise(t, .12, .04, "highpass", 5000) },
    scratch(){ const t = ctx.currentTime; noise(t, .45, .3, "bandpass", 2600, 700); osc("sawtooth", 180, t, .12, .25, 90) },   // le coup de feutre qui barre la date
    glass(i){ glass(i) },
    gold(){ MB.shinyGold(MB.bus(), ctx.currentTime, MB.EG.off) },
  };
  return {
    get on(){ return on }, get stream(){ init(); return dest.stream },
    toggle(v = !on){ on = v; init(); if(on){ ctx.resume(); startMusic() } else { stopMusic(); ctx.suspend() } return on },
    pause(p){ if(!ctx || !on) return; p ? ctx.suspend() : ctx.resume() },
    restart(){ if(!on) return; stopMusic(); musG.gain.cancelScheduledValues(ctx.currentTime); musG.gain.setValueAtTime(1, ctx.currentTime); startMusic() },
    sfx(name, arg){ if(!ok()) return; SFX[name]?.(arg) },
  };
})();

/* ---------- le moteur : scènes, repères, pause ---------- */
let cur = -1, t0 = 0, paused = false, pauseAt = 0, recording = null, fired = new Set();
const elapsed = () => ((paused ? pauseAt : performance.now()) - t0) / 1000;
function build(){
  STAGE.innerHTML = `<div class="bg"><div class="glow"></div><div class="burst"></div><div class="stars"></div></div>
    <div class="cam" id="cam"><div class="mini-logo">${logoHTML()}</div>${SCENES.map((S,i)=>`<section class="sc" data-i="${i}"></section>`).join("")}</div>
    <canvas id="fx"></canvas><div id="flash"></div>`;
  document.getElementById("dots").innerHTML = SCENES.map((S,i)=>`<button data-i="${i}">${i+1}. ${S.name}</button>`).join("");
  FX.fit();
}
function show(i){
  const secs = STAGE.querySelectorAll(".sc"), prev = secs[cur];
  if(prev && cur!==i){ prev.classList.remove("on"); prev.classList.add("out"); setTimeout(()=>{ prev.classList.remove("out"); if(!prev.classList.contains("on")) prev.innerHTML = "" }, 320) }
  cur = i; const el = secs[i], S = SCENES[i];
  el.classList.remove("out","on"); el.innerHTML = S.html(); void el.offsetWidth; el.classList.add("on");
  STAGE.classList.toggle("big-logo", S.logo==="big"); STAGE.classList.toggle("no-logo", S.logo==="none");
  STAGE.style.setProperty("--rc", S.rc);
  t0 = performance.now(); fired = new Set(); if(paused) setPaused(false);
  document.querySelectorAll("#dots button").forEach((b,k)=>b.classList.toggle("on", k===i));
}
function cue(what){
  const [k, a, b] = what.split(":");
  if(k==="burst") return FX.burst(a, +b);
  if(k==="shake") return kick(document.getElementById("cam"), "shake");
  if(k==="flash") return kick(document.getElementById("flash"), "go");
  SND.sfx(k, a===undefined ? undefined : +a);
}
function tick(){
  if(!paused && cur>=0){
    const S = SCENES[cur], e = elapsed();
    (S.cues||[]).forEach(([t, w], j)=>{ if(e>=t && !fired.has(j)){ fired.add(j); cue(w) } });
    if(e >= S.dur){
      if(cur===SCENES.length-1 && recording) stopRec();
      else if(!FREEZE){ if(cur===SCENES.length-1) SND.restart(); show((cur+1)%SCENES.length) }
    }
    // l'image figée : chaque animation est calée exactement à l'instant demandé (les captures sans écran prennent du retard sinon)
    if(FREEZE && e >= FREEZE.at && !paused){ setPaused(true); document.getAnimations().forEach(x=>{ try{ x.currentTime = FREEZE.at*1000; x.pause() }catch(_){} }) }
  }
  requestAnimationFrame(tick);
}
function setPaused(p){
  if(p===paused) return; paused = p;
  STAGE.querySelectorAll("*").forEach(x=>x.style.animationPlayState = p ? "paused" : "");
  if(p) pauseAt = performance.now(); else { t0 += performance.now()-pauseAt }
  SND.pause(p);
  document.getElementById("b-play").textContent = p ? "▶ Lecture" : "⏸ Pause";
}

/* ---------- le format ---------- */
const FORMATS = {"9:16":[1080,1920], "4:5":[1080,1350], "1:1":[1080,1080]};
let format = "9:16";
function layout(){
  const [W,H] = FORMATS[format], wrap = document.querySelector(".wrap"), film = document.body.classList.contains("film");
  const aw = wrap.clientWidth - (film?0:32), ah = wrap.clientHeight - (film?0:32), k = Math.min(aw/W, ah/H);
  const w = Math.floor(W*k), h = Math.floor(H*k);
  STAGE.style.setProperty("--sw", w+"px"); STAGE.style.setProperty("--sh", h+"px");
  STAGE.style.setProperty("--u", Math.min(w/100, h/158)+"px");
  requestAnimationFrame(FX.fit);
}

/* ---------- l'enregistrement (Chrome / Edge) : l'image de la scène et le son de la page ---------- */
async function startRec(){
  if(!navigator.mediaDevices?.getDisplayMedia){ document.querySelector(".hint").textContent = "Ton navigateur ne sait pas enregistrer l'onglet : utilise Win + Alt + R, ou l'enregistreur d'écran du téléphone."; return }
  let stream;
  try{ stream = await navigator.mediaDevices.getDisplayMedia({video:{frameRate:60}, audio:false, preferCurrentTab:true, selfBrowserSurface:"include"}) }catch(e){ return }
  const track = stream.getVideoTracks()[0];
  try{ if(window.CropTarget && track.cropTo) await track.cropTo(await CropTarget.fromElement(STAGE)) }catch(e){}
  if(SND.on) SND.stream.getAudioTracks().forEach(t=>stream.addTrack(t));
  const type = ["video/mp4;codecs=avc1,mp4a.40.2","video/mp4","video/webm;codecs=vp9,opus","video/webm"].find(t=>MediaRecorder.isTypeSupported(t)) || "";
  const rec = new MediaRecorder(stream, {mimeType:type, videoBitsPerSecond:16e6}), chunks = [];
  rec.ondataavailable = e=>e.data.size && chunks.push(e.data);
  rec.onstop = ()=>{ stream.getVideoTracks().forEach(t=>t.stop());
    const blob = new Blob(chunks, {type:rec.mimeType}), a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `tikalo-beta-1er-decembre-${format.replace(":","x")}.${rec.mimeType.includes("mp4")?"mp4":"webm"}`; a.click();
    document.getElementById("b-rec").textContent = "● Enregistrer la vidéo"; recording = null };
  track.onended = ()=>recording && stopRec();
  recording = rec; document.getElementById("b-rec").textContent = "■ Arrêter";
  await new Promise(r=>setTimeout(r,400));
  SND.restart(); show(0); rec.start(500);
}
function stopRec(){ if(recording && recording.state!=="inactive") recording.stop() }

/* ---------- les boutons ---------- */
const soundBtn = () => { const b = document.getElementById("b-sound"); b.textContent = SND.on ? "🔊 Son" : "🔇 Son coupé"; b.classList.toggle("on", SND.on) };
document.getElementById("b-play").onclick = ()=>setPaused(!paused);
document.getElementById("b-restart").onclick = ()=>{ SND.restart(); show(0) };
document.getElementById("b-sound").onclick = ()=>{ SND.toggle(); if(SND.on){ SND.restart(); show(0) } soundBtn() };
document.getElementById("dots").onclick = e=>{ const b = e.target.closest("button"); if(b) show(+b.dataset.i) };
document.getElementById("b-format").onchange = e=>{ format = e.target.value; layout() };
document.getElementById("b-film").onclick = ()=>{ document.body.classList.toggle("film"); layout() };
document.getElementById("b-rec").onclick = ()=>recording ? stopRec() : startRec();
addEventListener("resize", layout);
addEventListener("keydown", e=>{
  if(e.key===" "){ e.preventDefault(); setPaused(!paused) }
  else if(e.key==="ArrowRight") show((cur+1)%SCENES.length);
  else if(e.key==="ArrowLeft") show((cur-1+SCENES.length)%SCENES.length);
  else if(e.key.toLowerCase()==="h"){ document.body.classList.toggle("film"); layout() }
  else if(e.key.toLowerCase()==="m"){ SND.toggle(); soundBtn() }
});

// l'image de couverture : « Lancement reporté au 1er DÉCEMBRE », les 6 billes Bêta, « offertes jusqu'au 30 novembre »
function cover(){

    <div class="cov-logo">${logoHTML()}</div>

    <p class="old">1er novembre</p>

    ${row6(1.12)}
    <p><span class="tag">✦ Billes Bêta offertes ✦</span></p>
    <p class="hand">jusqu'au 30 novembre ⏳</p></div>`;
  setTimeout(()=>{ FX.burst("beta", 90); setTimeout(()=>{ paused = true }, 700) }, 50);

function prerender(){ BETAS.forEach(s=>{ url(s, 420); url(s, 260); url(s, 200) }) }
const Q = new URLSearchParams(location.search);
const FREEZE = Q.has("at") ? {at:+Q.get("at")} : null;
if(Q.has("film")) document.body.classList.add("film");
document.fonts.ready.then(()=>setTimeout(()=>{
  build(); layout(); prerender();
  if(Q.has("cover")){ document.getElementById("loading").remove(); cover(); return }
  SCENES.forEach(S=>S.html());
  document.getElementById("loading").remove();
  const s0 = Math.max(0, Math.min(SCENES.length-1, (+Q.get("s")||1)-1));
  show(s0); tick();
}, 30));
</script>
