<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tikalo repensé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;600;700;800;900&family=Caveat:wght@600;700&display=swap">
<style>
/* ---------- couleurs : celles de Tikalo, clair et sombre ---------- */
:root{
  --bg:#FBF4E6;--panel:#FFFCF6;--panel-2:#FFF8EC;--line:#EFE3CD;--line-2:#E4D4B6;
  --ink:#24253D;--ink-2:#56546B;--muted:#8E8898;
  --yellow:#FFC93F;--yellow-2:#F2AE12;--yellow-soft:#FFE5A0;
  --blue:#2E6BE6;--blue-2:#1F4FB8;--blue-soft:#D6E4FC;
  --green:#2FA35A;--green-soft:#D6F1D4;--pink:#FF5FA8;--red:#E5484D;
  --navy:#1B2748;--gold-line:#F4CF6A;--gold-bg:#FFF6DC;
  --board:#23402F;--board-2:#16291E;--chalk:rgba(255,255,255,.82);
  --outer:#EFE5D2;--frame:#D9CCB4;
  --shadow:0 1px 0 rgba(120,90,40,.06),0 8px 22px -12px rgba(120,90,40,.3);
  --display:"Lilita One","Arial Rounded MT Bold",sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --hand:"Caveat","Segoe Print",cursive;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#16130F;--panel:#211D18;--panel-2:#2A251F;--line:#352E26;--line-2:#4A4136;
  --ink:#F5EEE2;--ink-2:#C8BDAD;--muted:#8F8578;--yellow-soft:#3F3212;
  --blue:#4F86F5;--blue-2:#9CBBFF;--blue-soft:#1C2A48;--green:#4CC27A;--green-soft:#1B3524;
  --gold-line:#8C6A1C;--gold-bg:#2E2512;--board:#1C3326;--board-2:#0F1D15;
  --outer:#0C0A08;--frame:#2E2820;
  --shadow:0 1px 0 rgba(0,0,0,.25),0 10px 24px -12px rgba(0,0,0,.7);color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#16130F;--panel:#211D18;--panel-2:#2A251F;--line:#352E26;--line-2:#4A4136;
  --ink:#F5EEE2;--ink-2:#C8BDAD;--muted:#8F8578;--yellow-soft:#3F3212;
  --blue:#4F86F5;--blue-2:#9CBBFF;--blue-soft:#1C2A48;--green:#4CC27A;--green-soft:#1B3524;
  --gold-line:#8C6A1C;--gold-bg:#2E2512;--board:#1C3326;--board-2:#0F1D15;
  --outer:#0C0A08;--frame:#2E2820;
  --shadow:0 1px 0 rgba(0,0,0,.25),0 10px 24px -12px rgba(0,0,0,.7);color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--outer);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:10px}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
img{display:block;max-width:100%}
svg{flex:none}

/* ---------- la présentation autour de la maquette ---------- */
.deck{display:flex;flex-direction:column;height:100%;padding:14px 16px 16px;gap:12px}
.deck-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.deck-top h1{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.3px}
.deck-top h1 small{font-family:var(--hand);font-size:21px;color:var(--ink-2);margin-left:8px}
.deck-top .sp{flex:1}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
.seg button{height:32px;padding:0 14px;border-radius:999px;font-weight:800;font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.stage{flex:1;min-height:0;display:flex;gap:16px;justify-content:center}
.frame{position:relative;flex:1;max-width:1380px;min-width:0;border-radius:18px;overflow:hidden;border:1px solid var(--frame);box-shadow:0 30px 70px -30px rgba(0,0,0,.6);background:var(--bg)}
.deck[data-device="phone"] .frame{flex:0 0 390px;max-height:844px;border-radius:44px;border:10px solid #0B0908;box-shadow:0 0 0 1px var(--frame),0 30px 70px -30px rgba(0,0,0,.7)}
.deck[data-device="phone"] .frame::before{content:"";position:absolute;z-index:99;top:8px;left:50%;translate:-50% 0;width:96px;height:26px;border-radius:20px;background:#0B0908}
.notes{flex:0 0 310px;overflow:auto;padding:4px 4px 20px;display:flex;flex-direction:column;gap:10px}
.notes h2{font-family:var(--hand);font-size:26px;line-height:1.1}
.notes .lead{color:var(--ink-2);font-weight:600}
.note{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:12px 12px 12px 10px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.note i{font-style:normal;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--yellow);color:#24253D;font-family:var(--display);font-size:14px}
.note b{display:block;font-weight:900;font-size:14px;margin-bottom:2px}
.note p{font-size:13px;color:var(--ink-2);font-weight:600}
.deck[data-notes="off"] .notes{display:none}
@media (max-width:1100px){ .stage{flex-direction:column;align-items:center} .frame{width:100%;flex:none;height:78vh} .deck[data-device="phone"] .frame{width:390px;max-width:100%;height:78vh} .notes{flex:none;width:100%;max-width:760px;overflow:visible} .deck{height:auto;min-height:100%} }

/* =====================================================================
   L'APPLICATION
   ===================================================================== */
.app{position:absolute;inset:0;display:flex;flex-direction:column;container:app/inline-size;background:var(--bg);overflow:hidden}
.scroll{flex:1;min-height:0}

/* ---------- barre du haut ---------- */
.top{flex:none;display:flex;align-items:center;gap:10px;height:64px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--bg);position:relative;z-index:5}
.logo{display:flex;align-items:center;gap:3px;font-family:var(--display);font-size:32px;line-height:1;color:var(--yellow);letter-spacing:.5px}
.logo span{-webkit-text-stroke:6px var(--navy);paint-order:stroke fill;text-shadow:0 3px 0 var(--navy)}
.logo img{width:30px;height:30px;margin-top:3px}
.top .sp{flex:1}
.wallet{display:flex;align-items:center;gap:7px;height:38px;padding:0 6px 0 7px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:900;font-variant-numeric:tabular-nums}
.wallet .plus{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--yellow);color:#24253D}
.coin{width:22px;height:22px}
.day-btn{position:relative;display:flex;align-items:center;gap:8px;height:38px;padding:0 14px 0 10px;border-radius:999px;background:var(--gold-bg);border:1.5px solid var(--gold-line);font-weight:900;font-size:13px}
.day-btn .n{display:grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font-size:11px}
.me{display:flex;align-items:center;gap:9px;height:46px;padding:0 8px 0 4px;border-radius:14px}
.me:hover,.me[aria-expanded="true"]{background:var(--panel-2)}
.ring{--p:0;padding:3px;border-radius:50%;background:conic-gradient(var(--blue) calc(var(--p)*1%),color-mix(in srgb,var(--ink) 14%,transparent) 0)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 40% 35%,#3A342C,#1A1713);box-shadow:0 0 0 2px var(--bg)}
.av img{width:88%}
.me-txt b{display:block;font-weight:900;font-size:13.5px;line-height:1.2;text-align:left}
.me-txt small{display:block;font-size:11.5px;color:var(--muted);font-weight:700;text-align:left}
.deck[data-device="phone"] .top{height:94px;padding-top:30px}
.deck[data-device="phone"] .pop{top:88px}
.pop{position:absolute;top:58px;right:14px;width:300px;padding:14px;border-radius:18px;background:var(--panel);border:1px solid var(--line);box-shadow:0 24px 50px -18px rgba(0,0,0,.55);display:grid;gap:10px;z-index:20}
.pop-links{display:grid;gap:2px}
.pop-links button{display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;border-radius:10px;font-weight:800;text-align:left}
.pop-links button:hover{background:var(--panel-2)}
.pop-links .out{color:var(--muted)}

/* ---------- corps : menu à gauche, page, « Ma journée » à droite ---------- */
.body{display:grid;grid-template-columns:1fr;height:100%}
.rail{display:none}
.main{min-width:0;height:100%;overflow:auto;padding:18px 16px 40px}
.day{display:none}
@container app (min-width:900px){
  .body{grid-template-columns:212px minmax(0,1fr)}
  .rail{display:flex;flex-direction:column;gap:4px;height:100%;overflow:auto;padding:18px 10px;border-right:1px solid var(--line)}
  .main{padding:22px 26px 40px}
  .tabbar{display:none!important}
}
@container app (min-width:1240px){
  .body{grid-template-columns:212px minmax(0,1fr) 316px}
  .day{display:flex;flex-direction:column;gap:12px;height:100%;overflow:auto;padding:18px 16px 30px;border-left:1px solid var(--line)}
  .top .day-btn{display:none}
}
.nav{display:flex;align-items:center;gap:12px;height:46px;padding:0 12px;border-radius:12px;font-weight:800;font-size:14.5px;color:var(--ink-2);text-align:left;white-space:nowrap}
.nav:hover{background:var(--panel-2);color:var(--ink)}
.nav[aria-current="page"]{background:var(--blue-soft);color:var(--blue-2)}
.nav .dot{margin-left:auto;width:9px;height:9px;border-radius:50%;background:var(--red)}
.nav .cnt{margin-left:auto;font-size:11px;font-weight:900;padding:1px 8px;border-radius:999px;background:var(--green-soft);color:var(--green)}
.rail .grow{flex:1}
.friends{padding:12px;border-radius:14px;border:1.5px dashed var(--line-2);color:var(--muted);font-size:12.5px;font-weight:700}
.friends b{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:13.5px;margin-bottom:3px}
.quote{font-family:var(--hand);font-size:19px;line-height:1.1;color:var(--muted);padding:6px 8px 0}

/* ---------- barre du bas (téléphone) ---------- */
.tabbar{flex:none;position:relative;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;height:74px;padding:0 6px 10px;background:var(--panel);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:800;color:var(--muted);padding-top:8px;position:relative}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{color:var(--blue)}
.tab .dot{position:absolute;top:6px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--panel)}
.tab-bag{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:900;color:var(--ink)}
.tab-bag .bb{display:grid;place-items:center;width:64px;height:64px;margin-top:-26px;border-radius:50%;background:var(--yellow);box-shadow:0 4px 0 var(--yellow-2),0 10px 24px -8px rgba(0,0,0,.5);border:4px solid var(--panel);position:relative}
.tab-bag .bb svg{width:46px;height:52px}
.tab-bag .n{position:absolute;top:-4px;right:-4px;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;font-size:11px;font-weight:900;border:2px solid var(--panel)}

/* ---------- petits composants ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);min-width:0}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ph h2{font-size:16px;font-weight:900}
.ph .sp{flex:1}
.link{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:13px;color:var(--blue-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:44px;padding:0 20px;border-radius:999px;font-weight:900;font-size:14.5px;white-space:nowrap;transition:transform .12s,background .12s}
.btn:active{transform:translateY(1px)}
.btn.y{background:var(--yellow);color:#24253D;box-shadow:0 3px 0 var(--yellow-2)}
.btn.y:hover{background:#FFD35F}
.btn.b{background:var(--blue);color:#fff;box-shadow:0 3px 0 var(--blue-2)}
.btn.g{background:var(--green);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--green) 60%,#000)}
.btn.gh{background:var(--panel-2);border:1px solid var(--line-2)}
.btn.sm{height:34px;padding:0 14px;font-size:13px}
.btn.xl{height:56px;padding:0 28px;font-size:17px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:900;padding:2px 9px;border-radius:999px;white-space:nowrap;line-height:1.5;background:color-mix(in srgb,var(--rc) 18%,var(--panel));color:color-mix(in srgb,var(--rc) 75%,var(--ink))}
.pill.shiny{--rc:#FF6FB5;background:linear-gradient(90deg,#FF6FB533,#FFB54733,#6FE3A833,#5AB8FF33)}
.new{position:absolute;top:6px;right:6px;font-size:9.5px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--red);color:#fff}
.bar{height:8px;border-radius:999px;background:color-mix(in srgb,var(--ink) 12%,transparent);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--blue)}
.bar.gold i{background:linear-gradient(90deg,#F2AE12,#FFD86B)}
.bar.green i{background:var(--green)}
.meta{font-size:12.5px;color:var(--muted);font-weight:700}
.kicker{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.page-h{display:flex;align-items:flex-end;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.page-h h1{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.05;letter-spacing:.3px}
.page-h p{color:var(--ink-2);font-weight:600;max-width:60ch;margin-top:4px}
.page-h .sp{flex:1}
.hand{font-family:var(--hand);font-size:22px;color:var(--ink-2);line-height:1}
.mb{user-select:none;-webkit-user-drag:none}
.lum{filter:drop-shadow(0 0 10px var(--lc,#FFE08A)) drop-shadow(0 0 3px var(--lc,#FFE08A))}
.ghosted{filter:grayscale(1) brightness(.55);opacity:.32}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);font-weight:800;font-size:13px;color:var(--ink-2);background:var(--panel)}
.chip small{font-size:11px;color:var(--muted);font-weight:900}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.7}
.hscroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.hscroll::-webkit-scrollbar{display:none}

/* ---------- ACCUEIL ---------- */
.home{display:grid;gap:14px}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:24px 22px;min-height:250px;color:#F5EEE2;
  background:radial-gradient(120% 90% at 75% 40%,#2F5A40 0%,var(--board) 45%,var(--board-2) 100%);box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(115deg,rgba(255,255,255,.018) 0 2px,transparent 2px 7px)}
.hero-txt{position:relative;z-index:2;max-width:330px;display:grid;gap:10px;justify-items:start}
.hero .kicker{color:#CFE7D5}
.hero h1{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.02;letter-spacing:.3px}
.hero p{color:#CFE0D3;font-weight:600}
.stock{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;color:#CFE0D3}
.stock span{display:flex;gap:4px}
.stock i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.18)}
.stock i.on{background:var(--yellow);box-shadow:0 0 0 2px rgba(255,201,63,.3)}
.hero-art{position:absolute;inset:0 0 0 auto;width:62%;z-index:1;pointer-events:none}
.hero-art .chalk{position:absolute;right:4%;top:50%;translate:0 -50%;width:min(88%,380px);opacity:.9}
.hero-art .bag{position:absolute;right:30%;bottom:6%;width:150px;filter:drop-shadow(0 16px 18px rgba(0,0,0,.45))}
.hero-art .m{position:absolute;filter:drop-shadow(0 8px 8px rgba(0,0,0,.45))}
.hero .btn.y{box-shadow:0 4px 0 var(--yellow-2),0 12px 30px -10px rgba(255,201,63,.6)}
.home-grid{display:grid;gap:14px}
.active-card{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.active-card .big{width:96px;height:96px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 50% 45%,var(--panel-2),transparent 70%)}
.active-card b{display:block;font-size:17px;font-weight:900;line-height:1.2}
.active-card .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.goals{display:grid;gap:10px}
.goal{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line);text-align:left}
.goal:hover{border-color:var(--line-2)}
.goal .gi{width:52px;height:52px;display:grid;place-items:center}
.goal b{display:block;font-weight:900;font-size:14px}
.goal .meta{margin:2px 0 6px}
.goal .go{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--panel);border:1px solid var(--line-2);color:var(--ink-2)}
.finds .f{position:relative;flex:0 0 112px;display:grid;justify-items:center;gap:6px;padding:12px 8px 10px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line);text-align:center}
.finds .f b{font-size:12px;font-weight:800;line-height:1.2}
.finds .f .ball{height:66px;display:grid;place-items:center}
.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.size-t{display:grid;justify-items:center;gap:4px;padding:10px 6px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line);text-align:center}
.size-t .ball{height:52px;display:grid;place-items:end center}
.size-t b{font-size:12.5px;font-weight:900}
.size-t small{font-size:11px;font-weight:800;color:var(--muted)}
.size-t .bar{width:80%;height:5px}
@container app (min-width:700px){
  .hero{padding:32px 34px;min-height:280px}
  .hero h1{font-size:40px}
  .home-grid{grid-template-columns:1.25fr 1fr}
  .sizes{grid-template-columns:repeat(6,1fr)}
}

/* ---------- MA JOURNÉE ---------- */
.day h2,.sheet h2{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.3px}
.day-head{display:flex;align-items:center;gap:10px}
.day-head .sp{flex:1}
.day-prog{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:800;color:var(--ink-2)}
.day-prog .bar{flex:1;height:6px}
.claim-all{width:100%}
.sheet > *,.day > *{flex-shrink:0}
.todo{display:grid;gap:6px}
.todo-h{font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 2px 0}
.t{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:9px 10px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.t .ti{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--panel-2);color:var(--ink-2)}
.t b{display:block;font-size:13px;font-weight:900;line-height:1.25}
.t small{display:block;font-size:11.5px;font-weight:700;color:var(--muted)}
.t .bar{height:5px;margin-top:5px}
.t.ready{border-color:var(--gold-line);background:var(--gold-bg)}
.t.ready .ti{background:var(--yellow);color:#24253D}
.t.done{opacity:.55}
.t.done .ti{background:var(--green-soft);color:var(--green)}
.t .rw{display:flex;align-items:center;gap:3px;font-size:12px;font-weight:900;color:var(--ink-2);white-space:nowrap}
.t .rw .coin{width:16px;height:16px}
.pass-mini{padding:14px;border-radius:16px;color:#fff;background:linear-gradient(135deg,#1F3A8A,#3A2A6E);position:relative;overflow:hidden}
.pass-mini .kicker{color:#C9D5FF;display:block;padding-right:62px}
.pass-mini b{display:block;font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:.3px}
.pass-mini .bar{background:rgba(255,255,255,.18);margin:8px 0 6px}
.pass-mini .bar i{background:var(--yellow)}
.pass-mini small{font-size:12px;font-weight:700;color:#C9D5FF}
.pass-mini img{position:absolute;right:10px;top:10px;width:58px}
.pass-mini .btn{margin-top:10px}

/* feuille (téléphone et écrans moyens) */
.scrim{position:absolute;inset:0;z-index:40;background:rgba(10,8,6,.55);display:flex;align-items:flex-end;justify-content:flex-end;animation:fade .2s}
.sheet{width:100%;max-height:88%;overflow:auto;padding:16px 16px 26px;background:var(--bg);border-radius:24px 24px 0 0;display:flex;flex-direction:column;gap:12px;animation:up .28s cubic-bezier(.2,.9,.3,1)}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line-2);margin:-4px auto 2px}
@container app (min-width:900px){
  .scrim{align-items:stretch;background:rgba(10,8,6,.3)}
  .sheet{width:420px;max-height:none;height:100%;border-radius:0;border-left:1px solid var(--line);animation:side .28s cubic-bezier(.2,.9,.3,1)}
  .grab{display:none}
}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes side{from{transform:translateX(40px);opacity:0}}
.x{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);font-size:20px;line-height:1}

/* ---------- SACS ---------- */
.shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.shelf-b{position:relative;display:grid;justify-items:center;gap:4px;padding:10px 6px 10px;border-radius:16px;border:2px solid transparent;background:var(--panel);text-align:center}
.shelf-b[aria-pressed="true"]{border-color:var(--ink);background:var(--panel-2)}
.shelf-b > svg{width:66px;height:76px}
.shelf-b b{font-size:12px;font-weight:900;line-height:1.15}
.shelf-b small{display:flex;align-items:center;gap:3px;font-size:11.5px;font-weight:900;color:var(--ink-2)}
.shelf-b small .coin{width:15px;height:15px}
.shelf-b .gift{position:absolute;top:6px;right:6px;display:flex;align-items:center;justify-content:center;gap:2px;white-space:nowrap;min-width:22px;height:22px;padding:0 5px;border-radius:999px;background:var(--green);color:#fff;font-size:11px;font-weight:900}
.bag-stage{display:grid;gap:18px;margin-top:14px}
.bag-show{position:relative;display:grid;place-items:center;min-height:260px;border-radius:22px;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--bc) 30%,var(--panel)),var(--panel) 72%);border:1px solid var(--line)}
.bag-show svg{width:230px;height:250px;filter:drop-shadow(0 18px 20px rgba(0,0,0,.35))}
.bag-show .ribbon{position:absolute;top:14px;left:14px}
.bag-info{display:grid;gap:14px;align-content:start}
.bag-info h2{font-family:var(--display);font-weight:400;font-size:28px;letter-spacing:.3px}
.bag-info p{color:var(--ink-2);font-weight:600}
.odds{display:flex;height:14px;border-radius:999px;overflow:hidden;gap:2px}
.odds i{display:block;min-width:4px}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 10px;margin-top:8px}
.legend span{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--ink-2)}
.legend span i{width:9px;height:9px;border-radius:50%;background:var(--rc)}
.legend span em{font-style:normal;margin-left:auto;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.cta-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cta-row .btn .coin{width:20px;height:20px}
details.how{border-radius:14px;background:var(--panel);border:1px solid var(--line)}
details.how summary{list-style:none;display:flex;align-items:center;gap:8px;padding:12px 14px;font-weight:900;cursor:pointer}
details.how summary::-webkit-details-marker{display:none}
details.how summary::after{content:"+";margin-left:auto;font-size:18px;color:var(--muted)}
details.how[open] summary::after{content:"–"}
.steps{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:0 14px 14px}
.step{padding:10px;border-radius:12px;background:var(--panel-2)}
.step b{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:900}
.step b i{font-style:normal;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:11px}
.step p{font-size:12px;color:var(--ink-2);font-weight:600;margin-top:3px}
@container app (min-width:900px){
  .bag-stage{grid-template-columns:1.1fr 1fr;align-items:start}
  .shelf{max-width:620px}
  .shelf-b > svg{width:80px;height:92px}
  .steps{grid-template-columns:repeat(4,1fr)}
}

/* ouverture */
.reveal{position:absolute;inset:0;z-index:60;display:grid;place-items:center;align-content:center;gap:18px;padding:20px;text-align:center;color:#F5EEE2;
  background:radial-gradient(circle at 50% 45%,#2F5A40,#0F1D15 75%);animation:fade .25s}
.reveal h2{font-family:var(--display);font-weight:400;font-size:30px}
.rv-row{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;align-items:flex-end}
.rv{display:grid;justify-items:center;gap:6px;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.rv b{font-size:13px;font-weight:900}
.rv .tag{font-size:10.5px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.rv .tag.n1{background:var(--yellow);color:#24253D}
.rv .tag.n2{background:#4CC27A;color:#0F1D15}
.rv .tag.n3{background:rgba(255,255,255,.14);color:#CFE0D3}
@keyframes pop{from{transform:translateY(40px) scale(.3);opacity:0}}

/* ---------- BOÎTE À BILLES ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tabs button{position:relative;height:42px;padding:0 14px;font-weight:900;font-size:14px;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px;background:var(--blue)}
.tabs small{font-size:11px;color:var(--muted);margin-left:4px}
.sizepick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.sp-b{flex:1 0 76px;display:grid;justify-items:center;gap:3px;padding:8px 4px 7px;border-radius:14px;border:2px solid var(--line);background:var(--panel)}
.sp-b .ball{height:50px;display:grid;place-items:end center}
.sp-b b{font-size:12px;font-weight:900;line-height:1.1}
.sp-b small{font-size:10.5px;font-weight:800;color:var(--muted)}
.sp-b[aria-pressed="true"]{border-color:var(--rc);background:color-mix(in srgb,var(--rc) 12%,var(--panel))}
.tools{display:flex;gap:8px;align-items:center;margin:12px 0;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);color:var(--muted);min-width:180px;flex:1;max-width:280px}
.search input{border:0;background:none;outline:0;font:inherit;font-weight:700;color:var(--ink);width:100%}
.grid-cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.case{position:relative;display:grid;justify-items:center;gap:5px;padding:12px 8px 10px;border-radius:16px;background:var(--panel);border:1px solid var(--line);text-align:center}
.case:hover{border-color:var(--line-2);transform:translateY(-1px)}
.case .ball{height:78px;display:grid;place-items:center}
.case b{font-size:12.5px;font-weight:900;line-height:1.15}
.case small{font-size:11px;font-weight:800;color:var(--muted)}
.case .bar{width:78%;height:5px}
.case.full{background:linear-gradient(180deg,var(--gold-bg),var(--panel));border-color:var(--gold-line)}
.case.full small{color:#E0A417}
.case.empty b{color:var(--muted)}
.case .star{position:absolute;top:7px;left:8px;color:#E0A417;font-size:12px}
.rar-h{display:flex;align-items:center;gap:8px;margin:18px 0 8px;font-weight:900}
.rar-h i{width:10px;height:10px;border-radius:50%;background:var(--rc)}
.rar-h small{color:var(--muted);font-weight:700}
.series{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.serie{display:grid;gap:10px}
.serie .row{display:flex;gap:6px}
.serie .row span{flex:1;aspect-ratio:1;display:grid;place-items:center;border-radius:12px;background:var(--panel-2);border:1px dashed var(--line-2)}
.serie .row span.ok{border-style:solid}
.serie .rw{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--ink-2)}
.serie .rw .coin{width:16px;height:16px}

/* planche / fiche */
.planche{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pl{position:relative;display:grid;justify-items:center;gap:2px;padding:6px 2px 5px;border-radius:12px;background:var(--panel)}
.pl small{font-size:9.5px;font-weight:800;color:var(--muted);line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .wish{position:absolute;top:2px;right:3px;font-size:11px;color:var(--muted)}
.pl.miss small{opacity:.6}
.fiche-ball{display:grid;place-items:center;height:250px;border-radius:22px;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--rc) 26%,var(--panel)),var(--panel) 70%)}
.fiche-ball canvas{width:220px;height:220px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.facts div{padding:9px 11px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.facts small{display:block;font-size:10.5px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.facts b{font-size:14px;font-weight:900}
.acts{display:grid;gap:8px}
.acts .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ---------- JEUX ---------- */
.playing{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;border-radius:16px;background:var(--panel);border:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.playing b{font-weight:900}
.playing .sp{flex:1}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.game{display:grid;grid-template-rows:auto 1fr;overflow:hidden;padding:0}
.game .art{position:relative;aspect-ratio:240/120;overflow:hidden}
.game .art > svg{width:100%;height:100%}
.game .state{position:absolute;left:10px;bottom:10px;display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:900;padding:4px 10px;border-radius:999px;background:rgba(15,12,10,.72);color:#fff;backdrop-filter:blur(4px)}
.game .state.ok{background:var(--green)}
.game .gb{display:grid;gap:6px;padding:12px 14px 14px;align-content:start}
.game h3{font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:.3px}
.game p{font-size:12.5px;color:var(--ink-2);font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.game .gf{display:flex;align-items:center;gap:8px;margin-top:4px}
.game .gf small{flex:1;font-size:11.5px;font-weight:800;color:var(--muted)}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:20px 0 10px}
.sec-h h2{font-size:17px;font-weight:900}

/* ---------- CONFISERIE ---------- */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.mode{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;padding:14px;border-radius:18px;border:2px solid var(--line);background:var(--panel);text-align:left}
.mode .mi{grid-row:span 2;display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--panel-2)}
.mode b{font-weight:900;font-size:14.5px;line-height:1.2}
.mode small{font-size:12px;font-weight:800;color:var(--muted)}
.mode[aria-pressed="true"]{border-color:var(--pink);background:color-mix(in srgb,var(--pink) 10%,var(--panel))}
.mode[aria-pressed="true"] .mi{background:var(--pink);color:#fff}
.swap-sum{display:grid;gap:14px;align-items:center}
.swap-sum .big{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:40px;line-height:1}
.swap-sum .big .coin{width:40px;height:40px}
.dbl{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.dbl button{position:relative;display:grid;justify-items:center;gap:3px;padding:10px 4px 8px;border-radius:14px;background:var(--panel);border:1.5px solid var(--line);text-align:center}
.dbl button .ball{height:54px;display:grid;place-items:center}
.dbl b{font-size:11.5px;font-weight:900;line-height:1.15}
.dbl small{display:flex;align-items:center;gap:3px;font-size:11px;font-weight:900;color:var(--ink-2)}
.dbl small .coin{width:13px;height:13px}
.dbl .x2{position:absolute;top:6px;left:6px;font-size:10.5px;font-weight:900;padding:1px 6px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line)}
.dbl button[aria-pressed="false"]{opacity:.4;border-style:dashed}
.dbl .chk{position:absolute;top:6px;right:6px;display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--pink);color:#fff}
.dbl button[aria-pressed="false"] .chk{background:var(--line-2)}
.fuse{display:grid;gap:16px;align-items:center}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.slots span{aspect-ratio:1;display:grid;place-items:center;border-radius:14px;background:var(--panel-2);border:1.5px dashed var(--line-2)}
.slots span.f{border-style:solid;border-color:var(--line)}
.fuse-res{display:grid;justify-items:center;gap:8px;text-align:center}
.fuse-res .q{position:relative;display:grid;place-items:center;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--rc) 30%,var(--panel)),var(--panel) 70%)}
.fuse-res .q span{position:absolute;font-family:var(--display);font-size:40px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.4)}
@container app (min-width:900px){
  .swap-sum{grid-template-columns:1fr auto}
  .fuse{grid-template-columns:1fr auto 200px}
}

/* ---------- PASSE ---------- */
.pass-head{position:relative;overflow:hidden;border-radius:22px;padding:22px;color:#fff;background:linear-gradient(120deg,#1F3A8A 0%,#34469C 55%,#E8413C 140%);display:grid;gap:10px}
.pass-head h1{font-family:var(--display);font-weight:400;font-size:32px}
.pass-head .kicker{color:#C9D5FF}
.pass-head .bar{background:rgba(255,255,255,.2);max-width:420px}
.pass-head .bar i{background:var(--yellow)}
.pass-head small{font-weight:700;color:#C9D5FF}
.pass-head img{position:absolute;right:20px;top:50%;translate:0 -50%;width:130px}
.pass-head .final{position:absolute;right:28px;bottom:12px;font-family:var(--hand);font-size:19px;color:#FFE08A}
.track{display:grid;grid-auto-flow:column;grid-auto-columns:92px;grid-template-rows:auto auto auto;gap:8px 8px;overflow-x:auto;padding:14px 2px 10px;scrollbar-width:thin}
.tier-n{display:grid;place-items:center;height:26px;border-radius:999px;font-size:12px;font-weight:900;background:var(--panel-2);color:var(--muted)}
.tier-n.cur{background:var(--yellow);color:#24253D}
.tier-n.past{background:var(--blue-soft);color:var(--blue-2)}
.rwd{position:relative;display:grid;justify-items:center;align-content:center;gap:4px;height:104px;padding:6px;border-radius:14px;background:var(--panel);border:1px solid var(--line);text-align:center}
.rwd small{font-size:10.5px;font-weight:800;color:var(--ink-2);line-height:1.15}
.rwd svg.bagi{width:44px;height:50px}
.rwd .coin{width:30px;height:30px}
.rwd.got{opacity:.45}
.rwd.got::after{content:"✓";position:absolute;top:5px;right:7px;font-weight:900;color:var(--green)}
.rwd.claim{border-color:var(--gold-line);background:var(--gold-bg);box-shadow:0 0 0 2px var(--gold-line)}
.rwd.prem{background:linear-gradient(180deg,color-mix(in srgb,#FFC93F 10%,var(--panel)),var(--panel))}
.rwd.lock::before{content:"";position:absolute;inset:0;border-radius:inherit;background:color-mix(in srgb,var(--bg) 45%,transparent)}
.row-label{display:flex;gap:18px;font-size:12px;font-weight:900;color:var(--muted);margin-top:4px}

/* toast */
.toast{position:absolute;left:50%;bottom:92px;translate:-50% 0;z-index:70;display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:900;box-shadow:0 14px 30px -10px rgba(0,0,0,.5);animation:up .3s}
.toast .coin{width:18px;height:18px}
@container app (min-width:900px){ .toast{bottom:24px} }
@container app (max-width:520px){
  .top{gap:6px;padding:0 12px}
  .logo{font-size:28px}
  .day-btn{padding:0 8px}
  .day-btn .lbl,.me-txt,.wallet .plus{display:none}
  .wallet{padding-right:12px}
  .me{padding:0}
  .ph .hand{display:none}
  .hero{padding-top:176px}
  .hero-art{inset:0 0 auto 0;width:100%;height:180px}
  .hero-art .chalk{right:50%;translate:50% -50%;width:300px}
  .hero-art .bag{right:auto;left:50%;translate:-50% 0;bottom:4px;width:120px}
  .shelf{gap:6px}
  .shelf-b{padding:8px 2px}
  .shelf-b > svg{width:50px;height:58px}
  .shelf-b b{font-size:11.5px}
  .bag-show{min-height:170px}
  .bag-show svg{width:150px;height:165px}
  .bag-stage{gap:12px}
  .legend{grid-template-columns:repeat(2,1fr)}
}

<body>
<div class="deck" id="deck" data-device="desktop" data-notes="on">
  <div class="deck-top">
    <h1>Tikalo, repensé <small>si j'étais parti d'une page blanche</small></h1>
    <div class="sp"></div>
    <div class="seg" role="group" aria-label="Taille d'écran">
      <button data-dev="desktop" aria-pressed="true">Ordinateur</button>
      <button data-dev="phone" aria-pressed="false">Téléphone</button>
    </div>
    <div class="seg" role="group" aria-label="Notes">
      <button data-notes="on" aria-pressed="true">Mes notes</button>
      <button data-notes="off" aria-pressed="false">Sans notes</button>
    </div>
    <div class="seg" role="group" aria-label="Thème">
      <button data-th="dark" aria-pressed="true">Soir</button>
      <button data-th="light" aria-pressed="false">Jour</button>
    </div>
  </div>
  <div class="stage">
    <div class="frame"><div class="app" id="app"></div></div>
    <aside class="notes" id="notes" aria-label="Pourquoi ces choix"></aside>
  </div>
</div>

<script src="tikalo-rendu.js"></script>
<script>
/* =====================================================================
   DONNÉES DE DÉMO : un joueur fictif, tiré toujours pareil
   ===================================================================== */
const M = (type,family,pal,shiny=0,k="") => ({id:`${type}-${family}-${pal}-${k}`, seed:hash(`${type}-${family}-${pal}-${k}`), type, family, pal, shiny});
const PAL = n => PALETTES.findIndex(p=>p[0]===n);
const FAM = n => FAMILIES.findIndex(f=>f.name===n);
const ACTIVE = M("calot",FAM("Galaxie"),PAL("Nuit"),0,"a");
const SEASON = SEASONS[8], SEASON_PAL = BASE_PALS+8;             // septembre : la Rentrée
const FINAL = M("mammouth",SEASON.fam,SEASON_PAL,2,"final");

const R = rng(hash("AlexBilleur"));
const pickType = () => TK[pickW(R(), TK.map(t=>FREE_BAG.odds[t]))];
const MINE = [
  M("bille",FAM("Tourbillon"),PAL("Lagon"),1,"h1"), M("mammouth",FAM("Aurore"),PAL("Féerie"),0,"h2"),
  M("chinoise",FAM("Millefiori"),PAL("Cerise"),0,"h3"), M("boulet",FAM("Globe"),PAL("Azur"),0,"h4"),
  M("calot",FAM("Berlingot"),PAL("Sucre d'orge"),0,"h5"), M("bille",FAM("Pailletée"),PAL("Néon"),3,"h6"),
];
for(let i=0;i<48;i++) MINE.push(M(pickType(), pickW(R(),FAM_W), Math.floor(R()*BASE_PALS), 0, "c"+i));
MINE.push(ACTIVE);
const NEW = new Set(MINE.slice(0,5).map(s=>s.id));

const ST = {view:"accueil", tab:"album", size:"calot", bag:"gratuit", mode:"echange", fuseSize:"mini", filter:"tout",
            jetons:2480, claimed:new Set(), pop:false, sheet:null, excluded:new Set(), freeStock:3, q:""};

// Album : combien de coloris trouvés par case (taille × décor)
const RATIO = {mini:.85, bille:.7, chinoise:.5, calot:.45, boulet:.22, mammouth:.1};
function caseCount(t,f){
  if(t==="calot" && f===FAM("Tourbillon")) return 45;
  if((t==="mini" && f===FAM("Œil-de-chat")) || (t==="bille" && f===FAM("Opaline")) || (t==="mini" && f===FAM("Cible"))) return 48;
  const h = hash("case"+t+f), w = FAM_W[f]/10;
  if((h%1000)/1000 > RATIO[t]*(.55+w)) return 0;
  return 1 + (h>>>10) % Math.max(2, Math.round(40*RATIO[t]*w+4));
}

};

   OUVERTURE D'UN SAC (version courte : résumé d'un coup)
   ===================================================================== */
function openBag(id,n=1){
  const b = BAG_BY[id], R2 = rng(randU32()), out = [];
  for(let k=0;k<n;k++) for(let i=0;i<b.n;i++){ const t = TK[pickW(R2(), TK.map(x=>b.odds[x]))]; out.push(M(t, pickW(R2(),FAM_W), Math.floor(R2()*BASE_PALS), 0, "o"+randU32())) }
  if(id==="gratuit") ST.freeStock = Math.max(0, ST.freeStock-n);
  else if(GIFTS[id]) GIFTS[id]--; else ST.jetons -= b.price;
  const tags = [["n1","Nouvelle case"],["n2","Nouveau coloris"],["n3","Déjà dans ta boîte"]];
  const el = document.createElement("div"); el.className = "reveal";
  el.innerHTML = `<h2>${n>1?`${n} sacs ouverts !`:b.name}</h2>
    <div class="rv-row">${out.slice(0,15).map((s,i)=>{ const tg = tags[hash(s.id)%3]; return `<div class="rv" style="animation-delay:${i*.12}s">${img(s,szPx(s.type,n>1?58:84))}<b>${nameOf(s)}</b><span class="tag ${tg[0]}">${tg[1]}</span></div>` }).join("")}</div>
    <div class="cta-row" style="justify-content:center">${id==="gratuit"&&ST.freeStock?`<button class="btn y" data-again>${ic("bag",18)} Encore un (${ST.freeStock})</button>`:""}<button class="btn gh" data-close-rv style="background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff">Voir dans ma boîte</button></div>`;
  $("#app").appendChild(el);
  el.addEventListener("click",e=>{
    if(e.target.closest("[data-again]")){ el.remove(); openBag("gratuit") }
    else if(e.target.closest("[data-close-rv]")){ el.remove(); ST.view="boite"; ST.tab="billes"; MINE.unshift(...out); out.forEach(s=>NEW.add(s.id)); shell() }
  });
}

   INTERACTIONS
   ===================================================================== */
let spinRAF = 0;
function afterRender(){
  cancelAnimationFrame(spinRAF);
  const cv = document.getElementById("spin");
  if(cv && ST.sheet && ST.sheet.k==="spec"){
    // un seul contexte WebGL (celui des vignettes) : on dessine dedans puis on recopie sur la toile visible
    const s = ST.sheet.s, c2 = cv.getContext("2d"), tilt = rotAxis(1,0,0,s.type==="chinoise"?-.5:-.25), t0 = performance.now();
    const loop = now => { if(!mainGL) return; mainGL.draw(s,440,mul3(rotAxis(0,1,0,(now-t0)/1600),tilt)); c2.clearRect(0,0,440,440); c2.drawImage(mainGL.cv,0,0); spinRAF = requestAnimationFrame(loop) };
    spinRAF = requestAnimationFrame(loop);
  }
  const tr = document.getElementById("track");
  if(tr) tr.scrollLeft = Math.max(0,(PASS_TIER-3)*100);
  $("#notes").innerHTML = notesHTML();
}
function toast(html){
  const t = document.createElement("div"); t.className = "toast"; t.innerHTML = html;
  $("#app").appendChild(t); setTimeout(()=>t.remove(), 2400);
}
function findSpec(id){
  const s = MINE.find(x=>x.id===id); if(s) return s;
  const m = id.match(/^(\w+)-(\d+)-(\d+)-(.*)$/); return m ? M(m[1],+m[2],+m[3],0,m[4]) : ACTIVE;
}
function go(v){ ST.view = v; ST.sheet = null; ST.pop = false; shell(); $("#main").scrollTop = 0 }
document.addEventListener("click", e=>{
  const a = e.target.closest("button,[data-claim],[data-scrim]"); if(!a) return;
  const d = a.dataset;
  if(d.dev){ $("#deck").dataset.device = d.dev; document.querySelectorAll("[data-dev]").forEach(b=>b.setAttribute("aria-pressed", b===a)); return }
  if(d.notes){ $("#deck").dataset.notes = d.notes; document.querySelectorAll("[data-notes]").forEach(b=>b.setAttribute("aria-pressed", b===a)); return }
  if(d.th){ document.documentElement.dataset.theme = d.th; document.querySelectorAll("[data-th]").forEach(b=>b.setAttribute("aria-pressed", b===a)); return }
  if(!a.closest("#app")) return;
  if(d.scrim!==undefined && e.target===a){ ST.sheet = null; shell(); return }
  if(d.close!==undefined){ ST.sheet = null; shell(); return }
  if(d.pop!==undefined){ ST.pop = !ST.pop; shell(); return }
  if(d.go) return go(d.go);
  if(d.goSheet){ ST.sheet = "day"; ST.pop = false; shell(); return }
  if(d.tabGo){ ST.tab = d.tabGo; return go("boite") }
  if(d.sizeGo){ ST.size = d.sizeGo; ST.tab = "album"; return go("boite") }
  if(d.tab){ ST.tab = d.tab; shell(); return }
  if(d.size){ ST.size = d.size; shell(); return }
  if(d.filter){ ST.filter = d.filter; shell(); return }
  if(d.bag){ ST.bag = d.bag; shell(); return }
  if(d.mode){ ST.mode = d.mode; shell(); return }
  if(d.fuse){ ST.fuseSize = d.fuse; shell(); return }
  if(d.excl){ ST.excluded.has(d.excl) ? ST.excluded.delete(d.excl) : ST.excluded.add(d.excl); shell(); return }
  if(d.open){ ST.sheet = null; openBag(d.open, +(d.n||1)); return }
  if(d.case){ const [t,f] = d.case.split("|"); if(ST.view!=="boite"){ ST.view="boite"; ST.tab="album" } ST.size = t; ST.sheet = {k:"case", t, f:+f}; shell(); return }
  if(d.spec){ ST.sheet = {k:"spec", s:findSpec(d.spec)}; shell(); return }
  if(d.claim){
    if(d.claim==="pass"){ ST.claimed.add("pass"); ST.jetons += 216; toast(`${COIN} +216 bonbecs · palier ${PASS_TIER}`) }
    else { const it = DAY.find(x=>x.id===d.claim); ST.claimed.add(it.id); ST.jetons += it.rw; toast(`${COIN} +${it.rw} bonbecs`) }
    shell(); return }
  if(d.claimAll!==undefined){
    let n = 0; DAY.filter(x=>x.ready && !ST.claimed.has(x.id)).forEach(x=>{ ST.claimed.add(x.id); n += x.rw });
    if(!ST.claimed.has("pass")){ ST.claimed.add("pass"); n += 216 }
    ST.jetons += n; shell(); toast(`${COIN} +${n} bonbecs récupérés d'un coup`); return }
  if(d.swap!==undefined){ const tot = DOUBLES.filter(x=>!ST.excluded.has(x.s.id)).reduce((s,x)=>s+dblValue(x),0); ST.jetons += tot; DOUBLES.length = 0; shell(); toast(`${COIN} +${fmt(tot)} bonbecs`); return }
});
document.addEventListener("input", e=>{ if(e.target.id==="q"){ ST.q = e.target.value; const pos = e.target.selectionStart; shell(); const q = $("#q"); q.focus(); q.setSelectionRange(pos,pos) } });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && (ST.sheet||ST.pop)){ ST.sheet = null; ST.pop = false; shell() } });

  return `<h2>${N.t}</h2><p class="lead">${N.l}</p>${N.n.map((x,i)=>`<div class="note"><i>${i+1}</i><div><b>${x[0]}</b><p>${x[1]}</p></div></div>`).join("")}

// raccourcis d'adresse, ex. ma-vision.html#vue=sacs&ecran=telephone (vue, onglet, mode, ecran, panneau=journee|fiche|case)
{ const h = new URLSearchParams(location.hash.slice(1));
  if(h.get("vue")) ST.view = h.get("vue");
  if(h.get("onglet")) ST.tab = h.get("onglet");
  if(h.get("mode")) ST.mode = h.get("mode");
  if(h.get("ecran")==="telephone") document.querySelector('[data-dev="phone"]').click();
  const p = h.get("panneau");
  if(p==="journee") ST.sheet = "day"; else if(p==="fiche") ST.sheet = {k:"spec", s:MINE[1]}; else if(p==="case") ST.sheet = {k:"case", t:"calot", f:FAM("Tourbillon")};
}
