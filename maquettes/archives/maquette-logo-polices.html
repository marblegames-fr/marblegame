<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tikalo · polices du logo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titan+One&family=Luckiest+Guy&family=Chewy&family=Fredoka:wght@700&family=Baloo+2:wght@800&family=Gluten:wght@900&family=Modak&family=Rammetto+One&family=Bowlby+One&family=Grandstander:wght@900&family=Mochiy+Pop+One&family=Sniglet:wght@800&family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* Maquette : propositions de logo pour Tikalo (8 octobre 2026). Billes rendues par tikalo-rendu.js, comme dans le jeu. */
:root{--navy:#24253D;--y:#FFC93F;--display:"Lilita One",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#100E0B;color:#F5EEE2;font:600 15px/1.5 Nunito,system-ui,sans-serif}
main{max-width:1180px;margin:0 auto;padding:28px 16px 60px}
h1{font-family:"Titan One";font-weight:400;font-size:30px;margin:0 0 4px}
.lead{color:#C8BDAD;margin:0 0 26px}
.card{border:1px solid #352E26;border-radius:22px;background:#1A1713;margin:0 0 22px;overflow:hidden}
.card-h{display:flex;align-items:baseline;gap:12px;padding:16px 22px 0;flex-wrap:wrap}
.card-h b{font-family:"Titan One";font-weight:400;font-size:22px;color:var(--y)}
.card-h span{color:#C8BDAD}
.row{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:14px;padding:16px 22px 22px}
.cell{border-radius:16px;display:grid;place-items:center;min-height:170px;padding:18px;position:relative}
.cell small{position:absolute;left:12px;top:8px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;opacity:.55}
.dark{background:radial-gradient(120% 120% at 30% 20%,#2A231B,#16130F)}
.light{background:#FBF4E6;color:#24253D}
.side{background:#211D18}
.side .wrap{display:flex;flex-direction:column;gap:10px;align-items:flex-start;width:100%}
.side .nav{display:flex;flex-direction:column;gap:6px;width:100%}
.side .nav i{display:block;height:12px;border-radius:6px;background:#352E26}
.side .nav i:nth-child(2){width:70%}.side .nav i:nth-child(3){width:82%}
@media (max-width:820px){ .row{grid-template-columns:1fr} }

/* --- base commune : la police ronde et gourmande du jeu (Titan One), tranche caramel --- */
.L{display:inline-flex;align-items:flex-end;font-family:"Titan One";line-height:1;white-space:nowrap;letter-spacing:.02em}
.L .t{color:var(--y);-webkit-text-stroke:.16em var(--navy);paint-order:stroke fill;
  text-shadow:0 .04em 0 #F59E0B,0 .08em 0 #E07B00,0 .13em 0 var(--navy),0 .18em .24em rgba(0,0,0,.35)}
.L img{display:block;filter:drop-shadow(0 .06em 0 var(--navy)) drop-shadow(0 .14em .14em rgba(0,0,0,.4))}

/* A · la bille fait le « o » */
.A .o{width:.6em;height:.6em;margin:0 0 .06em .03em;border-radius:50%;box-shadow:0 0 0 .065em var(--navy);transform:rotate(-12deg)}

/* B · les points des i sont des billes, et le o aussi */
.B{position:relative}
.B .i{position:relative;display:inline-block}
.B .i .t{display:inline-block}
.B .dot{position:absolute;left:50%;top:-.17em;width:.3em;height:.3em;margin-left:-.15em;border-radius:50%;box-shadow:0 0 0 .05em var(--navy)}
.B .o{width:.6em;height:.6em;margin:0 0 .06em .03em;border-radius:50%;box-shadow:0 0 0 .065em var(--navy)}

/* C · ça roule : les lettres sautillent comme des billes qui rebondissent, la bille file avec ses traits de vitesse */
.C .t{display:inline-block}
.C .t:nth-child(1){transform:translateY(-.02em) rotate(-6deg)}
.C .t:nth-child(2){transform:translateY(-.10em) rotate(4deg)}
.C .t:nth-child(3){transform:translateY(.02em) rotate(-3deg)}
.C .t:nth-child(4){transform:translateY(-.08em) rotate(5deg)}
.C .t:nth-child(5){transform:translateY(.0em) rotate(-4deg)}
.C .run{position:relative;display:block;margin-left:.06em}
.C .run::before{content:"";position:absolute;right:62%;top:28%;width:.5em;height:.05em;border-radius:1em;background:var(--y);box-shadow:-.04em .14em 0 #F59E0B,.06em .28em 0 var(--y);opacity:.9}
.C .o{width:.6em;height:.6em;margin-bottom:.06em;border-radius:50%;box-shadow:0 0 0 .07em var(--navy);transform:rotate(25deg)}

/* D · la gommette : l'étiquette ronde collée sur les sachets */
.D{align-items:center;gap:.12em;padding:.14em .34em .16em .26em;border-radius:1em;background:linear-gradient(180deg,#FFD866,#FFC93F 60%,#F2AE12);
  box-shadow:0 0 0 .06em var(--navy),0 .1em 0 .06em var(--navy),0 .26em .3em rgba(0,0,0,.35);transform:rotate(-3deg)}
.D .t{color:var(--navy);-webkit-text-stroke:0;text-shadow:0 .04em 0 rgba(255,255,255,.55)}
.D img{width:.8em;height:.8em;border-radius:50%;box-shadow:0 0 0 .06em var(--navy);filter:none;margin-left:.04em}

/* E · bonbons : chaque lettre a sa couleur, comme un paquet de billes */
.E .t{display:inline-block}
.E .t:nth-child(1){color:#FFC93F}.E .t:nth-child(2){color:#5BC0FF}.E .t:nth-child(3){color:#FF6F91}
.E .t:nth-child(4){color:#7EE081}.E .t:nth-child(5){color:#B98CFF}
.E .t{text-shadow:0 .05em 0 rgba(0,0,0,.25),0 .13em 0 var(--navy),0 .18em .24em rgba(0,0,0,.35)}
.E .o{width:.6em;height:.6em;margin:0 0 .06em .03em;border-radius:50%;box-shadow:0 0 0 .065em var(--navy)}

/* actuel */
.Z{align-items:center;gap:.1em}
.Z .t{font-size:.92em}
.Z img{width:.95em;height:.95em;margin-top:.1em}
</style>
</head>
<body>
<main>
  <h1>Tikalo : le logo « Ça roule », police par police</h1>
  <p class="lead">Le même logo (lettres qui sautillent, la bille fait le « o ») avec différentes polices. En grand, sur fond clair et en petit dans la colonne du jeu.</p>
  <div id="list"></div>
</main>
<script src="tikalo-rendu.js"></script>
<script>
const M = (type,family,pal,shiny=0,k="") => ({id:`${type}-${family}-${pal}-${k}`, seed:hash(`${type}-${family}-${pal}-${k}`), type, family, pal, shiny});
const PAL = n => Math.max(0, PALETTES.findIndex(p=>p[0]===n));
const FAM = n => Math.max(0, FAMILIES.findIndex(f=>f.name===n));
const LOGO = {seed:hash("vitrine"+TK[1]), type:TK[1], family:0, pal:0, shiny:0};   // la bille du logo actuel
const LOGO_O = M("calot",FAM("Tourbillon"),PAL("Lagon"),0,"logo");
const DOT1 = M("bille",FAM("Œil-de-chat"),PAL("Cerise"),0,"d1");
const src = (s,px=192) => marbleURL(s,px);
const T = s => [...s].map(c=>`<span class="t">${c}</span>`).join("");
const FONTS = [["Titan One", "400", "Actuelle : ronde et gourmande"], ["Luckiest Guy", "400", "Bande dessinée, très « dessin animé », lettres qui tiennent bien debout"], ["Chewy", "400", "Molle comme un chewing-gum, très enfantine"], ["Fredoka", "700", "Toute ronde et douce, très lisible en petit"], ["Baloo 2", "800", "Ronde et bien grasse, sympa et moderne"], ["Gluten", "900", "Gonflée et un peu bancale, comme écrite à la main"], ["Modak", "400", "Ultra gonflée, des lettres en forme de ballons"], ["Rammetto One", "400", "Large et solide, très « logo de jeu »"], ["Bowlby One", "400", "Massive et percutante, lettres serrées"], ["Grandstander", "900", "Joyeuse et légèrement penchée, style cour de récré"], ["Mochiy Pop One", "400", "Arrondie façon jeu vidéo japonais"], ["Sniglet", "800", "Toute ronde et gentille, plus légère"]];
const V = FONTS.map(([f,w,n],i)=>({name:`${i+1} · ${f}`, note:n, html:()=>`<span class="L C" style="font-family:'${f}';font-weight:${w}">${T("Bille")}<span class="run"><img class="o" src="${src(LOGO_O)}" alt=""></span></span>`}));
document.getElementById("list").innerHTML = V.map(v=>`<section class="card"><div class="card-h"><b>${v.name}</b><span>${v.note}</span></div>
  <div class="row">
    <div class="cell dark"><small>Grand</small><div style="font-size:84px">${v.html()}</div></div>
    <div class="cell light"><small>Fond clair</small><div style="font-size:52px">${v.html()}</div></div>
    <div class="cell side"><small>Colonne du jeu</small><div class="wrap"><div style="font-size:36px">${v.html()}</div><div class="nav"><i></i><i></i><i></i></div></div></div>
  </div></section>`).join("");
</script>
</body>
</html>
